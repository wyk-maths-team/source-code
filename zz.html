      { key:'a', label:'Terminal A', type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => { cell.pins = { a: vals.a, b: vals.b }; });
    return true;
  }

  if (cell.type === 'lamp' || cell.type === 'resistor') {
    const p = cell.pins || {};
    openDialog(pre + (cell.type === 'lamp' ? 'Lamp' : 'Resistor'), [
      { key:'r', label:'Resistance (Ω)', type:'number', value:cell.r, min:1e-6, max:1e12 },
      { key:'a', label:'Terminal A', type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const r = parseFloat(vals.r);
      if (isFinite(r) && r > 0) cell.r = r;
      cell.pins = { a: vals.a, b: vals.b };
    });
    return true;
  }

  if (cell.type === 'capacitor') {
    const p = cell.pins || {};
    openDialog(pre + 'Capacitor', [
      { key:'c',   label:'Capacitance (F)',    type:'number', value:cell.c,   min:1e-15, max:1e3 },
      { key:'esr', label:'ESR (Ω)',            type:'number', value:cell.esr, min:0,     max:1e6 },
      { key:'a',   label:'Terminal A', type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b',   label:'Terminal B', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const c = parseFloat(vals.c);
      const e = parseFloat(vals.esr);
      if (isFinite(c) && c > 0) cell.c = c;
      if (isFinite(e) && e >= 0) cell.esr = e;
      cell.pins = { a: vals.a, b: vals.b };
    }, 'Z = ESR + 1/(jωC). DC → open circuit.');
    return true;
  }

  if (cell.type === 'inductor') {
    const p = cell.pins || {};
    openDialog(pre + 'Inductor', [
      { key:'l', label:'Inductance (H)', type:'number', value:cell.l, min:1e-12, max:1e6 },
      { key:'a', label:'Terminal A', type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const l = parseFloat(vals.l);
      if (isFinite(l) && l > 0) cell.l = l;
      cell.pins = { a: vals.a, b: vals.b };
    }, 'Ideal L. Z = jωL. DC → short.');
    return true;
  }

  if (cell.type === 'coil') {
    const p = cell.pins || {};
    openDialog(pre + 'Coil (R + L)', [
      { key:'r', label:'Series R (Ω)',   type:'number', value:cell.r, min:1e-6, max:1e12 },
      { key:'l', label:'Inductance (H)', type:'number', value:cell.l, min:1e-12, max:1e6 },
      { key:'a', label:'Terminal A', type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const r = parseFloat(vals.r);
      const l = parseFloat(vals.l);
      if (isFinite(r) && r > 0) cell.r = r;
      if (isFinite(l) && l > 0) cell.l = l;
      cell.pins = { a: vals.a, b: vals.b };
    }, 'Z = R + jωL. DC → R.');
    return true;
  }

  if (cell.type === 'diode') {
    const p = cell.pins || {};
    openDialog(pre + 'Diode', [
      { key:'vf', label:'Forward drop (V)', type:'number', value:cell.vf, min:0, max:100 },
      { key:'a', label:'Anode',   type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Cathode', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const vf = parseFloat(vals.vf);
      if (isFinite(vf) && vf >= 0) cell.vf = vf;
      cell.pins = { a: vals.a, b: vals.b };
    }, 'Ideal one-way valve. Conducts anode → cathode.');
    return true;
  }

  if (cell.type === 'led') {
    const p = cell.pins || {};
    openDialog(pre + 'LED', [
      { key:'vf', label:'Forward drop (V)', type:'number', value:cell.vf, min:0, max:100 },
      { key:'r',  label:'Series R (Ω)',     type:'number', value:cell.r,  min:1e-3, max:1e9 },
      { key:'a',  label:'Anode',   type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b',  label:'Cathode', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const vf = parseFloat(vals.vf);
      const r  = parseFloat(vals.r);
      if (isFinite(vf) && vf >= 0) cell.vf = vf;
      if (isFinite(r) && r > 0) cell.r = r;
      cell.pins = { a: vals.a, b: vals.b };
    });
    return true;
  }

  if (cell.type === 'transformer') {
    const p = cell.pins || {};
    openDialog(pre + 'Transformer', [
      { key:'L1', label:'Primary L1 (H)',   type:'number', value:cell.L1, min:1e-9, max:1e6 },
      { key:'L2', label:'Secondary L2 (H)', type:'number', value:cell.L2, min:1e-9, max:1e6 },
      { key:'R1', label:'Primary R1 (Ω)',   type:'number', value:cell.R1, min:0, max:1e6 },
      { key:'R2', label:'Secondary R2 (Ω)', type:'number', value:cell.R2, min:0, max:1e6 },
      { key:'k',  label:'Coupling k (0–1)', type:'number', value:cell.k,  min:0, max:0.999 },
      { key:'p1', label:'Primary +',   type:'select', value:p.p1, options:DIRS, labels:DIR_LABELS },
      { key:'p2', label:'Primary −',   type:'select', value:p.p2, options:DIRS, labels:DIR_LABELS },
      { key:'s1', label:'Secondary +', type:'select', value:p.s1, options:DIRS, labels:DIR_LABELS },
      { key:'s2', label:'Secondary −', type:'select', value:p.s2, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const L1 = parseFloat(vals.L1), L2 = parseFloat(vals.L2);
      const R1 = parseFloat(vals.R1), R2 = parseFloat(vals.R2);
      const k  = parseFloat(vals.k);
      if (isFinite(L1) && L1 > 0) cell.L1 = L1;
      if (isFinite(L2) && L2 > 0) cell.L2 = L2;
      if (isFinite(R1) && R1 >= 0) cell.R1 = R1;
      if (isFinite(R2) && R2 >= 0) cell.R2 = R2;
      if (isFinite(k))  cell.k = Math.min(0.999, Math.max(0, k));
      cell.pins = { p1: vals.p1, p2: vals.p2, s1: vals.s1, s2: vals.s2 };
    }, 'M = k·√(L1·L2). Turns ratio ≈ √(L2/L1).');
    return true;
  }

  if (cell.type === 'transistor') {
    const p = cell.pins || {};
    openDialog(pre + 'Transistor', [
      { key:'c', label:'Collector', type:'select', value:p.c, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Base',      type:'select', value:p.b, options:DIRS, labels:DIR_LABELS },
      { key:'e', label:'Emitter',   type:'select', value:p.e, options:DIRS, labels:DIR_LABELS }
    ], vals => { cell.pins = { c: vals.c, b: vals.b, e: vals.e }; });
    return true;
  }

  if (isWire(cell)) {
    const links = cell.links || {};
    openDialog(pre + 'Wire', [
      { key:'up',    label:'Up',    type:'select', value:links.up,    options:LINK_OPTIONS, labels:LINK_LABELS },
      { key:'down',  label:'Down',  type:'select', value:links.down,  options:LINK_OPTIONS, labels:LINK_LABELS },
      { key:'left',  label:'Left',  type:'select', value:links.left,  options:LINK_OPTIONS, labels:LINK_LABELS },
      { key:'right', label:'Right', type:'select', value:links.right, options:LINK_OPTIONS, labels:LINK_LABELS }
    ], vals => {
      cell.links = { up: vals.up, down: vals.down, left: vals.left, right: vals.right };
    });
    return true;
  }

  return false;
}

function openDialog(title, fields, onOk, subtitle) {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = '';

  const box = document.createElement('div');
  box.className = 'dialog';

  const h = document.createElement('h3');
  h.textContent = title;
  box.appendChild(h);

  if (subtitle) {
    const s = document.createElement('div');
    s.className = 'sub';
    s.textContent = subtitle;
    box.appendChild(s);
  }

  const inputs = {};
  for (const f of fields) {
    const row = document.createElement('label');
    row.className = 'field';
    const span = document.createElement('span');
    span.textContent = f.label;
    row.appendChild(span);

    let inp;
    if (f.type === 'select') {
      inp = document.createElement('select');
      f.options.forEach((o, i) => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = f.labels ? f.labels[i] : o;
        inp.appendChild(opt);
      });
      inp.value = f.value;
    } else {
      inp = document.createElement('input');
      inp.type = 'number'; inp.step = 'any';
      inp.value = f.value;
      if (f.min !== undefined) inp.min = f.min;
      if (f.max !== undefined) inp.max = f.max;
    }
    inputs[f.key] = inp;
    row.appendChild(inp);
    box.appendChild(row);
  }

  const btns = document.createElement('div');
  btns.className = 'btns';

  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.onclick = closeDialog;

  const ok = document.createElement('button');
  ok.textContent = 'OK';
  ok.className = 'primary';
  ok.onclick = () => {
    const vals = {};
    for (const k in inputs) vals[k] = inputs[k].value;
    closeDialog();
    onOk(vals);
    update();
  };

  btns.appendChild(cancel);
  btns.appendChild(ok);
  box.appendChild(btns);

  box.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); ok.click(); }
    if (e.key === 'Escape') { closeDialog(); }
  });

  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) closeDialog(); };

  const first = box.querySelector('input, select');
  if (first) { first.focus(); if (first.select) first.select(); }
}

function closeDialog() {
  const ov = document.getElementById('overlay');
  ov.classList.add('hidden');
  ov.innerHTML = '';
  ov.onclick = null;
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

  { id: 'inductor',    label: 'L' },
  { id: 'coil',        label: 'Coil' },
  { id: 'diode',       label: 'D' },
  { id: 'led',         label: 'LED' },
  { id: 'transformer', label: 'Xfmr' },
  { id: 'transistor',  label: 'Q' },
  { id: 'ground',      label: 'GND' },
  { sep: true },
  { id: 'rotate-ccw',  label: '↺', special: 'rotate-ccw', title: 'Rotate CCW (T)' },
  { id: 'rotate-cw',   label: '↻', special: 'rotate-cw',  title: 'Rotate CW (R)'  }
];

function buildToolbar() {
  const bar = document.getElementById('toolbar');
  bar.innerHTML = '';

  for (const t of TOOLS) {
    if (t.sep) {
      const s = document.createElement('span');
      s.className = 'sep';
      bar.appendChild(s);
      continue;
    }
    const b = document.createElement('button');
    b.dataset.tool = t.id;
    if (t.title) b.title = t.title;

    if (t.special) {
      b.className = 'rotate-btn';
      b.appendChild(document.createTextNode(t.label));
      b.onclick = () => {
        if (t.special === 'rotate-ccw') rotateCurrent(false);
        else                            rotateCurrent(true);
      };
      bar.appendChild(b);
      continue;
    }

    if (t.color) {
      const i = document.createElement('i');
      i.style.background = t.color;
      b.appendChild(i);
    }
    b.appendChild(document.createTextNode(t.label));
    b.onclick = () => {
      state.tool = t.id;
      refreshToolbar();
      save();
      render();
    };

    if (CONFIGURABLE_TYPES.has(t.id)) {
      b.title = 'Right-click to edit defaults';
      b.addEventListener('contextmenu', ev => {
        ev.preventDefault();
        ev.stopPropagation();
        openToolConfig(t.id);
      });
    }

    bar.appendChild(b);
  }
  refreshToolbar();
}

function refreshToolbar() {
  document.querySelectorAll('#toolbar button').forEach(b => {
    if (b.classList.contains('rotate-btn')) return;
    b.classList.toggle('active', b.dataset.tool === state.tool);
  });
}

/* ============================================================
   Scope interactions
   ============================================================ */

function toggleScope() {
  scopeCollapsed = !scopeCollapsed;
  const el = document.getElementById('scope');
  el.classList.toggle('collapsed', scopeCollapsed);
  document.getElementById('scopeToggle').textContent = scopeCollapsed ? '▴' : '▾';
  if (!scopeCollapsed) { resizeScope(); }
}

document.getElementById('scopeToggle').onclick = toggleScope;
document.querySelectorAll('#scope .mode button').forEach(b => {
  b.onclick = () => {
    const m = b.dataset.mode;
    if (!m) return;
    state.mode = m;
    document.querySelectorAll('#scope .mode button').forEach(x => x.classList.toggle('active', x === b));
    update();
    refreshScope();
  };
});

/* ============================================================
   Main
   ============================================================ */

function update() {
  save();
  simulate();
  render();
  refreshScope();
}

function init() {
  const hadSave = load();

  for (const k in state.cells) ensureDefaults(state.cells[k]);
  for (const t in toolCells) ensureDefaults(toolCells[t]);
  for (const t of TOOLS) {
    if (t.special || t.sep) continue;
    getToolCell(t.id);
  }

  buildToolbar();
  resize();

  // reflect loaded mode on the scope toggle
  document.querySelectorAll('#scope .mode button').forEach(x => {
    x.classList.toggle('active', x.dataset.mode === state.mode);
  });

  if (!hadSave) {
    state.cam.x = Math.round(window.innerWidth / 2 - CELL / 2);
    state.cam.y = Math.round(window.innerHeight / 2 - CELL / 2);
  }

  simulate();
  render();
  refreshScope();

  window.addEventListener('resize', resize);
}

init();
</script>
</body>
