  <style>
    .pkc-wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .pkc-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
    }
    .pkc-head h2 { margin: 0; }
    .pkc-list { display: flex; flex-direction: column; gap: .6rem; }
    .pkc-item {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 10px; padding: .9rem 1.1rem;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .pkc-item.pending { border-color: #e3a008; }
    .pkc-item.accepted { border-color: var(--accent); }
    .pkc-main { flex: 1 1 260px; min-width: 0; }
    .pkc-opp { font-weight: 700; }
    .pkc-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .12s ease, color .12s ease;
    }
    .pkc-link:hover { border-bottom-color: currentColor; color: var(--accent); }
    .pkc-sub { font-size: .8rem; color: var(--text-secondary); margin-top: 2px; }
    .pkc-stake { font-weight: 700; font-variant-numeric: tabular-nums; }
    .pkc-badge {
      font-size: .72rem; padding: 2px 9px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: .03em; font-weight: 700;
    }
    .pkc-badge.pending   { background: rgba(227,160,8,.18); color: #e3a008; }
    .pkc-badge.accepted  { background: rgba(74,144,217,.18); color: var(--accent); }
    .pkc-badge.declined  { background: rgba(231,76,60,.15); color: #e74c3c; }
    .pkc-badge.expired   { background: rgba(127,127,127,.18); color: var(--text-secondary); }
    .pkc-badge.cancelled { background: rgba(127,127,127,.18); color: var(--text-secondary); }
    .pkc-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .pkc-empty {
      background: var(--card-bg); border: 1px dashed var(--border-color);
      border-radius: 10px; padding: 2rem; text-align: center;
      color: var(--text-secondary);
    }
    .pkc-err {
      background: rgba(231,76,60,.08); border: 1px solid rgba(231,76,60,.4);
      border-radius: 10px; padding: 1rem; color: #e74c3c; font-size: .9rem;
    }
    .pkc-err pre { white-space: pre-wrap; font-size: .8rem; margin: .4rem 0 0; }
  </style>
