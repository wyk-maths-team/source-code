<style>
  /* 树的配色变量收拢到 #ktRoot —— 原来写在 :root 上会和系统的
     --accent / --line / --text-* 等同名变量互相覆盖，顶栏颜色会跟着变。 */
  #ktRoot {
    --bg-0:#0b1220; --bg-1:#0f172a; --bg-2:#1e293b; --bg-3:#334155;
    --line:#334155; --text-0:#f1f5f9; --text-1:#cbd5e1; --text-2:#94a3b8;
    --text-3:#64748b; --accent:#38bdf8; --success:#22c55e;
    --critical:#f97316; --ready:#38bdf8; --done:#22c55e;

    /* 铺满 mainContent，由它负责外部布局 */
    height: 100%;
    display:flex; flex-direction:column;
    background: var(--bg-0); color: var(--text-1);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
  }
  /* 这个页面是个满屏画布，不要 main-content 的 28px 内边距 */
  body.kt-page .main-content {
    padding: 0;
    min-height: 0;
    height: calc(100vh - var(--topbar-height, 56px));
    overflow: hidden;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  #error-banner {
    display:none; background:#7f1d1d; color:#fecaca;
    padding:10px 16px; font-size:13px; font-family:ui-monospace, monospace;
    border-bottom:1px solid #b91c1c; white-space:pre-wrap; z-index:100;
  }
  header {
    background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
    border-bottom:1px solid var(--line);
    padding:10px 18px; display:flex; align-items:center; gap:20px;
    flex-wrap:wrap; z-index:10;
    flex-shrink: 0;
  }
  header h1 { font-size:15px; margin:0; color:var(--text-0); font-weight:600; letter-spacing:.4px; }
  .stats { display:flex; gap:18px; font-size:12px; color:var(--text-2); }
  .stats b { color:var(--text-0); font-weight:600; }
  .progress-track { flex:1; min-width:140px; max-width:360px; height:5px; background:var(--bg-2); border-radius:3px; overflow:hidden; }
  .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--success)); transition:width .3s; }
  .header-actions { display:flex; gap:6px; margin-left:auto; }
  button {
    background:var(--bg-2); color:var(--text-1); border:1px solid var(--line);
    padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer;
    font-family:inherit; transition:all .15s;
    min-height: 36px;
  }
  button:hover:not(:disabled) { background:var(--bg-3); color:var(--text-0); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#0b1220; border-color:var(--accent); font-weight:600; }
  button.primary:hover:not(:disabled) { background:#7dd3fc; }

  .main { flex:1; display:flex; min-height:0; position:relative; }

  .viewport {
    flex:1; position:relative; overflow:hidden; cursor:grab;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(148,163,184,0.06) 1px, transparent 0);
    background-size: 28px 28px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .viewport.dragging { cursor:grabbing; }
  .world {
    position:absolute; top:0; left:0; width:1700px; height:1700px;
    transform-origin:0 0;
    /* 整张画布只有一个合成层：缩放只改这一层的矩阵，GPU 直接变换 */
    will-change: transform;
    /* 把布局/绘制范围圈在这一层内，缩放时不必回头重算外面的元素 */
    contain: layout style paint;
  }
  svg.edges { position:absolute; top:0; left:0; width:1700px; height:1700px; pointer-events:none; overflow:visible; }
  .edge {
    fill:none; stroke:rgba(100,116,139,0.16); stroke-width:1.2;
    transition: stroke .18s, stroke-width .18s, opacity .18s;
  }
  .edge.group { stroke:rgba(109,91,168,0.22); stroke-dasharray: 5 4; }
  .edge.hl { stroke:var(--accent); stroke-width:2; opacity:1; }
  .edge.group.hl { stroke:#a78bfa; }

  .ring { fill:none; stroke:rgba(148,163,184,0.06); stroke-width:1; }

  /* 缩放 / 拖拽进行中：关掉阴影和过渡。
     这两样在连续变换时每帧都要重算，而画面上根本看不出来。
     停下来 160ms 后移除这个类，效果自然恢复。 */
  .zooming .node,
  .zooming .edge { transition: none !important; }
  .zooming .node { box-shadow: none !important; }

  .nodes { position:absolute; top:0; left:0; width:1700px; height:1700px; }

  .node {
    position:absolute; width:68px; height:68px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    background:var(--bg-1);
    font-size:12px; font-weight:700;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.3px;
    transition: transform .12s, box-shadow .18s, opacity .18s, background .18s;
    z-index:1;
    /* 注意：这里不要写 will-change: transform。
       49 个节点各自提升成独立合成层后，缩放时浏览器要逐层光栅化并上传
       GPU —— 这正是"缩放卡"的主因，比样式写入贵得多。
       节点只在 :hover 时用 transform，浏览器会自己按需提升。 */
    border: 2px solid var(--cat-color, var(--line));
    color: var(--cat-color, var(--text-1));
    touch-action: none;
    -webkit-user-select: none;
  }
  .node:hover { z-index:5; transform: scale(1.10); }

  .node.locked { opacity:0.38; }
  .node.locked:hover { opacity:0.75; }
  .node.available { opacity:1; box-shadow: 0 0 0 1px var(--cat-color), 0 0 18px var(--cat-color); }
  .node.completed {
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.15), transparent 60%),
                var(--cat-color, var(--success));
    color:#0b1220;
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 0 2px rgba(34,197,94,0.35), 0 0 22px rgba(34,197,94,0.35);
  }

  .node.hl-selected {
    outline: 3px solid var(--accent);
    outline-offset: 5px;
    z-index: 20;
    box-shadow: 0 0 0 1px var(--accent), 0 0 40px rgba(56,189,248,0.9);
  }
  .node.hl-critical {
    outline: 3px solid var(--critical);
    outline-offset: 3px;
    z-index: 15;
    animation: pulse-orange 1.4s ease-in-out infinite;
  }
  .node.hl-ready {
    outline: 2px solid var(--ready);
    outline-offset: 3px;
    z-index: 15;
    animation: pulse-blue 1.4s ease-in-out infinite;
  }
  .node.hl-done {
    outline: 2px solid rgba(34,197,94,0.55);
    outline-offset: 2px;
  }
  @keyframes pulse-orange {
    0%,100% { box-shadow: 0 0 0 1px var(--critical), 0 0 16px rgba(249,115,22,0.55); }
    50%     { box-shadow: 0 0 0 1px var(--critical), 0 0 32px rgba(249,115,22,0.95); }
  }
  @keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 0 1px var(--ready), 0 0 14px rgba(56,189,248,0.5); }
    50%     { box-shadow: 0 0 0 1px var(--ready), 0 0 28px rgba(56,189,248,0.9); }
  }

  .zoom-controls {
    position:absolute; bottom:16px; right:16px;
    display:flex; flex-direction:column; gap:6px;
    background: rgba(15,23,42,0.78);
    padding:6px; border-radius:10px;
    border:1px solid var(--line);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 5;
  }
  .zoom-controls button {
    width:42px; height:42px; padding:0; font-size:18px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px;
  }

  /* 详情面板：右侧悬浮窗（不再占 flex 一列），可最小化成齿轮 */
  aside.kt-panel {
    position: absolute;
    top: 14px; right: 14px; bottom: 14px;
    width: 340px; max-width: calc(100% - 28px);
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    overflow-y: auto;
    padding: 20px;
    z-index: 30;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    /* 用 transform 移出而不是 display:none —— 避免切换时重排 */
    transition: transform .25s ease, opacity .2s ease;
  }
  aside.kt-panel.hidden {
    transform: translateX(calc(100% + 24px));
    opacity: 0;
    pointer-events: none;
  }
  /* 最小化后的齿轮按钮 */
  #ktPanelGear {
    position: absolute;
    right: 16px; bottom: 16px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--text-1);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 31;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,.45);
    padding: 0;
    min-height: 0;
  }
  #ktPanelGear.show { display: flex; }
  #ktPanelGear:hover { background: var(--bg-3); color: var(--text-0); }
  #ktPanelGear svg { width: 22px; height: 22px; }
  .sidebar-handle { display: none; }
  .sidebar-close { display: none; }

  .sb-empty { color:var(--text-3); font-size:13px; text-align:center; padding-top:40px; line-height:1.7; }
  .sb-empty kbd {
    background:var(--bg-2); border:1px solid var(--line);
    padding:1px 6px; border-radius:4px; font-size:11px; font-family:ui-monospace, monospace;
  }
  .sb-level { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-3); font-weight:600; }
  .sb-title { font-size:18px; color:var(--text-0); margin:6px 0 10px; font-weight:600; line-height:1.3; }
  .sb-desc { font-size:13px; line-height:1.55; color:var(--text-1); margin:0 0 14px; }
  .sb-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .sb-meta > div { background:var(--bg-2); border-radius:6px; padding:8px; font-size:12px; display:flex; flex-direction:column; gap:3px; }
  .sb-meta .k { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.5px; }
  .sb-meta > div > span:last-child { color:var(--text-0); font-weight:600; }
  .sb-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px; }
  .tag { background:var(--bg-2); color:var(--text-2); font-size:10px; padding:2px 7px; border-radius:10px; border:1px solid var(--line); }
  aside.kt-panel h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-3); margin:16px 0 8px; font-weight:600; }
  .prereq { font-size:12px; padding:10px; background:var(--bg-2); border-radius:5px; margin-bottom:4px; color:var(--text-1); cursor:pointer; transition:background .12s; display:flex; align-items:center; gap:6px; min-height: 40px; }
  .prereq:hover { background:var(--bg-3); }
  .prereq.done { color:var(--success); }
  .prereq.done::before { content:"✓"; font-weight:700; }
  .prereq:not(.done)::before { content:"○"; color:var(--text-3); }
  .muted { color:var(--text-3); font-size:12px; margin:0; }
  .group { background:rgba(167,139,250,.05); border:1px solid rgba(167,139,250,.2); border-radius:6px; padding:8px; margin-bottom:6px; }
  .group-label { font-size:10px; color:#a78bfa; text-transform:uppercase; letter-spacing:.5px; font-weight:600; margin-bottom:6px; }
  .group .prereq { margin-bottom:3px; background:var(--bg-1); }
  .sb-actions { margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .sb-actions button { width:100%; padding:12px; font-size:13px; min-height: 44px; }
  .legend {
    margin-top:16px; display:flex; flex-direction:column; gap:5px;
    font-size:11px; color:var(--text-3);
  }
  .legend-row { display:flex; align-items:center; gap:8px; }
  .legend-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }

  /* ============ Tablet / Narrow: bottom-sheet sidebar ============ */
  @media (max-width: 900px) {
    header { padding: 8px 14px; gap: 10px; }
    header h1 { font-size: 13px; }
    .stats { font-size: 11px; gap: 12px; }
    .progress-track { min-width: 70px; max-width: none; }

    aside.kt-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      width: 100%;
      height: 60vh;
      max-height: 640px;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: none;
      border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0;

    .sidebar-handle {
      display: block;
      width: 40px; height: 4px;
      background: var(--bg-3);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .sidebar-close {
      display: block;
      position: absolute;
      top: 10px; right: 12px;
      width: 36px; height: 36px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--text-2);
      border: none;
    }
    .sidebar-close:hover { background: var(--bg-2); color: var(--text-0); }

    .sb-empty { padding-top: 20px; }
    .sb-empty .legend {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
    }

    /* Zoom controls go up-right, out of the way of the bottom sheet */
    .zoom-controls {
      bottom: auto;
      top: 12px;
      right: 12px;
      padding: 4px;
    }
    .zoom-controls button { width: 40px; height: 40px; }
  }

  @media (max-width: 480px) {
    header h1 { display: none; }
    .stats { gap: 8px; }
    aside.kt-panel { height: 65vh; }
  }
</style>

/* =============== RADIAL LAYOUT (L0–L3) =============== */
var NODE_R = 34;
var RING_RADII = { 0: 110, 1: 380, 2: 560, 3: 730 };
var CANVAS_SIZE = 1700;
var CENTER = CANVAS_SIZE / 2;

var POSITIONS = {};
var ANGLE_OF = {};

var L1_CATS = ["Number Theory", "Algebra & Functions", "Geometry", "Combinatorics & Probability"];

for (var lvl = 0; lvl <= 3; lvl++) {
  var nodes = ACHIEVEMENTS.filter(function(a){ return a.level === lvl; });
  var ordered = [];
  if (lvl === 1) {
    for (var c = 0; c < L1_CATS.length; c++) {
      var group = nodes.filter(function(n){ return n.category === L1_CATS[c]; });
      group.sort(function(x, y){ return x.id < y.id ? -1 : x.id > y.id ? 1 : 0; });
      for (var k = 0; k < group.length; k++) ordered.push(group[k]);
    }
  } else {
    ordered = nodes.slice().sort(function(x, y){ return x.id < y.id ? -1 : x.id > y.id ? 1 : 0; });
  }
  var N = ordered.length;
  if (!N) continue;
  var offset = -Math.PI / 2;
  for (var i = 0; i < N; i++) {
    var ang = offset + (i / N) * Math.PI * 2;
    ANGLE_OF[ordered[i].id] = ang;
  }
}

for (var i = 0; i < ACHIEVEMENTS.length; i++) {
  var a = ACHIEVEMENTS[i];
  var r = RING_RADII[a.level];
  var ang = ANGLE_OF[a.id];
  POSITIONS[a.id] = {
    cx: CENTER + Math.cos(ang) * r,
    cy: CENTER + Math.sin(ang) * r,
    r: NODE_R,
    ang: ang
  };
}

/* =============== STATE =============== */
// 存档在服务端，按用户名分离（后端 /api/knowledge-tree 存在 userdata.knowledgeTree）。
// localStorage 只是首屏缓存：断网或请求失败时仍能看到上次的进度。
//
// 每完成 / 取消一个节点 = 一次 API call。不攒批量，是因为节点操作
// 本来就有视觉反馈的等待，一次往返感知不到，而攒着提交一旦关页面就丢。
var state = { completed: {}, selected: null, username: null };

var LEGACY_KEY = "olympiad-achievements-radial-v3";

function authToken() { return localStorage.getItem('auth_token') || ''; }

function cacheKey() { return 'kt-cache:' + (state.username || 'anon'); }

function banner(msg) {
  var el = document.getElementById('error-banner');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}
function clearBanner() {
  var el = document.getElementById('error-banner');
  if (el) el.style.display = 'none';
}

/** 从 JWT payload 里取用户名（只用于缓存键，权限校验在服务端）。 */
function usernameFromToken(tok) {
  try {
    var parts = tok.split('.');
    if (parts.length < 2) return null;
    var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    var json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json).username || null;
  } catch (e) { return null; }
}

function loadCache() {
  try {
    var raw = localStorage.getItem(cacheKey());
    if (!raw) return;
    var arr = JSON.parse(raw);
    for (var i = 0; i < arr.length; i++) state.completed[arr[i]] = true;
  } catch (e) {}
}

function writeCache() {
  try {
    localStorage.setItem(cacheKey(), JSON.stringify(Object.keys(state.completed)));
  } catch (e) {}
}

function applyCompleted(list) {
  state.completed = {};
  for (var i = 0; i < list.length; i++) state.completed[list[i]] = true;
  writeCache();
}

async function loadProgress() {
  var tok = authToken();
  if (!tok) {
    banner('Not logged in — progress will not be saved to your account.');
    loadCache();
    return;
  }
  state.username = usernameFromToken(tok);
  loadCache();   // 先用缓存渲染，避免白屏
  try {
    var res = await fetch('/api/knowledge-tree?action=load', {
      headers: { 'Authorization': 'Bearer ' + tok },
    });
    var data = await res.json();
    if (!data.success) throw new Error(data.message || ('HTTP ' + res.status));
    state.username = data.username || state.username;
    applyCompleted(data.completed || []);
    clearBanner();
  } catch (e) {
    banner('Could not load your progress (' + e.message + '). Showing the cached copy — changes will retry saving.');
  }
}

/**
 * 写一个节点的完成状态。
 * @param {string} id
 * @param {boolean} done
 */
async function persistNode(id, done) {
  var tok = authToken();
  if (!tok) { banner('Not logged in — this change is only stored locally.'); writeCache(); return; }

  try {
    var res = await fetch('/api/knowledge-tree?action=' + (done ? 'complete' : 'uncomplete'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
      body: JSON.stringify({ nodeId: id }),
    });
    var data = await res.json();
    if (!data.success) throw new Error(data.message || ('HTTP ' + res.status));
    // 以服务端返回的完整列表为准，避免本地与服务端漂移
    applyCompleted(data.completed || []);
    clearBanner();
  } catch (e) {
    banner('Failed to save "' + id + '": ' + e.message + ' (kept locally; retry by toggling again)');
    writeCache();
  }
}

async function resetProgress() {
  state.completed = {};
  state.selected = null;
  writeCache();
  updateNodeStates();
  updateProgress();
  deselect();

  var tok = authToken();
  if (!tok) return;
  try {
    var res = await fetch('/api/knowledge-tree?action=reset', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + tok },
    });
    var data = await res.json();
    if (!data.success) throw new Error(data.message || ('HTTP ' + res.status));
    applyCompleted(data.completed || []);
    clearBanner();
  } catch (e) {
    banner('Failed to reset on the server: ' + e.message);
  }
}

// 旧版存档是全局键，不区分用户 —— 直接丢掉，免得串档
try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}

/* =============== UNLOCK LOGIC =============== */
function canUnlock(id) {
  var a = ACHIEVEMENT_MAP[id];
  if (!a) return false;
  for (var i = 0; i < a.prerequisites.length; i++) {
    if (!state.completed[a.prerequisites[i]]) return false;
  }
  for (var i = 0; i < PREREQUISITE_GROUPS.length; i++) {
    var g = PREREQUISITE_GROUPS[i];
    if (g.target !== id) continue;
    var count = 0;
    for (var j = 0; j < g.anyOf.length; j++) if (state.completed[g.anyOf[j]]) count++;
    if (count < g.min) return false;
  }
  return true;
}

function statusOf(id) {
  if (state.completed[id]) return "completed";
  if (canUnlock(id)) return "available";
  return "locked";
}

//

// （fitView、带 transition 的动画）要用 applyTransformNow()。
var _framePending = false;
var _written = { tx: NaN, ty: NaN, scale: NaN };

// 缩放/拖拽期间给 viewport 加 .zooming，暂时关掉节点的阴影与过渡。
var _zoomIdleTimer = null;
function markZooming() {
  if (!viewport.classList.contains("zooming")) viewport.classList.add("zooming");
  if (_zoomIdleTimer) clearTimeout(_zoomIdleTimer);
  _zoomIdleTimer = setTimeout(function () {
    viewport.classList.remove("zooming");
  }, 160);
}

function _writeTransform() {
  if (view.tx === _written.tx && view.ty === _written.ty && view.scale === _written.scale) return;
  _written.tx = view.tx;
  _written.ty = view.ty;
  _written.scale = view.scale;
  world.style.transform =
    "translate3d(" + view.tx + "px," + view.ty + "px,0) scale(" + view.scale + ")";
}

function applyTransform() {
  markZooming();
  // 直接写：浏览器本来就会把同一帧内的多次 style 写入合并成一次，
  // 再套一层 rAF 只会让画面比手指慢一帧。
  _writeTransform();
}

/** 立即写入（绕过 rAF）—— 初始化、以及带 CSS transition 的动画必须用这个。 */
function applyTransformNow() {
  _framePending = false;
  _writeTransform();
}

function fitView(animate) {
  var vw = viewport.clientWidth;
  var vh = viewport.clientHeight;
  var pad = 30;
  var s = Math.min((vw - pad * 2) / CANVAS_SIZE, (vh - pad * 2) / CANVAS_SIZE);
  if (!isFinite(s) || s <= 0) s = 0.5;
  view.scale = s;
  view.tx = (vw - CANVAS_SIZE * s) / 2;
  view.ty = (vh - CANVAS_SIZE * s) / 2;
  if (animate) world.style.transition = "transform 0.35s ease";
  else world.style.transition = "";
  // 带 transition 时必须同步写，否则动画从下一帧才开始，会被合并/跳过
  applyTransformNow();
  if (animate) setTimeout(function(){ world.style.transition = ""; }, 400);
}

/* =============== EDGES =============== */
function edgePath(from, to) {
  var p1 = POSITIONS[from], p2 = POSITIONS[to];
  if (!p1 || !p2) return null;
  var dx = p2.cx - p1.cx, dy = p2.cy - p1.cy;
  var dist = Math.sqrt(dx * dx + dy * dy) || 1;
  var ux = dx / dist, uy = dy / dist;
  var x1 = p1.cx + ux * (p1.r + 3);
  var y1 = p1.cy + uy * (p1.r + 3);
  var x2 = p2.cx - ux * (p2.r + 3);
  var y2 = p2.cy - uy * (p2.r + 3);
  var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  var cx0 = mx - CENTER, cy0 = my - CENTER;
  var clen = Math.sqrt(cx0 * cx0 + cy0 * cy0) || 1;
  var bow = Math.min(dist * 0.08, 22);
  var cx = mx + (cx0 / clen) * bow;
  var cy = my + (cy0 / clen) * bow;
  return "M " + x1.toFixed(2) + " " + y1.toFixed(2) + " Q " + cx.toFixed(2) + " " + cy.toFixed(2) + " " + x2.toFixed(2) + " " + y2.toFixed(2);
}

function createMarker(id, color) {
  var m = document.createElementNS(SVG_NS, "marker");
  m.setAttribute("id", id);
  m.setAttribute("viewBox", "0 0 10 10");
  m.setAttribute("refX", "9"); m.setAttribute("refY", "5");
  m.setAttribute("markerWidth", "6"); m.setAttribute("markerHeight", "6");
  m.setAttribute("orient", "auto");
  var p = document.createElementNS(SVG_NS, "path");
  p.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
  p.setAttribute("fill", color);
  m.appendChild(p);
  return m;
}

function renderRings() {
  for (var lvl = 0; lvl <= 3; lvl++) {
    var c = document.createElementNS(SVG_NS, "circle");
    c.setAttribute("cx", CENTER);
    c.setAttribute("cy", CENTER);
    c.setAttribute("r", RING_RADII[lvl]);
    c.setAttribute("class", "ring");
    edgesSvg.appendChild(c);
  }
}

function renderEdges() {
  while (edgesSvg.firstChild) edgesSvg.removeChild(edgesSvg.firstChild);

  var defs = document.createElementNS(SVG_NS, "defs");
  defs.appendChild(createMarker("arr-hard", "rgba(100,116,139,0.5)"));
  defs.appendChild(createMarker("arr-group", "rgba(167,139,250,0.6)"));
  edgesSvg.appendChild(defs);

  renderRings();

  function addEdge(from, to, kind) {
    var d = edgePath(from, to);
    if (!d) return;
    var path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "edge " + kind);
    path.setAttribute("marker-end", kind === "group" ? "url(#arr-group)" : "url(#arr-hard)");
    path.setAttribute("data-key", from + "->" + to);
    edgesSvg.appendChild(path);
    edgeEls[from + "->" + to] = path;
  }

  for (var i = 0; i < PREREQUISITE_EDGES.length; i++) addEdge(PREREQUISITE_EDGES[i][0], PREREQUISITE_EDGES[i][1], "hard");
  for (var i = 0; i < OPTIONAL_GROUP_EDGES.length; i++) addEdge(OPTIONAL_GROUP_EDGES[i][0], OPTIONAL_GROUP_EDGES[i][1], "group");
}

/* =============== NODES =============== */
function labelFor(id) {
  var parts = id.split("-");
  return parts.slice(1).join("-");
}

function createNodeEl(a) {
  var pos = POSITIONS[a.id];
  var el = document.createElement("div");
  el.className = "node " + statusOf(a.id);
  el.setAttribute("data-id", a.id);
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-label", a.id + " — " + a.title);
  el.title = a.id + " — " + a.title + " [" + a.category + "]";
  el.style.left = (pos.cx - NODE_R) + "px";
  el.style.top = (pos.cy - NODE_R) + "px";
  el.style.setProperty("--cat-color", CATEGORY_COLORS[a.category] || "#94a3b8");
  el.textContent = labelFor(a.id);

  el.addEventListener("click", function(e){
    if (Date.now() < suppressClickUntil) { e.stopPropagation(); return; }
    e.stopPropagation();
    selectNode(a.id);
  });
  el.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      selectNode(a.id);
    }
  });

  return el;
}

function renderNodes() {
  nodesLayer.innerHTML = "";
  for (var i = 0; i < ACHIEVEMENTS.length; i++) {
    var el = createNodeEl(ACHIEVEMENTS[i]);
    nodesLayer.appendChild(el);
    nodeEls[ACHIEVEMENTS[i].id] = el;
  }
}

function updateNodeStates() {
  for (var id in nodeEls) {
    if (!nodeEls.hasOwnProperty(id)) continue;
    var el = nodeEls[id];
    el.classList.remove("locked", "available", "completed");
    el.classList.add(statusOf(id));
  }
}

/* =============== HIGHLIGHT / ANALYSIS =============== */
function clearHighlight() {
  for (var id in nodeEls) {
    if (!nodeEls.hasOwnProperty(id)) continue;
    var el = nodeEls[id];
    el.classList.remove("hl-selected","hl-critical","hl-ready","hl-done");
  }
  for (var key in edgeEls) {
    if (!edgeEls.hasOwnProperty(key)) continue;
    edgeEls[key].classList.remove("hl");
  }
}

function collectAncestors(targetId) {
  var ancestors = {};
  var queue = [targetId];
  var visited = {};
  visited[targetId] = true;
  while (queue.length) {
    var cur = queue.shift();
    var parents = ALL_PARENTS[cur] || [];
    for (var i = 0; i < parents.length; i++) {
      var p = parents[i];
      if (!visited[p]) {
        visited[p] = true;
        ancestors[p] = true;
        queue.push(p);
      }
    }
  }
  return ancestors;
}

function selectNode(id) {
  state.selected = id;
  renderSidebar(id);
  openSidebar();

  clearHighlight();

  var ancestors = collectAncestors(id);

  if (nodeEls[id]) nodeEls[id].classList.add("hl-selected");

  var criticalCount = 0, readyCount = 0, doneCount = 0;
  for (var anc in ancestors) {
    if (!ancestors.hasOwnProperty(anc)) continue;
    var el = nodeEls[anc];
    if (!el) continue;
    if (state.completed[anc]) {
      el.classList.add("hl-done");
      doneCount++;
    } else if (canUnlock(anc)) {
      el.classList.add("hl-ready");
      readyCount++;
    } else {
      el.classList.add("hl-critical");
      criticalCount++;
    }
  }

  var members = {};
  members[id] = true;
  for (var anc in ancestors) if (ancestors.hasOwnProperty(anc)) members[anc] = true;

  for (var i = 0; i < PREREQUISITE_EDGES.length; i++) {
    var e = PREREQUISITE_EDGES[i];
    if (members[e[0]] && members[e[1]]) {
      var key = e[0] + "->" + e[1];
      if (edgeEls[key]) edgeEls[key].classList.add("hl");
    }
  }
  for (var i = 0; i < OPTIONAL_GROUP_EDGES.length; i++) {
    var e = OPTIONAL_GROUP_EDGES[i];
    if (members[e[0]] && members[e[1]]) {
      var key = e[0] + "->" + e[1];
      if (edgeEls[key]) edgeEls[key].classList.add("hl");
    }
  }

  var summary = document.getElementById("sb-summary");
  if (summary) {
    summary.innerHTML =
      '<p class="muted">' +
      '<span style="color:#22c55e">✓ ' + doneCount + ' done</span> · ' +
      '<span style="color:#38bdf8">◐ ' + readyCount + ' ready</span> · ' +
      '<span style="color:#f97316">✗ ' + criticalCount + ' critical</span>' +
      '</p>';
  }
}

function deselect() {
  state.selected = null;
  clearHighlight();
  document.getElementById("sb-empty").style.display = "block";
  document.getElementById("sb-content").style.display = "none";
  closeSidebar();
}

/* =============== DETAIL PANEL: 最小化 / 展开 =============== */
// 详情窗现在是右侧悬浮层。最小化后变成一个齿轮按钮，
// 点齿轮重新展开 —— 保留「选中了哪个节点」，展开后直接显示它。
var panelGear = document.getElementById("ktPanelGear");

function minimizePanel() {
  sidebar.classList.add("hidden");
  if (panelGear) panelGear.classList.add("show");
}
function expandPanel() {
  sidebar.classList.remove("hidden");
  if (panelGear) panelGear.classList.remove("show");
  // 展开时若还没有选中节点，就把提示页显示出来
  if (!state.selected) {
    document.getElementById("sb-content").style.display = "none";
    document.getElementById("sb-empty").style.display = "";
  }
}
function isPanelMinimized() {
  return sidebar.classList.contains("hidden");
}

var btnMinimize = document.getElementById("btn-minimize-panel");
if (btnMinimize) btnMinimize.addEventListener("click", function(e){
  e.stopPropagation();
  minimizePanel();
});
if (panelGear) panelGear.addEventListener("click", function(e){
  e.stopPropagation();
  expandPanel();
});

// 移动端底部抽屉仍需 open 类，保留原语义
function openSidebar() {
  sidebar.classList.add("open");
  expandPanel();
}
function closeSidebar() {
  sidebar.classList.remove("open");
}

/* =============== SIDEBAR CONTENT =============== */
var sbEmpty = document.getElementById("sb-empty");
var sbContent = document.getElementById("sb-content");
var sbLevel = document.getElementById("sb-level");
var sbTitle = document.getElementById("sb-title");
var sbDesc = document.getElementById("sb-desc");
var sbXp = document.getElementById("sb-xp");
var sbTier = document.getElementById("sb-tier");
var sbTags = document.getElementById("sb-tags");
var sbPrereqs = document.getElementById("sb-prereqs");
var sbGroups = document.getElementById("sb-groups");
var btnToggle = document.getElementById("btn-toggle");

function renderSidebar(id) {
  var a = ACHIEVEMENT_MAP[id];
  if (!a) return;

  sbEmpty.style.display = "none";
  sbContent.style.display = "block";

  sbLevel.textContent = "Level " + a.level + " · " + a.category;
  sbTitle.textContent = a.title;
  sbDesc.textContent = a.description;
  sbXp.textContent = a.xp + " XP";
  sbTier.textContent = a.tier;

  sbTags.innerHTML = "";
  for (var i = 0; i < a.tags.length; i++) {
    var t = document.createElement("span");
    t.className = "tag";
    t.textContent = a.tags[i];
    sbTags.appendChild(t);
  }

  sbPrereqs.innerHTML = "";
  if (a.prerequisites.length === 0) {
    sbPrereqs.innerHTML = '<p class="muted">None</p>';
  } else {
    for (var i = 0; i < a.prerequisites.length; i++) {
      var pid = a.prerequisites[i];
      var p = ACHIEVEMENT_MAP[pid];
      var div = document.createElement("div");
      div.className = "prereq" + (state.completed[pid] ? " done" : "");
      div.setAttribute("data-id", pid);
      div.textContent = p.title;
      sbPrereqs.appendChild(div);
    }
  }

  sbGroups.innerHTML = "";
  var found = false;
  for (var i = 0; i < PREREQUISITE_GROUPS.length; i++) {
    var g = PREREQUISITE_GROUPS[i];
    if (g.target !== id) continue;
    found = true;
    var groupDiv = document.createElement("div");
    groupDiv.className = "group";
    var label = document.createElement("div");
    label.className = "group-label";
    label.textContent = g.label + " — at least " + g.min + " of " + g.anyOf.length;
    groupDiv.appendChild(label);
    for (var j = 0; j < g.anyOf.length; j++) {
      var oid = g.anyOf[j];
      var o = ACHIEVEMENT_MAP[oid];
      var odiv = document.createElement("div");
      odiv.className = "prereq" + (state.completed[oid] ? " done" : "");
      odiv.setAttribute("data-id", oid);
      odiv.textContent = o.title;
      groupDiv.appendChild(odiv);
    }
    sbGroups.appendChild(groupDiv);
  }
  if (!found) sbGroups.innerHTML = '<p class="muted">None</p>';

  var isCompleted = !!state.completed[id];
  var unlocked = canUnlock(id);

  if (isCompleted) {
    btnToggle.textContent = "Mark as Incomplete";
    btnToggle.disabled = false;
    btnToggle.className = "";
  } else if (unlocked) {
    btnToggle.textContent = "Unlock Achievement";
    btnToggle.disabled = false;
    btnToggle.className = "primary";
  } else {
    btnToggle.textContent = "Locked — prerequisites missing";
    btnToggle.disabled = true;
    btnToggle.className = "";
  }

  btnToggle.onclick = function(){
    // 每完成 / 取消一个节点，就是一次 API call
    if (state.completed[id]) {
      delete state.completed[id];
      updateNodeStates();
      updateProgress();
      selectNode(id);
      persistNode(id, false);
    } else {
      state.completed[id] = true;
      updateNodeStates();
      updateProgress();
      selectNode(id);
      persistNode(id, true);
    }
  };
}

sbContent.addEventListener("click", function(e){
  var el = e.target;
  while (el && el !== sbContent && !(el.getAttribute && el.getAttribute("data-id"))) el = el.parentNode;
  if (el && el.getAttribute && el.getAttribute("data-id")) {
    selectNode(el.getAttribute("data-id"));
  }
});

/* =============== PROGRESS =============== */
function updateProgress() {
  var total = ACHIEVEMENTS.length;
  var done = 0, totalXp = 0, gotXp = 0;
  for (var i = 0; i < ACHIEVEMENTS.length; i++) {
    var a = ACHIEVEMENTS[i];
    totalXp += a.xp;
    if (state.completed[a.id]) { done++; gotXp += a.xp; }
  }
  document.getElementById("stat-done").textContent = done + " / " + total;
  document.getElementById("stat-xp").textContent = gotXp + " / " + totalXp + " XP";
  document.getElementById("progress-bar").style.width = Math.round((done / total) * 100) + "%";
}

/* ============================================================
   POINTER / TOUCH INTERACTION
   - 1 pointer  → pan (with 6px threshold to distinguish tap from drag)
   - 2 pointers → pinch zoom anchored at the midpoint of the two fingers
   - tap on node → select; tap on empty → deselect
   - wheel (mouse / trackpad) → gentle anchored zoom
   ============================================================ */
var pointers = {};         // pointerId -> {x, y}
var gesture = null;        // { type, ... }
var suppressClickUntil = 0;

function pointInViewport(clientX, clientY) {
  var rect = viewport.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function pointerList() {
  var ids = [];
  for (var id in pointers) if (pointers.hasOwnProperty(id)) ids.push(id);
  return ids;
}

function onPointerDown(e) {
  // Ignore pointers that start on the zoom controls or the sidebar.
  if (e.target.closest(".zoom-controls") || e.target.closest(".kt-panel")) return;

  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = pointerList();

  if (ids.length === 1) {
    gesture = {
      type: "pan-maybe",
      startX: e.clientX,
      startY: e.clientY,
      startTx: view.tx,
      startTy: view.ty,
      moved: false
    };
  } else if (ids.length === 2) {
    var p1 = pointers[ids[0]];
    var p2 = pointers[ids[1]];
    var m0 = pointInViewport((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
    var d0 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    gesture = {
      type: "pinch",
      d0: d0,
      m0: m0,
      s0: view.scale,
      tx0: view.tx,
      ty0: view.ty
    };
    suppressClickUntil = Date.now() + 400;
    viewport.classList.remove("dragging");
  }
}

function onPointerMove(e) {
  if (!(e.pointerId in pointers)) return;
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

  if (!gesture) return;

  if (gesture.type === "pan-maybe") {
    var dx = e.clientX - gesture.startX;
    var dy = e.clientY - gesture.startY;
    if (!gesture.moved && Math.hypot(dx, dy) > 6) {
      gesture.moved = true;
      viewport.classList.add("dragging");
      suppressClickUntil = Date.now() + 400;
    }
    if (gesture.moved) {
      view.tx = gesture.startTx + dx;
      view.ty = gesture.startTy + dy;
      applyTransform();
    }
  } else if (gesture.type === "pinch") {
    var ids = pointerList();
    if (ids.length < 2) return;
    var p1 = pointers[ids[0]];
    var p2 = pointers[ids[1]];
    var m1 = pointInViewport((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
    var d1 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (gesture.d0 < 1) return;

    var newScale = Math.max(0.2, Math.min(3, gesture.s0 * (d1 / gesture.d0)));

    // World-space anchor (the point under the initial midpoint)
    var wx = (gesture.m0.x - gesture.tx0) / gesture.s0;
    var wy = (gesture.m0.y - gesture.ty0) / gesture.s0;

    view.scale = newScale;
    view.tx = m1.x - wx * newScale;
    view.ty = m1.y - wy * newScale;
    applyTransform();
  }
}

function onPointerUp(e) {
  if (!(e.pointerId in pointers)) {
    // Still clean up gesture if it belonged to this pointer chain
    return;
  }
  delete pointers[e.pointerId];
  var ids = pointerList();

  if (gesture) {
    if (gesture.moved) suppressClickUntil = Date.now() + 400;

    if (gesture.type === "pinch" && ids.length === 1) {
      // Downgrade pinch → pan (continue moving with the remaining finger)
      var p = pointers[ids[0]];
      gesture = {
        type: "pan-maybe",
        startX: p.x,
        startY: p.y,
        startTx: view.tx,
        startTy: view.ty,
        moved: true
      };
    } else if (ids.length === 0) {
      gesture = null;
      viewport.classList.remove("dragging");
    }
  }
}

viewport.addEventListener("pointerdown", onPointerDown);
viewport.addEventListener("pointermove", onPointerMove);
viewport.addEventListener("pointerup", onPointerUp);
viewport.addEventListener("pointercancel", onPointerUp);
viewport.addEventListener("pointerleave", function(e){
  // pointerleave during drag is fine (pointer capture not used), keep as-is.
});

// Prevent long-press context menu on touch devices
viewport.addEventListener("contextmenu", function(e){
  if (e.pointerType === "touch" || e.pointerType === "pen") e.preventDefault();
});

// viewport 的位置在缩放过程中不会变，但每次读 getBoundingClientRect()
// 都会强制同步布局（reflow）—— 在 wheel 里每帧读一次是纯浪费。
// 缓存它，只在窗口尺寸变化时失效。
var _vpRect = null;
function viewportRect() {
  if (!_vpRect) _vpRect = viewport.getBoundingClientRect();
  return _vpRect;
}
window.addEventListener("resize", function(){ _vpRect = null; }, { passive: true });
window.addEventListener("scroll", function(){ _vpRect = null; }, { passive: true, capture: true });

// Mouse wheel / trackpad — gentle anchored zoom
viewport.addEventListener("wheel", function(e){
  e.preventDefault();
  var rect = viewportRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;

  var intensity = Math.min(Math.abs(e.deltaY), 120) / 120;
  var factor = e.deltaY < 0 ? (1 + intensity * 0.06) : (1 - intensity * 0.06);
  var newScale = Math.max(0.2, Math.min(3, view.scale * factor));

  view.tx = mx - (mx - view.tx) * (newScale / view.scale);
  view.ty = my - (my - view.ty) * (newScale / view.scale);
  view.scale = newScale;
  applyTransform();
}, { passive: false });

// Click on empty space deselects
viewport.addEventListener("click", function(e){
  if (Date.now() < suppressClickUntil) return;
  if (!e.target.closest(".node") && !e.target.closest(".zoom-controls")) {
    deselect();
  }
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") deselect();
});

/* =============== ZOOM BUTTONS =============== */
document.getElementById("btn-zoom-in").addEventListener("click", function(e){
  e.stopPropagation();
  var vw = viewport.clientWidth / 2, vh = viewport.clientHeight / 2;
  var newScale = Math.min(3, view.scale * 1.12);
  view.tx = vw - (vw - view.tx) * (newScale / view.scale);
  view.ty = vh - (vh - view.ty) * (newScale / view.scale);
  view.scale = newScale;
  applyTransform();
});

document.getElementById("btn-zoom-out").addEventListener("click", function(e){
  e.stopPropagation();
  var vw = viewport.clientWidth / 2, vh = viewport.clientHeight / 2;
  var newScale = Math.max(0.2, view.scale * 0.89);
  view.tx = vw - (vw - view.tx) * (newScale / view.scale);
  view.ty = vh - (vh - view.ty) * (newScale / view.scale);
  view.scale = newScale;
  applyTransform();
});

/* =============== RESET & FIT =============== */
document.getElementById("btn-fit").addEventListener("click", function(){ fitView(true); });

document.getElementById("btn-reset").addEventListener("click", function(){
  if (!confirm("Reset all progress? This clears it for your account.")) return;
  resetProgress();
});

/* =============== RESIZE =============== */
var resizeTimer = null;
window.addEventListener("resize", function(){
  // Close the bottom-sheet sidebar when going back to wide layout
  if (window.innerWidth > 900) closeSidebar();

  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    // Keep the current view; just make sure it's not fully off-screen.
    applyTransform();
  }, 120);
});

/* =============== BOOT =============== */
try {
  // 先同步读缓存渲染，再异步向服务端拉最新存档（拉回来会重绘一次）
  loadCache();
  renderEdges();
  renderNodes();
  updateProgress();
  fitView(false);

  loadProgress().then(function () {
    updateNodeStates();
    updateProgress();
  });

  // Re-fit once layout settles (fonts / rotation)
  window.addEventListener("orientationchange", function(){
    setTimeout(function(){ fitView(false); }, 250);
  });
} catch (err) {
  window.__showError(err && err.message ? err.message : String(err));
  throw err;
}
</script>
