<!DOCTYPE html>
<html lang="en">
<head>
<script>window.__BUILD_V='d9634c1d';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/css/styles.css?v=d9634c1d" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
<link rel="stylesheet" href="/assets/css/pages/calendar.css?v=d9634c1d" />
<script src="/assets/js/core/ui.js?v=d9634c1d"></script>
<script src="/assets/js/core/net.js?v=d9634c1d"></script>
<script src="/assets/js/core/api.js?v=d9634c1d"></script>
<script src="/assets/js/core/page.js?v=d9634c1d"></script>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">

      <div id="calendarApp">
        <div class="cal-topbar">
          <div class="cal-month-label" id="calMonthLabel">—</div>
          <div class="cal-topbar-actions">
            <button class="cal-today-btn" id="calTodayBtn">Today</button>
            <button class="cal-add-btn" id="calAddBtn" title="New task">+</button>
          </div>
        </div>
        <div class="cal-scroll" id="calScroll"></div>
      </div>

    </main>
  </div>

  <!-- 模态框 -->
  <div class="cal-modal-overlay" id="calModal">
    <div class="cal-modal">
      <div class="cal-modal-head">
        <h3 id="calModalTitle">New Task</h3>
        <button class="cal-modal-close" id="calModalClose">×</button>
      </div>
      <div class="cal-modal-body">
        <label for="calModalDate">Date</label>
        <input type="date" id="calModalDate">
        <label for="calModalTitleInput">Title</label>
        <input type="text" id="calModalTitleInput" maxlength="100" placeholder="What's this about?">
        <label for="calModalDetails">Details</label>
        <textarea id="calModalDetails" maxlength="2000" rows="5" placeholder="Optional details..."></textarea>
      </div>
      <div class="cal-modal-foot">
        <button class="cal-btn-danger" id="calModalDelete" style="display:none">Delete</button>
        <button class="cal-btn-secondary" id="calModalCancel">Cancel</button>
        <button class="cal-btn-primary" id="calModalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Tooltip -->
  <div class="cal-tooltip" id="calTooltip" hidden>
    <div class="cal-tooltip-head">
      <span class="cal-tooltip-title" id="calTooltipTitle"></span>
      <button class="cal-tooltip-close" id="calTooltipClose">×</button>
    </div>
    <div class="cal-tooltip-details" id="calTooltipDetails"></div>
    <div class="cal-tooltip-actions">
      <button id="calTooltipEdit">Edit</button>
      <button id="calTooltipDone">Toggle done</button>
    </div>
  </div>

  <!-- 依赖 -->
  <script src="/assets/js/auth.js?v=d9634c1d"></script>
  <script src="/assets/js/app.js?v=d9634c1d"></script>
  <script src="/assets/js/topbar.js?v=d9634c1d"></script>
  <script src="/assets/js/sidebar.js?v=d9634c1d"></script>
  <script src="/assets/js/heartbeat.js?v=d9634c1d"></script>
  <script src="/assets/js/pk-invite.js?v=d9634c1d"></script>

<script src="/assets/js/pages/calendar.js?v=d9634c1d"></script>
</body>
</html>
