  <style>
    .pkr-wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .pkr-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 1.4rem; margin-bottom: 1rem;
    }
    .pkr-title { font-size: 1.3rem; font-weight: 800; margin-bottom: .3rem; }
    .pkr-sub { font-size: .85rem; color: var(--text-secondary); }
    .pkr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    @media (max-width: 640px) { .pkr-grid { grid-template-columns: 1fr; } }
    .pkr-p {
      border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem;
    }
    .pkr-p.winner { border-color: #2ecc71; box-shadow: 0 0 0 1px #2ecc71 inset; }
    .pkr-p .nm { font-weight: 700; font-size: 1.05rem; }
    .pkr-p .tag { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
    .pkr-p .tag.weak { background: rgba(227,160,8,.18); color: #e3a008; }
    .pkr-p .tag.strong { background: rgba(231,76,60,.15); color: #e74c3c; }
    .pkr-score { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: .4rem 0; }
    .pkr-detail { font-size: .82rem; color: var(--text-secondary); line-height: 1.6; }
    .pkr-prize { font-size: 1.1rem; font-weight: 700; color: #2ecc71; margin-top: .5rem; }
    .pkr-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .85rem; }
    .pkr-table th, .pkr-table td { padding: .5rem; border-bottom: 1px solid var(--border-color); text-align: left; }
    .pkr-table th { font-weight: 700; color: var(--text-secondary); font-size: .78rem; text-transform: uppercase; }
    .pkr-row { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: .88rem; margin-top: .6rem; }
    .pkr-row b { color: var(--accent); }
    .pkr-note { font-size: .78rem; color: var(--text-secondary); margin-top: 1rem; line-height: 1.6; }
