  <style>
    :root {

      --c-text-subtle: #6e7681;

    :root[data-theme="scifi"] {
      --c-surface: #09101a;

      --c-surface-muted: #101b26;

    .profile-container {
      background: var(--card-bg);
      border-radius: 4px;
      padding: 1.5rem;

    /* ========== 头部信息 ========== */
    .profile-header {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.2rem;
    }
    .profile-avatar {
      flex-shrink: 0;
    }
    .profile-avatar img,
    .profile-avatar .placeholder {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);

    .profile-avatar .placeholder {

      justify-content: center;

    }
    .profile-info {
      flex: 1;
      min-width: 200px;
    }
    .profile-info h1 {
      margin: 0 0 0.3rem 0;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .profile-realname {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .profile-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.6rem 0;
    }
    .profile-meta .meta-badge {
      background: var(--border-color);
      color: var(--text-primary);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .profile-meta .btn-link {
      background: var(--accent);
      color: #fff;
      padding: 4px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .profile-meta .btn-link:hover {
      opacity: 0.88;
    }
    .profile-meta .btn-link.purple {
      background: #7d5bb0;
    }
    .profile-meta .btn-link.purple.offline {
      background: #8a7a9a;   /* 灰紫，視覺上弱一點但不至於像 disabled */
      opacity: 0.75;
    }
    .profile-meta .btn-link.purple.offline:hover {
      opacity: 1;
    }
    .profile-stats {
      display: flex;
      gap: 1.2rem;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 0.4rem;
      color: var(--text-primary);
    }
    .profile-stats .passed {
      color: #2e7d32;
    }
    [data-theme="dark"] .profile-stats .passed {
      color: #8fce9f;
    }

    /* ========== 已解题目网格（HKOI 风格，用 flex 而非 table） ========== */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 0.8rem 0;
    }
    .profile-solved {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-bottom: 1rem;
    }
    .profile-solved a {
      display: inline-block;
      min-width: 5.5em;
      padding: 5px 8px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background: var(--c-surface-sunken);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: monospace;
      text-decoration: none;
      transition: transform 0.12s ease, background 0.15s, border-color 0.15s;
    }
    .profile-solved a:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: #e8f2ff;
    }
    .profile-solved a.state-passed {
      background: #d4edda;
      color: #155724;
      border-color: #b1dfbb;
    }
    .profile-solved a.state-passed:hover {
      background: #a5d6a7;
    }
    .profile-solved a.state-failed {
      background: #f8d7da;
      color: #721c24;
      border-color: #f1b0b7;
    }
    .profile-solved a.state-failed:hover {
      background: #ef9a9a;
    }

    /* ========== Dark mode ========== */
    [data-theme="dark"] .profile-solved a {
      background: #161b22;
      color: var(--text-primary);
      border-color: var(--border-color);
    }
    [data-theme="dark"] .profile-solved a:hover {
      background: #21262d;
      border-color: var(--accent);
    }
    [data-theme="dark"] .profile-solved a.state-passed {
      background: #1a3a2a;
      color: #8fce9f;
      border-color: #2a5a3a;
    }
    
    /* ========== Sci-Fi mode ========== */
    [data-theme="scifi"] .profile-solved a {
      background: #0b1420;
      color: #a8d8ea;
      border-color: #14313f;
    }
    [data-theme="scifi"] .profile-solved a:hover {
      background: #0f2231;
      border-color: var(--accent);
    }
    [data-theme="scifi"] .profile-solved a.state-passed {
      background: #0b2a24;
      color: #7ef2c8;
      border-color: #14524a;
    }
    [data-theme="scifi"] .profile-solved a.state-failed {
      background: #2a1118;
      color: #ff9db8;
      border-color: #5a2430;
    }
    .edit-realname-btn {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;

}
.edit-realname-btn:hover {
  background: rgba(74, 144, 217, 0.12);
}
    /* ===== 只顯示 attempted 的開關 ===== */
    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 0.8rem 0;
    }
    .section-header-row .section-title { margin: 0; }
    .attempted-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      padding: 4px 10px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: var(--card-bg);
      transition: border-color 0.15s, color 0.15s;
    }
    .attempted-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .attempted-toggle input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent);
      margin: 0;
    }
        /* ═══════════════ Achievements ═══════════════ */
    .ach-section {
      margin-top: 1.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border-color);
    }
    .ach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .ach-header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .ach-progress {
      font-size: .85rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .ach-progress b {
      color: var(--accent);
      font-size: 1rem;
    }

    /* ─── 网格 ─── */
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: .7rem;
    }
    @media (max-width: 500px) {
      .ach-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }

    /* ─── 卡片 ─── */
    .ach-card {
      position: relative;
      padding: .8rem .7rem;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      text-align: center;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      cursor: default;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
    }
    .ach-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .ach-card.locked {
      opacity: .45;
      filter: grayscale(1);
    }
    .ach-card.locked:hover {
      opacity: .65;
    }

    .ach-icon-wrap {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(74,144,217,.1);
      margin-bottom: .1rem;
      flex-shrink: 0;
    }
    .ach-icon-wrap i {
      font-size: 1.5rem;
    }
    .ach-name {
      font-size: .88rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .ach-desc {
      font-size: .72rem;
      color: var(--text-secondary);
      line-height: 1.35;
      flex: 1;
    }
    .ach-date {
      font-size: .68rem;
      color: var(--text-secondary);
      font-family: 'Consolas', monospace;
      margin-top: auto;
      opacity: .85;
    }
    .ach-rarity-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: .6rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 8px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ── 进度条（未解锁的成就显示距离目标还差多少）── */
    .ach-bar-wrap {
      margin-top: 6px;
      width: 100%;
    }
    .ach-bar {
      height: 5px;
      border-radius: 3px;
      background: rgba(127, 127, 127, .22);
      overflow: hidden;
    }
    .ach-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width .25s ease;
    }
    .ach-bar-label {
      font-size: .64rem;
      color: var(--text-secondary);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .ach-card.rarity-legendary .ach-bar-fill { background: #FFAA00; }
    .ach-card.rarity-epic      .ach-bar-fill { background: #AA00AA; }
    .ach-card.rarity-rare      .ach-bar-fill { background: #4A90D9; }
    .ach-card.rarity-uncommon  .ach-bar-fill { background: #008000; }

    /* 未解锁时显示的奖励金额 */
    .ach-reward {
      font-size: .66rem;
      font-weight: 700;
      color: #2ecc71;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    /* 头部已获得的 token 总额 */
    .ach-earned {
      font-size: .8rem;
      font-weight: 700;
      color: #2ecc71;
      margin-left: .6rem;
      font-variant-numeric: tabular-nums;
    }

    /* ─── 稀有度配色（图标 + 边框 + tag） ─── */
    .ach-card.rarity-common    { border-color: rgba(128,128,128,.4); }
    .ach-card.rarity-common    .ach-icon-wrap { background: rgba(128,128,128,.15); color: #808080; }
    .ach-card.rarity-common    .ach-rarity-tag { background: rgba(128,128,128,.15); color: #808080; }

    .ach-card.rarity-uncommon  { border-color: rgba(0,128,0,.45); }
    .ach-card.rarity-uncommon  .ach-icon-wrap { background: rgba(0,128,0,.14); color: #008000; }
    .ach-card.rarity-uncommon  .ach-rarity-tag { background: rgba(0,128,0,.15); color: #008000; }

    .ach-card.rarity-rare      { border-color: rgba(0,0,255,.45); }
    .ach-card.rarity-rare      .ach-icon-wrap { background: rgba(0,0,255,.12); color: #0000FF; }
    .ach-card.rarity-rare      .ach-rarity-tag { background: rgba(0,0,255,.12); color: #0000FF; }

    .ach-card.rarity-epic      { border-color: rgba(170,0,170,.5); }
    .ach-card.rarity-epic      .ach-icon-wrap { background: rgba(170,0,170,.14); color: #AA00AA; }
    .ach-card.rarity-epic      .ach-rarity-tag { background: rgba(170,0,170,.14); color: #AA00AA; }

    .ach-card.rarity-legendary {
      border-color: rgba(255,170,0,.7);
      box-shadow: 0 0 12px rgba(255,170,0,.18);
    }
    .ach-card.rarity-legendary .ach-icon-wrap { background: rgba(255,170,0,.18); color: #FFAA00; }
    .ach-card.rarity-legendary .ach-rarity-tag { background: rgba(255,170,0,.2); color: #B37700; }

    /* dark 模式微调 */
    [data-theme="dark"] .ach-card.locked { opacity: .3; }
    [data-theme="dark"] .ach-card.rarity-common .ach-rarity-tag { color: #aaa; }
    [data-theme="dark"] .ach-card.rarity-uncommon .ach-rarity-tag { color: #6dbf6d; }
    [data-theme="dark"] .ach-card.rarity-uncommon .ach-icon-wrap { color: #6dbf6d; }
    [data-theme="dark"] .ach-card.rarity-rare .ach-rarity-tag { color: #7d9dff; }
    [data-theme="dark"] .ach-card.rarity-rare .ach-icon-wrap { color: #7d9dff; }
    [data-theme="dark"] .ach-card.rarity-epic .ach-rarity-tag { color: #d68cd6; }
    [data-theme="dark"] .ach-card.rarity-epic .ach-icon-wrap { color: #d68cd6; }

    /* ─── 空状态 ─── */
    .ach-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-secondary);
      font-style: italic;
    }
        /* 已解锁的右上角绿色勾 */
    .ach-card.unlocked::before {
      content: '\f00c';  /* FontAwesome check */
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: -6px;
      left: -6px;
      width: 20px;
      height: 20px;
      background: #2e7d32;
      color: #fff;
      border-radius: 50%;
      font-size: .7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.15);
      z-index: 1;
    }
  /* ⭐ 在线时长 */
.profile-online-row {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  margin-top: .7rem;
  font-size: .85rem;
}
  /* ⭐ 在线时长 & 最后可见（重构版） */
  .profile-online-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .profile-online-row .item {
    display: flex;
    align-items: center;
    justify-content: space-between; /* 左右分布，对齐更工整 */
    padding: 8px 12px;
    background: var(--c-surface-sunken);
    border: 1px solid var(--c-border);
    border-radius: 6px; /* 改成跟 badge 统一的微圆角 */
    color: var(--c-text-muted);
    font-size: .85rem;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .profile-online-row .item:hover {
    border-color: var(--accent);
    background: var(--c-surface-raised);
    transform: translateY(-1px);
  }
  
  .profile-online-row .item-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile-online-row .item i {
    color: var(--c-text-subtle);
    font-size: .9rem;
  }
  .profile-online-row .item b {
    color: var(--c-text);
    font-family: 'Consolas', monospace;
    font-weight: 700;
    font-size: .95rem;
  }

  /* ── 在线状态的特殊修饰 ── */
  .profile-online-row .item.online {
    background: rgba(46,204,113,.05);
    border-color: rgba(46,204,113,.25);
  }
  .profile-online-row .item.online i {
    color: #2ecc71;
  }
  .profile-online-row .item.online b {
    color: #2e7d32;
  }
  
  /* ── Dark 模式 ── */
  [data-theme="dark"] .profile-online-row .item {
    background: var(--c-surface-sunken);
    border-color: var(--c-border);
  }
  [data-theme="dark"] .profile-online-row .item:hover {
    background: var(--c-surface-raised);
    border-color: var(--accent);
  }
  [data-theme="dark"] .profile-online-row .item b {
    color: var(--c-text);
  }
  [data-theme="dark"] .profile-online-row .item.online {
    background: rgba(46,204,113,.1);

    color: #8fdf8f;
  }

  /* ── Sci-Fi 模式 ── */

    background: #0f2231;

  }
  [data-theme="scifi"] .profile-online-row .item i {
    color: #1e4a5e;
  }
  [data-theme="scifi"] .profile-online-row .item b {
    color: #c6eeff;
  }
