<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Changelog - WYK Maths Team</title>

  <!-- ⭐ PWA（每個新頁面都要加這 7 行） -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WYK Maths">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    .changelog-container {
      background: var(--card-bg);
      border-radius: 4px;
      padding: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .changelog-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-color);
    }
    .changelog-header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--text-primary);
    }
    .changelog-header i {
      font-size: 1.6rem;
      color: var(--accent);
    }
    .update-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      transition: border-color 0.15s;
    }
    .update-card:hover {
      border-color: var(--accent);
    }
    .update-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .update-badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .update-badge.new  { background: #e8f5e9; color: #2e7d32; }
    .update-badge.info { background: #e3f2fd; color: #1565c0; }
    .update-badge.warning { background: #fff3e0; color: #e65100; }
    [data-theme="dark"] .update-badge.new  { background: #1b4d2e; color: #8fdf8f; }
    [data-theme="dark"] .update-badge.info { background: #14395e; color: #8ec3ff; }
    [data-theme="dark"] .update-badge.warning { background: #4d2e0d; color: #ffb86c; }
    .update-time {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-family: 'Consolas', monospace;
    }
    .update-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 0.4rem 0;
      color: var(--text-primary);
    }
    .update-content {
      color: var(--text-primary);
      line-height: 1.7;
      font-size: 0.92rem;
    }
    .loading-msg, .error-msg {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="changelog-container">
        <div class="changelog-header">
          <i class="fas fa-clock-rotate-left"></i>
          <h1>Changelog</h1>
        </div>
        <div id="changelogList">
          <div class="loading-msg">Loading…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    (function() {
      const listEl = document.getElementById('changelogList');

      function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
      }

      async function loadChangelog() {
        try {
          const res = await fetch('/api/updates');
          const data = await res.json();
          if (!data.success || !data.updates || data.updates.length === 0) {
            listEl.innerHTML = '<div class="loading-msg">No updates yet.</div>';
            return;
          }

          listEl.innerHTML = data.updates.map(u => `
            <div class="update-card">
              <div class="update-card-header">
                <span class="update-badge ${escapeHtml(u.badge)}">${escapeHtml(u.badgeText)}</span>
                <span class="update-time">${escapeHtml(u.time)}</span>
              </div>
              ${u.title ? `<h3 class="update-title">${escapeHtml(u.title)}</h3>` : ''}
              <div class="update-content">${u.content || ''}</div>
            </div>
          `).join('');

          if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(listEl, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ]
            });
          }
        } catch (err) {
          console.error(err);
          listEl.innerHTML = '<div class="error-msg">Failed to load changelog.</div>';
        }
      }

      loadChangelog();
    })();
  </script>
</body>
</html>
