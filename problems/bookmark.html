    <style>
        .problems-table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--card-bg); border-radius: 4px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .problems-table th, .problems-table td {
            padding: 0.2rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .problems-table th { background: #e9ecef; font-weight: 700; padding-top: 0.3rem; padding-bottom: 0.3rem; }
        .problem-row { cursor: pointer; transition: background 0.15s; }
        .problem-row.state-not_started { border-left: 2px solid #b3d4ff; }
        .problem-row.state-passed td { background-color: #e6ffed; }
        .problem-row.state-passed { border-left: 2px solid #4caf50; }
        .problem-row.state-failed td { background-color: #ffeaea; }
        .problem-row.state-failed { border-left: 2px solid #e74c3c; }
        .problem-row:hover td { background-color: #f0f0f0 !important; }
        .problem-row.state-passed:hover td { background-color: #b9f6ca !important; }
        .problem-row.state-failed:hover td { background-color: #ffb3b3 !important; }

        :root[data-theme="dark"] .problem-row.state-passed td {
            background-color: #1a3a2a !important;
        }
        :root[data-theme="dark"] .problem-row.state-failed td {
            background-color: #3a1a1a !important;
        }
        :root[data-theme="dark"] .problem-row:hover td {
            background-color: #2a2a2a !important;
        }
        :root[data-theme="dark"] .problem-row.state-passed:hover td {
            background-color: #2a4a3a !important;
        }
        :root[data-theme="dark"] .problem-row.state-failed:hover td {
            background-color: #4a2a2a !important;
        }

        .problem-id { font-family: monospace; font-weight: 700; width: 120px; }
        .problem-name { font-weight: 600; }
        .tags-container {
            display: flex;
            gap: 0.4rem;
            flex-wrap: nowrap;
            overflow: hidden;
            min-height: 1.5em;
            align-items: center;
            padding: 0;
        }
        .tag { background: #f0f0f0; padding: 0.1rem 0.5rem; border-radius: 12px; font-size: 0.7rem; white-space: nowrap; }
        .difficulty { text-align: right; width: 70px; }
        .solves { text-align: right; width: 70px; }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: var(--accent); }
        .back-link { margin-bottom: 1rem; display: inline-block; }
        /* 星星样式 */
        .star-favorite { color: #f1c40f; cursor: pointer; font-size: 1.2rem; }
        .star-favorite:hover { opacity: 0.8; }
    </style>
