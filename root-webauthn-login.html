<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Root Login - WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .wa-card {
    background: var(--card-bg); border: 2px solid var(--accent); border-radius: 16px;
    padding: 40px 32px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .wa-icon {
    width: 88px; height: 88px; margin: 0 auto 24px;
    background: radial-gradient(circle at 30% 30%, #4a90d9, #2e5fa0);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem; color: #fff;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,144,217,.4); }
    50% { box-shadow: 0 0 0 20px rgba(74,144,217,0); }
  }
  .wa-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
  .wa-sub { font-size: .9rem; color: var(--text-secondary); margin-bottom: 26px; }
  .wa-btn {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-weight: 700; font-size: 1rem;
    cursor: pointer; font-family: inherit;
  }
  .wa-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .wa-btn:disabled { opacity: .5; cursor: not-allowed; }
  .wa-msg { font-size: .88rem; margin-top: 16px; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="wa-card">
    <div class="wa-icon"><i class="fas fa-fingerprint"></i></div>
    <div class="wa-title">Root Access</div>
    <div class="wa-sub">Use Touch ID / Windows Hello</div>
    <button class="wa-btn" id="waBtn">
      <i class="fas fa-fingerprint"></i> Sign in with Biometrics
    </button>
    <div class="wa-msg" id="waMsg"></div>
  </div>

  <script type="module">
    import { startAuthentication } from 'https://esm.sh/@simplewebauthn/browser@11';

    const btn = document.getElementById('waBtn');
    const msg = document.getElementById('waMsg');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Waiting for biometric…';
      msg.textContent = '';

      try {
        // 1. 拿 challenge
        const beginRes = await fetch('/api/root-webauthn?action=auth-begin', { method: 'POST' });
        const begin = await beginRes.json();
        if (!begin.success) throw new Error(begin.message);

        // 2. 系統彈窗 → 按指紋
        const assertion = await startAuthentication({ optionsJSON: begin.options });

        // 3. 驗證簽名
        const finishRes = await fetch('/api/root-webauthn?action=auth-finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionKey: begin.sessionKey, response: assertion }),
        });
        const finish = await finishRes.json();
        if (!finish.success) throw new Error(finish.message);

        localStorage.setItem('auth_token', finish.token);
        msg.textContent = '✓ Success — redirecting…';
        msg.style.color = '#2ecc71';
        setTimeout(() => location.href = '/', 400);
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          msg.textContent = 'Cancelled or biometric failed';
        } else {
          msg.textContent = err.message || 'Failed';
        }
        msg.style.color = 'var(--danger)';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-fingerprint"></i> Sign in with Biometrics';
      }
    });
  </script>
</body>
</html>
