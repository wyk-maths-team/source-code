<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true
                    || window.matchMedia('(display-mode: fullscreen)').matches
                    || window.matchMedia('(display-mode: minimal-ui)').matches;
    if (!isStandalone) return;
    if (location.pathname.indexOf('/os') === 0) return;
    if (location.pathname.indexOf('/admin') === 0) return;
    if (!sessionStorage.getItem('pwaEnteredOS')) {
      sessionStorage.setItem('pwaEnteredOS', '1');
      location.replace('/os' + location.search + location.hash);
    }
  } catch(e){}
})();
</script>

    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WYK Maths Team</title>
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js"></script>
    <style>
        /* 骨架样式 */
        .skeleton-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            margin-bottom: 1rem;
        }
        .skeleton-line {
            display: block;
            height: 12px;
            background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .skeleton-line:last-child { margin-bottom: 0; }
        .skeleton-line.short { width: 30%; }
        .skeleton-line.medium { width: 60%; }
        .skeleton-line.long { width: 90%; }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        [data-theme="dark"] .skeleton-line {
            background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%);
            background-size: 200% 100%;
        }
        .load-more-wrapper {
            text-align: center;
            margin-top: 1rem;
        }
        .load-more-btn {
            padding: 0.5rem 2rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .load-more-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .load-more-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>

  <!-- ⭐ PWA manifest（必須靜態寫入，不能 JS 注入） -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WYK Maths">
  <meta name="mobile-web-app-capable" content="yes">

</head>
<body class="index-body">
    <div id="appContainer">
        <header class="topbar" id="topbarContainer"></header>
        <aside class="sidebar" id="sidebarContainer"></aside>

        <main class="main-content" id="mainContent">
            <div class="updates-panel">
                <div class="updates-header">
                    <h2>Recent Updates</h2>
                    <span class="updates-date" id="currentDate"></span>
                </div>
                <div class="updates-body" id="updatesBody">
                    <!-- 骨架由 JS 生成 -->
                </div>
            </div>
        </main>

        <!-- <button class="sidebar-toggle" id="sidebarToggle">☰</button> -->
    </div>

    <div id="loginModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Sign In Required</h2>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>

    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

    <script>
        // 显示当前日期
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString();

        // ---------- DOM 引用 ----------
        const updatesBody = document.getElementById('updatesBody');

        // ---------- 工具函数 ----------
        function escapeHtml(str) {
            return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }

        const domPurifyConfig = {
            ALLOWED_TAGS: ['b', 'i', 'u', 'strong', 'em', 'a', 'p', 'br', 'ul', 'ol', 'li', 'span', 'div', 'code', 'pre'],
            ALLOWED_ATTR: ['href', 'target', 'rel', 'class']
        };

        // ---------- 渲染骨架（5条） ----------
        function renderSkeleton() {
            let skeletonHtml = '';
            for (let i = 0; i < 5; i++) {
                skeletonHtml += `
                    <div class="skeleton-card">
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                `;
            }
            updatesBody.innerHTML = skeletonHtml;
        }

        // ---------- 渲染更新列表 ----------
        function renderUpdates(updates, showAll = false) {
            const total = updates.length;
            const display = showAll ? updates : updates.slice(0, 5);
            const hasMore = !showAll && total > 5;

            let html = '';
            display.forEach(u => {
                const titleHtml = u.title ? `<h3>${escapeHtml(u.title)}</h3>` : '';
                const contentHtml = u.content ? DOMPurify.sanitize(u.content, domPurifyConfig) : '';
                html += `
                    <div class="update-card">
                        <div class="update-card-header">
                            <span class="update-badge ${escapeHtml(u.badge)}">${escapeHtml(u.badgeText)}</span>
                            <span class="update-time">${escapeHtml(u.time)}</span>
                        </div>
                        ${titleHtml}
                        <p>${contentHtml}</p>
                    </div>
                `;
            });

            if (hasMore) {
                html += `
                    <div class="load-more-wrapper">
                        <button class="load-more-btn" id="loadMoreBtn">Load More</button>
                    </div>
                `;
            }

            updatesBody.innerHTML = html;

            // 绑定 Load More 事件
            if (hasMore) {
                document.getElementById('loadMoreBtn').addEventListener('click', function() {
                    this.disabled = true;
                    this.textContent = 'Loading...';
                    // 延迟一点模拟加载，但实际是立即渲染（因为数据已全量获取）
                    // 为了避免闪烁，直接渲染全部
                    renderUpdates(allUpdates, true);
                });
            }
        }

        // ---------- 存储全部更新数据 ----------
        let allUpdates = [];

        // ---------- 加载更新 ----------
        async function loadUpdates() {
            renderSkeleton(); // 显示骨架

            try {
                const res = await fetch('/api/updates');
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                if (data.success && data.updates.length > 0) {
                    allUpdates = data.updates;
                    renderUpdates(allUpdates, false); // 先显示前5条
                } else {
                    updatesBody.innerHTML = '<div class="placeholder-card">No updates yet.</div>';
                }
            } catch (err) {
                updatesBody.innerHTML = '<div class="error-msg">Could not load updates.</div>';
            }
        }

        // 启动
        loadUpdates();
    </script>
</body>
</html>
