<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<style>
  /* ═══════════ Home Dashboard ═══════════ */
  .home-wrap {
    width: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    padding: 0.5rem 0;
  }

  /* ── Hero Banner ── */
  .home-hero {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    padding: 2rem 2.2rem;
    background: linear-gradient(135deg, #4a90d9 0%, #2e5fa0 60%, #1a1a2e 100%);
    color: #fff;
    box-shadow: 0 12px 40px rgba(74,144,217,.22), 0 0 0 1px rgba(255,255,255,.08) inset;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .home-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 25%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 58% 20%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 78% 78%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 90% 35%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 5% 88%, rgba(255,255,255,.6), transparent);
    background-size: 400px 400px;
    opacity: .55;
    pointer-events: none;
    animation: heroDrift 60s linear infinite;
  }
  @keyframes heroDrift {
    from { background-position: 0 0; }
    to   { background-position: 400px 300px; }
  }
  .home-hero::after {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }

  .hero-greet {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 0.3rem;
    color: #fff;
  }
  .hero-sub {
    font-size: 1rem;
    opacity: .92;
    margin: 0 0 1.2rem;
    font-weight: 400;
    color: #fff;
  }
  .hero-actions {
    display: flex;
    gap: 0.7rem;
    flex-wrap: wrap;
  }
  .hero-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 24px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.92rem;
    transition: transform .15s, box-shadow .15s, background .15s;
    border: 1px solid rgba(255,255,255,.3);
    font-family: inherit;
  }
  .hero-btn.primary {
    background: #fff;
    color: #2e5fa0;
    border-color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .hero-btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .hero-btn.ghost {
    background: rgba(255,255,255,.12);
    color: #fff;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .hero-btn.ghost:hover {
    background: rgba(255,255,255,.22);
    transform: translateY(-2px);
  }

  /* ── Quick Access Grid ── */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .quick-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    transition: transform .15s, border-color .15s, box-shadow .15s;
    position: relative;
    overflow: hidden;
    min-height: 120px;
  }
  .quick-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(74,144,217,.10) 0%, transparent 60%);
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .quick-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 12px 32px rgba(74,144,217,.2);
  }
  .quick-card:hover::after { opacity: 1; }
  .quick-card .qc-icon {
    font-size: 26px;
    color: var(--accent);
    line-height: 1;
  }
  .quick-card .qc-title {
    font-size: 1.02rem;
    font-weight: 700;
    margin-top: auto;
    color: var(--text-primary);
  }
  .quick-card .qc-desc {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  /* ── Updates Panel ── */
  .updates-panel {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--border-color);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .updates-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 8px;
  }
  .updates-header h2 {
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    color: var(--text-primary);
  }
  .updates-header h2 i {
    color: var(--accent);
    font-size: 1rem;
  }
  .updates-date {
    font-size: .85rem;
    color: var(--text-secondary);
  }
  .updates-body {
    padding: 20px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 200px;
  }

  /* ── Update card ── */
  .update-card {
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .update-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(74,144,217,.12);
  }
  .update-card-header {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .update-badge {
    font-size: .7rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .update-badge.new     { background: rgba(46, 160, 67, .18); color: #2e7d32; }
  .update-badge.info    { background: rgba(31, 111, 235, .18); color: #1565c0; }
  .update-badge.warning { background: rgba(230, 140, 30, .18); color: #b45309; }

  :root[data-theme="dark"] .update-badge.new     { background: #1b4d2e; color: #8fdf8f; }
  :root[data-theme="dark"] .update-badge.info    { background: #14395e; color: #8ec3ff; }
  :root[data-theme="dark"] .update-badge.warning { background: #4d2e0d; color: #ffb86c; }

  .update-time {
    font-size: .78rem;
    color: var(--text-secondary);
    font-family: 'Consolas', 'Monaco', monospace;
  }
  .update-card h3 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--text-primary);
  }
  .update-card p {
    font-size: .88rem;
    color: var(--text-secondary);
    margin: 0;
    line-height: 1.6;
  }

  /* ── Skeleton ── */
  .skeleton-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .skeleton-line {
    display: block;
    height: 11px;
    background: linear-gradient(90deg, #e5e9ee 25%, #f0f3f7 50%, #e5e9ee 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  :root[data-theme="dark"] .skeleton-line {
    background: linear-gradient(90deg, #2a2f38 25%, #343a44 50%, #2a2f38 75%);
    background-size: 200% 100%;
  }
  .skeleton-line:last-child { margin-bottom: 0; }
  .skeleton-line.short { width: 30%; }
  .skeleton-line.medium { width: 60%; }
  .skeleton-line.long { width: 90%; }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Load more ── */
  .load-more-wrapper { text-align: center; padding-top: 6px; }
  .load-more-btn {
    padding: 8px 28px;
    border: 1px solid var(--border-color);
    border-radius: 22px;
    background: var(--card-bg);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
    font-weight: 600;
    transition: all .15s;
  }
  .load-more-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .load-more-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .placeholder-card {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
    font-size: .95rem;
  }
  .error-msg {
    text-align: center;
    padding: 30px 20px;
    color: var(--danger);
    font-size: .9rem;
  }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .home-hero { padding: 1.5rem 1.4rem; min-height: 160px; border-radius: 12px; }
    .hero-greet { font-size: 1.55rem; }
    .hero-sub { font-size: .9rem; }
    .hero-btn { padding: 8px 16px; font-size: .85rem; }
    .quick-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .quick-card { padding: 14px 12px; min-height: 100px; }
    .quick-card .qc-icon { font-size: 22px; }
    .quick-card .qc-title { font-size: .9rem; }
    .quick-card .qc-desc { font-size: .72rem; }
    .updates-header, .updates-body { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>

    <main class="main-content" id="mainContent">
      <div class="home-wrap">

        <!-- ═══════ Hero ═══════ -->
        <section class="home-hero">
          <div class="hero-inner">
            <h1 class="hero-greet">
              <span id="heroGreet">Welcome back</span>
            </h1>
            <p class="hero-sub" id="heroSub">Ready to solve some problems?</p>
            <div class="hero-actions">
              <a href="/problems" class="hero-btn primary">
                <i class="fas fa-play"></i>
                Start Solving
              </a>
              <a href="/leaderboard" class="hero-btn ghost">
                <i class="fas fa-ranking-star"></i>
                Leaderboard
              </a>
            </div>
          </div>
        </section>

        <!-- ═══════ Quick Access ═══════ -->
        <section class="quick-grid">
          <a href="/problems" class="quick-card">
            <i class="fas fa-list-check qc-icon"></i>
            <div class="qc-title">Problems</div>
            <div class="qc-desc">Browse and solve</div>
          </a>
          <a href="/contest" class="quick-card">
            <i class="fas fa-trophy qc-icon"></i>
            <div class="qc-title">Contests</div>
            <div class="qc-desc">Join live contests</div>
          </a>
          <a href="/submissions" class="quick-card">
            <i class="fas fa-paper-plane qc-icon"></i>
            <div class="qc-title">Submissions</div>
            <div class="qc-desc">Your latest submits</div>
          </a>
          <a href="/leaderboard" class="quick-card">
            <i class="fas fa-ranking-star qc-icon"></i>
            <div class="qc-title">Leaderboard</div>
            <div class="qc-desc">Global rankings</div>
          </a>
          <a href="/resources" class="quick-card">
            <i class="fas fa-folder-open qc-icon"></i>
            <div class="qc-title">Resources</div>
            <div class="qc-desc">Study materials</div>
          </a>
          <a href="/charts" class="quick-card">
            <i class="fas fa-chart-line qc-icon"></i>
            <div class="qc-title">Progress</div>
            <div class="qc-desc">Track your stats</div>
          </a>
        </section>

        <!-- ═══════ Recent Updates ═══════ -->
        <section class="updates-panel">
          <div class="updates-header">
            <h2><i class="fas fa-bullhorn"></i> Recent Updates</h2>
            <span class="updates-date" id="currentDate"></span>
          </div>
          <div class="updates-body" id="updatesBody">
            <!-- Skeleton rendered by JS -->
          </div>
        </section>

      </div>
    </main>
  </div>

  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Sign In Required</h2>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="modalLoginForm">
        <div class="form-group">
          <label for="modalUsername">Username</label>
          <input type="text" id="modalUsername" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="modalPassword">Password</label>
          <input type="password" id="modalPassword" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div id="modalLoginError" class="login-error hidden"></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    // ═══════ 日期 ═══════
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-HK', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });

    // ═══════ Hero 歡迎詞 ═══════
    (function updateHero() {
      const user = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
      const greetEl = document.getElementById('heroGreet');
      const subEl = document.getElementById('heroSub');
      if (!greetEl) return;
      if (user && user.username) {
        const hour = new Date().getHours();
        const timeGreet = hour < 5 ? 'Late night' :
                          hour < 12 ? 'Good morning' :
                          hour < 18 ? 'Good afternoon' :
                          'Good evening';
        greetEl.textContent = `${timeGreet}, ${user.displayName || user.username}`;
        subEl.textContent = 'What are we solving today?';
      }
    })();

    // ═══════ Updates 渲染 ═══════
    const updatesBody = document.getElementById('updatesBody');

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    const domPurifyConfig = {
      ALLOWED_TAGS: ['b', 'i', 'u', 'strong', 'em', 'a', 'p', 'br', 'ul', 'ol', 'li', 'span', 'div', 'code', 'pre', 'img'],
      ALLOWED_ATTR: ['href', 'target', 'rel', 'class', 'src', 'style']
    };

    function renderSkeleton() {
      let html = '';
      for (let i = 0; i < 3; i++) {
        html += `
          <div class="skeleton-card">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line medium"></div>
          </div>
        `;
      }
      updatesBody.innerHTML = html;
    }

    function renderUpdates(updates, showAll = false) {
      const total = updates.length;
      const display = showAll ? updates : updates.slice(0, 4);
      const hasMore = !showAll && total > 4;

      let html = '';
      display.forEach(u => {
        const titleHtml = u.title ? `<h3>${escapeHtml(u.title)}</h3>` : '';
        const contentHtml = u.content ? DOMPurify.sanitize(u.content, domPurifyConfig) : '';
        html += `
          <div class="update-card">
            <div class="update-card-header">
              <span class="update-badge ${escapeHtml(u.badge)}">${escapeHtml(u.badgeText)}</span>
              <span class="update-time">${escapeHtml(u.time)}</span>
            </div>
            ${titleHtml}
            <p>${contentHtml}</p>
          </div>
        `;
      });

      if (hasMore) {
        html += `
          <div class="load-more-wrapper">
            <button class="load-more-btn" id="loadMoreBtn">
              Load More (${total - 4})
            </button>
          </div>
        `;
      }

      updatesBody.innerHTML = html;

      if (hasMore) {
        document.getElementById('loadMoreBtn').addEventListener('click', function () {
          this.disabled = true;
          this.textContent = 'Loading...';
          renderUpdates(allUpdates, true);
        });
      }
    }

    let allUpdates = [];

    async function loadUpdates() {
      renderSkeleton();
      try {
        const res = await fetch('/api/updates');
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();
        if (data.success && data.updates.length > 0) {
          allUpdates = data.updates;
          renderUpdates(allUpdates, false);
        } else {
          updatesBody.innerHTML = '<div class="placeholder-card">No updates yet.</div>';
        }
      } catch (err) {
        updatesBody.innerHTML = '<div class="error-msg">Could not load updates.</div>';
      }
    }

    loadUpdates();
  </script>
</body>
</html>
