<!DOCTYPE html>
<html lang="en">

<script>
(function(){
  try {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true
                    || window.matchMedia('(display-mode: fullscreen)').matches
                    || window.matchMedia('(display-mode: minimal-ui)').matches;
    if (!isStandalone) return;
    if (location.pathname.indexOf('/os') === 0) return;
    if (location.pathname.indexOf('/admin') === 0) return;
    if (!sessionStorage.getItem('pwaEnteredOS')) {
      sessionStorage.setItem('pwaEnteredOS', '1');
      location.replace('/os' + location.search + location.hash);
    }
  } catch(e){}
})();
</script>

<style>
  /* ═══════════ Home Dashboard ═══════════ */
.home-wrap {
    width: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    padding: 0.5rem 0;
  }

  /* ── Hero Banner ── */
  .home-hero {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    padding: 2rem 2.2rem;
    background: linear-gradient(135deg, #4a90d9 0%, #2e5fa0 60%, #1a1a2e 100%);
    color: #fff;
    box-shadow: 0 12px 40px rgba(74,144,217,.28);
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .home-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 25%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 58% 20%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 78% 78%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 90% 35%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 5% 88%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,.5), transparent);
    background-size: 400px 400px;
    opacity: .6;
    pointer-events: none;
    animation: heroDrift 60s linear infinite;
  }
  @keyframes heroDrift {
    from { background-position: 0 0; }
    to   { background-position: 400px 300px; }
  }
  .home-hero::after {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero-greet {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 0.3rem;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  
  .hero-sub {
    font-size: 1rem;
    opacity: .9;
    margin: 0 0 1.2rem;
    font-weight: 400;
  }
  .hero-actions {
    display: flex;
    gap: 0.7rem;
    flex-wrap: wrap;
  }
  .hero-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 24px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.92rem;
    transition: transform .15s, box-shadow .15s, background .15s;
    border: 1px solid rgba(255,255,255,.3);
  }
  .hero-btn.primary {
    background: #fff;
    color: #2e5fa0;
    border-color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .hero-btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .hero-btn.ghost {
    background: rgba(255,255,255,.12);
    color: #fff;
    backdrop-filter: blur(8px);
  }
  .hero-btn.ghost:hover {
    background: rgba(255,255,255,.22);
    transform: translateY(-2px);
  }

  /* ── Quick Access Grid ── */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .quick-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    transition: transform .15s, border-color .15s, box-shadow .15s;
    position: relative;
    overflow: hidden;
    min-height: 120px;
  }
  .quick-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(74,144,217,.08) 0%, transparent 60%);
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .quick-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 12px 32px rgba(74,144,217,.15);
  }
  .quick-card:hover::after { opacity: 1; }
  .quick-card .qc-icon {
    font-size: 26px;
    color: var(--accent);
    line-height: 1;
  }
  .quick-card .qc-title {
    font-size: 1.02rem;
    font-weight: 700;
    margin-top: auto;
  }
  .quick-card .qc-desc {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  /* ── Updates Panel ── */
  .updates-panel {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    overflow: hidden;
  }
  .updates-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 8px;
  }
  .updates-header h2 {
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }
  .updates-header h2 i {
    color: var(--accent);
    font-size: 1rem;
  }
  .updates-date {
    font-size: .85rem;
    color: var(--text-secondary);
  }
  .updates-body {
    padding: 20px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 200px;
  }

  /* Update card */
  .update-card {
    background: rgba(74,144,217,.04);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .update-card:hover {
    border-color: rgba(74,144,217,.35);
    box-shadow: 0 2px 12px rgba(74,144,217,.08);
  }
  [data-theme="dark"] .update-card {
    background: rgba(74,144,217,.06);
  }
  .update-card-header {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .update-badge {
    font-size: .7rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .update-badge.new    { background: #e8f5e9; color: #2e7d32; }
  .update-badge.info   { background: #e3f2fd; color: #1565c0; }
  .update-badge.warning { background: #fff3e0; color: #e65100; }
  [data-theme="dark"] .update-badge.new    { background: #1b4d2e; color: #8fdf8f; }
  [data-theme="dark"] .update-badge.info   { background: #14395e; color: #8ec3ff; }
  [data-theme="dark"] .update-badge.warning { background: #4d2e0d; color: #ffb86c; }
  .update-time {
    font-size: .78rem;
    color: var(--text-secondary);
    font-family: 'Consolas', monospace;
  }
  .update-card h3 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .update-card p {
    font-size: .88rem;
    color: var(--text-secondary);
    margin: 0;
    line-height: 1.6;
  }

  /* Skeleton */
  .skeleton-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .skeleton-line {
    display: block;
    height: 11px;
    background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .skeleton-line:last-child { margin-bottom: 0; }
  .skeleton-line.short { width: 30%; }
  .skeleton-line.medium { width: 60%; }
  .skeleton-line.long { width: 90%; }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  [data-theme="dark"] .skeleton-line {
    background: linear-gradient(90deg, #2a2f38 25%, #343a44 50%, #2a2f38 75%);
    background-size: 200% 100%;
  }

  .load-more-wrapper { text-align: center; padding-top: 6px; }
  .load-more-btn {
    padding: 8px 28px;
    border: 1px solid var(--border-color);
    border-radius: 22px;
    background: var(--card-bg);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
    font-weight: 600;
    transition: all .15s;
  }
  .load-more-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .load-more-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .placeholder-card {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
    font-size: .95rem;
  }
  .error-msg {
    text-align: center;
    padding: 30px 20px;
    color: var(--danger);
    font-size: .9rem;
  }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .home-hero { padding: 1.5rem 1.4rem; min-height: 160px; border-radius: 12px; }
    .hero-greet { font-size: 1.55rem; }
    .hero-sub { font-size: .9rem; }
    .hero-btn { padding: 8px 16px; font-size: .85rem; }
    .quick-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .quick-card { padding: 14px 12px; min-height: 100px; }
    .quick-card .qc-icon { font-size: 22px; }
    .quick-card .qc-title { font-size: .9rem; }
    .quick-card .qc-desc { font-size: .72rem; }
    .updates-header, .updates-body { padding-left: 16px; padding-right: 16px; }
  }
    /* ═══════════ 背景裝飾層 ═══════════ */
  .bg-decor {
    position: fixed;
    inset: 0;
    z-index: -1;                 /* 沉到最底 */
    overflow: hidden;
    pointer-events: none;
  }

  /* 深空漸變底 */
  .bg-decor::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a15 55%, #050510 100%),
      linear-gradient(180deg, #141425 0%, #050510 100%);
  }

  /* ── 漂浮彩色光斑 ── */
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    will-change: transform;
  }
  .bg-blob-1 {
    width: 620px; height: 620px;
    top: -220px; left: -140px;
    background: radial-gradient(circle, #4a90d9 0%, transparent 70%);
    animation: blobFloat1 22s ease-in-out infinite;
  }
  .bg-blob-2 {
    width: 520px; height: 520px;
    top: 28%; right: -180px;
    background: radial-gradient(circle, #a855f7 0%, transparent 70%);
    animation: blobFloat2 28s ease-in-out infinite;
    opacity: .45;
  }
  .bg-blob-3 {
    width: 720px; height: 720px;
    bottom: -320px; left: 28%;
    background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
    animation: blobFloat3 34s ease-in-out infinite;
    opacity: .4;
  }

  @keyframes blobFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(90px, 110px) scale(1.12); }
    66%      { transform: translate(-70px, 60px) scale(.94); }
  }
  @keyframes blobFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(-110px, 90px) scale(1.18); }
    66%      { transform: translate(60px, -90px) scale(.88); }
  }
  @keyframes blobFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-90px, -110px) scale(1.1); }
  }

  /* ── 星點層 ── */
  .bg-stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 25% 40%, #aac4ff, transparent),
      radial-gradient(2px 2px at 40% 15%, #fff, transparent),
      radial-gradient(1px 1px at 55% 60%, #aac4ff, transparent),
      radial-gradient(1px 1px at 70% 25%, #fff, transparent),
      radial-gradient(2px 2px at 85% 55%, #aac4ff, transparent),
      radial-gradient(1px 1px at 15% 80%, #fff, transparent),
      radial-gradient(2px 2px at 45% 75%, #aac4ff, transparent),
      radial-gradient(1px 1px at 75% 85%, #fff, transparent),
      radial-gradient(1px 1px at 90% 10%, #aac4ff, transparent),
      radial-gradient(1px 1px at 5% 55%, #fff, transparent),
      radial-gradient(2px 2px at 62% 90%, #aac4ff, transparent);
    background-size: 620px 420px;
    animation: starsDrift 100s linear infinite;
    opacity: .75;
  }
  @keyframes starsDrift {
    from { background-position: 0 0; }
    to   { background-position: 620px 420px; }
  }

  /* ── 點陣網格 ── */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(120,170,240,.14) 1px, transparent 1.4px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse at center, #000 15%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 15%, transparent 78%);
    opacity: .6;
  }

  /* ── 讓現有內容透出裝飾背景 ── */
  body.index-body {
    background: transparent !important;
  }
  body.index-body .main-content {
    background: transparent !important;
  }

  /* ── 卡片稍微加點玻璃感，浮在裝飾上 ── */
  .home-hero {
    /* 原有藍色漸層保持 */
    box-shadow:
      0 12px 40px rgba(74,144,217,.35),
      0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .quick-card {
    background: rgba(255,255,255,.04) !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-color: rgba(120,170,240,.18);
  }
  [data-theme="dark"] .quick-card {
    background: rgba(20,26,44,.55) !important;
  }
  .quick-card:hover {
    border-color: rgba(74,144,217,.55);
    box-shadow: 0 12px 32px rgba(74,144,217,.25);
  }
  .updates-panel {
    background: rgba(20,26,44,.55) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-color: rgba(120,170,240,.16);
  }
  .update-card {
    background: rgba(255,255,255,.03) !important;
    border-color: rgba(120,170,240,.14);
  }
  [data-theme="dark"] .update-card {
    background: rgba(74,144,217,.05) !important;
  }
    /* ═══════════ 強制首頁為深色（背景是深空） ═══════════ */
  /* 只作用於 index，不影響其他頁面 */
  body.index-body {
    /* ── 基本顏色（深色主題）── */
    --topbar-bg: #0d1117;
    --topbar-text: #e6edf3;
    --sidebar-bg: #0d1117;
    --sidebar-text: #8b949e;
    --sidebar-hover-bg: #21262d;
    --sidebar-active-bg: #1f6feb;
    --sidebar-active-text: #ffffff;

    --accent: #58a6ff;
    --accent-hover: #1f6feb;
    --danger: #f85149;

    --content-bg: transparent;
    --card-bg: #0d1117;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --border-color: #30363d;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.5);
  }

  /* ── 卡片統一：半透明 + 毛玻璃 + 深色底 ── */
  body.index-body .quick-card,
  body.index-body .updates-panel,
  body.index-body .update-card,
  body.index-body .skeleton-card {
    background: rgba(22,27,34,.55) !important;
    border-color: rgba(48,54,61,.9) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  body.index-body .quick-card:hover {
    background: rgba(22,27,34,.75) !important;
    border-color: rgba(88,166,255,.6) !important;
    box-shadow: 0 12px 32px rgba(88,166,255,.25) !important;
  }
  body.index-body .update-card:hover {
    border-color: rgba(88,166,255,.4) !important;
    box-shadow: 0 2px 12px rgba(88,166,255,.12) !important;
  }

  /* ── Update badge：深色版配色 ── */
  body.index-body .update-badge.new     { background: #1b4d2e; color: #8fdf8f; }
  body.index-body .update-badge.info    { background: #14395e; color: #8ec3ff; }
  body.index-body .update-badge.warning { background: #4d2e0d; color: #ffb86c; }

  /* ── Skeleton：深色底 ── */
  body.index-body .skeleton-line {
    background: linear-gradient(90deg, #2a2f38 25%, #343a44 50%, #2a2f38 75%);
    background-size: 200% 100%;
  }

  /* ── Load more 按鈕：深色版 ── */
  body.index-body .load-more-btn {
    background: rgba(22,27,34,.6);
    color: #e6edf3;
    border-color: rgba(48,54,61,.9);
  }
  body.index-body .load-more-btn:hover {
    background: #1f6feb;
    color: #fff;
    border-color: #1f6feb;
  }

  /* ── Hero 邊界：加個光暈跟背景分離 ── */
  body.index-body .home-hero {
    box-shadow:
      0 12px 40px rgba(74,144,217,.35),
      0 0 0 1px rgba(88,166,255,.15) inset;
  }

  /* ── placeholder / error 文字更明顯 ── */
  body.index-body .placeholder-card,
  body.index-body .error-msg {
    color: #8b949e;
  }
  body.index-body .error-msg {
    color: #f85149;
  }
</style>

          </a>
          <a href="/resources" class="quick-card">
            <i class="fas fa-folder-open qc-icon"></i>
            <div class="qc-title">Resources</div>
            <div class="qc-desc">Study materials</div>
          </a>
          <a href="/charts" class="quick-card">
            <i class="fas fa-chart-line qc-icon"></i>
            <div class="qc-title">Progress</div>
            <div class="qc-desc">Track your stats</div>
          </a>
        </section>

        <!-- ═══════ Recent Updates ═══════ -->
        <section class="updates-panel">
          <div class="updates-header">
            <h2><i class="fas fa-bullhorn"></i> Recent Updates</h2>
            <span class="updates-date" id="currentDate"></span>
          </div>
          <div class="updates-body" id="updatesBody">
            <!-- Skeleton rendered by JS -->
          </div>
        </section>

      </div>
    </main>
  </div>

  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Sign In Required</h2>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="modalLoginForm">
        <div class="form-group">
          <label for="modalUsername">Username</label>
          <input type="text" id="modalUsername" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="modalPassword">Password</label>
          <input type="password" id="modalPassword" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div id="modalLoginError" class="login-error hidden"></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    // ═══════ 日期 ═══════
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-HK', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });

    // ═══════ Hero 歡迎詞 ═══════
    (function updateHero() {
      const user = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
      const greetEl = document.getElementById('heroGreet');
      const subEl = document.getElementById('heroSub');
      if (!greetEl) return;
      if (user && user.username) {
        const hour = new Date().getHours();
        const timeGreet = hour < 5 ? 'Late night' :
                          hour < 12 ? 'Good morning' :
                          hour < 18 ? 'Good afternoon' :
                          'Good evening';
        greetEl.textContent = `${timeGreet}, ${user.displayName || user.username}`;
        subEl.textContent = 'What are we solving today?';
      }
    })();

    // ═══════ Updates 渲染 ═══════
    const updatesBody = document.getElementById('updatesBody');

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    const domPurifyConfig = {
      ALLOWED_TAGS: ['b', 'i', 'u', 'strong', 'em', 'a', 'p', 'br', 'ul', 'ol', 'li', 'span', 'div', 'code', 'pre', 'img'],
      ALLOWED_ATTR: ['href', 'target', 'rel', 'class', 'src', 'style']
    };

    function renderSkeleton() {
      let html = '';
      for (let i = 0; i < 3; i++) {
        html += `
          <div class="skeleton-card">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line medium"></div>
          </div>
        `;
      }
      updatesBody.innerHTML = html;
    }

    function renderUpdates(updates, showAll = false) {
      const total = updates.length;
      const display = showAll ? updates : updates.slice(0, 4);
      const hasMore = !showAll && total > 4;

      let html = '';
      display.forEach(u => {
        const titleHtml = u.title ? `<h3>${escapeHtml(u.title)}</h3>` : '';
        const contentHtml = u.content ? DOMPurify.sanitize(u.content, domPurifyConfig) : '';
        html += `
          <div class="update-card">
            <div class="update-card-header">
              <span class="update-badge ${escapeHtml(u.badge)}">${escapeHtml(u.badgeText)}</span>
              <span class="update-time">${escapeHtml(u.time)}</span>
            </div>
            ${titleHtml}
            <p>${contentHtml}</p>
          </div>
        `;
      });

      if (hasMore) {
        html += `
          <div class="load-more-wrapper">
            <button class="load-more-btn" id="loadMoreBtn">
              Load More (${total - 4})
            </button>
          </div>
        `;
      }

      updatesBody.innerHTML = html;

      if (hasMore) {
        document.getElementById('loadMoreBtn').addEventListener('click', function () {
          this.disabled = true;
          this.textContent = 'Loading...';
          renderUpdates(allUpdates, true);
        });
      }
    }

    let allUpdates = [];

    async function loadUpdates() {
      renderSkeleton();
      try {
        const res = await fetch('/api/updates');
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();
        if (data.success && data.updates.length > 0) {
          allUpdates = data.updates;
          renderUpdates(allUpdates, false);
        } else {
          updatesBody.innerHTML = '<div class="placeholder-card">No updates yet.</div>';
        }
      } catch (err) {
        updatesBody.innerHTML = '<div class="error-msg">Could not load updates.</div>';
      }
    }

    loadUpdates();
  </script>
</body>
</html>
