<style>
    /* ── 中性色变量（由 tools/extract-colors.mjs 生成）──────────────
       原先写死在内联样式里的浅色背景 / 深色文字 / 浅灰边框，抽取成
       变量后暗色与科幻主题只需覆盖取值，不必逐条重写规则。
       语义色（成功绿、错误红、警告橙）与代码高亮色刻意保留，
       它们在深色背景下依然成立。 */
    :root {
      --c-surface: #ffffff;
      --c-surface-sunken: #f8f9fa;
      --c-surface-raised: #f0f0f0;
      --c-surface-muted: #e9ecef;
      --c-border: #dddddd;
      --c-border-strong: #bbbbbb;
      --c-text: #333333;
      --c-text-muted: #666666;
      --c-text-subtle: #999999;
    }
    :root[data-theme="dark"] {
      --c-surface: #161b22;
      --c-surface-sunken: #0d1117;
      --c-surface-raised: #21262d;
      --c-surface-muted: #21262d;
      --c-border: #30363d;
      --c-border-strong: #484f58;
      --c-text: #c9d1d9;
      --c-text-muted: #8b949e;
      --c-text-subtle: #6e7681;
    }
    :root[data-theme="scifi"] {
      --c-surface: #09101a;
      --c-surface-sunken: #070d15;
      --c-surface-raised: #0f2231;
      --c-surface-muted: #101b26;
      --c-border: #14313f;
      --c-border-strong: #1e4a5e;
      --c-text: #c6eeff;
      --c-text-muted: #6c8fa3;
      --c-text-subtle: #546f80;
    }

  /* ═══════════ Layout ═══════════ */
  .home-wrap {
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    padding: 0.5rem 0;
  }

  /* ═══════════ Exam Banner ═══════════ */
  .exam-banner {
    background: linear-gradient(135deg, #fff4e0 0%, #ffe4c4 100%);
    border: 1px solid #f0c98f;
    border-radius: 12px;
    padding: 14px 18px;
    color: #7a4a00;
    box-shadow: 0 2px 10px rgba(240, 201, 143, .25);
  }
  [data-theme="dark"] .exam-banner {
    background: linear-gradient(135deg, #2a1f0f 0%, #3a2a14 100%);
    border-color: #5c4420;
    color: #ffb86c;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .exam-banner-inner {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .exam-banner-inner > i {
    font-size: 1.15rem;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .exam-banner-inner strong {
    display: block;
    font-size: 0.92rem;
    margin-bottom: 3px;
    font-weight: 700;
    letter-spacing: -0.1px;
  }
  .exam-banner-inner span {
    font-size: 0.83rem;
    line-height: 1.55;
    opacity: .92;
  }

  /* ═══════════ Hero ═══════════ */
  /* 底色来自 styles.css 末尾的 --hero-bg，随导航主题切换。
     原来这里是三停靠渐变，浅色主题下末端会压出一块深色，已改成单色。 */
  .home-hero {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    padding: 1.8rem 2rem;
    background: var(--hero-bg, #2e5fa0);
    color: #fff;
    box-shadow: 0 6px 24px var(--hero-shadow);
  }
  .hero-inner { position: relative; z-index: 1; }

  .hero-greet {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 0 0 0.3rem;
    color: #fff;
    line-height: 1.25;
  }
  .hero-sub {
    font-size: 0.92rem;
    opacity: .9;
    margin: 0 0 1.1rem;
    font-weight: 400;
    color: #fff;
  }
  .hero-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.88rem;
    background: var(--c-surface);
    color: var(--hero-btn-fg);
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
    font-family: inherit;
    border: none;
  }
  .hero-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,.22);
  }
  .hero-btn i { font-size: 0.82rem; }

  /* ═══════════ Progress Card ═══════════ */
  .progress-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 1.3rem 1.5rem 1.4rem;
    box-shadow: var(--shadow-sm);
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.1rem;
    gap: 10px;
  }
  .progress-header h2 {
    font-size: 1.02rem;
    font-weight: 700;
    margin: 0;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }
  .progress-header a {
    font-size: .83rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-header a:hover { text-decoration: underline; }

  .progress-stats {
    display: flex;
    gap: 2.4rem;
    margin-bottom: 1.05rem;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .stat-num {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .stat-label {
    font-size: .72rem;
    color: var(--text-secondary);
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .progress-bar {
    height: 6px;
    background: var(--border-color);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #4a90d9, #6bb6ff);
    border-radius: 3px;
    transition: width .8s cubic-bezier(.4,0,.2,1);
  }

  /* ═══════════ Updates Panel ═══════════ */
  .updates-panel {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--border-color);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .updates-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 8px;
  }
  .updates-header h2 {
    font-size: 1.02rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }
  .updates-header h2 i {
    color: var(--accent);
    font-size: 0.92rem;
  }
  .updates-date {
    font-size: .82rem;
    color: var(--text-secondary);
  }
  .updates-body {
    padding: 18px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 140px;
  }

  /* ── Timeline: one node per day ──
     Entries arrive newest-first; grouping them by day keeps a burst of
     small commits reading as "what happened that day" instead of a wall
     of near-identical cards. Rail = 44 + 10 gap + 12 column, so the dot
     centre sits at 59px and the 2px rule is drawn at 58. */
  .day-timeline {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .day-timeline::before {
    content: '';
    position: absolute;
    left: 58px;
    top: 20px;
    bottom: 4px;
    width: 2px;
    border-radius: 2px;
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--accent) 50%, transparent),
      color-mix(in srgb, var(--accent) 8%, transparent));
  }

  .day-group {
    display: grid;
    grid-template-columns: 44px 12px 1fr;
    column-gap: 10px;
    align-items: start;
  }
  .day-rail {
    text-align: right;
    padding-top: 13px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .day-date {
    display: block;
    font-size: .8rem;
    font-weight: 700;
    color: var(--text-primary);
  }
  .day-dow {
    display: block;
    font-size: .64rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-secondary);
  }
  .day-dot {
    width: 10px;
    height: 10px;
    margin-top: 17px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 9%, transparent);
    position: relative;
    z-index: 1;
  }
  /* Only the newest day pulses — it marks where reading should start. */
  .day-group.is-latest .day-dot { background: var(--accent); }
  .day-group.is-latest .day-dot::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 38%, transparent);
    animation: dayPulse 2.6s ease-out infinite;
  }
  @keyframes dayPulse {
    0%   { transform: scale(.8); opacity: .85; }
    70%  { transform: scale(1.5); opacity: 0; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .day-cards { display: flex; flex-direction: column; gap: 8px; }

  /* ── Update card ──
     The accent bar is a ::before, not border-left: a transparent 3px left
     border leaves a gap in the resting outline at narrow widths. */
  .update-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 13px 15px;
    transition: border-color .15s, box-shadow .15s;
  }
  .update-card::before {
    content: '';
    position: absolute;
    left: -1px;
    top: -1px;
    bottom: -1px;
    width: 3px;
    border-radius: 10px 0 0 10px;
    background: transparent;
    transition: background .15s;
    pointer-events: none;
  }
  .update-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }
  .update-card:hover::before { background: var(--accent); }
  .update-card-header {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .update-badge {
    font-size: .66rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .update-badge.new     { background: rgba(46, 160, 67, .18); color: #2e7d32; }
  .update-badge.info    { background: rgba(31, 111, 235, .18); color: #1565c0; }
  .update-badge.warning { background: rgba(230, 140, 30, .18); color: #b45309; }

  :root[data-theme="dark"] .update-badge.new     { background: #1b4d2e; color: #8fdf8f; }
  :root[data-theme="dark"] .update-badge.info    { background: #14395e; color: #8ec3ff; }
  :root[data-theme="dark"] .update-badge.warning { background: #4d2e0d; color: #ffb86c; }

  /* scifi had no badge colours of its own and fell back to the light
     palette — pale chips on a near-black panel. */
  :root[data-theme="scifi"] .update-badge {
    background: rgba(0, 229, 255, .10);
    color: #8ff0ff;
    border: 1px solid rgba(0, 229, 255, .30);
    text-shadow: 0 0 6px rgba(0, 229, 255, .45);
  }
  :root[data-theme="scifi"] .update-badge.new {
    background: rgba(120, 255, 176, .10);
    color: #78ffb0;
    border-color: rgba(120, 255, 176, .34);
    text-shadow: 0 0 6px rgba(120, 255, 176, .40);
  }
  :root[data-theme="scifi"] .update-badge.warning {
    background: rgba(255, 143, 171, .10);
    color: #ff8fab;
    border-color: rgba(255, 143, 171, .34);
    text-shadow: 0 0 6px rgba(255, 143, 171, .40);
  }

  .update-time {
    font-size: .74rem;
    color: var(--text-secondary);
    font-family: 'Consolas', 'Monaco', monospace;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .update-card h3 {
    font-size: .9rem;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--text-primary);
  }
  .update-card .update-version {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: .7rem;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 1px 6px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
  }
  .update-card p {
    font-size: .85rem;
    color: var(--text-secondary);
    margin: 0;
    line-height: 1.55;
  }

  /* scifi: a clipped corner, because the rest of that skin is clipped. */
  :root[data-theme="scifi"] .update-card {
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }
  :root[data-theme="scifi"] .update-card:hover {
    box-shadow: 0 0 16px rgba(0, 229, 255, .16);
  }

  /* Narrow screens: the rail moves above the card and the rule goes away. */
  @media (max-width: 620px) {
    .day-timeline::before { display: none; }
    .day-group { grid-template-columns: 1fr; row-gap: 6px; }
    .day-rail {
      display: flex;
      align-items: baseline;
      gap: 7px;
      text-align: left;
      padding-top: 0;
    }
    .day-dot { display: none; }
    .day-dow { font-size: .66rem; }
    .update-time { margin-left: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .day-group.is-latest .day-dot::after { animation: none; }
  }

  /* ── Skeleton ── */
  .skeleton-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .skeleton-line {
    display: block;
    height: 10px;
    background: linear-gradient(90deg, #e5e9ee 25%, #f0f3f7 50%, #e5e9ee 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  :root[data-theme="dark"] .skeleton-line {
    background: linear-gradient(90deg, #2a2f38 25%, #343a44 50%, #2a2f38 75%);
    background-size: 200% 100%;
  }
  /* scifi had none either: the light grey bars glowed white on #04070d. */
  :root[data-theme="scifi"] .skeleton-line {
    background: linear-gradient(90deg, #0d2230 25%, #14384a 50%, #0d2230 75%);
    background-size: 200% 100%;
  }
  .skeleton-line:last-child { margin-bottom: 0; }
  .skeleton-line.short  { width: 30%; }
  .skeleton-line.medium { width: 60%; }
  .skeleton-line.long   { width: 90%; }
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position:  200% 0; }
  }

  /* ── Load more ── */
  .load-more-wrapper { text-align: center; padding-top: 4px; }
  .load-more-btn {
    padding: 7px 26px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-primary);
    cursor: pointer;
    font-size: .85rem;
    font-family: inherit;
    font-weight: 600;
    transition: all .15s;
  }
  .load-more-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .load-more-btn:disabled { opacity: .6; cursor: not-allowed; }

  .placeholder-card {
    text-align: center;
    padding: 36px 20px;
    color: var(--text-secondary);
    font-size: .9rem;
  }
  .error-msg {
    text-align: center;
    padding: 28px 20px;
    color: var(--danger);
    font-size: .88rem;
  }

  /* ═══════════ Mobile ═══════════ */
  @media (max-width: 640px) {
    .home-wrap { gap: 1rem; padding: 0.3rem 0; }
    .home-hero { padding: 1.4rem 1.3rem; border-radius: 12px; }
    .hero-greet { font-size: 1.3rem; }
    .hero-sub { font-size: .85rem; margin-bottom: 0.9rem; }
    .hero-btn { padding: 8px 16px; font-size: .82rem; }

    .exam-banner { padding: 12px 14px; border-radius: 10px; }
    .exam-banner-inner strong { font-size: .86rem; }
    .exam-banner-inner span   { font-size: .78rem; }

    .progress-card { padding: 1.1rem 1.15rem 1.2rem; border-radius: 12px; }
    .progress-header h2 { font-size: .95rem; }
    .progress-stats { gap: 1.5rem; margin-bottom: 0.9rem; }
    .stat-num { font-size: 1.3rem; }
    .stat-label { font-size: .68rem; }

    .updates-header { padding: 14px 16px; }
    .updates-header h2 { font-size: .95rem; }
    .updates-body { padding: 14px 16px 18px; gap: 10px; }
    .update-card { padding: 12px 14px; }
  }
    /* ── Recent Solves 极客卡片列表 ── */
    .recent-ac-panel {
      margin-top: 1.5rem;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.2rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    
    .recent-ac-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px dashed var(--border-color);
    }
    
    .recent-ac-header h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .recent-ac-note {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: monospace;
    }

    .recent-ac-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 单条记录卡片 */
    .ac-item {
      display: grid;
      grid-template-columns: 150px 1fr 80px;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    
    .ac-item:hover {
      border-color: var(--accent);
      transform: translateX(2px);
      box-shadow: -2px 0 0 var(--accent) inset;
    }

    /* 列内容对齐 */
    .ac-who {
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .ac-who::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2ecc71; /* AC 绿点 */
    }

    /* 未登入时服务端不下发 username，名字只作纯文本显示 */
    .ac-who-anon {
      color: var(--text-secondary);
      font-style: italic;
    }

    .ac-problem {
      color: var(--accent);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ac-answer {
      font-family: ui-monospace, monospace;
      color: var(--text-secondary);
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--hover-bg);
      padding: 2px 8px;
      border-radius: 4px;
      justify-self: start;
      max-width: 100%;
    }

    .ac-time {
      text-align: right;
      font-family: monospace;
      color: var(--text-subtle);
      font-size: 0.75rem;
    }

    /* 答案被锁住时的小提示 */
    .recent-ac-locked {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--text-subtle);
    }

    /* ac-item 里的三个链接不想要下划线 */
    .ac-who, .ac-problem, .ac-time {
      text-decoration: none;
    }
    .ac-who:hover, .ac-problem:hover, .ac-time:hover {
      text-decoration: underline;
    }

    /* 空状态 */
    .recent-ac-empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 24px 0;
      font-size: 0.9rem;
    }

    /* Token 仪表盘 */
    .token-meter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.2rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--border-color);
    }
    
    .token-meter-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .token-meter-value {
      font-family: ui-monospace, monospace;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(74,144,217,0.3);
    }

    /* 移动端响应式适配 */
    @media (max-width: 640px) {
      .ac-item {
        grid-template-columns: 1fr auto;
        grid-template-areas: 
          "who time"
          "prob ans";
        gap: 6px 12px;
        padding: 12px;
      }
      .ac-who { grid-area: who; }
      .ac-time { grid-area: time; }
      .ac-problem { grid-area: prob; }
      .ac-answer { grid-area: ans; justify-self: end; }
    }
