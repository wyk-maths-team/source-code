<script>
/* ============================================================
   Circuit Grid  ·  DC steady-state
   ============================================================ */

const CELL   = 44;
const LS_KEY = 'circuit-grid-v1';

const DIRV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const OPP  = { up:'down', down:'up', left:'right', right:'left' };
const DIRS = ['up','down','left','right'];
const DIR_LABELS = ['Up','Down','Left','Right'];

const WIRE_COLORS = { wire1:'#ffd60a', wire2:'#34d399', wire3:'#60a5fa' };
const WIRE_NAMES  = { wire1:'Wire 1', wire2:'Wire 2', wire3:'Wire 3' };
const LINK_OPTIONS = ['auto','on','off'];
const LINK_LABELS  = ['Auto (redstone-like)','Force ON','Force OFF'];

const isWire = c => c && (c.type === 'wire1' || c.type === 'wire2' || c.type === 'wire3');

/* Types that have a meaningful polarity: their (v, i) sign carries info. */
const POLARIZED_TYPES = new Set(['power', 'diode', 'led', 'transistor']);
const isPolarizedType = t => POLARIZED_TYPES.has(t);

/* --- rotation maps (clockwise / counter-clockwise) --- */
const ROTATE_CW  = { up:'right', right:'down', down:'left', left:'up' };
const ROTATE_CCW = { up:'left',  left:'down',  down:'right', right:'up' };

/* --- which tools carry configurable properties --- */
const CONFIGURABLE_TYPES = new Set([
  'power','switch','lamp','resistor','capacitor','inductor',
  'coil','diode','led','transistor','wire1','wire2','wire3'
]);

/* ---------------- state ---------------- */

const state = {
  cells: {},
  cam:   { x: 0, y: 0 },
  tool:  'power'
};

/* Per-tool rotated templates — edited by R / T and the toolbar buttons,
   cloned whenever a new element of that type is placed. */
const toolCells = {};

let simResult = {
  redWires: new Set(),
  results:  new Map(),
  volt:     new Map(),
  dsu:      null,
  diodeOn:  new Set(),
  ledOn:    new Set()
};
let hoverCell = null;

/* ---------------- persistence ---------------- */

function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      cells: state.cells,
      cam:   state.cam,
      tool:  state.tool,
      toolCells: toolCells
    }));
  } catch (e) { /* ignore */ }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    if (d && typeof d === 'object') {
      if (d.cells && typeof d.cells === 'object') state.cells = d.cells;
      if (d.cam && isFinite(d.cam.x) && isFinite(d.cam.y)) state.cam = d.cam;
      if (d.tool) state.tool = d.tool;
      if (d.toolCells && typeof d.toolCells === 'object') {
        for (const t in d.toolCells) {
          if (d.toolCells[t] && typeof d.toolCells[t] === 'object') {
            toolCells[t] = d.toolCells[t];
          }
        }
      }
      return true;
    }
  } catch (e) {}
  return false;
}

/* ---------------- defaults / migration ---------------- */

function ensureDefaults(cell) {
  if (!cell) return;

  if (cell.type === 'power') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { pos:'up', neg:'down' };
    if (!DIRS.includes(cell.pins.pos)) cell.pins.pos = 'up';
    if (!DIRS.includes(cell.pins.neg)) cell.pins.neg = 'down';
    if (typeof cell.v !== 'number' || !isFinite(cell.v)) cell.v = 5;
    if (cell.v < 1e-9) cell.v = 1e-9;
    if (cell.v > 100)  cell.v = 100;
    if (typeof cell.on !== 'boolean') cell.on = true;
  }

  if (isWire(cell)) {
    if (!cell.links || typeof cell.links !== 'object') cell.links = {};
    for (const d of DIRS) {
      if (!LINK_OPTIONS.includes(cell.links[d])) cell.links[d] = 'auto';
    }
  }

  if (cell.type === 'lamp' || cell.type === 'resistor') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { a:'left', b:'right' };
    if (!DIRS.includes(cell.pins.a)) cell.pins.a = 'left';
    if (!DIRS.includes(cell.pins.b)) cell.pins.b = 'right';
    if (typeof cell.r !== 'number' || !isFinite(cell.r) || cell.r <= 0) cell.r = 10;
  }

  if (cell.type === 'switch') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { a:'left', b:'right' };
    if (!DIRS.includes(cell.pins.a)) cell.pins.a = 'left';
    if (!DIRS.includes(cell.pins.b)) cell.pins.b = 'right';
    if (typeof cell.on !== 'boolean') cell.on = true;
  }

  if (cell.type === 'capacitor') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { a:'left', b:'right' };
    if (!DIRS.includes(cell.pins.a)) cell.pins.a = 'left';
    if (!DIRS.includes(cell.pins.b)) cell.pins.b = 'right';
    if (typeof cell.c !== 'number' || !isFinite(cell.c) || cell.c <= 0) cell.c = 1e-6;
  }

  if (cell.type === 'inductor') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { a:'left', b:'right' };
    if (!DIRS.includes(cell.pins.a)) cell.pins.a = 'left';
    if (!DIRS.includes(cell.pins.b)) cell.pins.b = 'right';
    if (typeof cell.l !== 'number' || !isFinite(cell.l) || cell.l <= 0) cell.l = 1e-3;
  }

  if (cell.type === 'coil') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { a:'left', b:'right' };
    if (!DIRS.includes(cell.pins.a)) cell.pins.a = 'left';
    if (!DIRS.includes(cell.pins.b)) cell.pins.b = 'right';
    if (typeof cell.r !== 'number' || !isFinite(cell.r) || cell.r <= 0) cell.r = 10;
    if (typeof cell.l !== 'number' || !isFinite(cell.l) || cell.l <= 0) cell.l = 1e-3;
  }

  if (cell.type === 'diode' || cell.type === 'led') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { a:'left', b:'right' };
    if (!DIRS.includes(cell.pins.a)) cell.pins.a = 'left';
    if (!DIRS.includes(cell.pins.b)) cell.pins.b = 'right';
  }

  if (cell.type === 'led') {
    if (typeof cell.r !== 'number' || !isFinite(cell.r) || cell.r <= 0) cell.r = 50;
  }

  if (cell.type === 'transistor') {
    if (!cell.pins || typeof cell.pins !== 'object') cell.pins = { c:'up', b:'left', e:'down' };
    for (const k of ['c','b','e']) {
      if (!DIRS.includes(cell.pins[k])) {
        cell.pins[k] = k === 'c' ? 'up' : k === 'b' ? 'left' : 'down';
      }
    }
  }
}

function makeCell(type) {
  switch (type) {
    case 'power':
      return { type:'power', v:5, on:true, pins:{ pos:'up', neg:'down' } };
    case 'wire1':
    case 'wire2':
    case 'wire3':
      return { type, links:{ up:'auto', down:'auto', left:'auto', right:'auto' } };
    case 'switch':
      return { type:'switch', on:true, pins:{ a:'left', b:'right' } };
    case 'lamp':
      return { type:'lamp', r:10, pins:{ a:'left', b:'right' } };
    case 'resistor':
      return { type:'resistor', r:10, pins:{ a:'left', b:'right' } };
    case 'capacitor':
      return { type:'capacitor', c:1e-6, pins:{ a:'left', b:'right' } };
    case 'inductor':
      return { type:'inductor', l:1e-3, pins:{ a:'left', b:'right' } };
    case 'coil':
      return { type:'coil', r:10, l:1e-3, pins:{ a:'left', b:'right' } };
    case 'diode':
      return { type:'diode', pins:{ a:'left', b:'right' } };
    case 'led':
      return { type:'led', r:50, pins:{ a:'left', b:'right' } };
    case 'transistor':
      return { type:'transistor', pins:{ c:'up', b:'left', e:'down' } };
    case 'ground':
      return { type:'ground' };
  }
  return null;
}

/* ============================================================
   Tool rotation
   ============================================================ */

function deepCloneCell(cell) {
  return JSON.parse(JSON.stringify(cell));
}

/** Rotate every direction stored in cell.pins in place. */
function rotatePins(cell, cw) {
  if (!cell || !cell.pins || typeof cell.pins !== 'object') return false;
  const map = cw ? ROTATE_CW : ROTATE_CCW;
  let changed = false;
  for (const k in cell.pins) {
    const v = cell.pins[k];
    if (typeof v === 'string' && map[v]) {
      cell.pins[k] = map[v];
      changed = true;
    }
  }
  return changed;
}

/** Get (or lazily create) the current oriented template for a tool. */
function getToolCell(type) {
  if (!toolCells[type]) {
    const c = makeCell(type);
    if (!c) return null;
    toolCells[type] = c;
  }
  return toolCells[type];
}

/** Produce a fresh element with the tool's current orientation. */
function placeTool(type) {
  const tpl = getToolCell(type);
  if (!tpl) return null;
  return deepCloneCell(tpl);
}

/** Rotate the currently selected tool; saves and shows a toast. */
function rotateCurrent(cw) {
  const type = state.tool;
  const cell = getToolCell(type);
  if (!cell || !cell.pins || Object.keys(cell.pins).length === 0) {
    showToast('This tool has no orientation');
    return;
  }
  const changed = rotatePins(cell, cw);
  if (!changed) {
    showToast('This tool has no orientation');
    return;
  }
  save();
  render(); // ghost preview follows immediately
  const dirName = cw ? 'clockwise' : 'counter-clockwise';
  showToast(`${toolLabel(type)} rotated ${dirName}`);
}

function toolLabel(type) {
  const t = TOOLS.find(x => x.id === type);
  return t ? t.label : type;
}

/* ============================================================
   Electrical model
   ============================================================ */

function terminalOf(cell, dir) {
  switch (cell.type) {
    case 'wire1': case 'wire2': case 'wire3':
      return 't';

    case 'power': {
      const p = cell.pins || { pos:'up', neg:'down' };
      if (dir === p.pos) return '+';
      if (dir === p.neg) return '-';
      return null;
    }

    case 'switch':
    case 'lamp':
    case 'resistor':
    case 'capacitor':
    case 'inductor':
    case 'coil':
    case 'diode':
    case 'led': {
      const p = cell.pins || { a:'left', b:'right' };
      if (dir === p.a) return 'a';
      if (dir === p.b) return 'b';
      return null;
    }

    case 'transistor': {
      const p = cell.pins;
      if (!p) return null;
      if (p.c === dir) return 'c';
      if (p.b === dir) return 'b';
      if (p.e === dir) return 'e';
      return null;
    }

    case 'ground':
      return 'g';
  }
  return null;
}

function wireDrawsTowards(cell, cx, cy, dir) {
  const st = (cell.links && cell.links[dir]) || 'auto';
  if (st === 'off') return false;
  if (st === 'on')  return true;

  const [dx, dy] = DIRV[dir];
  const n = state.cells[(cx + dx) + ',' + (cy + dy)];
  if (!n) return false;

  if (isWire(n) && n.links && n.links[OPP[dir]] === 'on') return true;

  return connectionAllowed(cell, n, dir);
}

function connectionAllowed(a, b, dir) {
  const ta = terminalOf(a, dir);
  const tb = terminalOf(b, OPP[dir]);
  if (!ta || !tb) return false;

  const aWire = isWire(a), bWire = isWire(b);
  const aLink = (aWire && a.links && a.links[dir]) || 'auto';
  const bLink = (bWire && b.links && b.links[OPP[dir]]) || 'auto';

  if (aLink === 'off' || bLink === 'off') return false;
  if (aLink === 'on'  || bLink === 'on')  return true;

  if (aWire && bWire) return a.type === b.type;
  return true;
}

class DSU {
  constructor() { this.p = new Map(); }
  find(x) {
    if (!this.p.has(x)) { this.p.set(x, x); return x; }
    let r = x;
    while (this.p.get(r) !== r) r = this.p.get(r);
    while (this.p.get(x) !== r) { const n = this.p.get(x); this.p.set(x, r); x = n; }
    return r;
  }
  union(a, b) {
    a = this.find(a); b = this.find(b);
    if (a !== b) this.p.set(a, b);
  }
}

function runSimulation(diodeOn, ledOn) {
  const cells = state.cells;
  const keys  = Object.keys(cells);
  const port  = (k, t) => k + '#' + t;

  const dsu = new DSU();

  for (const k of keys) {
    const c = cells[k];
    const set = new Set();
    for (const d of DIRS) {
      const t = terminalOf(c, d);
      if (t) set.add(t);
    }
    for (const t of set) dsu.find(port(k, t));
  }

  for (const k of keys) {
    const [x, y] = k.split(',').map(Number);
    const c = cells[k];
    for (const d of ['right', 'down']) {
      const [dx, dy] = DIRV[d];
      const nk = (x + dx) + ',' + (y + dy);
      const nc = cells[nk];
      if (!nc) continue;
      if (!connectionAllowed(c, nc, d)) continue;
      const t1 = terminalOf(c, d);
      const t2 = terminalOf(nc, OPP[d]);
      dsu.union(port(k, t1), port(nk, t2));
    }
  }

  for (const k of keys) {
    const c = cells[k];
    if (c.type === 'switch' && c.on)          dsu.union(port(k, 'a'), port(k, 'b'));
    if (c.type === 'inductor')                dsu.union(port(k, 'a'), port(k, 'b'));
    if (c.type === 'diode' && diodeOn.has(k)) dsu.union(port(k, 'a'), port(k, 'b'));
  }

  let groundRoot = null;
  for (const k of keys) {
    if (cells[k].type === 'ground') {
      groundRoot = dsu.find(port(k, 'g'));
      break;
    }
  }

  const vsources = [];
  for (const k of keys) {
    const c = cells[k];
    if (c.type !== 'power' || !c.on) continue;
    const p = dsu.find(port(k, '+'));
    const n = dsu.find(port(k, '-'));
    vsources.push({ key: k, p, n, v: c.v, shorted: p === n });
  }

  const resistors = [];
  for (const k of keys) {
    const c = cells[k];
    let r = null;
    if (c.type === 'lamp' || c.type === 'resistor' || c.type === 'coil') r = c.r;
    else if (c.type === 'led' && ledOn.has(k)) r = c.r;
    if (r === null || !isFinite(r) || r <= 0) continue;
    const a = dsu.find(port(k, 'a'));
    const b = dsu.find(port(k, 'b'));
    resistors.push({ key: k, a, b, r: Math.max(1e-9, r) });
  }

  const redWires = new Set();
  const shortRoots = new Set();
  for (const s of vsources) if (s.shorted) shortRoots.add(s.p);
  if (shortRoots.size) {
    for (const k of keys) {
      if (!isWire(cells[k])) continue;
      if (shortRoots.has(dsu.find(port(k, 't')))) redWires.add(k);
    }
  }

  const activeV = vsources.filter(s => !s.shorted);
  const nodeSet = new Set();
  for (const r of resistors) { nodeSet.add(r.a); nodeSet.add(r.b); }
  for (const s of activeV)   { nodeSet.add(s.p); nodeSet.add(s.n); }

  let nodes = [...nodeSet];
  if (groundRoot !== null && nodeSet.has(groundRoot)) {
    nodes = [groundRoot, ...nodes.filter(n => n !== groundRoot)];
  }
  const idx  = new Map(nodes.map((n, i) => [n, i]));
  const N    = nodes.length;
  const m    = activeV.length;
  const size = Math.max(0, N - 1) + m;
  const results = new Map();
  const volt = new Map();

  if (N > 0 && size > 0) {
    const A = [];
    for (let i = 0; i < size; i++) A.push(new Float64Array(size + 1));

    const rowOf = node => {
      const i = idx.get(node);
      if (i === undefined || i === 0) return -1;
      return i - 1;
    };

    for (const r of resistors) {
      const g = 1 / r.r;
      const a = rowOf(r.a), b = rowOf(r.b);
      if (a >= 0) A[a][a] += g;
      if (b >= 0) A[b][b] += g;
      if (a >= 0 && b >= 0) { A[a][b] -= g; A[b][a] -= g; }
    }

    activeV.forEach((s, k) => {
      const p = rowOf(s.p), n = rowOf(s.n);
      const rr = (N - 1) + k;
      if (p >= 0) { A[p][rr] += 1; A[rr][p] += 1; }
      if (n >= 0) { A[n][rr] -= 1; A[rr][n] -= 1; }
      A[rr][size] = s.v;
    });

    for (let i = 0; i < N - 1; i++) A[i][i] += 1e-9;

    const x = gauss(A, size);

    nodes.forEach((node, i) => volt.set(node, i === 0 ? 0 : (x[i - 1] || 0)));

    for (const r of resistors) {
      const va = volt.get(r.a) || 0;
      const vb = volt.get(r.b) || 0;
      const dv = va - vb;
      const polarized = isPolarizedType(cells[r.key].type);
      results.set(r.key, {
        v: polarized ? dv : Math.abs(dv),
        i: polarized ? dv / r.r : Math.abs(dv / r.r),
        p: (dv * dv) / r.r
      });
    }
  } else {
    nodes.forEach(n => volt.set(n, 0));
  }

  return { redWires, results, volt, dsu };
}

function simulate() {
  const cells = state.cells;
  const keys  = Object.keys(cells);
  const diodeKeys = keys.filter(k => cells[k].type === 'diode');
  const ledKeys   = keys.filter(k => cells[k].type === 'led');

  let diodeOn = new Set(diodeKeys);
  let ledOn   = new Set(ledKeys);
  let final   = null;

  for (let iter = 0; iter < 16; iter++) {
    final = runSimulation(diodeOn, ledOn);

    const newDiodeOn = new Set();
    const newLedOn   = new Set();

    for (const k of diodeKeys) {
      const va = final.volt.get(final.dsu.find(k + '#a')) || 0;
      const vb = final.volt.get(final.dsu.find(k + '#b')) || 0;
      if (va > vb + 1e-9) newDiodeOn.add(k);
    }
    for (const k of ledKeys) {
      const va = final.volt.get(final.dsu.find(k + '#a')) || 0;
      const vb = final.volt.get(final.dsu.find(k + '#b')) || 0;
      if (va > vb + 1e-9) newLedOn.add(k);
    }

    if (setsEqual(newDiodeOn, diodeOn) && setsEqual(newLedOn, ledOn)) {
      diodeOn = newDiodeOn;
      ledOn   = newLedOn;
      break;
    }
    diodeOn = newDiodeOn;
    ledOn   = newLedOn;
  }

  simResult = {
    redWires: final.redWires,
    results:  final.results,
    volt:     final.volt,
    dsu:      final.dsu,
    diodeOn,
    ledOn
  };
}

function setsEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const v of a) if (!b.has(v)) return false;
  return true;
}

function gauss(A, n) {
  for (let col = 0; col < n; col++) {
    let piv = -1, best = 1e-14;
    for (let r = col; r < n; r++) {
      const v = Math.abs(A[r][col]);
      if (v > best) { best = v; piv = r; }
    }
    if (piv === -1) continue;
    if (piv !== col) { const t = A[piv]; A[piv] = A[col]; A[col] = t; }
    const p = A[col][col];
    for (let c = col; c <= n; c++) A[col][c] /= p;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = A[r][col];
      if (Math.abs(f) < 1e-18) continue;
      for (let c = col; c <= n; c++) A[r][c] -= f * A[col][c];
    }
  }
  const x = new Float64Array(n);
  for (let i = 0; i < n; i++) x[i] = A[i][n];
  return x;
}

/* ============================================================
   Canvas / rendering
   ============================================================ */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width  = Math.max(1, Math.floor(cv.clientWidth  * dpr));
  cv.height = Math.max(1, Math.floor(cv.clientHeight * dpr));
  render();
}

function screenToCell(sx, sy) {
  return {
    x: Math.floor((sx - state.cam.x) / CELL),
    y: Math.floor((sy - state.cam.y) / CELL)
  };
}

let rafPending = false;
function render() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; draw(); });
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const camX = state.cam.x, camY = state.cam.y;

  ctx.fillStyle = '#0b0f14';
  ctx.fillRect(0, 0, w, h);

  const gx0 = Math.floor(-camX / CELL) - 1;
  const gx1 = Math.ceil((w - camX) / CELL) + 1;
  const gy0 = Math.floor(-camY / CELL) - 1;
  const gy1 = Math.ceil((h - camY) / CELL) + 1;

  ctx.lineWidth = 1;
  ctx.strokeStyle = '#141b24';
  ctx.beginPath();
  for (let x = gx0; x <= gx1; x++) {
    const px = Math.round(x * CELL + camX) + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, h);
  }
  for (let y = gy0; y <= gy1; y++) {
    const py = Math.round(y * CELL + camY) + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(w, py);
  }
  ctx.stroke();

  ctx.strokeStyle = '#1c2635';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const ox = Math.round(camX) + 0.5, oy = Math.round(camY) + 0.5;
  ctx.moveTo(ox, 0); ctx.lineTo(ox, h);
  ctx.moveTo(0, oy); ctx.lineTo(w, oy);
  ctx.stroke();

  for (let y = gy0; y <= gy1; y++) {
    for (let x = gx0; x <= gx1; x++) {
      const c = state.cells[x + ',' + y];
      if (c) drawCell(x, y, c);
    }
  }

  /* --- ghost preview of the currently selected tool --- */
  if (hoverCell) {
    const hk = hoverCell.x + ',' + hoverCell.y;
    const tool = state.tool;
    if (!state.cells[hk] && tool !== 'delete' && tool !== 'rightclick') {
      const tpl = getToolCell(tool);
      if (tpl) {
        ctx.save();
        ctx.globalAlpha = 0.40;
        try { drawCell(hoverCell.x, hoverCell.y, tpl); } catch (e) {}
        ctx.restore();
      }
    }
  }

  /* --- hover highlight --- */
  if (hoverCell) {
    const key = hoverCell.x + ',' + hoverCell.y;
    const px = hoverCell.x * CELL + camX;
    const py = hoverCell.y * CELL + camY;
    ctx.strokeStyle = state.cells[key] ? 'rgba(59,130,246,.75)' : 'rgba(59,130,246,.3)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, px + 1.5, py + 1.5, CELL - 3, CELL - 3, 7);
    ctx.stroke();
  }
}

function drawCell(cx, cy, cell) {
  switch (cell.type) {
    case 'wire1': case 'wire2': case 'wire3': drawWire(cx, cy, cell); break;
    case 'power':      drawPower(cx, cy, cell); break;
    case 'switch':     drawSwitch(cx, cy, cell); break;
    case 'lamp':       drawLamp(cx, cy, cell); break;
    case 'resistor':   drawResistor(cx, cy, cell); break;
    case 'capacitor':  drawCapacitor(cx, cy, cell); break;
    case 'inductor':   drawInductor(cx, cy, cell); break;
    case 'coil':       drawCoil(cx, cy, cell); break;
    case 'diode':      drawDiode(cx, cy, cell); break;
    case 'led':        drawLED(cx, cy, cell); break;
    case 'transistor': drawTransistor(cx, cy, cell); break;
    case 'ground':     drawGround(cx, cy, cell); break;
  }
}

/* ---- wire ---- */

function drawWire(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const key = cx + ',' + cy;
  const shorted = simResult.redWires.has(key);
  const color = shorted ? '#ef4444' : WIRE_COLORS[cell.type];
  const links = cell.links || {};

  const drawDirs = [];
  for (const d of DIRS) {
    if (wireDrawsTowards(cell, cx, cy, d)) drawDirs.push(d);
  }

  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  if (drawDirs.length === 0) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(px, py, 4.6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    for (const d of drawDirs) {
      const [dx, dy] = DIRV[d];
      ctx.moveTo(px, py);
      ctx.lineTo(px + dx * CELL / 2, py + dy * CELL / 2);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 7;
    if (shorted) { ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 12; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (drawDirs.length >= 2) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const d of DIRS) {
    const st = links[d];
    if (!st || st === 'auto') continue;
    const [dx, dy] = DIRV[d];
    const ex = px + dx * CELL * 0.33;
    const ey = py + dy * CELL * 0.33;

    ctx.beginPath();
    ctx.arc(ex, ey, 3.5, 0, Math.PI * 2);
    if (st === 'on') {
      ctx.fillStyle = shorted ? '#ef4444' : color;
      ctx.fill();
      ctx.strokeStyle = '#0b0f14';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.fillStyle = '#0b0f14';
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,172,188,.75)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      const r = 2.2;
      ctx.moveTo(ex - r, ey - r);
      ctx.lineTo(ex + r, ey + r);
      ctx.strokeStyle = 'rgba(160,172,188,.8)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
}

/* ---- power ---- */

function drawPower(cx, cy, cell) {
  const px = cx * CELL + state.cam.x;
  const py = cy * CELL + state.cam.y;
  const pad = 5;
  const x = px + pad, y = py + pad, w = CELL - pad * 2, h = CELL - pad * 2;
  const on = !!cell.on;
  const col = on ? '#f59e0b' : '#48566a';
  const pins = cell.pins || { pos:'up', neg:'down' };

  ctx.fillStyle = on ? 'rgba(245,158,11,.12)' : 'rgba(72,86,106,.10)';
  roundRect(ctx, x, y, w, h, 9);
  ctx.fill();

  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  if (on) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
  roundRect(ctx, x, y, w, h, 9);
  ctx.stroke();
  ctx.shadowBlur = 0;

  const sameSide = pins.pos === pins.neg;
  drawPolarityMark(px, py, pins.pos, '+', on, sameSide ? -1 : 0);
  drawPolarityMark(px, py, pins.neg, '−', on, sameSide ?  1 : 0);

  ctx.fillStyle = on ? '#fde68a' : '#67788e';
  ctx.font = 'bold 9px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(shortNum(cell.v), px + CELL / 2, py + CELL / 2 + 1);
}

function drawPolarityMark(px, py, dir, ch, on, shift) {
  const off = 9;
  let x = px + CELL / 2, y = py + CELL / 2;
  if (dir === 'up')    { y = py + off;        x = px + CELL / 2 + shift * 7; }
  if (dir === 'down')  { y = py + CELL - off; x = px + CELL / 2 + shift * 7; }
  if (dir === 'left')  { x = px + off;        y = py + CELL / 2 + shift * 7; }
  if (dir === 'right') { x = px + CELL - off; y = py + CELL / 2 + shift * 7; }

  ctx.fillStyle = on ? '#fde68a' : '#7a8a9e';
  ctx.font = 'bold 11px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ch, x, y);
}

/* ---- switch ---- */

function drawSwitch(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const pins = cell.pins || { a:'left', b:'right' };
  const on = !!cell.on;
  const col = on ? '#22d3ee' : '#5a6a7d';

  const P = {};
  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    P[name] = { x: px + dx * CELL / 2, y: py + dy * CELL / 2, dx, dy };
  }

  ctx.lineCap = 'round';

  if (on && P.a && P.b) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 3.5;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(P.a.x, P.a.y);
    ctx.lineTo(P.b.x, P.b.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else {
    ctx.strokeStyle = col;
    ctx.lineWidth = 3.5;
    const gap = 9;
    for (const name of ['a','b']) {
      const p = P[name];
      if (!p) continue;
      const ix = px + p.dx * gap;
      const iy = py + p.dy * gap;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(ix, iy);
      ctx.stroke();
    }
  }

  for (const name of ['a','b']) {
    const p = P[name];
    if (!p) continue;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(p.x - p.dx * 3, p.y - p.dy * 3, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---- generic 2-terminal lead helper ---- */

function drawLeads(px, py, pins, innerOffset) {
  ctx.strokeStyle = '#4b5c72';
  ctx.lineWidth = 2;
  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.beginPath();
    ctx.moveTo(px + dx * innerOffset, py + dy * innerOffset);
    ctx.lineTo(px + dx * CELL / 2, py + dy * CELL / 2);
    ctx.stroke();
  }
  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.fillStyle = '#8fa3ba';
    ctx.beginPath();
    ctx.arc(px + dx * CELL / 2, py + dy * CELL / 2, 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---- lamp ---- */

function drawLamp(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const res = simResult.results.get(cx + ',' + cy);
  const power = res ? Math.max(0, res.p) : 0;
  const bright = Math.min(1, Math.pow(power, 0.35));
  const R = CELL * 0.27;
  const pins = cell.pins || { a:'left', b:'right' };

  ctx.strokeStyle = '#4b5c72';
  ctx.lineWidth = 2;
  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.beginPath();
    ctx.moveTo(px + dx * R, py + dy * R);
    ctx.lineTo(px + dx * CELL / 2, py + dy * CELL / 2);
    ctx.stroke();
  }

  if (bright > 0.015) {
    const g = ctx.createRadialGradient(px, py, 0, px, py, R * 2.6);
    g.addColorStop(0, `rgba(255,231,120,${0.75 * bright})`);
    g.addColorStop(1, 'rgba(255,231,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, R * 2.6, 0, Math.PI * 2); ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(px, py, R, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,231,120,${0.06 + 0.85 * bright})`;
  ctx.fill();
  ctx.strokeStyle = bright > 0.015
    ? `rgba(255,222,110,${0.55 + 0.45 * bright})`
    : '#4b5c72';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.strokeStyle = bright > 0.015
    ? `rgba(120,80,0,${0.4 + 0.5 * (1 - bright)})`
    : '#4b5c72';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(px - R * 0.5, py - R * 0.5);
  ctx.lineTo(px + R * 0.5, py + R * 0.5);
  ctx.moveTo(px + R * 0.5, py - R * 0.5);
  ctx.lineTo(px - R * 0.5, py + R * 0.5);
  ctx.stroke();

  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.fillStyle = '#8fa3ba';
    ctx.beginPath();
    ctx.arc(px + dx * CELL / 2, py + dy * CELL / 2, 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---- resistor ---- */

function drawResistor(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const res = simResult.results.get(cx + ',' + cy);
  const power = res ? Math.max(0, res.p) : 0;
  const hot = Math.min(1, Math.pow(power, 0.35) * 0.7);
  const pins = cell.pins || { a:'left', b:'right' };

  ctx.strokeStyle = '#5a6a7d';
  ctx.lineWidth = 2;
  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.beginPath();
    ctx.moveTo(px + dx * CELL * 0.28, py + dy * CELL * 0.28);
    ctx.lineTo(px + dx * CELL / 2, py + dy * CELL / 2);
    ctx.stroke();
  }

  const w = CELL * 0.56, h = CELL * 0.34;

  ctx.fillStyle = hot > 0.02
    ? `rgba(249,115,22,${0.12 + 0.5 * hot})`
    : 'rgba(90,105,125,.14)';
  roundRect(ctx, px - w / 2, py - h / 2, w, h, 4);
  ctx.fill();
  ctx.strokeStyle = hot > 0.02
    ? `rgba(251,146,60,${0.55 + 0.45 * hot})`
    : '#5a6a7d';
  ctx.lineWidth = 2;
  roundRect(ctx, px - w / 2, py - h / 2, w, h, 4);
  ctx.stroke();

  for (const name of ['a','b']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.fillStyle = '#8fa3ba';
    ctx.beginPath();
    ctx.arc(px + dx * CELL / 2, py + dy * CELL / 2, 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---- capacitor ---- */

function drawCapacitor(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const pins = cell.pins || { a:'left', b:'right' };

  drawLeads(px, py, pins, 9);

  const dA = DIRV[pins.a] || [-1, 0];
  const dB = DIRV[pins.b] || [1, 0];
  const axisX = dB[0] - dA[0];
  const axisY = dB[1] - dA[1];
  const len = Math.hypot(axisX, axisY) || 1;
  const ux = axisX / len, uy = axisY / len;
  const perpX = -uy, perpY = ux;

  const gap = 4.5;
  const plateLen = CELL * 0.36;

  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  for (const sgn of [-1, 1]) {
    const cxp = px + ux * gap * sgn;
    const cyp = py + uy * gap * sgn;
    ctx.beginPath();
    ctx.moveTo(cxp + perpX * plateLen / 2, cyp + perpY * plateLen / 2);
    ctx.lineTo(cxp - perpX * plateLen / 2, cyp - perpY * plateLen / 2);
    ctx.stroke();
  }

  ctx.font = 'bold 8px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillStyle = 'rgba(167,139,250,.7)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('+', px + ux * (gap + 8) + perpX * 10,
                    py + uy * (gap + 8) + perpY * 10);
  ctx.fillText('−', px - ux * (gap + 8) - perpX * 10,
                    py - uy * (gap + 8) - perpY * 10);
}

/* ---- inductor ---- */

function drawInductor(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const pins = cell.pins || { a:'left', b:'right' };

  drawLeads(px, py, pins, CELL * 0.24);

  const dA = DIRV[pins.a] || [-1, 0];
  const dB = DIRV[pins.b] || [1, 0];
  const axisX = dB[0] - dA[0];
  const axisY = dB[1] - dA[1];
  const len = Math.hypot(axisX, axisY) || 1;
  const ux = axisX / len, uy = axisY / len;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(Math.atan2(uy, ux));
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';

  const n = 3;
  const coilR = CELL * 0.12;
  const totalW = n * 2 * coilR;
  const startX = -totalW / 2 + coilR;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const cx0 = startX + i * 2 * coilR;
    ctx.arc(cx0, 0, coilR, Math.PI, 0, false);
  }
  ctx.stroke();
  ctx.restore();
}

/* ---- coil ---- */

function drawCoil(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const res = simResult.results.get(cx + ',' + cy);
  const power = res ? Math.max(0, res.p) : 0;
  const hot = Math.min(1, Math.pow(power, 0.35) * 0.7);
  const pins = cell.pins || { a:'left', b:'right' };

  drawLeads(px, py, pins, CELL * 0.24);

  const dA = DIRV[pins.a] || [-1, 0];
  const dB = DIRV[pins.b] || [1, 0];
  const axisX = dB[0] - dA[0];
  const axisY = dB[1] - dA[1];
  const len = Math.hypot(axisX, axisY) || 1;
  const ux = axisX / len, uy = axisY / len;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(Math.atan2(uy, ux));
  ctx.strokeStyle = hot > 0.02
    ? `rgba(251,146,60,${0.65 + 0.35 * hot})`
    : '#f472b6';
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';

  const n = 3;
  const coilR = CELL * 0.12;
  const totalW = n * 2 * coilR;
  const startX = -totalW / 2 + coilR;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const cx0 = startX + i * 2 * coilR;
    ctx.arc(cx0, 0, coilR, Math.PI, 0, false);
  }
  ctx.stroke();

  ctx.strokeStyle = hot > 0.02
    ? `rgba(251,146,60,${0.45 + 0.35 * hot})`
    : 'rgba(244,114,182,.45)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-totalW / 2 - 2, -coilR * 1.1);
  ctx.lineTo( totalW / 2 + 2, -coilR * 1.1);
  ctx.moveTo(-totalW / 2 - 2,  coilR * 1.1);
  ctx.lineTo( totalW / 2 + 2,  coilR * 1.1);
  ctx.stroke();
  ctx.restore();
}

/* ---- diode ---- */

function drawDiode(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const pins = cell.pins || { a:'left', b:'right' };
  const key = cx + ',' + cy;
  const on = simResult.diodeOn.has(key);

  const col = on ? '#fbbf24' : '#5a6a7d';

  drawLeads(px, py, pins, CELL * 0.20);

  const dA = DIRV[pins.a] || [-1, 0];
  const dB = DIRV[pins.b] || [1, 0];
  const axisX = dB[0] - dA[0];
  const axisY = dB[1] - dA[1];
  const len = Math.hypot(axisX, axisY) || 1;
  const ux = axisX / len, uy = axisY / len;
  const perpX = -uy, perpY = ux;

  const size = CELL * 0.22;

  const tipX = px + ux * size, tipY = py + uy * size;
  const b1X  = px - ux * size + perpX * size;
  const b1Y  = py - uy * size + perpY * size;
  const b2X  = px - ux * size - perpX * size;
  const b2Y  = py - uy * size - perpY * size;

  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(b1X, b1Y);
  ctx.lineTo(b2X, b2Y);
  ctx.closePath();
  ctx.fillStyle = on ? 'rgba(251,191,36,.35)' : 'rgba(90,106,125,.25)';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tipX + perpX * size, tipY + perpY * size);
  ctx.lineTo(tipX - perpX * size, tipY - perpY * size);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.4;
  ctx.stroke();

  if (on) {
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

/* ---- LED ---- */

function drawLED(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const pins = cell.pins || { a:'left', b:'right' };
  const key = cx + ',' + cy;
  const on = simResult.ledOn.has(key);
  const res = simResult.results.get(key);
  const power = res ? Math.max(0, res.p) : 0;
  const bright = on ? Math.min(1, Math.pow(power * 4, 0.4)) : 0;

  const col = on ? '#f87171' : '#5a6a7d';

  if (bright > 0.02) {
    const R = CELL * 0.42;
    const g = ctx.createRadialGradient(px, py, 0, px, py, R * 2.4);
    g.addColorStop(0, `rgba(248,113,113,${0.7 * bright})`);
    g.addColorStop(1, 'rgba(248,113,113,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, R * 2.4, 0, Math.PI * 2); ctx.fill();
  }

  drawLeads(px, py, pins, CELL * 0.20);

  const dA = DIRV[pins.a] || [-1, 0];
  const dB = DIRV[pins.b] || [1, 0];
  const axisX = dB[0] - dA[0];
  const axisY = dB[1] - dA[1];
  const len = Math.hypot(axisX, axisY) || 1;
  const ux = axisX / len, uy = axisY / len;
  const perpX = -uy, perpY = ux;

  const size = CELL * 0.20;

  const tipX = px + ux * size, tipY = py + uy * size;
  const b1X  = px - ux * size + perpX * size;
  const b1Y  = py - uy * size + perpY * size;
  const b2X  = px - ux * size - perpX * size;
  const b2Y  = py - uy * size - perpY * size;

  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(b1X, b1Y);
  ctx.lineTo(b2X, b2Y);
  ctx.closePath();
  ctx.fillStyle = on ? `rgba(248,113,113,${0.35 + 0.5 * bright})`
                     : 'rgba(90,106,125,.22)';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tipX + perpX * size, tipY + perpY * size);
  ctx.lineTo(tipX - perpX * size, tipY - perpY * size);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.4;
  ctx.stroke();

  const ax = -ux * 0.6 + perpX * 0.6;
  const ay = -uy * 0.6 + perpY * 0.6;
  ctx.strokeStyle = on ? `rgba(248,113,113,${0.55 + 0.45 * bright})`
                       : 'rgba(90,106,125,.5)';
  ctx.lineWidth = 1.6;
  for (const off of [0, 6]) {
    const sx = px + ax * 14 + perpX * off - ux * off;
    const sy = py + ay * 14 + perpY * off - uy * off;
    const ex = sx + ax * 7;
    const ey = sy + ay * 7;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    const hx = -ay, hy = ax;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - ax * 2.5 + hx * 1.8, ey - ay * 2.5 + hy * 1.8);
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - ax * 2.5 - hx * 1.8, ey - ay * 2.5 - hy * 1.8);
    ctx.stroke();
  }

  if (on) {
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(tipX + perpX * size, tipY + perpY * size);
    ctx.lineTo(tipX - perpX * size, tipY - perpY * size);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

/* ---- transistor ---- */

function drawTransistor(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const R = CELL * 0.20;
  const pins = cell.pins || { c:'up', b:'left', e:'down' };

  ctx.lineCap = 'round';

  for (const name of ['c', 'b', 'e']) {
    const d = pins[name];
    if (!d) continue;
    const [dx, dy] = DIRV[d];
    ctx.strokeStyle = name === 'b' ? '#c4b5fd'
                    : name === 'c' ? '#a78bfa'
                    : '#8b5cf6';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px + dx * R * 0.8, py + dy * R * 0.8);
    ctx.lineTo(px + dx * CELL / 2, py + dy * CELL / 2);
    ctx.stroke();

    ctx.fillStyle = '#ddd6fe';
    ctx.beginPath();
    ctx.arc(px + dx * CELL / 2, py + dy * CELL / 2, 2.4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(px, py, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(167,139,250,.16)';
  ctx.fill();
  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 2;
  ctx.stroke();
}

/* ---- ground ---- */

function drawGround(cx, cy, cell) {
  const px = cx * CELL + state.cam.x + CELL / 2;
  const py = cy * CELL + state.cam.y + CELL / 2;
  const col = '#94a3b8';

  ctx.fillStyle = 'rgba(148,163,184,.07)';
  roundRect(ctx, px - CELL / 2 + 3, py - CELL / 2 + 3, CELL - 6, CELL - 6, 6);
  ctx.fill();

  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(px, py - 7);
  ctx.lineTo(px, py + 4);
  ctx.stroke();

  const bars = [
    { y: py + 4,  w: 18 },
    { y: py + 10, w: 11 },
    { y: py + 16, w: 5 }
  ];
  for (const b of bars) {
    ctx.beginPath();
    ctx.moveTo(px - b.w / 2, b.y);
    ctx.lineTo(px + b.w / 2, b.y);
    ctx.stroke();
  }
}

/* ============================================================
   Formatting
   ============================================================ */

function shortNum(n) {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a === 0) return '0';
  if (a >= 0.001 && a < 10000) return String(parseFloat(n.toPrecision(4)));
  return n.toExponential(1).replace('e+', 'e').replace('e-', 'e-');
}

function fmtNum(n) {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a === 0) return '0';
  if (a >= 1e-4 && a < 1e6) return String(parseFloat(n.toPrecision(5)));
  return n.toExponential(3);
}

function fmtEng(v, unit) {
  if (!isFinite(v)) return '∞ ' + unit;
  const a = Math.abs(v);
  if (a === 0) return '0 ' + unit;
  const prefixes = [
    [1e9,  'G'], [1e6, 'M'], [1e3, 'k'], [1, ''],
    [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']
  ];
  for (const [scale, p] of prefixes) {
    if (a >= scale * 0.999) return String(parseFloat((v / scale).toPrecision(4))) + ' ' + p + unit;
  }
  return v.toExponential(2) + ' ' + unit;
}

/* ============================================================
   Interactions
   ============================================================ */

let pointerState = null;

document.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  if (e.button === 2) e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  pointerState = {
    sx: e.clientX, sy: e.clientY,
    camX: state.cam.x, camY: state.cam.y,
    button: e.button,
    moved: false
  };
});

cv.addEventListener('pointermove', e => {
  const rect = cv.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  const prevHover = hoverCell;
  hoverCell = screenToCell(sx, sy);
  if (!prevHover || prevHover.x !== hoverCell.x || prevHover.y !== hoverCell.y) render();

  if (!pointerState) return;
  const dx = e.clientX - pointerState.sx;
  const dy = e.clientY - pointerState.sy;

  if (!pointerState.moved && Math.hypot(dx, dy) > 4) pointerState.moved = true;

  if (pointerState.moved && pointerState.button === 0) {
    state.cam.x = pointerState.camX + dx;
    state.cam.y = pointerState.camY + dy;
    render();
  }
});

cv.addEventListener('pointerup', e => {
  if (!pointerState) return;
  const ps = pointerState;
  pointerState = null;

  if (ps.moved) {
    save();
    return;
  }

  const rect = cv.getBoundingClientRect();
  const pt = screenToCell(e.clientX - rect.left, e.clientY - rect.top);
  handleClick(pt.x, pt.y, e.button);
});

cv.addEventListener('pointercancel', () => { pointerState = null; });

cv.addEventListener('pointerleave', () => {
  if (hoverCell) { hoverCell = null; render(); }
});

/* ---- keyboard: R = CW, T = CCW, Delete/Backspace = remove hovered ---- */

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
  const ov = document.getElementById('overlay');
  if (ov && !ov.classList.contains('hidden')) return;

  const k = e.key.toLowerCase();

  if (k === 'r') { e.preventDefault(); rotateCurrent(true);  return; }
  if (k === 't') { e.preventDefault(); rotateCurrent(false); return; }

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (hoverCell) {
      const key = hoverCell.x + ',' + hoverCell.y;
      if (state.cells[key]) {
        e.preventDefault();
        delete state.cells[key];
        update();
      }
    }
  }
});

/* ---- click handling ---- */

function handleClick(cx, cy, button) {
  const key  = cx + ',' + cy;
  const cell = state.cells[key];
  const tool = state.tool;

  if (button === 2) {
    if (cell) openContextMenu(cell, key);
    return;
  }

  if (tool === 'delete') {
    if (cell) {
      delete state.cells[key];
      update();
    }
    return;
  }

  if (tool === 'rightclick') {
    if (cell) openContextMenu(cell, key);
    return;
  }

  if (cell) {
    leftAction(cell, key);
    return;
  }

  const fresh = placeTool(tool);
  if (fresh) {
    state.cells[key] = fresh;
    update();
  }
}

function leftAction(cell, key) {
  switch (cell.type) {
    case 'power':
      cell.on = !cell.on;
      update();
      break;

    case 'switch':
      cell.on = !cell.on;
      update();
      break;

    case 'lamp':
    case 'resistor':
    case 'coil': {
      const res = simResult.results.get(key);
      const label = cell.type === 'lamp' ? 'Lamp'
                  : cell.type === 'coil' ? 'Coil'
                  : 'Resistor';
      if (res) {
        showToast(
          `${label} · ${fmtNum(res.p)} W · ${fmtNum(res.i)} A · ${fmtNum(res.v)} V`
        );
      } else {
        showToast(`${label} · not in a closed circuit`);
      }
      break;
    }

    case 'capacitor': {
      const va = simResult.volt.get(simResult.dsu?.find(key + '#a')) || 0;
      const vb = simResult.volt.get(simResult.dsu?.find(key + '#b')) || 0;
      const dv = Math.abs(va - vb);
      showToast(`Capacitor · ${fmtEng(cell.c, 'F')} · ΔV ${fmtNum(dv)} V · DC open`);
      break;
    }

    case 'inductor': {
      showToast(`Inductor · ${fmtEng(cell.l, 'H')} · ideal short in DC`);
      break;
    }

    case 'diode': {
      const on = simResult.diodeOn.has(key);
      showToast(`Diode · ${on ? 'conducting' : 'blocking'}`);
      break;
    }

    case 'led': {
      const on = simResult.ledOn.has(key);
      const res = simResult.results.get(key);
      if (on && res) {
        showToast(`LED · ON · ${fmtNum(res.p)} W · ${fmtNum(res.i)} A`);
      } else {
        showToast(`LED · OFF`);
      }
      break;
    }

    case 'transistor': {
      const p = cell.pins || {};
      showToast(`Transistor · C:${p.c || '—'}  B:${p.b || '—'}  E:${p.e || '—'}`);
      break;
    }

    case 'ground':
      showToast('Ground · reference node (0 V)');
      break;
  }
}

/* ============================================================
   Config dialogs — shared between placed cells and tool defaults
   ============================================================ */

function openConfigDialogFor(cell, isTool) {
  const pre = isTool ? 'Tool Defaults · ' : '';

  if (cell.type === 'power') {
    const pins = cell.pins || { pos:'up', neg:'down' };
    openDialog(pre + 'Power Source', [
      { key:'v', label:'Voltage (V)  ·  range 1e-9 – 100',
        type:'number', value:cell.v, min:1e-9, max:100 },
      { key:'pos', label:'+ terminal direction',
        type:'select', value:pins.pos, options:DIRS, labels:DIR_LABELS },
      { key:'neg', label:'− terminal direction',
        type:'select', value:pins.neg, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const v = parseFloat(vals.v);
      if (isFinite(v)) cell.v = Math.min(100, Math.max(1e-9, v));
      cell.pins = { pos: vals.pos, neg: vals.neg };
    }, isTool
      ? 'These values are used for every Power Source you place from now on.'
      : 'Both + and − must face a neighbouring cell to make contact.');
    return true;
  }

  if (cell.type === 'switch') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(pre + 'Switch — Terminal Directions', [
      { key:'a', label:'Terminal A', type:'select', value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B', type:'select', value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      cell.pins = { a: vals.a, b: vals.b };
    }, isTool
      ? 'These values are used for every Switch you place from now on.'
      : 'Left-click the switch to toggle it on / off.');
    return true;
  }

  if (cell.type === 'lamp' || cell.type === 'resistor') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(
      pre + (cell.type === 'lamp' ? 'Lamp — Resistance & Terminals'
                                   : 'Resistor — Resistance & Terminals'),
      [
        { key:'r', label:'Resistance (Ω)', type:'number',
          value:cell.r, min:1e-6, max:1e12 },
        { key:'a', label:'Terminal A direction', type:'select',
          value:p.a, options:DIRS, labels:DIR_LABELS },
        { key:'b', label:'Terminal B direction', type:'select',
          value:p.b, options:DIRS, labels:DIR_LABELS }
      ],
      vals => {
        const r = parseFloat(vals.r);
        if (isFinite(r) && r > 0) cell.r = r;
        cell.pins = { a: vals.a, b: vals.b };
      },
      isTool
        ? 'These values are used for every new element of this type.'
        : (cell.type === 'lamp'
            ? 'Non-polarised. Left-click to read power / current / voltage.'
            : 'Non-polarised. Left-click to read dissipated power.')
    );
    return true;
  }

  if (cell.type === 'capacitor') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(pre + 'Capacitor', [
      { key:'c', label:'Capacitance (F)', type:'number',
        value:cell.c, min:1e-15, max:1e3 },
      { key:'a', label:'Terminal A direction', type:'select',
        value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B direction', type:'select',
        value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const c = parseFloat(vals.c);
      if (isFinite(c) && c > 0) cell.c = c;
      cell.pins = { a: vals.a, b: vals.b };
    }, isTool
      ? 'These values are used for every Capacitor you place from now on.'
      : 'Non-polarised. Open circuit in DC steady state.');
    return true;
  }

  if (cell.type === 'inductor') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(pre + 'Inductor', [
      { key:'l', label:'Inductance (H)', type:'number',
        value:cell.l, min:1e-12, max:1e6 },
      { key:'a', label:'Terminal A direction', type:'select',
        value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B direction', type:'select',
        value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const l = parseFloat(vals.l);
      if (isFinite(l) && l > 0) cell.l = l;
      cell.pins = { a: vals.a, b: vals.b };
    }, isTool
      ? 'These values are used for every Inductor you place from now on.'
      : 'Non-polarised. Ideal short circuit in DC steady state.');
    return true;
  }

  if (cell.type === 'coil') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(pre + 'Coil (inductor + series resistance)', [
      { key:'r', label:'Series resistance (Ω)', type:'number',
        value:cell.r, min:1e-6, max:1e12 },
      { key:'l', label:'Inductance (H)', type:'number',
        value:cell.l, min:1e-12, max:1e6 },
      { key:'a', label:'Terminal A direction', type:'select',
        value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Terminal B direction', type:'select',
        value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const r = parseFloat(vals.r);
      const l = parseFloat(vals.l);
      if (isFinite(r) && r > 0) cell.r = r;
      if (isFinite(l) && l > 0) cell.l = l;
      cell.pins = { a: vals.a, b: vals.b };
    }, isTool
      ? 'These values are used for every Coil you place from now on.'
      : 'Non-polarised. In DC it behaves like a resistor.');
    return true;
  }

  if (cell.type === 'diode') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(pre + 'Diode — Anode / Cathode', [
      { key:'a', label:'Anode direction (current in)', type:'select',
        value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Cathode direction (current out)', type:'select',
        value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      cell.pins = { a: vals.a, b: vals.b };
    }, isTool
      ? 'These values are used for every Diode you place from now on.'
      : 'Polarised: conducts only anode → cathode. Left-click to read its state.');
    return true;
  }

  if (cell.type === 'led') {
    const p = cell.pins || { a:'left', b:'right' };
    openDialog(pre + 'LED — Anode / Cathode', [
      { key:'r', label:'Internal resistance (Ω)', type:'number',
        value:cell.r, min:1e-3, max:1e9 },
      { key:'a', label:'Anode direction (current in)', type:'select',
        value:p.a, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Cathode direction (current out)', type:'select',
        value:p.b, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      const r = parseFloat(vals.r);
      if (isFinite(r) && r > 0) cell.r = r;
      cell.pins = { a: vals.a, b: vals.b };
    }, isTool
      ? 'These values are used for every LED you place from now on.'
      : 'Polarised: emits light when forward-biased. Left-click to read its state.');
    return true;
  }

  if (cell.type === 'transistor') {
    const p = cell.pins || { c:'up', b:'left', e:'down' };
    openDialog(pre + 'Transistor — Pin Directions', [
      { key:'c', label:'Collector', type:'select', value:p.c, options:DIRS, labels:DIR_LABELS },
      { key:'b', label:'Base',      type:'select', value:p.b, options:DIRS, labels:DIR_LABELS },
      { key:'e', label:'Emitter',   type:'select', value:p.e, options:DIRS, labels:DIR_LABELS }
    ], vals => {
      cell.pins = { c: vals.c, b: vals.b, e: vals.e };
    }, isTool ? 'These values are used for every Transistor you place from now on.' : undefined);
    return true;
  }

  if (isWire(cell)) {
    const links = cell.links || { up:'auto', down:'auto', left:'auto', right:'auto' };
    openDialog(pre + 'Wire — Redstone-like Connections', [
      { key:'up',    label:'Up',    type:'select', value:links.up,    options:LINK_OPTIONS, labels:LINK_LABELS },
      { key:'down',  label:'Down',  type:'select', value:links.down,  options:LINK_OPTIONS, labels:LINK_LABELS },
      { key:'left',  label:'Left',  type:'select', value:links.left,  options:LINK_OPTIONS, labels:LINK_LABELS },
      { key:'right', label:'Right', type:'select', value:links.right, options:LINK_OPTIONS, labels:LINK_LABELS }
    ], vals => {
      cell.links = {
        up:    vals.up,
        down:  vals.down,
        left:  vals.left,
        right: vals.right
      };
    }, isTool
      ? 'These defaults apply to every wire you place from now on.'
      : 'Auto links only to same-colour wires next door. Force ON draws & powers the link unconditionally.');
    return true;
  }

  return false;
}

function openContextMenu(cell, key) {
  if (!openConfigDialogFor(cell, false)) {
    if (cell.type === 'ground') showToast('Ground · reference node (0 V)');
  }
}

/* Right-click on a toolbar component button → edit that tool's default. */
function openToolConfig(type) {
  const tpl = getToolCell(type);
  if (!tpl) return;

  if (tpl.type === 'ground') {
    showToast('Ground has no configurable properties');
    return;
  }
  if (!CONFIGURABLE_TYPES.has(tpl.type)) {
    showToast(`${toolLabel(type)} has no configurable properties`);
    return;
  }

  openConfigDialogFor(tpl, true);
}

/* ============================================================
   Dialog
   ============================================================ */

function openDialog(title, fields, onOk, subtitle) {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = '';

  const box = document.createElement('div');
  box.className = 'dialog';

  const h = document.createElement('h3');
  h.textContent = title;
  box.appendChild(h);

  if (subtitle) {
    const s = document.createElement('div');
    s.className = 'sub';
    s.textContent = subtitle;
    box.appendChild(s);
  }

  const inputs = {};
  for (const f of fields) {
    const row = document.createElement('label');
    row.className = 'field';

    const span = document.createElement('span');
    span.textContent = f.label;
    row.appendChild(span);

    let inp;
    if (f.type === 'select') {
      inp = document.createElement('select');
      f.options.forEach((o, i) => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = f.labels ? f.labels[i] : o;
        inp.appendChild(opt);
      });
      inp.value = f.value;
    } else {
      inp = document.createElement('input');
      inp.type = 'number';
      inp.step = 'any';
      inp.value = f.value;
      if (f.min !== undefined) inp.min = f.min;
      if (f.max !== undefined) inp.max = f.max;
    }
    inputs[f.key] = inp;
    row.appendChild(inp);
    box.appendChild(row);
  }

  const btns = document.createElement('div');
  btns.className = 'btns';

  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.onclick = closeDialog;

  const ok = document.createElement('button');
  ok.textContent = 'OK';
  ok.className = 'primary';
  ok.onclick = () => {
    const vals = {};
    for (const k in inputs) vals[k] = inputs[k].value;
    closeDialog();
    onOk(vals);
    update();
  };

  btns.appendChild(cancel);
  btns.appendChild(ok);
  box.appendChild(btns);

  box.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); ok.click(); }
    if (e.key === 'Escape') { closeDialog(); }
  });

  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) closeDialog(); };

  const first = box.querySelector('input, select');
  if (first) { first.focus(); if (first.select) first.select(); }
}

function closeDialog() {
  const ov = document.getElementById('overlay');
  ov.classList.add('hidden');
  ov.innerHTML = '';
  ov.onclick = null;
}

/* ============================================================
   Toast
   ============================================================ */

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   Toolbar
   ============================================================ */

const TOOLS = [
  { id: 'delete',     label: 'Delete' },
  { id: 'rightclick', label: 'R-Click' },
  { sep: true },
  { id: 'power',      label: 'Power' },
  { id: 'wire1',      label: 'Wire 1', color: WIRE_COLORS.wire1 },
  { id: 'wire2',      label: 'Wire 2', color: WIRE_COLORS.wire2 },
  { id: 'wire3',      label: 'Wire 3', color: WIRE_COLORS.wire3 },
  { id: 'switch',     label: 'Switch' },
  { id: 'lamp',       label: 'Lamp' },
  { id: 'resistor',   label: 'Resistor' },
  { id: 'capacitor',  label: 'Cap' },
  { id: 'inductor',   label: 'Ind' },
  { id: 'coil',       label: 'Coil' },
  { id: 'diode',      label: 'Diode' },
  { id: 'led',        label: 'LED' },
  { id: 'transistor', label: 'Transistor' },
  { id: 'ground',     label: 'GND' },
  { sep: true },
  { id: 'rotate-ccw', label: '↺', special: 'rotate-ccw', title: 'Rotate CCW (T)' },
  { id: 'rotate-cw',  label: '↻', special: 'rotate-cw',  title: 'Rotate CW (R)'  }
];

function buildToolbar() {
  const bar = document.getElementById('toolbar');
  bar.innerHTML = '';

  for (const t of TOOLS) {
    if (t.sep) {
      const s = document.createElement('span');
      s.className = 'sep';
      bar.appendChild(s);
      continue;
    }
    const b = document.createElement('button');
    b.dataset.tool = t.id;
    if (t.title) b.title = t.title;

    if (t.special) {
      b.className = 'rotate-btn';
      b.appendChild(document.createTextNode(t.label));
      b.onclick = () => {
        if (t.special === 'rotate-ccw') rotateCurrent(false);
        else                            rotateCurrent(true);
      };
      bar.appendChild(b);
      continue;
    }

    if (t.color) {
      const i = document.createElement('i');
      i.style.background = t.color;
      b.appendChild(i);
    }
    b.appendChild(document.createTextNode(t.label));
    b.onclick = () => {
      state.tool = t.id;
      refreshToolbar();
      save();
      render(); // ghost updates instantly
    };

    /* Right-click on the button → edit that tool's defaults. */
    if (CONFIGURABLE_TYPES.has(t.id)) {
      b.title = 'Right-click to edit default orientation & values';
      b.addEventListener('contextmenu', ev => {
        ev.preventDefault();
        ev.stopPropagation();
        openToolConfig(t.id);
      });
    }

    bar.appendChild(b);
  }
  refreshToolbar();
}

function refreshToolbar() {
  document.querySelectorAll('#toolbar button').forEach(b => {
    if (b.classList.contains('rotate-btn')) return;
    b.classList.toggle('active', b.dataset.tool === state.tool);
  });
}

/* ============================================================
   Main loop / init
   ============================================================ */

function update() {
  save();
  simulate();
  render();
}

function init() {
  const hadSave = load();

  for (const k in state.cells) ensureDefaults(state.cells[k]);
  for (const t in toolCells) ensureDefaults(toolCells[t]);

  // Make sure every placeable tool has a template.
  for (const t of TOOLS) {
    if (t.special || t.sep) continue;
    getToolCell(t.id);
  }

  buildToolbar();
  resize();

  if (!hadSave) {
    state.cam.x = Math.round(window.innerWidth  / 2 - CELL / 2);
    state.cam.y = Math.round(window.innerHeight / 2 - CELL / 2);
  }

  simulate();
  render();

  window.addEventListener('resize', resize);
}

init();
</script>
