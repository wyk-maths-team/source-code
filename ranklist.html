﻿<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/arch-render.js"></script>

<meta charset="UTF-8" />
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  if (localStorage.getItem('pageTransition') === 'off') return;
  if (sessionStorage.getItem('__pt') !== 'in') return;
  document.documentElement.style.background = (t === 'dark' ? '#0d1117' : '#0f3460');
}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/pageload.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Leaderboard - WYK Maths Team</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
  <style>
    :root {
      --card-bg: #fff;
      --border-color: #dee2e6;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --accent: #337ab7;
      --danger: #dc3545;
      --hover-bg: #e9ecef;
      --table-hover-bg: #f0f7ff;
    }
    [data-theme="dark"] {
      --card-bg: #1e1e1e;
      --border-color: #444;
      --text-primary: #e0e0e0;
      --text-secondary: #aaa;
      --hover-bg: #2c2c2c;
      --table-hover-bg: #2a2a2a;
    }

    .leaderboard-container {
      background: var(--card-bg);
      border-radius: 4px;
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .page-header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--text-primary);
    }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .btn {
      padding: 0.4rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-block;
    }
    .btn:hover {
      background: var(--hover-bg);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: default;
      pointer-events: none;
    }
    .btn.disabled {
      opacity: 0.6;
      pointer-events: none;
      cursor: default;
    }
    .btn-info {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-info:hover {
      background: #286090;
    }

    .submissions-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .submissions-table th,
    .submissions-table td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .submissions-table th {
      background: #e9ecef;
      font-weight: 700;
      color: #333;
    }
    .submissions-table tbody tr:hover {
      background: var(--table-hover-bg);
    }
    .submissions-table tr.mine {
      background: #fffde7 !important;
      font-weight: 500;
    }
    .submissions-table tr.mine td {
      border-bottom-color: #ffe082;
    }
    [data-theme="dark"] .submissions-table th {
      background: #333;
      color: #ddd;
    }
    [data-theme="dark"] .submissions-table td {
      border-bottom-color: var(--border-color);
    }
    [data-theme="dark"] .submissions-table tr.mine {
      background: #3e3a20 !important;
    }
    [data-theme="dark"] .submissions-table tr.mine td {
      border-bottom-color: #5c5518;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [data-theme="dark"] .spinner {
      border-color: rgba(255,255,255,0.2);
    }

    .text-center { text-align: center; }
    .text-danger { color: var(--danger); }
    [data-theme="dark"] .text-danger { color: #ff8888; }

    /* ===== Hover tooltip ===== */
    #userTooltip {
      position: fixed;
      top: 0; left: 0;
      z-index: 10000;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
      max-width: 340px;
    }
    #userTooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #userTooltip .tip-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--border-color);
      background: var(--hover-bg);
    }
    #userTooltip .tip-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--text-secondary);
    }
    #userTooltip .tip-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #userTooltip .tip-display {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #userTooltip .tip-username {
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      color: var(--accent);
    }
    #userTooltip .tip-realname {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    /* ⭐ 头像 + 在线点 */
    .user-avatar-wrap {
      position: relative;
      display: inline-flex;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-right: 8px;
    }
    .user-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .user-avatar-wrap .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, #4a90d9, #2e5fa0);
    }
    .user-avatar-wrap .online-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2ecc71;
      border: 2px solid var(--card-bg);
      box-shadow: 0 0 0 0 rgba(46,204,113,.7);
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(46,204,113,.7); }
      70%  { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }
    [data-theme="dark"] .user-avatar-wrap .online-dot {
      border-color: var(--card-bg);
    }

    /* tooltip 头像也用同样方式 */
    #userTooltip .tip-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    #userTooltip .tip-avatar-wrap .online-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2ecc71;
      border: 2px solid var(--card-bg);
    }

    #refreshBtn {
      min-width: 110px;
      transition: background .15s, border-color .15s, color .15s;
    }
    #refreshBtn i {
      transition: transform .15s;
    }
    #refreshBtn.spinning i {
      animation: spin 1s linear infinite;
    }
    #refreshBtn .rf-time {
      font-family: 'Consolas', monospace;
      font-size: .82em;
      opacity: .7;
      margin-left: 2px;
    }

    #leaderboardBody {
      transition: opacity .2s;
    }
    #leaderboardBody.refreshing {
      opacity: .5;
    }
  </style>

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>
  <script src="/script/heartbeat.js"></script>

  <script>
    if (!isLoggedIn()) window.location.href = '/index.html';

    const mainContainer = document.getElementById('mainContent');
    const currentUsername = getCurrentUser()?.username || '';

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    // ⭐ 相对时间：3 分钟前 / 2 小时前 / 昨天 14:32 / 10-04 14:32
function formatLastSeen(ts) {
  if (!ts) return 'never';
  const d = new Date(ts);
  const now = Date.now();
  const diff = now - d.getTime();

  if (diff < 0) return 'just now';
  if (diff < 60_000) return 'just now';
  if (diff < 3600_000) {
    const m = Math.floor(diff / 60_000);
    return `${m} minute${m > 1 ? 's' : ''} ago`;
  }
  if (diff < 86400_000) {
    const h = Math.floor(diff / 3600_000);
    return `${h} hour${h > 1 ? 's' : ''} ago`;
  }

  const p = n => String(n).padStart(2, '0');
  const hhmm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);

  if (d.toDateString() === yesterday.toDateString()) return `yesterday ${hhmm}`;
  if (d.getFullYear() === today.getFullYear()) {
    return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hhmm}`;
  }
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
// ⭐ 头像 + 绿点
    
    function avatarHtml(user, size = 24) {
      const pfp = user.pfp;
      const online = user.online;
      const inner = pfp
        ? `<img src="${escapeHtml(pfp)}" alt="" loading="lazy" decoding="async">`
        : `<div class="avatar-placeholder"><i class="fas fa-user"></i></div>`;
      const dot = online ? '<span class="online-dot" title="Online"></span>' : '';
      return `<span class="user-avatar-wrap" style="width:${size}px;height:${size}px;">${inner}${dot}</span>`;
    }

    // ═══════════════ Skeleton ═══════════════
    function renderSkeleton() {
      mainContainer.innerHTML = `
        <div class="leaderboard-container">
          <div class="page-header">
            <h1>Leaderboard</h1>
            <div class="btn-group">
              <button class="btn btn-info disabled" disabled>Leaderboard</button>
              <a href="/charts" class="btn">Chart</a>
              <button class="btn" id="refreshBtn" title="Refresh leaderboard">
                <i class="fas fa-rotate"></i> Refresh <span class="rf-time" id="refreshTime"></span>
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="submissions-table">
              <thead>
                <tr>
                  <th style="width:10%" class="text-center">Rank</th>
                  <th style="width:75%">User</th>
                  <th style="width:15%" class="text-center">Tasks Solved</th>
                </tr>
              </thead>
              <tbody id="leaderboardBody">
                <tr>
                  <td colspan="3" class="text-center">
                    <span class="spinner"></span> Loading leaderboard…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ═══════════════ Tooltip ═══════════════
    const tooltip = document.createElement('div');
    tooltip.id = 'userTooltip';
    document.body.appendChild(tooltip);

    let tooltipTargetEl = null;
    let leaderboardUserMap = {};

    function showTooltip(user) {
      const avatarInner = user.pfp
        ? `<img class="tip-avatar" src="${escapeHtml(user.pfp)}" alt="">`
        : `<div class="tip-avatar placeholder"><i class="fas fa-user"></i></div>`;
      const avatar = `
        <div class="tip-avatar-wrap">
          ${avatarInner}
          ${user.online ? '<span class="online-dot" title="Online"></span>' : ''}
        </div>`;
      tooltip.innerHTML = `
        ${avatar}
        <div class="tip-info">
          <div class="tip-display">${escapeHtml(user.displayName || user.username)}</div>
          <div class="tip-username">@${escapeHtml(user.username)}</div>
          ${user.realName ? `<div class="tip-realname">${escapeHtml(user.realName)}</div>` : ''}
          <div class="tip-realname" style="margin-top:4px;">
            <span style="color:${user.online ? '#2ecc71' : '#aaa'};">
              <i class="fas fa-circle" style="font-size:6px;vertical-align:middle;"></i>
              ${user.online
  ? 'Online'
  : user.explicitlyOffline
    ? `Offline (logged out) · Last seen: ${escapeHtml(formatLastSeen(user.lastSeenAt))}`
    : `Last seen: ${escapeHtml(formatLastSeen(user.lastSeenAt))}`}
            </span>
          </div>
        </div>
      `;
      tooltip.style.display = 'flex';
      void tooltip.offsetWidth;
      tooltip.classList.add('visible');
    }

    function hideTooltip() {
      tooltipTargetEl = null;
      tooltip.classList.remove('visible');
      setTimeout(() => {
        if (!tooltipTargetEl) tooltip.style.display = 'none';
      }, 120);
    }

    function moveTooltip(e) {
      if (!tooltipTargetEl) return;
      const pad = 14;
      const w = tooltip.offsetWidth;
      const h = tooltip.offsetHeight;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tooltip.style.left = Math.max(8, x) + 'px';
      tooltip.style.top  = Math.max(8, y) + 'px';
    }

    // ═══════════════ Leaderboard ═══════════════
    let isLoadingLeaderboard = false;

    function formatTime(d) {
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    async function loadLeaderboard() {
      if (isLoadingLeaderboard) return;
      isLoadingLeaderboard = true;

      const tbody = document.getElementById('leaderboardBody');
      const btn = document.getElementById('refreshBtn');
      if (!tbody) { isLoadingLeaderboard = false; return; }

      tbody.classList.add('refreshing');
      if (btn) { btn.disabled = true; btn.classList.add('spinning'); }

      try {
        const data = await apiCall('/api/users?action=leaderboard');
        if (!data.success || !data.leaderboard || data.leaderboard.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center">No solves yet.</td></tr>';
          return;
        }
        leaderboardUserMap = {};
        let html = '';
        data.leaderboard.forEach(entry => {
          if (entry.solves === 0) return;
          leaderboardUserMap[entry.username] = entry;
          const isMe = (currentUsername && entry.username === currentUsername);
          html += `
            <tr${isMe ? ' class="mine"' : ''}>
              <td class="text-center">${entry.rank}</td>
              <td>
                <a href="/users/${encodeURIComponent(entry.username)}"
                   class="user-link"
                   data-username="${escapeHtml(entry.username)}"
                   style="display:flex;align-items:center;gap:6px;">
                  ${avatarHtml(entry, 24)}
                  <span>${escapeHtml(entry.username)} - ${escapeHtml(entry.displayName || entry.username)}</span>
                </a>
              </td>
              <td class="text-center">${entry.solves}</td>
            </tr>`;
        });
        tbody.innerHTML = html;

        tbody.querySelectorAll('.user-link').forEach(link => {
          link.addEventListener('mouseenter', (e) => {
            const u = leaderboardUserMap[link.dataset.username];
            if (!u) return;
            tooltipTargetEl = link;
            showTooltip(u);
            moveTooltip(e);
          });
          link.addEventListener('mousemove', moveTooltip);
          link.addEventListener('mouseleave', hideTooltip);
        });

        // ⭐ 记录刷新时间
        const rt = document.getElementById('refreshTime');
        if (rt) rt.textContent = `(${formatTime(new Date())})`;
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Failed to load leaderboard.</td></tr>';
      } finally {
        isLoadingLeaderboard = false;
        tbody.classList.remove('refreshing');
        if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
      }
    }

    // ═══════════════ 手动刷新 ═══════════════
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('#refreshBtn');
      if (!btn) return;
      if (isLoadingLeaderboard) return;
      loadLeaderboard();
    });

    renderSkeleton();
    loadLeaderboard();
  </script>
</body>
