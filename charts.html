<style>
    /* ── 中性色变量（由 tools/extract-colors.mjs 生成）──────────────
       原先写死在内联样式里的浅色背景 / 深色文字 / 浅灰边框，抽取成
       变量后暗色与科幻主题只需覆盖取值，不必逐条重写规则。
       语义色（成功绿、错误红、警告橙）与代码高亮色刻意保留，
       它们在深色背景下依然成立。 */
    :root {
      --c-surface: #ffffff;
      --c-surface-sunken: #f8f9fa;
      --c-surface-raised: #f0f0f0;
      --c-surface-muted: #e9ecef;
      --c-border: #dddddd;
      --c-border-strong: #bbbbbb;
      --c-text: #333333;
      --c-text-muted: #666666;
      --c-text-subtle: #999999;
    }
    :root[data-theme="dark"] {
      --c-surface: #161b22;
      --c-surface-sunken: #0d1117;
      --c-surface-raised: #21262d;
      --c-surface-muted: #21262d;
      --c-border: #30363d;
      --c-border-strong: #484f58;
      --c-text: #c9d1d9;
      --c-text-muted: #8b949e;
      --c-text-subtle: #6e7681;
    }
    :root[data-theme="scifi"] {
      --c-surface: #09101a;
      --c-surface-sunken: #070d15;
      --c-surface-raised: #0f2231;
      --c-surface-muted: #101b26;
      --c-border: #14313f;
      --c-border-strong: #1e4a5e;
      --c-text: #c6eeff;
      --c-text-muted: #6c8fa3;
      --c-text-subtle: #546f80;
    }

  .chart-page-container {
    background: var(--card-bg);
    border-radius: 4px;
    padding: 1.2rem;
    box-shadow: var(--shadow-sm);
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  .page-header h1 {
    margin: 0;
    font-size: 1.5rem;
    color: var(--text-primary);
  }
  .btn-group { display: flex; gap: 0.5rem; }
  .btn {
    padding: 0.4rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: none;
    transition: background 0.2s;
    display: inline-block;
  }
  .btn:hover { background: var(--hover-bg); }
  .btn.disabled { opacity: 0.6; pointer-events: none; cursor: default; }
  .btn-info { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-info:hover { background: var(--accent-hover); }

  .chart-row {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .chart-main {
    flex: 1 1 65%;
    min-width: 320px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.8rem;
  }
  #solveChart { width: 100%; height: 560px; }

  /* ⭐ 全局 tooltip（fixed 定位，跟随鼠标）*/
  #cursorTooltip {
    position: fixed;
    pointer-events: none;
    display: none;
    background: rgba(25, 25, 30, 0.94);
    color: var(--c-surface-raised);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-family: inherit;
    max-height: 380px;
    overflow-y: auto;
    min-width: 180px;
    max-width: 320px;
    z-index: 9999;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
  }
  #cursorTooltip .tt-header {
    font-weight: 700;
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 0.85rem;
  }
  #cursorTooltip .tt-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 1px 0;
    white-space: nowrap;
  }
  #cursorTooltip .tt-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #cursorTooltip .tt-value {
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .chart-options {
    flex: 1 1 28%;
    min-width: 260px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.9rem 1rem;
  }
  .chart-options h3 {
    margin: 0.8rem 0 0.4rem 0;
    font-size: 1rem;
    color: var(--text-primary);
  }
  .chart-options h3:first-child { margin-top: 0; }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0;
    font-size: 0.9rem;
    color: var(--text-primary);
    cursor: pointer;
  }
  .range-row { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.85rem; }
  .range-row label { display: flex; align-items: center; gap: 0.5rem; color: var(--text-primary); }
  .range-row input[type="date"] {
    flex: 1;
    padding: 0.25rem 0.4rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: 0.85rem;
  }
  .range-buttons { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
  .range-buttons .btn { flex: 1; padding: 0.3rem 0.5rem; font-size: 0.8rem; text-align: center; }

  .chart-legend-list {
    margin-top: 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 320px;
    overflow-y: auto;
  }
  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.4rem;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s;
    user-select: none;
  }
  .chart-legend-item:hover { background: var(--hover-bg); }
  .chart-legend-item input[type="checkbox"] { flex-shrink: 0; cursor: pointer; margin: 0; }
  .chart-legend-swatch {
    display: inline-block;
    width: 20px; height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .chart-legend-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-legend-count { color: var(--text-secondary); font-size: 0.8rem; flex-shrink: 0; }
  .legend-toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 0.2rem;
    font-size: 0.8rem;
  }
  .legend-toolbar a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .legend-toolbar a:hover { text-decoration: underline; }

  .loading-msg { text-align: center; padding: 2rem; color: var(--text-secondary); }

  @media (max-width: 768px) {
    .chart-main, .chart-options { flex: 1 1 100%; }
    #solveChart { height: 400px; }
    #cursorTooltip { max-height: 260px; max-width: 240px; font-size: 0.75rem; }
  }
  #cursorTooltip.pinned {
  border-color: rgba(255,255,255,0.45);
  box-shadow: 0 8px 26px rgba(0,0,0,0.55);
}
#cursorTooltip.pinned .tt-header::after {
  content: ' 📌';
  font-size: 0.75rem;
  opacity: 0.7;
  margin-left: 4px;
}
</style>
