<style>
  .pk-inv-wrap { max-width: 460px; margin: 60px auto; padding: 20px; }
  .pk-inv-card {
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(74,144,217,.25);
    text-align: center;
    animation: invIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes invIn {
    from { opacity: 0; transform: translateY(-12px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pk-inv-icon {
    width: 84px; height: 84px; margin: 0 auto 18px;
    background: radial-gradient(circle at 30% 30%, #4a90d9, #2e5fa0);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; color: #fff;
    box-shadow: 0 8px 24px rgba(74,144,217,.4);
  }
  .pk-inv-icon.danger {
    background: radial-gradient(circle at 30% 30%, #e74c3c, #a02c1f);
    box-shadow: 0 8px 24px rgba(231,76,60,.4);
  }
  .pk-inv-icon.success {
    background: radial-gradient(circle at 30% 30%, #2ecc71, #1a7a44);
    box-shadow: 0 8px 24px rgba(46,204,113,.4);
  }
  .pk-inv-title {
    font-size: 1.15rem; font-weight: 800; margin-bottom: 8px;
    line-height: 1.4;
  }
  .pk-inv-sub {
    font-size: .9rem; color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .pk-inv-ttl {
    font-family: 'Consolas', monospace;
    font-size: .85rem; color: var(--text-secondary);
    margin-bottom: 22px;
  }
  .pk-inv-ttl.warn   { color: #f0ad4e; }
  .pk-inv-ttl.danger { color: #e74c3c; font-weight: 700; }
  .pk-inv-actions { display: flex; gap: 12px; }
  .pk-inv-actions button {
    flex: 1; padding: 12px; border-radius: 10px;
    border: none; font-weight: 700; font-size: .95rem;
    cursor: pointer; font-family: inherit;
    transition: filter .15s, opacity .15s;
  }
  .pk-inv-actions button:hover:not(:disabled) { filter: brightness(1.08); }
  .pk-inv-actions button:disabled { opacity: .5; cursor: not-allowed; }
  .pk-accept  { background: #2ecc71; color: #fff; }
  .pk-decline {
    background: none; color: var(--text-secondary);
    border: 1px solid var(--border-color) !important;
  }
  .pk-inv-status {
    font-size: .9rem; margin-top: 16px; min-height: 1.2em;
  }
</style>
