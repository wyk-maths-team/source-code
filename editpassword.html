<script>
(function(){
  try {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true
                    || window.matchMedia('(display-mode: fullscreen)').matches
                    || window.matchMedia('(display-mode: minimal-ui)').matches;
    if (!isStandalone) return;
    if (location.pathname.indexOf('/os') === 0) return;
    if (location.pathname.indexOf('/admin') === 0) return;
    if (!sessionStorage.getItem('pwaEnteredOS')) {
      sessionStorage.setItem('pwaEnteredOS', '1');
      location.replace('/os' + location.search + location.hash);
    }
  } catch(e){}
})();
</script>

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="edit-form-container">
        <h2>Change Password</h2>
        <form id="editPasswordForm">
          <div class="form-group">
            <label for="oldPassword">Current Password</label>
            <input type="password" id="oldPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required minlength="4" />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" required minlength="4" />
          </div>
          <div class="form-actions">
            <button type="button" class="back-btn" id="backBtn">← Back</button>
            <button type="submit" class="save-btn">Save</button>
          </div>
        </form>
        <div id="message" class="message" style="display:none;"></div>
      </div>
    </main>
    <!-- <button class="sidebar-toggle" id="sidebarToggle">☰</button> -->
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    // 登录检查
    if (typeof isLoggedIn === 'function' && !isLoggedIn()) {
      window.location.href = '/index.html';
    }

    const form = document.getElementById('editPasswordForm');
    const messageEl = document.getElementById('message');
    const backBtn = document.getElementById('backBtn');

    backBtn.addEventListener('click', () => {
      window.history.back();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.style.display = 'none';

      const oldPassword = document.getElementById('oldPassword').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (!oldPassword || !newPassword || !confirmPassword) {
        messageEl.textContent = 'All fields are required.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      if (newPassword !== confirmPassword) {
        messageEl.textContent = 'New passwords do not match.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      if (newPassword.length < 4) {
        messageEl.textContent = 'Password must be at least 4 characters.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      try {
        const result = await apiCall('/api/users?action=changepassword', 'POST', {
          oldPassword,
          newPassword
        });

        if (result.success) {
          messageEl.textContent = 'Password changed successfully!';
          messageEl.className = 'message success';
          messageEl.style.display = 'block';
          form.reset();
        } else {
          messageEl.textContent = result.message || 'Update failed.';
          messageEl.className = 'message error';
          messageEl.style.display = 'block';
        }
      } catch (err) {
        messageEl.textContent = 'Network error. Please try again.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
      }
    });
  </script>
