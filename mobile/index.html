<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/mobile/styles.css">

<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WYK Maths">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<!-- Critical loading CSS：styles.css 抵達前先撐住，避免白屏閃爍 -->
<style>
html,body{margin:0;padding:0;background:#0d1117;color:#e6edf3;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#ml-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1117;z-index:9999}
#ml-loading .ml-box{text-align:center;width:min(280px,80vw)}
#ml-loading .ml-logo{font-size:44px;color:#4a90d9;margin-bottom:16px;opacity:.9}
#ml-loading .ml-title{font-size:15px;font-weight:600;margin-bottom:24px;letter-spacing:.3px}
#ml-loading .ml-bar{height:3px;background:#21262d;border-radius:2px;overflow:hidden;margin-bottom:10px}
#ml-loading .ml-fill{height:100%;width:0;background:#4a90d9;border-radius:2px}
#ml-loading .ml-pct{font-size:11px;color:#6e7681;letter-spacing:.5px;font-family:'SF Mono',Consolas,monospace}
</style>
</head>
<body>

<div id="ml-loading">
  <div class="ml-box">
    <div class="ml-logo"><i class="fas fa-cube"></i></div>
    <div class="ml-title">WYK Maths Team</div>
    <div class="ml-bar"><div class="ml-fill" id="mlFill"></div></div>
    <div class="ml-pct" id="mlPct">0%</div>
  </div>
</div>

<div id="ml-root"></div>

<script src="/mobile/script.js"></script>
</body>
</html>
