<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  if (localStorage.getItem('pageTransition') === 'off') return;
  if (sessionStorage.getItem('__pt') !== 'in') return;
  // ⭐ 铺的是"遮罩色"，不是页面底色
  document.documentElement.style.background = (t === 'dark' ? '#000000' : '#1a237e');
}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/pageload.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<script>
// 早期套用主題，避免白閃
(function(){
  try {
    var raw = localStorage.getItem('mobile_settings_v1');
    var t = 'dark';
    if (raw) {
      var s = JSON.parse(raw).v;
      if (s && s.theme) {
        t = s.theme === 'auto'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : s.theme;
      }
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="stylesheet" href="/mobile/styles.css">

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WYK Maths">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/mobile/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0d1117;color:#e6edf3}
html[data-theme="light"]{background:#f5f7fa;color:#1a1a2e}
#ml-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1117;z-index:9999}
html[data-theme="light"] #ml-loading{background:#f5f7fa}
#ml-loading .ml-box{text-align:center;width:min(280px,80vw)}
#ml-loading .ml-logo{font-size:44px;color:#4a90d9;margin-bottom:16px;opacity:.9}
#ml-loading .ml-title{font-size:15px;font-weight:600;margin-bottom:24px;letter-spacing:.3px}
#ml-loading .ml-bar{height:3px;background:#21262d;border-radius:2px;overflow:hidden;margin-bottom:10px}
html[data-theme="light"] #ml-loading .ml-bar{background:#e3e8ef}
#ml-loading .ml-fill{height:100%;width:0;background:#4a90d9;border-radius:2px}
#ml-loading .ml-pct{font-size:11px;color:#6e7681;letter-spacing:.5px;font-family:'SF Mono',Consolas,monospace}
</style>
</head>
<body>

<div id="ml-loading">
  <div class="ml-box">
    <div class="ml-logo"><i class="fas fa-cube"></i></div>
    <div class="ml-title">WYK Maths Team</div>
    <div class="ml-bar"><div class="ml-fill" id="mlFill"></div></div>
    <div class="ml-pct" id="mlPct">0%</div>
  </div>
</div>

<div id="ml-root"></div>

<script src="/mobile/script.js"></script>
</body>
</html>
