  <style>
    .pkb-page {
      min-height: calc(100vh - 64px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.2rem;
    }
    .pkb-board {
      width: 100%; max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.6rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
    }

    /* ── 顶部：计时 + 奖池 ── */
    .pkb-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem;
    }
    .pkb-timer {
      font-size: 3rem; font-weight: 800; line-height: 1;
      font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    }
    .pkb-timer.warn { color: #e3a008; }
    .pkb-timer.danger { color: #e74c3c; animation: pkbPulse 1s ease-in-out infinite; }
    @keyframes pkbPulse { 0%,100%{opacity:1} 50%{opacity:.55} }
    .pkb-moneys { text-align: right; font-size: .85rem; color: var(--text-secondary); line-height: 1.7; }
    .pkb-moneys b { color: #2ecc71; font-size: 1.05rem; }

    /* ── 三个色块 ── */
    .pkb-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; }
    @media (max-width: 560px) { .pkb-blocks { grid-template-columns: 1fr; } }

    .pkb-block {
      position: relative;
      border-radius: 12px;
      padding: 1rem .8rem .85rem;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      min-height: 128px;
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
    }
    .pkb-block:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.16); }
    .pkb-block:active { transform: translateY(0); }

    /* 状态：未做 / AC / WA / PS */
    .pkb-block.todo { background: rgba(127,127,127,.10); border-color: rgba(127,127,127,.28); }
    .pkb-block.ac   { background: rgba(46,204,113,.16); border-color: #2ecc71; }
    .pkb-block.wa   { background: rgba(231,76,60,.14);  border-color: #e74c3c; }
    .pkb-block.ps   { background: rgba(227,160,8,.16);  border-color: #e3a008; }

    .pkb-block .qname {
      font-size: .72rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-secondary);
    }
    .pkb-block.ac .qname { color: #1e8449; }
    .pkb-block.wa .qname { color: #c0392b; }
    .pkb-block.ps .qname { color: #b9770e; }
    [data-theme="dark"] .pkb-block.ac .qname,
    [data-theme="dark"] .pkb-block.wa .qname,
    [data-theme="dark"] .pkb-block.ps .qname { color: inherit; opacity: .85; }

    .pkb-block .value {
      font-size: 1.55rem; font-weight: 800;
      font-variant-numeric: tabular-nums; line-height: 1.1;
    }
    .pkb-block.todo .value { color: var(--text-secondary); font-size: 1.2rem; }
    .pkb-block .unit {
      font-size: .68rem; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .pkb-block .at { font-size: .72rem; color: var(--text-secondary); }

    /* ── 双方状态条 ── */
    .pkb-vs {
      display: flex; align-items: center; gap: 1rem;
      margin-top: 1.5rem; padding-top: 1.2rem;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .pkb-side { flex: 1 1 200px; min-width: 0; }
    .pkb-side .who {
      font-weight: 700; font-size: .95rem;
      display: flex; align-items: center; gap: .45rem;
    }
    .pkb-side .who .me { font-size: .7rem; padding: 1px 7px; border-radius: 8px; background: var(--accent); color: #fff; }
    .pkb-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .12s ease, color .12s ease;
    }
    .pkb-link:hover { border-bottom-color: currentColor; color: var(--accent); }
    .pkb-side .meta { font-size: .78rem; color: var(--text-secondary); margin-top: 3px; }
    .pkb-side .pips { display: flex; gap: 5px; margin-top: 7px; }
    .pkb-side .pip {
      width: 100%; height: 7px; border-radius: 4px; background: rgba(127,127,127,.22);
    }
    .pkb-side .pip.ac { background: #2ecc71; }
    .pkb-side .pip.wa { background: #e74c3c; }
    .pkb-side .pip.ps { background: #e3a008; }

    /* ── 底部：宣布结束 ── */
    .pkb-footer {
      display: flex; align-items: center; gap: .8rem;
      margin-top: 1.4rem; flex-wrap: wrap;
    }
    .pkb-endbtn {
      padding: .6rem 1.4rem; border-radius: 8px; font-weight: 700;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--text-primary); cursor: pointer; font-size: .88rem;
    }
    .pkb-endbtn.armed {
      background: #e3a008; border-color: #e3a008; color: #1a1a1a;
    }
    .pkb-endbtn:disabled { opacity: .5; cursor: not-allowed; }
    .pkb-endnote { font-size: .82rem; color: var(--text-secondary); }
    .pkb-endnote.opp { color: #e3a008; font-weight: 600; }

    .pkb-hint {
      margin-top: 1rem; font-size: .76rem; color: var(--text-secondary);
      line-height: 1.6;
    }
    .pkb-err {
      background: rgba(231,76,60,.08); border: 1px solid rgba(231,76,60,.4);
      border-radius: 10px; padding: 1rem; color: #e74c3c; font-size: .88rem;
    }
  </style>
</head>
