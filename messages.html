<style>
  /* 这个页面要刚好占满可视区：抵消 .main-content 的 28/32px padding，
     否则 100vh 的聊天区再加 padding 就会把整页撑出滚动条 */
  #mainContent {
    padding: 0;
    min-height: 0;
    /* vh 在手机上把地址栏也算进去，导致底部被裁且滚不到；
       dvh 跟着可视区变，后面的 @supports 覆盖它 */
    height: calc(100vh - var(--topbar-height, 60px));
    overflow: hidden;
  }
  @supports (height: 100dvh) {
    #mainContent { height: calc(100dvh - var(--topbar-height, 60px)); }
  }

  .chat-layout {
    display: flex; height: 100%; min-height: 0;
    margin: 0; overflow: hidden;
  }

  /* 左：会话列表 */
  .thread-list {
    width: 290px; flex: 0 0 290px; overflow-y: auto;
    border-right: 1px solid var(--border-color); background: var(--card-bg);
  }
  .thread-search { padding: 10px; border-bottom: 1px solid var(--border-color); }
  .thread-search input {
    width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: .84rem;
    border: 1px solid var(--border-color); border-radius: 8px;
    background: var(--bg-color); color: var(--text-primary); position: relative;
  }
  .thread-item {
    display: flex; gap: 10px; align-items: center; padding: 10px 12px;
    cursor: pointer; border-bottom: 1px solid var(--border-color);
    transition: background .12s ease;
  }
  .thread-item:hover { background: rgba(74,144,217,.07); }
  .thread-item.active { background: rgba(74,144,217,.14); }
  .avatar {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .9rem; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, #8e5cf7, #4a90d9);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .thread-meta { flex: 1; min-width: 0; }
  .thread-name { font-weight: 700; font-size: .88rem; color: var(--text-primary); }
  .thread-last {
    font-size: .76rem; color: var(--text-secondary); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thread-unread {
    background: #d93025; color: #fff; border-radius: 10px;
    padding: 1px 7px; font-size: .7rem; font-weight: 700;
  }

  /* 右：聊天窗口 */
  .chat-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border-color); background: var(--card-bg);
  }
  .chat-head .name { font-weight: 700; }
  .chat-head .sub { font-size: .76rem; color: var(--text-secondary); }
  .chat-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--content-bg);
    /* flex 子项默认 min-height:auto 会被内容撑开，溢出后就被父级裁掉；
       显式归零才会真的滚动 */
    min-height: 0;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .chat-empty {
    margin: auto; text-align: center; color: var(--text-secondary);
    font-size: .88rem;
  }
  .bubble-row { display: flex; }
  .bubble-row.mine { justify-content: flex-end; }
  .bubble {
    max-width: 72%; padding: 8px 12px; border-radius: 14px;
    font-size: .88rem; line-height: 1.45; word-break: break-word;
  }
  .bubble-row.mine .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble-row.theirs .bubble {
    background: var(--card-bg); color: var(--text-primary);
    border: 1px solid var(--border-color); border-bottom-left-radius: 4px;
  }
  .bubble-time { font-size: .66rem; opacity: .7; margin-top: 3px; display: block; }
  .bubble a.chip-link, .bubble span.chip-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
    border-radius: 8px; font-weight: 700; font-size: .82rem; text-decoration: none;
    background: rgba(39,165,103,.16); color: inherit;
  }
  .bubble-row.theirs .bubble a.chip-link { color: var(--text-primary); }
  .bubble a.chip-link.purple { background: rgba(142,92,247,.18); }

  /* 输入区 */
  .chat-input { border-top: 1px solid var(--border-color); padding: 10px 12px; background: var(--card-bg); }
  .chat-input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chat-input-row + .chat-input-row { margin-top: 8px; }
  .word-block {
    min-width: 70px; padding: 8px 14px; border-radius: 9px; cursor: pointer;
    font-weight: 700; font-size: .84rem; font-family: inherit;
    background: rgba(74,144,217,.12); border: 1px solid rgba(74,144,217,.4);
    color: var(--text-primary);
  }
  .word-block:hover { background: rgba(74,144,217,.22); }
  .chat-input input[type="text"] {
    padding: 7px 10px; border: 1px solid var(--border-color); border-radius: 7px;
    background: var(--bg-color); color: var(--text-primary); font-size: .84rem;
  }
  .chat-input button.plain {
    padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border-color);
    background: var(--card-bg); color: var(--text-primary); cursor: pointer;
    font-size: .8rem; font-weight: 600; font-family: inherit;
  }
  .chat-input button.plain:hover { border-color: var(--accent); }
  .cost-note { font-size: .72rem; color: var(--text-secondary); margin-left: auto; }

  /* 下拉候选 */
  .ac-wrap { position: relative; }
  .ac-dropdown {
    display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 60;
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 220px; overflow: auto; margin-top: 4px;
    max-width: 100%;
  }
  /* 位于页面底部时向上弹，避免被裁掉 */
  .ac-dropdown.ac-up { top: auto; bottom: 100%; margin-top: 0; margin-bottom: 4px; }
  .ac-dropdown .ac-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: .82rem; }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: rgba(74,144,217,.12); }

  .back-btn { display: none; }

  @media (max-width: 760px) {
    .chat-layout { flex-direction: column; height: 100%; min-height: 0; }
    /* 手机上必须让列表自己滚：flex 子项默认 min-height:auto，会被内容撑开又把
       溢出裁掉，表现就是「滑不动」 */
    .thread-list {
      width: 100%; flex: 1 1 auto; border-right: none;
      min-height: 0; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .chat-pane { display: none; min-height: 0; }
    .chat-body { min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .chat-layout.chat-open .thread-list { display: none; }
    .chat-layout.chat-open .chat-pane { display: flex; }
    .back-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border-color);
      background: transparent; color: var(--text-primary); cursor: pointer;
    }
  }
</style>
</head>

  <script src="/assets/js/sidebar.js?v=fce35aa1"></script>

  <script>
    Page.boot({ title: 'Messages', requireAuth: true, skeleton: true });
    Page.ready(async (user) => {
      const me = (user && user.username) || '';
      const esc = (s) => (window.DSHUI && DSHUI.esc) ? DSHUI.esc(s)
        : String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const safeId = (s) => /^[A-Za-z0-9_-]{1,64}$/.test(String(s || '')) ? String(s) : '';

      const layout = document.getElementById('chatLayout');
      const threadItems = document.getElementById('threadItems');
      const chatBody = document.getElementById('chatBody');
      const chatInput = document.getElementById('chatInput');
      const peerName = document.getElementById('peerName');
      const peerSub = document.getElementById('peerSub');
      const peerAvatar = document.getElementById('peerAvatar');
      let currentPeer = null;
      let currentPeerInfo = null;

      function avatarHtml(name, pfp) {
        if (pfp) return '<img src="' + esc(pfp) + '" alt="">';
        return esc(String(name || '?').trim().charAt(0).toUpperCase() || '?');
      }

      function previewText(t) {
        if (t.lastKind === 'text') return t.lastText || '';
        if (t.lastKind === 'problem') return '📄 Problem card';
        if (t.lastKind === 'submission') return '📤 Submission card';
        if (t.lastKind === 'pk-invite') return '⚔ PK challenge';
        if (t.lastKind === 'pk-accept') return '⚔ PK accepted';
        return 'Message';
      }

      // ── 会话列表 ──
      async function loadThreads() {
        try {
          const res = await API.get('/api/messages?action=threads');
          const threads = (res && res.threads) || [];
          if (!threads.length) {
            threadItems.innerHTML = '<div class="chat-empty" style="padding:26px 12px;font-size:.82rem;">No conversations yet.<br>Search a name above to start one.</div>';
            return;
          }
          threadItems.innerHTML = threads.map((t) => {
            const active = currentPeer === t.peer ? ' active' : '';
            return '<div class="thread-item' + active + '" data-peer="' + esc(t.peer) + '">'
              + '<div class="avatar">' + avatarHtml(t.displayName, t.pfp) + '</div>'
              + '<div class="thread-meta">'
              + '<div class="thread-name">' + esc(t.displayName) + '</div>'
              + '<div class="thread-last">' + esc(previewText(t)) + '</div>'
              + '</div>'
              + (t.unread ? '<span class="thread-unread">' + t.unread + '</span>' : '')
              + '</div>';
          }).join('');
          threadItems.querySelectorAll('.thread-item').forEach((el) => {
            el.addEventListener('click', () => openThread(el.dataset.peer));
          });
        } catch (e) {
          threadItems.innerHTML = '<div class="chat-empty" style="padding:20px;color:var(--danger);">Failed to load.</div>';
        }
      }

      // ── 单条消息气泡 ──
      function bubbleHtml(m) {
        const mine = m.from === me;
        let inner = '';

        if (m.kind === 'text') {
          inner = esc(m.text || '');
        } else if (m.kind === 'problem' && safeId(m.problemId)) {
          inner = '<a class="chip-link" href="/problems/' + encodeURIComponent(m.problemId) + '">'
            + '<i class="fas fa-file-lines"></i> Problem ' + esc(m.problemId) + '</a>';
        } else if (m.kind === 'submission' && safeId(m.submissionId)) {
          inner = '<a class="chip-link" href="/submissions/' + encodeURIComponent(m.submissionId) + '/detail">'
            + '<i class="fas fa-paper-plane"></i> Submission</a>';
        } else if (m.kind === 'pk-invite' || m.kind === 'pk-accept') {
          const room = safeId(m.roomId);
          const label = m.kind === 'pk-invite' ? 'PK challenge' : 'PK accepted';
          inner = room
            ? '<a class="chip-link purple" href="/pk-bet-room?id=' + encodeURIComponent(room) + '">'
              + '<i class="fas fa-swords"></i> ' + label + ' · open room</a>'
            : '<span class="chip-link purple"><i class="fas fa-swords"></i> ' + label + '</span>';
        } else {
          inner = esc(m.content || '');
        }

        const time = m.createdAt ? new Date(m.createdAt).toLocaleString() : '';
        return '<div class="bubble-row ' + (mine ? 'mine' : 'theirs') + '">'
          + '<div class="bubble">' + inner + '<span class="bubble-time">' + esc(time) + '</span></div>'
          + '</div>';
      }

      // 每个会话只保留一页，往上滚再补更早的
      const thread = { peer: null, oldestAt: null, hasMore: false, loading: false };

      function renderFirstPage(msgs, hasMore) {
        thread.hasMore = !!hasMore;
        thread.oldestAt = msgs.length ? msgs[0].createdAt : null;
        chatBody.innerHTML = msgs.length
          ? msgs.map(bubbleHtml).join('')
          : '<div class="chat-empty">No messages yet.</div>';
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      async function loadOlder() {
        if (!thread.hasMore || thread.loading || !thread.oldestAt) return;
        thread.loading = true;
        const prevHeight = chatBody.scrollHeight;
        try {
          const res = await API.get('/api/messages?action=thread&with=' + encodeURIComponent(thread.peer)
            + '&before=' + encodeURIComponent(thread.oldestAt));
          const older = (res && res.messages) || [];
          if (older.length) {
            chatBody.insertAdjacentHTML('afterbegin', older.map(bubbleHtml).join(''));
            thread.oldestAt = older[0].createdAt;
            // 保持视觉位置不跳
            chatBody.scrollTop = chatBody.scrollHeight - prevHeight;
          }
          thread.hasMore = !!(res && res.hasMore);
        } catch (e) { /* 静默，下次滚动再试 */ }
        thread.loading = false;
      }

      chatBody.addEventListener('scroll', () => {
        if (chatBody.scrollTop < 80) loadOlder();
      });

      function appendBubble(m) {
        if (!m) return;
        const placeholder = chatBody.querySelector('.chat-empty');
        if (placeholder) placeholder.remove();
        chatBody.insertAdjacentHTML('beforeend', bubbleHtml(m));
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      async function openThread(peer) {
        currentPeer = peer;
        layout.classList.add('chat-open');
        threadItems.querySelectorAll('.thread-item').forEach((el) => {
          el.classList.toggle('active', el.dataset.peer === peer);
        });
        chatBody.innerHTML = '<div class="chat-empty">Loading…</div>';
        thread.peer = peer;
        thread.oldestAt = null;
        thread.hasMore = false;

        try {
          const res = await API.get('/api/messages?action=thread&with=' + encodeURIComponent(peer));
          currentPeerInfo = res.peer || null;
          peerName.textContent = (res.peer && res.peer.displayName) || peer;
          peerSub.textContent = peer === 'system' ? 'system notifications' : (peer || '');
          peerAvatar.innerHTML = avatarHtml((res.peer && res.peer.displayName) || peer, res.peer && res.peer.pfp);

          renderFirstPage(res.messages || [], res.hasMore);

          // 系统会话不允许发消息
          chatInput.style.display = peer === 'system' ? 'none' : '';
          loadThreads();
        } catch (e) {
          chatBody.innerHTML = '<div class="chat-empty" style="color:var(--danger);">Failed to open conversation.</div>';
        }
      }

      // ── 发送 ──
      async function send(payload) {
        if (!currentPeer || currentPeer === 'system') return;
        try {
          const res = await API.post('/api/messages', Object.assign({ to: currentPeer }, payload));
          if (!res || !res.success) throw new Error((res && res.message) || 'Send failed');
          appendBubble(res.message);            // 只追加这一条，不重拉
          // 直接用后端返回的余额刷新顶栏，不再单独请求 /api/token
          if (window.updateTopbarTokens && res.tokens) {
            window.updateTopbarTokens(res.tokens.daily, res.tokens.global);
          }
          loadThreads();                        // 侧栏摘要轻量刷新
          DSHUI.toast('Sent · ' + (res.cost || 1000) + ' tokens', 'ok');
          // 清空题目/提交输入
          const pid = document.getElementById('sendProblemId');
          const sid = document.getElementById('sendSubId');
          if (pid && payload.kind === 'problem') pid.value = '';
          if (sid && payload.kind === 'submission') sid.value = '';
        } catch (e) {
          DSHUI.toast(e.message || 'Send failed', 'err');
        }
      }

      document.querySelectorAll('#chatInput [data-word]').forEach((btn) => {
        btn.addEventListener('click', () => send({ kind: 'text', text: btn.dataset.word }));
      });
      document.getElementById('sendProblemBtn').addEventListener('click', () => {
        const pid = (document.getElementById('sendProblemId').value || '').trim();
        if (!pid) { DSHUI.toast('Enter a problem ID', 'err'); return; }
        send({ kind: 'problem', problemId: pid });
      });
      document.getElementById('sendSubBtn').addEventListener('click', () => {
        const sid = (document.getElementById('sendSubId').value || '').trim();
        if (!sid) { DSHUI.toast('Enter a submission ID', 'err'); return; }
        send({ kind: 'submission', submissionId: sid });
      });

      // ── 发起新会话：搜人 ──
      const newTo = document.getElementById('newTo');
      const newToDrop = document.getElementById('newToDrop');
      let toTimer = null, toActive = -1;
      newTo.addEventListener('input', () => {
        const kw = newTo.value.trim();
        clearTimeout(toTimer);
        if (!kw) { newToDrop.style.display = 'none'; return; }
        toTimer = setTimeout(async () => {
          try {
            const res = await API.get('/api/search?action=search_user&keyword=' + encodeURIComponent(kw));
            const list = (res && res.data) || [];
            toActive = -1;
            newToDrop.innerHTML = list.length
              ? list.slice(0, 20).map((u) => '<div class="ac-item" data-val="' + esc(u.username) + '"><strong>'
                  + esc(u.username) + '</strong>'
                  + (u.displayName && u.displayName !== u.username ? ' — ' + esc(u.displayName) : '')
                  + (u.realName ? ' <span style="color:var(--text-secondary);">(' + esc(u.realName) + ')</span>' : '')
                  + '</div>').join('')
              : '<div class="ac-item" style="color:var(--text-secondary);">No results</div>';
            newToDrop.style.display = 'block';
          } catch (e) { newToDrop.style.display = 'none'; }
        }, 250);
      });
      newToDrop.addEventListener('click', (e) => {
        const item = e.target.closest('.ac-item[data-val]');
        if (!item) return;
        newTo.value = '';
        newToDrop.style.display = 'none';
        openThread(item.dataset.val);
      });
      newTo.addEventListener('keydown', (e) => {
        const items = newToDrop.querySelectorAll('.ac-item[data-val]');
        if (!items.length || newToDrop.style.display === 'none') return;
        if (e.key === 'ArrowDown') { e.preventDefault(); toActive = (toActive + 1) % items.length; }
        else if (e.key === 'ArrowUp') { e.preventDefault(); toActive = (toActive - 1 + items.length) % items.length; }
        else if (e.key === 'Enter' && toActive >= 0 && items[toActive]) { e.preventDefault(); items[toActive].click(); }
        else if (e.key === 'Escape') { newToDrop.style.display = 'none'; }
        items.forEach((it, i) => it.classList.toggle('active', i === toActive));
      });

      // ── 题目搜索 ──
      const probInput = document.getElementById('sendProblemId');
      const probDrop = document.getElementById('sendProbDrop');
      let probTimer = null, probActive = -1;
      probInput.addEventListener('input', () => {
        const kw = probInput.value.trim();
        clearTimeout(probTimer);
        if (!kw) { probDrop.style.display = 'none'; return; }
        probTimer = setTimeout(async () => {
          try {
            const res = await API.get('/api/search?action=search_prob&keyword=' + encodeURIComponent(kw));
            const list = (res && res.data) || [];
            probActive = -1;
            probDrop.innerHTML = list.length
              ? list.slice(0, 20).map((p) => '<div class="ac-item" data-val="' + esc(p.id) + '"><strong>'
                  + esc(p.id) + '</strong> — ' + esc(p.name || '') + '</div>').join('')
              : '<div class="ac-item" style="color:var(--text-secondary);">No results</div>';
            probDrop.style.display = 'block';
          } catch (e) { probDrop.style.display = 'none'; }
        }, 250);
      });
      probDrop.addEventListener('click', (e) => {
        const item = e.target.closest('.ac-item[data-val]');
        if (!item) return;
        probInput.value = item.dataset.val;
        probDrop.style.display = 'none';
      });
      probInput.addEventListener('keydown', (e) => {
        const items = probDrop.querySelectorAll('.ac-item[data-val]');
        if (!items.length || probDrop.style.display === 'none') return;
        if (e.key === 'ArrowDown') { e.preventDefault(); probActive = (probActive + 1) % items.length; }
        else if (e.key === 'ArrowUp') { e.preventDefault(); probActive = (probActive - 1 + items.length) % items.length; }
        else if (e.key === 'Enter' && probActive >= 0 && items[probActive]) { e.preventDefault(); items[probActive].click(); }
        else if (e.key === 'Escape') { probDrop.style.display = 'none'; }
        items.forEach((it, i) => it.classList.toggle('active', i === probActive));
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        layout.classList.remove('chat-open');
      });

      loadThreads();
      Page.hideSkeleton();
    });
  </script>
