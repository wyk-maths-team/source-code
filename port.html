<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port · DSE Practice</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="/assets/css/port.css">
<script src="/assets/js/core/ui.js"></script>
<script src="/assets/js/core/net.js"></script>
<script src="/assets/js/core/api.js"></script>
<script src="/assets/js/core/page.js"></script>
<style>
  :root {
    --port-bg: #0a0a0a;
    --port-panel: #141414;
    --port-border: #2a2a2a;
    --port-accent: #4a90d9;
  }
  body { margin: 0; font-family: -apple-system, sans-serif; background: var(--port-bg); color: #fff; display: flex; height: 100vh; overflow: hidden; }
  
  /* 左侧题目列表 */
  .sidebar { width: 280px; background: var(--port-panel); border-right: 1px solid var(--port-border); display: flex; flex-direction: column; }
  .sb-header { padding: 16px; border-bottom: 1px solid var(--port-border); }
  .sb-header select, .sb-header input { width: 100%; padding: 8px; margin-bottom: 8px; background: #000; border: 1px solid var(--port-border); color: #fff; border-radius: 4px; box-sizing: border-box; }
  .sb-list { flex: 1; overflow-y: auto; }
  .sb-item { padding: 12px 16px; border-bottom: 1px solid var(--port-border); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
  .sb-item:hover { background: rgba(255,255,255,0.05); }
  .sb-item.active { border-left: 3px solid var(--port-accent); background: rgba(74,144,217,0.1); }
  .sb-item .status-pass { color: #2ecc71; font-weight: bold; }
  
  /* 右侧主内容区 */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .mc-header { padding: 12px 24px; border-bottom: 1px solid var(--port-border); display: flex; justify-content: space-between; align-items: center; background: var(--port-panel); }
  .mc-header h2 { margin: 0; font-size: 16px; }
  
  /* 题目展示区 */
  .problem-view { flex: 1; padding: 24px; overflow-y: auto; }
  .problem-statement { font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
  
  /* 提交区 */
  .submit-area { height: 40%; min-height: 250px; border-top: 1px solid var(--port-border); background: var(--port-panel); display: flex; flex-direction: column; }
  .submit-toolbar { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--port-border); font-size: 12px; color: #888; }
  .submit-textarea { flex: 1; width: 100%; background: transparent; border: none; color: #fff; padding: 16px; font-family: monospace; font-size: 14px; resize: none; outline: none; box-sizing: border-box; }
  .submit-footer { padding: 12px 16px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--port-border); }
  
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-family: inherit; transition: 0.2s; }
  .btn-primary { background: var(--port-accent); color: #fff; }
  .btn-primary:hover { background: #3a7bc8; }
  .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
  .btn-admin { background: #e74c3c; color: #fff; font-size: 12px; display: none; }
  
  /* 批改结果面板 */
  .result-panel { padding: 20px; background: rgba(46, 204, 113, 0.05); border: 1px solid #2ecc71; border-radius: 8px; margin-top: 20px; display: none; }
  .result-header { font-size: 24px; font-weight: bold; color: #2ecc71; margin-bottom: 12px; }
  .result-warning { color: #f1c40f; font-size: 13px; margin-bottom: 12px; background: rgba(241,196,15,0.1); padding: 8px; border-radius: 4px; }
  .result-comment { line-height: 1.6; font-size: 14px; }
  
  /* 弹窗 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-box { background: var(--port-panel); padding: 24px; border-radius: 8px; width: 600px; max-width: 90%; border: 1px solid var(--port-border); }
  .modal-box textarea, .modal-box input { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 10px; margin-bottom: 12px; border-radius: 4px; box-sizing: border-box; }
</style>
</head>
<body>

  <!-- 左侧题目列表 -->
  <aside class="sidebar">
    <div class="sb-header">
      <select id="subjectSelect">
        <option value="maths">Mathematics</option>
        <option value="m2">M2</option>
        <option value="phy">Physics</option>
        <option value="chem">Chemistry</option>
        <option value="bio">Biology</option>
        <option value="chin">中文</option>
        <option value="eng">English</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search ID or Keyword...">
    </div>
    <div class="sb-list" id="problemList"></div>
  </aside>

  <!-- 右侧主区域 -->
  <main class="main-content">
    <header class="mc-header">
      <h2 id="headerTitle">Select a problem</h2>
      <div>
        <button class="btn btn-admin" id="adminBtn" onclick="openAdminModal()"><i class="fas fa-cog"></i> Manage Problems</button>
        <span id="headerScore" style="font-weight:bold; color:#888; margin-left: 16px;"></span>
      </div>
    </header>

    <div class="problem-view" id="problemView">
      <div style="text-align:center; margin-top:100px; color:#555;">
        <i class="fas fa-book-open" style="font-size:48px; margin-bottom:16px;"></i>
        <p>Select a problem from the sidebar to start practicing.</p>
      </div>
    </div>

    <div class="submit-area" id="submitArea" style="display: none;">
      <div class="submit-toolbar">
        <span>Autosave enabled</span>
        <span id="draftStatus">Ready</span>
      </div>
      <textarea class="submit-textarea" id="stepsInput" placeholder="Write your solution steps here... (Markdown + LaTeX supported)"></textarea>
      <div class="submit-footer">
        <button class="btn btn-primary" id="submitBtn">Submit for AI Grading</button>
      </div>
    </div>
  </main>

  <!-- Admin 弹窗 -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3>Manage Problem</h3>
      <input type="text" id="adminPid" placeholder="Problem ID (e.g. M2-001)" readonly style="opacity: 0.6;">
      <input type="number" id="adminMaxScore" placeholder="Max Score">
      <textarea id="adminStatement" rows="5" placeholder="Problem Statement (Markdown/LaTeX)"></textarea>
      <textarea id="adminAnswer" rows="5" placeholder="Reference Answer / Marking Scheme"></textarea>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn" onclick="document.getElementById('adminModal').style.display='none'">Cancel</button>
        <button class="btn btn-primary" onclick="saveProblem()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/page/port.js"></script>
</body>
</html>
