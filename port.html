<!DOCTYPE html>
<html lang="en">
<head>
<script id="auth-gate">(function(){try{if(!localStorage.getItem("auth_token")){document.documentElement.style.display="none";location.replace("/index.html");}}catch(e){document.documentElement.style.display="none";location.replace("/index.html");}})();</script>
<meta name="robots" content="noindex, nofollow" />
<script>window.__BUILD_V='3d384dc4';</script>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('theme')||'light';if (t === 'dark' || t === 'scifi') document.documentElement.setAttribute('data-theme', t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port · WYK Maths</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- ⭐ 修复评语不渲染的问题 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="/assets/css/port.css?v=3d384dc4">
<script src="/assets/js/core/ui.js?v=3d384dc4"></script>
<script src="/assets/js/core/net.js?v=3d384dc4"></script>
<script src="/assets/js/core/api.js?v=3d384dc4"></script>
<script src="/assets/js/core/page.js?v=3d384dc4"></script>
<style>
  /* 左侧列表项美化 */
  .sb-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--port-border);
    cursor: pointer;
    transition: all 0.15s;
  }
  .sb-item:hover {
    background: rgba(255,255,255,0.03);
  }
  .sb-item.active {
    background: rgba(74,144,217,0.1);
    border-left: 3px solid var(--port-accent);
  }
</style>
</head>
<body>
  <header class="port-topbar">
    <div class="ptb-left">
      <i class="fas fa-terminal"></i>
      <span>Port</span>
    </div>
    <nav class="ptb-nav">
      <button class="ptb-tab active" data-view="tasks"><i class="fas fa-list-check"></i> Tasks</button>
      <button class="ptb-tab" data-view="submissions"><i class="fas fa-inbox"></i> Submissions</button>
      <button class="ptb-tab" data-view="settings"><i class="fas fa-cog"></i></button>
    </nav>
    <div class="ptb-right">
      <button id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <main class="port-main">
    <!-- 任务视图 -->
    <section class="port-view" id="view-tasks">
      <div class="task-sidebar">
        <div class="sidebar-block">
          <label>Subject</label>
          <select id="subjectSelect">
            <option value="maths">Mathematics</option>
            <option value="m2">M2</option>
            <option value="phy">Physics</option>
            <option value="chem">Chemistry</option>
            <option value="bio">Biology</option>
            <option value="chin">中文</option>
            <option value="eng">English</option>
          </select>
        </div>
        <div class="sidebar-block sidebar-search">
          <label>Search</label>
          <input type="text" id="searchInput" placeholder="ID or keyword…">
        </div>
        <div class="problem-list" id="problemList"></div>
        <div class="sidebar-footer">
          <span id="problemCount">— problems</span>
        </div>
      </div>

      <div class="task-canvas">
        <div id="problemEmpty" class="empty-state">
          <i class="fas fa-book-open"></i>
          <h3>Select a problem</h3>
          <p>Pick from the list on the left to start.</p>
        </div>

        <div id="problemPanel" class="problem-panel" hidden>
          <div class="pp-header">
            <div class="pp-header-left">
              <span class="pp-id" id="ppId"></span>
              <span class="pp-chapter" id="ppChapter"></span>
              <span class="pp-source" id="ppSource"></span>
            </div>
            <div class="pp-header-right">
              <span class="pp-maxscore" id="ppMaxScore"></span>
            </div>
          </div>
          <div class="pp-body">
            <div class="pp-section">
              <div class="pp-label">Problem</div>
              <div class="pp-statement" id="ppStatement"></div>
            </div>
            <!-- ⭐ 恢复的折叠参考答案 -->
            <details class="pp-answer-wrap">
              <summary>Show reference answer</summary>
              <div class="pp-answer" id="ppAnswer"></div>
            </details>
          </div>
        </div>

        <div class="submit-panel">
          <div class="sp-tabs">
            <button class="sp-tab active" data-mode="steps"><i class="fas fa-pen"></i> Steps</button>
            <div class="sp-tabs-right">
              <span class="sp-draft-indicator" id="draftIndicator"></span>
            </div>
          </div>

          <div class="sp-pane" data-pane="steps">
            <textarea id="stepsInput" placeholder="Write your solution here (max 10000 chars)…" maxlength="10000"></textarea>
            <div class="sp-counter">
              <span id="stepsCount">0</span> / 10000
              <button class="sp-clear" id="clearSteps" title="Clear"><i class="fas fa-trash"></i></button>
            </div>
          </div>

          <div class="result-panel" id="resultPanel" hidden>
            <div class="result-header">
              <div class="result-score" id="resultScore"></div>
              <button class="result-close" id="resultClose" title="Close"><i class="fas fa-times"></i></button>
            </div>
            <div class="result-warning" id="resultWarning" style="display:none; color:#f1c40f; margin-bottom:10px; font-size:13px;"></div>
            <div class="result-comment" id="resultComment"></div>
          </div>

          <div class="sp-footer">
            <span class="sp-status" id="submitStatus"></span>
            <button id="submitBtn" disabled>
              <i class="fas fa-paper-plane"></i> Submit
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 提交记录视图 -->
    <section class="port-view" id="view-submissions" hidden>
      <div class="subs-header">
        <h2>My Submissions</h2>
        <div class="subs-filters">
          <select id="subsSubject">
            <option value="">All subjects</option>
            <option value="chin">中文</option>
            <option value="eng">English</option>
            <option value="maths">Mathematics</option>
            <option value="m2">M2</option>
            <option value="phy">Physics</option>
            <option value="chem">Chemistry</option>
            <option value="bio">Biology</option>
          </select>
          <button id="subsRefresh"><i class="fas fa-rotate"></i></button>
        </div>
      </div>
      <div class="subs-list" id="subsList"></div>
      <div class="pagination" id="subsPagination" hidden>
        <button class="pg-btn" id="pgPrev"><i class="fas fa-chevron-left"></i> Prev</button>
        <div class="pg-pages" id="pgPages"></div>
        <button class="pg-btn" id="pgNext">Next <i class="fas fa-chevron-right"></i></button>
      </div>
    </section>

    <!-- 设置视图 -->
    <section class="port-view" id="view-settings" hidden>
      <div class="settings-card">
        <h3><i class="fas fa-link"></i> DeepSeek Chat URL</h3>
        <p>每次提交前，Bridge 會跳到這個對話。批改完請在 DeepSeek 開新對話並更新這裡。</p>
        <input type="url" id="chatUrlInput" placeholder="https://chat.deepseek.com/a/chat/s/…">
        <div class="settings-actions">
          <button id="chatUrlSave">Save</button>
          <span id="chatUrlStatus"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- Admin 弹窗 (Root Only) -->
  <div id="adminModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#141414; border:1px solid #333; padding:24px; border-radius:8px; width:600px; max-width:90%;">
      <h3 style="margin-top:0; color:#fff;">Manage Problem</h3>
      <input type="text" id="adminPid" readonly style="width:100%; margin-bottom:10px; padding:8px; background:#000; color:#888; border:1px solid #333; box-sizing:border-box;">
      <input type="number" id="adminMaxScore" placeholder="Max Score" style="width:100%; margin-bottom:10px; padding:8px; background:#000; color:#fff; border:1px solid #333; box-sizing:border-box;">
      <textarea id="adminStatement" rows="4" style="width:100%; margin-bottom:10px; padding:8px; background:#000; color:#fff; border:1px solid #333; box-sizing:border-box;" placeholder="Problem Statement"></textarea>
      <textarea id="adminAnswer" rows="4" style="width:100%; margin-bottom:10px; padding:8px; background:#000; color:#fff; border:1px solid #333; box-sizing:border-box;" placeholder="Reference Answer"></textarea>
      <div style="text-align:right;">
        <button onclick="document.getElementById('adminModal').style.display='none'" style="padding:8px 16px; background:#333; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-right:10px;">Cancel</button>
        <button onclick="saveProblem()" style="padding:8px 16px; background:#4a90d9; color:#fff; border:none; border-radius:4px; cursor:pointer;">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/auth.js?v=3d384dc4"></script>
  <script src="/assets/js/app.js?v=3d384dc4"></script>
  <script src="/assets/js/port.js?v=3d384dc4"></script>
<script src="/assets/js/pk-notify.js?v=3d384dc4"></script>
</body>
</html>
