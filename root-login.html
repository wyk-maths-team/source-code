<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Root Login - WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  .root-login-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .root-login-card {
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    text-align: center;
  }
  .root-login-icon {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    background: radial-gradient(circle at 30% 30%, #e74c3c, #a02c1f);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; color: #fff;
    box-shadow: 0 8px 24px rgba(231,76,60,.4);
  }
  .root-login-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
  .root-login-sub   { font-size: .88rem; color: var(--text-secondary); margin-bottom: 26px; }
  .root-login-input {
    width: 100%; padding: 14px 16px;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    background: var(--card-bg); color: var(--text-primary);
    font-family: 'Consolas', monospace; font-size: .9rem;
    box-sizing: border-box;
    margin-bottom: 16px;
  }
  .root-login-input:focus { outline: none; border-color: var(--accent); }
  .root-login-btn {
    width: 100%; padding: 14px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    font-weight: 700; font-size: 1rem;
    cursor: pointer; transition: filter .15s;
    font-family: inherit;
  }
  .root-login-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .root-login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .root-login-msg { font-size: .88rem; margin-top: 16px; min-height: 1.2em; }
  .root-login-hint {
    font-size: .75rem; color: var(--text-secondary);
    margin-top: 24px; line-height: 1.6; text-align: left;
    padding: 12px 16px;
    background: rgba(74,144,217,.05);
    border: 1px solid var(--border-color);
    border-radius: 8px;
  }
</style>
</head>
<body class="index-body">
  <div class="root-login-wrap">
    <div class="root-login-card">
      <div class="root-login-icon"><i class="fas fa-crown"></i></div>
      <div class="root-login-title">Root Access</div>
      <div class="root-login-sub">Pre-shared secret required</div>

      <form id="rootLoginForm">
        <input
          type="password"
          class="root-login-input"
          id="rootSecret"
          placeholder="Paste your secret"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <button type="submit" class="root-login-btn" id="rootLoginBtn">
          <i class="fas fa-sign-in-alt"></i> Sign in
        </button>
      </form>

      <div class="root-login-msg" id="rootLoginMsg"></div>

      <div class="root-login-hint">
        <strong>Setup:</strong>
        <ol style="margin: 6px 0 0 18px; padding: 0;">
          <li>Secret is stored in <code>ROOT_LOGIN_SECRETS</code> env var.</li>
          <li>On success, a 365-day token is saved to this browser.</li>
          <li>If a device is lost, rotate the secret and re-login on remaining devices.</li>
        </ol>
      </div>
    </div>
  </div>

  <script src="/auth.js"></script>

  <script>
    // 已登入為 root → 立即跳走
    try {
      const me = getCurrentUser();
      if (me && me.role === 'root') {
        window.location.replace('/');
        throw new Error('already root');
      }
    } catch {}

    const form  = document.getElementById('rootLoginForm');
    const input = document.getElementById('rootSecret');
    const btn   = document.getElementById('rootLoginBtn');
    const msg   = document.getElementById('rootLoginMsg');

    function showMsg(text, color) {
      msg.textContent = text;
      msg.style.color = color || 'var(--text-secondary)';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const secret = input.value.trim();
      if (!secret) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';
      showMsg('');

      try {
        const res = await fetch('/api/root-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret }),
        });
        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('auth_token', data.token);
          showMsg('✓ Success — redirecting…', '#2ecc71');
          setTimeout(() => window.location.replace('/'), 400);
        } else {
          showMsg(data.message || 'Invalid secret', 'var(--danger)');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign in';
          input.select();
        }
      } catch (err) {
        showMsg('Network error: ' + err.message, 'var(--danger)');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign in';
      }
    });
  </script>
</body>
</html>
