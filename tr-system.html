<!DOCTYPE html>
<html lang="zh-HK" translate="no" class="notranslate">
<head>

<script src="/assets/js/arch-render.js"></script>

<meta charset="UTF-8">
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  if (localStorage.getItem('pageTransition') === 'off') return;
  if (sessionStorage.getItem('__pt') !== 'in') return;
  // ⭐ 铺的是"遮罩色"，不是页面底色
  document.documentElement.style.background = (t === 'dark' ? '#0d1117' : '#0f3460');
}catch(e){}})();</script>
<script src="/assets/js/pageload.js" defer></script>
<!-- ⭐ 反翻譯聲明 -->
<meta name="google" content="notranslate">
<meta name="microsoft" content="notranslate">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>TR Training</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<style>
    /* ═══════════════ 反選取 ═══════════════ */
  *,
  *::before,
  *::after {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;   /* iOS 長按菜單 */
    -webkit-tap-highlight-color: transparent;
  }

  /* 允許 input / textarea 正常輸入 */
  input,
  textarea,
  [contenteditable="true"] {
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
  }

  /* 禁止圖片拖拽 */
  img {
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: auto;   /* 保留點擊放大功能 */
  }

  /* ═══════════════ 反翻譯 ═══════════════ */
  /* 隱藏 Google Translate 頂部工具條 */
  .skiptranslate,
  .goog-te-banner-frame,
  #goog-gt-tt,
  .goog-te-balloon-frame,
  .goog-tooltip,
  .goog-tooltip:hover {
    display: none !important;
    visibility: hidden !important;
  }
  /* Google Translate 會把 body 往下推，強制歸零 */
  body {
    top: 0 !important;
  }
  /* Google Translate 翻譯後會把 <font> 包在文字外面，讓它繼承樣式 */
  font {
    background: transparent !important;
    box-shadow: none !important;
    color: inherit !important;
    font: inherit !important;
  }

  /* ═══════════════ 禁止列印 / 另存 ═══════════════ */
  @media print {
    body * {
      display: none !important;
      visibility: hidden !important;
    }
    body::after {
      content: 'Printing is disabled on this page.';
      display: block !important;
      visibility: visible !important;
      font-size: 18px;
      padding: 40px;
      color: #666;
    }
  }
  /* ═══════════════ 對齊 styles.css 的變數 ═══════════════ */
  :root {
    --accent: #4a90d9;
    --accent-hover: #3a7bc8;
    --content-bg: #f0f2f5;
    --card-bg: #ffffff;
    --text-primary: #2c3e50;
    --text-secondary: #6b7d8e;
    --border-color: #e1e5eb;
    --hover-bg: #f7f9fb;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
    --shadow-md: 0 4px 12px rgba(0,0,0,.1);
    --radius-sm: 6px;
    --radius-md: 10px;
    --good: #2e7d32;
    --good-bg: #e8f5e9;
    --bad: #c62828;
    --bad-bg: #ffebee;
    --sidebar-w: 210px;
  }
  :root[data-theme="dark"] {
    --accent: #58a6ff;
    --accent-hover: #1f6feb;
    --content-bg: #0d1117;
    --card-bg: #161b22;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --border-color: #30363d;
    --hover-bg: #21262d;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,.5);
    --good: #56d364;
    --good-bg: #1a3a2a;
    --bad: #f85149;
    --bad-bg: #3a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--content-bg);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
    overflow: hidden; /* 阻止整頁滾動，由內部區域各自滾動 */
  }
  button { font-family: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  /* ═══════════════ 主佈局：左側欄 + 主區 ═══════════════ */
  .tr-layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── 左側欄 ── */
  .tr-sidebar {
    background: var(--card-bg);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tr-sidebar-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .tr-sidebar-title {
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-secondary);
    flex: 1;
  }
  .tr-refresh-btn {
    width: 26px;
    height: 26px;
    border: 1px solid var(--border-color);
    background: transparent;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: .72rem;
    transition: all .15s;
  }
  .tr-refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .tr-refresh-btn.spinning i {
    animation: spin .8s linear infinite;
  }

  .tr-sidebar-filter {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }
  .tr-sidebar-filter input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border-color);
    background: var(--content-bg);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    font-size: .8rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .tr-sidebar-filter input:focus {
    border-color: var(--accent);
    background: var(--card-bg);
  }

  .tr-sidebar-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 0;
  }
  .tr-sidebar-list::-webkit-scrollbar { width: 6px; }
  .tr-sidebar-list::-webkit-scrollbar-thumb {
    background: rgba(150,150,150,.3);
    border-radius: 3px;
  }
  .tr-sidebar-list::-webkit-scrollbar-thumb:hover {
    background: rgba(150,150,150,.5);
  }

  /* ── 側邊欄項目 ── */
  .tr-side-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 14px;
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: .72rem;
    color: var(--text-secondary);
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .1s, border-color .1s, color .1s;
    user-select: none;
    overflow: hidden;
  }
  .tr-side-item:hover {
    background: var(--hover-bg);
    color: var(--text-primary);
  }
  .tr-side-item.active {
    background: rgba(74,144,217,.10);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  :root[data-theme="dark"] .tr-side-item.active {
    background: rgba(88,166,255,.12);
  }
  .tr-side-item.correct {
    color: var(--good);
  }
  .tr-side-item.correct.active {
    background: rgba(46,125,50,.12);
    border-left-color: var(--good);
  }
  .tr-side-item.wrong {
    color: var(--bad);
  }
  .tr-side-item.wrong.active {
    background: rgba(198,40,40,.12);
    border-left-color: var(--bad);
  }
  .tr-side-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-color);
    flex-shrink: 0;
  }
  .tr-side-item.correct .dot { background: var(--good); }
  .tr-side-item.wrong .dot { background: var(--bad); }
  .tr-side-item.active .dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(74,144,217,.6);
  }
  .tr-side-item.correct.active .dot { background: var(--good); box-shadow: 0 0 6px rgba(46,125,50,.6); }
  .tr-side-item.wrong.active .dot { background: var(--bad); box-shadow: 0 0 6px rgba(198,40,40,.6); }

  .tr-side-item .id {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  /* ── 主區 ── */
  .tr-main {
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  .tr-main::-webkit-scrollbar { width: 8px; }
  .tr-main::-webkit-scrollbar-thumb {
    background: rgba(150,150,150,.3);
    border-radius: 4px;
  }

  .tr-main-inner {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── 標題列 ── */
  .tr-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }
  .tr-head h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tr-head h1 i { color: var(--accent); font-size: 1rem; }
  .tr-head-spacer { flex: 1; }
  .tr-head-stat {
    font-size: .78rem;
    color: var(--text-secondary);
    font-family: 'Consolas', monospace;
  }

  .tr-icon-btn {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    font-size: .85rem;
  }
  .tr-icon-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--hover-bg);
  }

  /* ── 過濾器列 ── */
  .tr-filters {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
  }
  .tr-filters select {
    padding: 6px 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    font-size: .82rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
    min-width: 110px;
  }
  .tr-filters select:focus {
    border-color: var(--accent);
  }
  .tr-filters .tr-filter-label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
    font-weight: 700;
  }

  /* ── 進度條 ── */
  .tr-progress {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: .8rem;
    color: var(--text-secondary);
    box-shadow: var(--shadow-sm);
  }
  .tr-progress .count {
    font-family: 'Consolas', monospace;
    font-weight: 700;
    color: var(--text-primary);
    min-width: 80px;
  }
  .tr-progress .track {
    flex: 1;
    height: 5px;
    background: var(--border-color);
    border-radius: 3px;
    overflow: hidden;
    min-width: 100px;
  }
  .tr-progress .track > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #6ab0f0);
    border-radius: 3px;
    transition: width .4s ease;
  }
  .tr-progress .accuracy {
    font-family: 'Consolas', monospace;
    font-weight: 700;
    color: var(--accent);
    min-width: 52px;
    text-align: right;
  }
  .tr-progress .legend {
    display: flex;
    gap: 10px;
    font-size: .72rem;
  }
  .tr-progress .legend span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tr-progress .legend .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .tr-progress .legend .dot.g { background: var(--good); }
  .tr-progress .legend .dot.r { background: var(--bad); }

  /* ── 題目卡片 ── */
  .tr-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    padding: 26px 30px;
  }
  @media (max-width: 640px) {
    .tr-card { padding: 18px 16px; }
  }

  .tr-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
  }
  .tr-tag {
    font-size: .7rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 11px;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .tr-tag.id {
    background: var(--hover-bg);
    color: var(--text-secondary);
    font-family: 'Consolas', monospace;
    text-transform: none;
    letter-spacing: 0;
  }
  .tr-tag.cat {
    background: rgba(74,144,217,.12);
    color: var(--accent);
    text-transform: none;
    letter-spacing: 0;
  }
  .tr-tag.lvl {
    background: rgba(255,193,7,.16);
    color: #b28500;
  }
  :root[data-theme="dark"] .tr-tag.lvl { color: #ffd54f; }
  .tr-tag.diff.easy {
    background: rgba(76,175,80,.16);
    color: #2e7d32;
  }
  .tr-tag.diff.medium {
    background: rgba(74,144,217,.16);
    color: #2a6cb0;
  }
  .tr-tag.diff.hard {
    background: rgba(198,40,40,.16);
    color: #c0392b;
  }
  :root[data-theme="dark"] .tr-tag.diff.easy { color: #8fdf8f; }
  :root[data-theme="dark"] .tr-tag.diff.medium { color: #8ec3ff; }
  :root[data-theme="dark"] .tr-tag.diff.hard { color: #ff9b8f; }

  .tr-statement {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text-primary);
    margin-bottom: 20px;
    white-space: pre-wrap;
    word-break: break-word;
  }
    /* ⭐ KaTeX 微調 */
  .tr-statement .katex-display {
    margin: 12px 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 0;
  }
  .tr-statement .katex {
    font-size: 1.05em;
  }
  /* 避免長公式撐破卡片 */
  .tr-statement .katex-display > .katex {
    white-space: normal;
  }

  .tr-image {
    margin-bottom: 20px;
    text-align: center;
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .tr-image img {
    max-height: 340px;
    margin: 0 auto;
    border-radius: var(--radius-sm);
    cursor: zoom-in;
    transition: opacity .15s;
  }
  .tr-image img:hover { opacity: .92; }
  .tr-image .placeholder {
    padding: 22px 10px;
    color: var(--text-secondary);
    font-size: .82rem;
  }

  /* ── 選項 ── */
  .tr-choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tr-choice {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 15px;
    background: var(--card-bg);
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-sm);
    text-align: left;
    font-size: .92rem;
    line-height: 1.55;
    color: var(--text-primary);
    transition: all .15s;
    font-family: inherit;
  }
  .tr-choice:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--hover-bg);
  }
  .tr-choice .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: var(--hover-bg);
    color: var(--text-secondary);
    font-weight: 700;
    font-size: .78rem;
    flex-shrink: 0;
    transition: all .15s;
  }
  .tr-choice .text { flex: 1; word-break: break-word; }

  .tr-choice.selected {
    border-color: var(--accent);
    background: rgba(74,144,217,.06);
  }
  .tr-choice.selected .key {
    background: var(--accent);
    color: #fff;
  }
  .tr-choice.correct {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .tr-choice.correct .key {
    background: var(--good);
    color: #fff;
  }
  .tr-choice.wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
  }
  .tr-choice.wrong .key {
    background: var(--bad);
    color: #fff;
  }
  .tr-choice:disabled { cursor: default; }

  /* ── 回饋 ── */
  .tr-feedback {
    padding: 11px 15px;
    border-radius: var(--radius-sm);
    font-size: .88rem;
    font-weight: 500;
    margin-bottom: 14px;
    animation: trIn .2s ease;
  }
  .tr-feedback.good {
    background: var(--good-bg);
    color: var(--good);
    border-left: 3px solid var(--good);
  }
  .tr-feedback.bad {
    background: var(--bad-bg);
    color: var(--bad);
    border-left: 3px solid var(--bad);
  }
  @keyframes trIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── 按鈕列 ── */
  .tr-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding-top: 14px;
    border-top: 1px solid var(--border-color);
  }
  .tr-actions .spacer { flex: 1; }

  .tr-btn {
    padding: 8px 16px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    font-size: .85rem;
    font-weight: 600;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    white-space: nowrap;
  }
  .tr-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--hover-bg);
  }
  .tr-btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .tr-btn.primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }
  .tr-btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-secondary);
  }
  .tr-btn.ghost:hover:not(:disabled) {
    background: var(--hover-bg);
    color: var(--text-primary);
  }
  .tr-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  /* ── 空 / Loading ── */
  .tr-empty,
  .tr-loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: .92rem;
  }
  .tr-empty i,
  .tr-loading i {
    font-size: 2rem;
    color: var(--accent);
    opacity: .5;
    display: block;
    margin-bottom: 12px;
  }
  .tr-empty h2 {
    font-size: 1.1rem;
    color: var(--text-primary);
    margin-bottom: 6px;
    font-weight: 700;
  }

  /* ── Lightbox ── */
  .tr-lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  .tr-lightbox.show {
    display: flex;
    animation: trIn .2s ease;
  }
  .tr-lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    border-radius: var(--radius-md);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }

  /* ── 刷新遮罩 ── */
  .tr-refresh-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .tr-refresh-mask.show { display: flex; }
  .tr-refresh-mask .box {
    background: var(--card-bg);
    padding: 24px 32px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    text-align: center;
    font-size: .9rem;
    color: var(--text-primary);
    min-width: 200px;
  }
  .tr-refresh-mask i {
    color: var(--accent);
    font-size: 1.6rem;
    margin-bottom: 10px;
    display: inline-block;
  }

  /* ── Spinner ── */
  .tr-spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-color);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 響應式 ── */
  @media (max-width: 700px) {
    :root { --sidebar-w: 0px; }
    .tr-layout {
      grid-template-columns: 1fr;
    }
    .tr-sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 240px;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform .25s ease;
      box-shadow: var(--shadow-md);
    }
    .tr-sidebar.open { transform: translateX(0); }
    .tr-main-inner { padding: 14px 14px 80px; }
    .tr-mobile-menu-btn {
      display: inline-flex !important;
    }
  }

  .tr-mobile-menu-btn {
    display: none;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    align-items: center;
    justify-content: center;
    font-size: .9rem;
  }
</style>
</head>
<body>

<div class="tr-layout" id="trLayout" style="display:none;">

  <!-- ═══ 左側欄：ID 列表 ═══ -->
  <aside class="tr-sidebar" id="trSidebar">
    <div class="tr-sidebar-head">
      <span class="tr-sidebar-title">Problems</span>
      <button class="tr-refresh-btn" id="trRefreshBtn" title="Refresh from server">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
    <div class="tr-sidebar-filter">
      <input type="text" id="trSideFilter" placeholder="Filter id..." autocomplete="off">
    </div>
    <div class="tr-sidebar-list" id="trSideList">
      <!-- 動態生成 -->
    </div>
  </aside>

  <!-- ═══ 主區 ═══ -->
  <main class="tr-main" id="trMain">
    <div class="tr-main-inner">

      <!-- 標題列 -->
      <header class="tr-head">
        <button class="tr-mobile-menu-btn" id="trMobileMenuBtn" title="Menu">
          <i class="fas fa-bars"></i>
        </button>
        <h1><i class="fas fa-graduation-cap"></i> TR Training</h1>
        <div class="tr-head-spacer"></div>
        <span class="tr-head-stat" id="trHeadStat">—</span>
        <button class="tr-icon-btn" id="trThemeBtn" title="Toggle theme">
          <i class="fas fa-moon" id="trThemeIcon"></i>
        </button>
      </header>

      <!-- 過濾器 -->
      <div class="tr-filters">
        <span class="tr-filter-label">Level</span>
        <select id="trFilterLevel"><option value="">All</option></select>
        <span class="tr-filter-label">Diff</span>
        <select id="trFilterDiff">
          <option value="">All</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <span class="tr-filter-label">Category</span>
        <select id="trFilterCat"><option value="">All</option></select>
        <select id="trFilterStatus">
          <option value="">All Status</option>
          <option value="unanswered">Unanswered</option>
          <option value="correct">Correct</option>
          <option value="wrong">Wrong</option>
        </select>
      </div>

      <!-- 進度列 -->
      <div class="tr-progress">
        <span class="count" id="trCounter">0 / 0</span>
        <div class="track"><i id="trProgressFill"></i></div>
        <span class="accuracy" id="trAccuracy">—</span>
        <div class="legend">
          <span><span class="dot g"></span><b id="trLegGood">0</b></span>
          <span><span class="dot r"></span><b id="trLegBad">0</b></span>
        </div>
      </div>

      <!-- 題目卡片 -->
      <div id="trCardWrap">
        <div class="tr-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <div>載入題庫中…</div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- 存取被拒 -->
<div id="trDenied" class="tr-empty" style="display:none;">
  <i class="fas fa-lock"></i>
  <h2>404</h2>
  <div>Page not found.</div>
</div>

<!-- Lightbox -->
<div class="tr-lightbox" id="trLightbox">
  <img id="trLightboxImg" src="" alt="">
</div>

<!-- 刷新遮罩 -->
<div class="tr-refresh-mask" id="trRefreshMask">
  <div class="box">
    <i class="fas fa-spinner fa-spin"></i>
    <div id="trRefreshMsg">Refreshing from server...</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(function() {
  'use strict';

  if (!isLoggedIn()) {
    window.location.href = '/index.html';
    return;
  }
    // ═══════════════ 反選取 / 反翻譯 保護 ═══════════════
  (function guard() {
    // ── 1. 阻止 Ctrl+A 全選（除非在 input / textarea）──
    document.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const inField = ['INPUT', 'TEXTAREA'].includes(tag) ||
                      (e.target && e.target.isContentEditable);
      if (inField) return;

      const mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === 'a' || e.key === 'A')) {
        e.preventDefault();
      }
      // ── 阻止 Ctrl+C 複製 ──
      if (mod && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
      }
      // ── 阻止 Ctrl+X 剪下 ──
      if (mod && (e.key === 'x' || e.key === 'X')) {
        e.preventDefault();
      }
      // ── 阻止 Ctrl+P 列印（另存 PDF）──
      if (mod && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
      }
      // ── 阻止 Ctrl+S 儲存頁面 ──
      if (mod && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
      }
    }, true);

    // ── 2. 阻止 copy 事件 ──
    document.addEventListener('copy', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (!['INPUT', 'TEXTAREA'].includes(tag)) {
        e.preventDefault();
      }
    }, true);

    // ── 3. 阻止拖拽選取 ──
    document.addEventListener('dragstart', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (!['INPUT', 'TEXTAREA'].includes(tag)) {
        e.preventDefault();
      }
    }, true);

    // ── 4. 阻止 iframe 包裹（有人會用 iframe 嵌入後翻譯）──
    try {
      if (window.self !== window.top) {
        // 被嵌入 → 清空頁面 + 跳出去
        document.documentElement.innerHTML = '';
        window.top.location = window.self.location.href;
        return;
      }
    } catch (e) { /* 跨域 iframe 會拋錯，代表被嵌入 */ }

    // ── 5. 檢測翻譯注入 ──
    const TRANSLATE_SIGNS = [
      'translated-ltr',     // Google Translate / Chrome 內建
      'translated-rtl',
    ];
    const TRANSLATE_SELECTORS = [
      '#goog-gt-tt',
      '.goog-te-banner-frame',
      '.goog-te-balloon-frame',
      '.skiptranslate',
      'body > .skiptranslate',
      'iframe.goog-te-banner-frame',
    ];

    let _translationWarned = false;

    function detectTranslation() {
      const html = document.documentElement;
      let detected = false;

      // 檢查 class
      for (const cls of TRANSLATE_SIGNS) {
        if (html.classList.contains(cls)) {
          html.classList.remove(cls);
          detected = true;
        }
      }

      // 檢查 DOM 元素
      for (const sel of TRANSLATE_SELECTORS) {
        const el = document.querySelector(sel);
        if (el && el.parentNode) {
          try { el.remove(); } catch {}
          detected = true;
        }
      }

      // Chrome 翻譯會把 body 往下推
      const top = parseInt(getComputedStyle(document.body).top, 10);
      if (top > 0) {
        document.body.style.setProperty('top', '0', 'important');
        detected = true;
      }

      // 偵測到翻譯 → 顯示警告（只顯示一次）
      if (detected && !_translationWarned) {
        _translationWarned = true;
        showTranslateWarning();
        setTimeout(() => { _translationWarned = false; }, 5000);
      }

      return detected;
    }

    function showTranslateWarning() {
      // 建立警告浮層
      const warn = document.createElement('div');
      warn.id = 'tr-translate-warning';
      warn.innerHTML = `
        <div style="
          position:fixed;inset:0;z-index:999999;
          background:rgba(0,0,0,.75);
          display:flex;align-items:center;justify-content:center;
          padding:24px;backdrop-filter:blur(4px);
          font-family:'Segoe UI',system-ui,sans-serif;
        ">
          <div style="
            background:#fff;color:#2c3e50;
            padding:28px 32px;border-radius:12px;
            max-width:420px;text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.4);
          ">
            <div style="font-size:2rem;color:#e67e22;margin-bottom:12px;">
              <i class="fas fa-language"></i>
            </div>
            <h2 style="margin:0 0 8px;font-size:1.1rem;">Auto-Translate Detected</h2>
            <p style="font-size:.88rem;color:#666;line-height:1.6;margin:0 0 18px;">
              This page cannot be translated.<br>
              Please disable browser translation and refresh.
            </p>
            <button id="tr-tw-close" style="
              padding:8px 24px;border:none;border-radius:6px;
              background:#4a90d9;color:#fff;font-size:.88rem;
              font-weight:600;cursor:pointer;font-family:inherit;
            ">OK</button>
          </div>
        </div>
      `;
      document.body.appendChild(warn);
      warn.querySelector('#tr-tw-close').addEventListener('click', () => {
        warn.remove();
      });
    }

    // ── 6. 用 MutationObserver 監測 DOM class 變化 ──
    const observer = new MutationObserver(() => {
      detectTranslation();
    });
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class', 'style'],
      childList: false,
      subtree: false,
    });
    // 也監測 body 的子節點（翻譯工具會插入元素）
    observer.observe(document.body, {
      childList: true,
      subtree: false,
    });

    // ── 7. 週期性檢查（有些翻譯工具不加 class）──
    setInterval(detectTranslation, 800);

    // ── 8. 攔截 contextmenu（右鍵）中的翻譯選項 ──
    // 不阻止右鍵完全（會影響用戶體驗），但移除 Google 翻譯選項
    document.addEventListener('contextmenu', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (['INPUT', 'TEXTAREA'].includes(tag)) return;
      // 不 preventDefault，保留一般右鍵菜單
    }, false);

  })();
  // ═══════════════════════════════════════════════════════════
  // 🔧 設定
  // ═══════════════════════════════════════════════════════════
  const CDN_BASE = 'https://cdn.jsdelivr.net/gh/wyk-math-team/resources@main/script/tr-images/';
  const FILEMAP_URL = CDN_BASE + 'filemap.json';

  const CACHE_KEY_ITEMS     = 'tr_items_v1';
  const CACHE_KEY_FILEMAP   = 'tr_filemap_v1';
  const CACHE_KEY_PROGRESS  = 'tr_progress_v1';
  const CACHE_KEY_STATE     = 'tr_state_v1';         // 當前題 id / 過濾器
  const CACHE_KEY_SCROLL    = 'tr_scroll_v1';        // 主區 & 側欄滾動位置
  const CACHE_KEY_THEME     = 'tr_theme';

  const ITEMS_TTL     = 24 * 60 * 60 * 1000;   // 題庫快取 24h
  const FILEMAP_TTL   = 6 * 60 * 60 * 1000;    // filemap 快取 6h

  // ═══════════ 狀態 ═══════════
  const state = {
    items: [],
    filtered: [],
    currentId: null,
    currentDetail: null,
    selected: null,
    submitted: false,
    correct: false,
    progress: {},         // { id: { selected, correct, ts } }
    filters: { level: '', diff: '', cat: '', status: '', side: '' },
    fileMap: {},
    imageLoadFailed: new Set(),
    loading: false,
  };

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));

  // ═══════════ 主題 ═══════════
  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      $('#trThemeIcon').className = 'fas fa-sun';
    } else {
      document.documentElement.removeAttribute('data-theme');
      $('#trThemeIcon').className = 'fas fa-moon';
    }
  }
  function initTheme() {
    let t = localStorage.getItem(CACHE_KEY_THEME) || localStorage.getItem('theme') || 'light';
    applyTheme(t);
    $('#trThemeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem(CACHE_KEY_THEME, next);
      applyTheme(next);
    });
  }

  // ═══════════ localStorage 工具 ═══════════
  function lsGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) {
      console.warn(`[TR] localStorage.setItem failed for ${key}:`, e.message);
      return false;
    }
  }
  function lsDel(key) {
    try { localStorage.removeItem(key); } catch {}
  }

  // ═══════════ 進度 ═══════════
  function loadProgress() {
    state.progress = lsGet(CACHE_KEY_PROGRESS, {}) || {};
  }
  function saveProgress() {
    lsSet(CACHE_KEY_PROGRESS, state.progress);
  }

  // ═══════════ 狀態（當前題 + 過濾器）═══════════
  function loadState() {
    const s = lsGet(CACHE_KEY_STATE, {});
    if (s.filters) state.filters = { ...state.filters, ...s.filters, side: '' };
    if (s.currentId) state.currentId = s.currentId;
  }
  function saveState() {
    lsSet(CACHE_KEY_STATE, {
      currentId: state.currentId,
      filters: {
        level: state.filters.level,
        diff: state.filters.diff,
        cat: state.filters.cat,
        status: state.filters.status,
      },
    });
  }

  // ═══════════ 滾動位置 ═══════════
  let _scrollSaveTimer = null;
  function saveScroll() {
    if (_scrollSaveTimer) clearTimeout(_scrollSaveTimer);
    _scrollSaveTimer = setTimeout(() => {
      lsSet(CACHE_KEY_SCROLL, {
        main: $('#trMain')?.scrollTop || 0,
        side: $('#trSideList')?.scrollTop || 0,
        ts: Date.now(),
      });
    }, 150);
  }
  function restoreScroll() {
    const s = lsGet(CACHE_KEY_SCROLL, null);
    if (!s) return;
    // 滾動位置只在 5 分鐘內有效
    if (Date.now() - (s.ts || 0) > 5 * 60 * 1000) return;
    requestAnimationFrame(() => {
      if (s.main) $('#trMain').scrollTop = s.main;
      if (s.side) $('#trSideList').scrollTop = s.side;
    });
  }

  // ═══════════ 題庫快取 ═══════════
  function loadItemsCache() {
    const c = lsGet(CACHE_KEY_ITEMS, null);
    if (!c || !Array.isArray(c.items)) return null;
    if (Date.now() - (c.ts || 0) > ITEMS_TTL) return null;
    return c.items;
  }
  function saveItemsCache(items) {
    const ok = lsSet(CACHE_KEY_ITEMS, { ts: Date.now(), items });
    if (!ok) console.warn('[TR] items cache save failed (may be too large)');
    return ok;
  }
  function clearItemsCache() {
    lsDel(CACHE_KEY_ITEMS);
  }

  // ═══════════ filemap ═══════════
  async function loadFileMap() {
    // 1) 快取
    const cached = lsGet(CACHE_KEY_FILEMAP, null);
    if (cached && cached.map && Date.now() - (cached.ts || 0) < FILEMAP_TTL) {
      state.fileMap = cached.map;
      console.log(`[TR] filemap from cache: ${Object.keys(state.fileMap).length}`);
      return;
    }
    // 2) CDN
    try {
      const res = await fetch(FILEMAP_URL, { cache: 'force-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const map = await res.json();
      state.fileMap = map || {};
      lsSet(CACHE_KEY_FILEMAP, { ts: Date.now(), map: state.fileMap });
      console.log(`[TR] filemap from CDN: ${Object.keys(state.fileMap).length}`);
    } catch (e) {
      console.warn('[TR] filemap failed:', e.message);
      state.fileMap = {};
    }
  }

  function resolveImageSrc(id) {
    const filename = state.fileMap[id];
    if (!filename || state.imageLoadFailed.has(id)) return '';
    return CDN_BASE + encodeURIComponent(filename);
  }

  window.__trImgError = function(id, imgEl) {
    state.imageLoadFailed.add(id);
    const container = imgEl.parentElement;
    if (container) {
      container.innerHTML = `<div class="placeholder">
        <i class="fas fa-image" style="margin-right:6px;opacity:.5;"></i>圖片載入失敗
      </div>`;
    }
  };

  // ═══════════ 認證 ═══════════
  async function checkAccess() {
    try {
      const r = await apiCall('/api/tr-problems?action=whoami');
      return !!(r && r.canView);
    } catch { return false; }
  }

  // ═══════════ 從伺服器拉題庫 ═══════════
  async function fetchItemsFromServer() {
    const r = await apiCall('/api/tr-problems?action=list-all');
    if (!r.success) throw new Error(r.message || 'load failed');
    return r.items || [];
  }

  // ═══════════ 載入題庫（優先快取）═══════════
  async function loadItems(force = false) {
    if (force) {
      clearItemsCache();
    } else {
      const cached = loadItemsCache();
      if (cached) {
        state.items = cached;
        console.log(`[TR] items from cache: ${cached.length}`);
        return true;
      }
    }

    // 顯示載入
    $('#trCardWrap').innerHTML = `<div class="tr-loading">
      <i class="fas fa-spinner fa-spin"></i>
      <div>從伺服器載入題庫…</div>
    </div>`;

    try {
      const items = await fetchItemsFromServer();
      state.items = items;
      saveItemsCache(items);
      console.log(`[TR] items from server: ${items.length}`);
      return true;
    } catch (e) {
      console.error('[TR] loadItems failed:', e);
      $('#trCardWrap').innerHTML = `<div class="tr-empty">
        <i class="fas fa-triangle-exclamation"></i>
        <h2>載入失敗</h2>
        <div>${esc(e.message)}</div>
      </div>`;
      return false;
    }
  }

  // ═══════════ 建立過濾選項 ═══════════
  function buildFilterOptions() {
    // Level
    const levelSel = $('#trFilterLevel');
    const curLevel = levelSel.value;
    let levelHtml = '<option value="">All</option>';
    for (let i = 1; i <= 9; i++) levelHtml += `<option value="${i}">Lv.${i}</option>`;
    levelSel.innerHTML = levelHtml;
    levelSel.value = curLevel;

    // Category
    const catSel = $('#trFilterCat');
    const curCat = catSel.value;
    const cats = [...new Set(state.items.map(i => i.category).filter(Boolean))].sort();
    catSel.innerHTML = '<option value="">All</option>' +
      cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    catSel.value = curCat;
  }

  // ═══════════ 過濾 ═══════════
  function applyFilters() {
    const { level, diff, cat, status } = state.filters;
    state.filtered = state.items.filter(it => {
      if (level && String(it.level) !== String(level)) return false;
      if (diff && it.difficulty !== diff) return false;
      if (cat && it.category !== cat) return false;

      if (status) {
        const p = state.progress[it.id];
        if (status === 'unanswered' && p) return false;
        if (status === 'correct'   && !(p && p.correct)) return false;
        if (status === 'wrong'     && !(p && !p.correct)) return false;
      }
      return true;
    });
  }

  // ═══════════ 側邊列表過濾 ═══════════
  function applySideFilter() {
    const q = (state.filters.side || '').trim().toLowerCase();
    if (!q) return state.filtered;
    return state.filtered.filter(it => it.id.toLowerCase().includes(q));
  }

  // ═══════════ 渲染側邊列表 ═══════════
  function renderSideList() {
    const el = $('#trSideList');
    const list = applySideFilter();

    if (!list.length) {
      el.innerHTML = `<div style="padding:16px;color:var(--text-secondary);font-size:.75rem;text-align:center;">
        No problems
      </div>`;
      return;
    }

    // 用 DocumentFragment 提升效能
    const frag = document.createDocumentFragment();
    for (const it of list) {
      const p = state.progress[it.id];
      const isActive = it.id === state.currentId;
      const cls = [
        'tr-side-item',
        isActive ? 'active' : '',
        p ? (p.correct ? 'correct' : 'wrong') : '',
      ].filter(Boolean).join(' ');

      const node = document.createElement('div');
      node.className = cls;
      node.dataset.id = it.id;
      node.title = it.id;
      node.innerHTML = `<span class="dot"></span><span class="id">${esc(it.id)}</span>`;
      frag.appendChild(node);
    }

    el.innerHTML = '';
    el.appendChild(frag);

    // 事件委派
    el.querySelectorAll('.tr-side-item').forEach(node => {
      node.addEventListener('click', () => {
        goToId(node.dataset.id);
      });
    });

    // 滾動到當前題（僅當選中項不在視窗內時）
    if (state.currentId) {
      const active = el.querySelector('.tr-side-item.active');
      if (active) {
        const rect = active.getBoundingClientRect();
        const listRect = el.getBoundingClientRect();
        if (rect.top < listRect.top || rect.bottom > listRect.bottom) {
          active.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
    }
  }

  // ═══════════ 更新統計 ═══════════
  function updateStats() {
    const list = state.filtered;
    const total = list.length;
    const done = list.filter(it => state.progress[it.id]).length;
    const correct = list.filter(it => state.progress[it.id]?.correct).length;
    const wrong = done - correct;

    $('#trCounter').textContent = `${done} / ${total}`;
    $('#trProgressFill').style.width = (total ? (done / total) * 100 : 0) + '%';
    $('#trAccuracy').textContent = done ? `${Math.round((correct / done) * 100)}%` : '—';
    $('#trLegGood').textContent = correct;
    $('#trLegBad').textContent = wrong;
    $('#trHeadStat').textContent = `${state.items.length} problems`;
  }

  // ═══════════ 載入單題詳情（純本地，不打 API）═══════════
  async function loadDetail(id) {
    if (state.currentDetail && state.currentDetail.id === id) return state.currentDetail;

    // ⭐ 1) 從已載入的題庫找（list-all 已含全部渲染所需欄位）
    const local = state.items.find(it => it.id === id);
    if (local) {
      state.currentDetail = local;
      return local;
    }

    // 2) 本地找不到（罕見：items 被清空 / 該題不在列表）→ 打 API 兜底
    try {
      const r = await apiCall(`/api/tr-problems?action=get&id=${encodeURIComponent(id)}`);
      if (!r.success) throw new Error(r.message);
      state.currentDetail = r.problem;
      return r.problem;
    } catch (e) {
      console.error('[TR] loadDetail failed:', e);
      return null;
    }
  }

  // ═══════════ 渲染題目 ═══════════
  async function renderCard() {
    const wrap = $('#trCardWrap');

    if (!state.filtered.length) {
      wrap.innerHTML = `<div class="tr-card"><div class="tr-empty">
        <i class="fas fa-inbox"></i>
        <h2>沒有題目</h2>
        <div>試著調整過濾條件。</div>
      </div></div>`;
      updateStats();
      return;
    }

    // 找當前題
    let meta = state.filtered.find(it => it.id === state.currentId);
    if (!meta) {
      meta = state.filtered[0];
      state.currentId = meta.id;
    }

    // 載入詳情
    wrap.innerHTML = `<div class="tr-card"><div class="tr-loading" style="padding:40px 0;">
      <i class="fas fa-spinner fa-spin"></i><div>載入中…</div>
    </div></div>`;

    const detail = await loadDetail(meta.id);
    if (!detail) {
      wrap.innerHTML = `<div class="tr-card"><div class="tr-empty">
        <i class="fas fa-triangle-exclamation"></i>
        <h2>載入失敗</h2>
      </div></div>`;
      return;
    }

    // 若已答過 → 帶入
    const p = state.progress[detail.id];
    if (p) {
      state.selected = p.selected;
      state.submitted = true;
      state.correct = p.correct;
    } else {
      state.selected = null;
      state.submitted = false;
      state.correct = false;
    }

    const diffLabel = { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[detail.difficulty] || detail.difficulty;

    // 圖片
    const imgSrc = resolveImageSrc(detail.id);
    let imageHtml = '';
    if (imgSrc) {
      imageHtml = `
        <div class="tr-image">
          <img src="${esc(imgSrc)}" alt="題目圖" id="trProblemImg"
               onerror="window.__trImgError('${esc(detail.id)}', this)">
        </div>`;
    }

    // 選項
    const choicesHtml = Object.keys(detail.choice).sort().map(k => {
      let cls = 'tr-choice';
      if (state.submitted) {
        if (k === detail.ans) cls += ' correct';
        else if (k === state.selected) cls += ' wrong';
      } else if (state.selected === k) {
        cls += ' selected';
      }
      return `
        <button class="${cls}" data-key="${esc(k)}" ${state.submitted ? 'disabled' : ''}>
          <span class="key">${esc(k)}</span>
          <span class="text">${esc(detail.choice[k])}</span>
        </button>`;
    }).join('');

    // 回饋
    let feedbackHtml = '';
    if (state.submitted) {
      const isCorrect = state.selected === detail.ans;
      feedbackHtml = `
        <div class="tr-feedback ${isCorrect ? 'good' : 'bad'}">
          <strong>${isCorrect ? '✓ 正確' : '✗ 錯誤'}</strong>
          ${isCorrect ? '' : `　正確答案：<b>${esc(detail.ans)}</b>`}
        </div>`;
    }

    const idx = state.filtered.findIndex(it => it.id === detail.id);
    const isFirst = idx <= 0;
    const isLast = idx >= state.filtered.length - 1;

    wrap.innerHTML = `
      <article class="tr-card">
        <div class="tr-meta">
          <span class="tr-tag id">${esc(detail.id)}</span>
          ${detail.category ? `<span class="tr-tag cat">${esc(detail.category)}</span>` : ''}
          <span class="tr-tag lvl">Lv.${detail.level}</span>
          <span class="tr-tag diff ${esc(detail.difficulty)}">${esc(diffLabel)}</span>
        </div>

        <div class="tr-statement">${esc(detail.statement)}</div>

        ${imageHtml}

        <div class="tr-choices" id="trChoices">${choicesHtml}</div>

        ${feedbackHtml}

        <div class="tr-actions">
          <button class="tr-btn ghost" id="trPrev" ${isFirst ? 'disabled' : ''}>
            <i class="fas fa-arrow-left"></i> 上一題
          </button>
          <div class="spacer"></div>
          <button class="tr-btn ghost" id="trClear" ${state.submitted ? 'disabled' : ''}>
            <i class="fas fa-eraser"></i> 清除
          </button>
          <button class="tr-btn primary" id="trSubmit" ${!state.selected || state.submitted ? 'disabled' : ''}>
            <i class="fas fa-check"></i> 提交
          </button>
          <button class="tr-btn primary" id="trNext" ${isLast ? 'disabled' : ''}>
            下一題 <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </article>
    `;

    bindCardEvents();
    renderKatex(wrap);
    updateStats();
    renderSideList();
    saveState();
  }

  // ⭐ KaTeX 渲染
  function renderKatex(root) {
    if (typeof renderMathInElement !== 'function') return;
    try {
      renderMathInElement(root, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$',  right: '$',  display: false },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
        ],
        throwOnError: false,
        errorColor: '#c62828',
        strict: false,
        trust: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
        ignoredClasses: ['no-katex'],
      });
    } catch (e) {
      console.warn('[TR] KaTeX render failed:', e);
    }
  }

  // ═══════════ 卡片事件 ═══════════
  function bindCardEvents() {
    $$('.tr-choice').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.submitted) return;
        state.selected = btn.dataset.key;
        $$('.tr-choice').forEach(x => x.classList.remove('selected'));
        btn.classList.add('selected');
        $('#trSubmit').disabled = false;
      });
    });

    $('#trSubmit')?.addEventListener('click', submitAnswer);
    $('#trClear')?.addEventListener('click', () => {
      state.selected = null;
      $$('.tr-choice').forEach(x => x.classList.remove('selected'));
      $('#trSubmit').disabled = true;
    });
    $('#trPrev')?.addEventListener('click', () => goPrev());
    $('#trNext')?.addEventListener('click', () => goNext());

    $('#trProblemImg')?.addEventListener('click', (e) => {
      $('#trLightboxImg').src = e.target.src;
      $('#trLightbox').classList.add('show');
    });
  }

  function submitAnswer() {
    if (!state.selected || state.submitted) return;
    const detail = state.currentDetail;
    const isCorrect = state.selected === detail.ans;
    state.submitted = true;
    state.correct = isCorrect;
    state.progress[detail.id] = {
      selected: state.selected,
      correct: isCorrect,
      ts: Date.now(),
    };
    saveProgress();
    renderCard();
  }

  // ═══════════ 導航 ═══════════
  function goPrev() {
    const idx = state.filtered.findIndex(it => it.id === state.currentId);
    if (idx <= 0) return;
    goToId(state.filtered[idx - 1].id);
  }
  function goNext() {
    const idx = state.filtered.findIndex(it => it.id === state.currentId);
    if (idx < 0 || idx >= state.filtered.length - 1) return;
    goToId(state.filtered[idx + 1].id);
  }
  function goToId(id) {
    if (state.currentId === id && state.currentDetail?.id === id) return;
    state.currentId = id;
    state.currentDetail = null;
    state.selected = null;
    state.submitted = false;
    $('#trMain').scrollTop = 0;
    // 手機：點 sidebar 項目後收起
    if (window.innerWidth <= 700) {
      $('#trSidebar').classList.remove('open');
    }
    renderCard();
  }

  // ═══════════ Lightbox ═══════════
  $('#trLightbox')?.addEventListener('click', () => {
    $('#trLightbox').classList.remove('show');
  });

  // ═══════════ 鍵盤快捷鍵 ═══════════
  document.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    const detail = state.currentDetail;
    if (!detail) return;

    const key = e.key.toUpperCase();

    if (/^[A-Z]$/.test(key) && detail.choice[key]) {
      if (state.submitted) return;
      state.selected = key;
      $$('.tr-choice').forEach(x => x.classList.toggle('selected', x.dataset.key === key));
      const btn = $('#trSubmit');
      if (btn) btn.disabled = false;
      e.preventDefault();
      return;
    }
    if (e.key === 'Enter') {
      if (!state.submitted && state.selected) submitAnswer();
      else if (state.submitted) goNext();
      e.preventDefault();
      return;
    }
    if (e.key === 'ArrowLeft') { goPrev(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { goNext(); e.preventDefault(); }
    if (e.key === 'Escape' && !state.submitted) {
      state.selected = null;
      $$('.tr-choice').forEach(x => x.classList.remove('selected'));
      const btn = $('#trSubmit');
      if (btn) btn.disabled = true;
    }
  });

  // ═══════════ 過濾器事件 ═══════════
  function bindFilterEvents() {
    ['#trFilterLevel', '#trFilterDiff', '#trFilterCat', '#trFilterStatus'].forEach(sel => {
      $(sel)?.addEventListener('change', () => {
        state.filters.level  = $('#trFilterLevel').value;
        state.filters.diff   = $('#trFilterDiff').value;
        state.filters.cat    = $('#trFilterCat').value;
        state.filters.status = $('#trFilterStatus').value;
        applyFilters();
        // 若當前題被過濾掉 → 跳到第一篇
        if (!state.filtered.find(it => it.id === state.currentId)) {
          state.currentId = state.filtered[0]?.id || null;
          state.currentDetail = null;
          state.selected = null;
          state.submitted = false;
        }
        renderCard();
        saveState();
      });
    });

    // 側邊搜尋
    let _sideTimer = null;
    $('#trSideFilter')?.addEventListener('input', () => {
      clearTimeout(_sideTimer);
      _sideTimer = setTimeout(() => {
        state.filters.side = $('#trSideFilter').value;
        renderSideList();
      }, 150);
    });
  }

  // ═══════════ 滾動保存 ═══════════
  function bindScrollListeners() {
    $('#trMain')?.addEventListener('scroll', saveScroll, { passive: true });
    $('#trSideList')?.addEventListener('scroll', saveScroll, { passive: true });
  }

  // ═══════════ 刷新按鈕 ═══════════
  async function handleRefresh() {
    const btn = $('#trRefreshBtn');
    const mask = $('#trRefreshMask');
    if (btn.classList.contains('spinning')) return;

    btn.classList.add('spinning');
    mask.classList.add('show');
    $('#trRefreshMsg').textContent = 'Refreshing from server...';

    try {
      const ok = await loadItems(true);
      if (!ok) return;
      // 重建過濾選項
      buildFilterOptions();
      applyFilters();
      // 若當前題不在新題庫，跳到第一篇
      if (!state.filtered.find(it => it.id === state.currentId)) {
        state.currentId = state.filtered[0]?.id || null;
        state.currentDetail = null;
        state.selected = null;
        state.submitted = false;
      }
      await renderCard();
      $('#trRefreshMsg').textContent = 'Done!';
      setTimeout(() => mask.classList.remove('show'), 400);
    } catch (e) {
      $('#trRefreshMsg').textContent = 'Refresh failed: ' + e.message;
      setTimeout(() => mask.classList.remove('show'), 1500);
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // ═══════════ 手機側欄 ═══════════
  function bindMobileMenu() {
    $('#trMobileMenuBtn')?.addEventListener('click', () => {
      $('#trSidebar').classList.toggle('open');
    });
    // 點主區關閉側欄
    $('#trMain')?.addEventListener('click', (e) => {
      if (window.innerWidth > 700) return;
      const sb = $('#trSidebar');
      if (sb.classList.contains('open')) {
        // 若點擊的是 sidebar 內部則不關
        if (!$('#trSidebar').contains(e.target)) {
          sb.classList.remove('open');
        }
      }
    });
  }

  // ═══════════ 啟動 ═══════════
  (async function init() {
    initTheme();

    const ok = await checkAccess();
    if (!ok) {
      window.location.replace('/404.html');
      return;
    }

    // 載入進度 & 狀態
    loadProgress();
    loadState();

    // 顯示布局
    $('#trLayout').style.display = 'grid';

    // 平行載入 filemap + 題庫（若快取有直接讀）
    await Promise.all([
      loadFileMap(),
      loadItems(false),
    ]);

    if (!state.items.length) {
      $('#trCardWrap').innerHTML = `<div class="tr-card"><div class="tr-empty">
        <i class="fas fa-inbox"></i>
        <h2>題庫為空</h2>
      </div></div>`;
      return;
    }

    // 建立過濾選項
    buildFilterOptions();

    // 還原過濾器 UI 值
    $('#trFilterLevel').value = state.filters.level || '';
    $('#trFilterDiff').value = state.filters.diff || '';
    $('#trFilterCat').value = state.filters.cat || '';
    $('#trFilterStatus').value = state.filters.status || '';

    // 過濾
    applyFilters();

    // 若無當前題（首次）→ 選第一篇
    if (!state.currentId || !state.filtered.find(it => it.id === state.currentId)) {
      state.currentId = state.filtered[0]?.id || null;
    }

    // 綁定事件
    bindFilterEvents();
    bindScrollListeners();
    bindMobileMenu();
    $('#trRefreshBtn').addEventListener('click', handleRefresh);

    // 渲染
    renderSideList();
    await renderCard();
    updateStats();

    // 恢復滾動位置
    restoreScroll();
  })();
})();
</script>
</body>
