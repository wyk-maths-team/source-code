<!DOCTYPE html>
<html lang="zh-HK" translate="no" class="notranslate">
<head>
<script>window.__BUILD_V='d9634c1d';</script>

<script src="/assets/js/arch-render.js?v=d9634c1d"></script>

<meta charset="UTF-8">
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();</script>
<!-- ⭐ 反翻譯聲明 -->
<meta name="google" content="notranslate">
<meta name="microsoft" content="notranslate">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>TR Training</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="stylesheet" href="/assets/css/pages/tr-system.css?v=d9634c1d" />
<script src="/assets/js/core/ui.js?v=d9634c1d"></script>
<script src="/assets/js/core/net.js?v=d9634c1d"></script>
<script src="/assets/js/core/api.js?v=d9634c1d"></script>
<script src="/assets/js/core/page.js?v=d9634c1d"></script>
</head>
<body>

<div class="tr-layout" id="trLayout" style="display:none;">

  <!-- ═══ 左側欄：ID 列表 ═══ -->
  <aside class="tr-sidebar" id="trSidebar">
    <div class="tr-sidebar-head">
      <span class="tr-sidebar-title">Problems</span>
      <button class="tr-refresh-btn" id="trRefreshBtn" title="Refresh from server">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
    <div class="tr-sidebar-filter">
      <input type="text" id="trSideFilter" placeholder="Filter id..." autocomplete="off">
    </div>
    <div class="tr-sidebar-list" id="trSideList">
      <!-- 動態生成 -->
    </div>
  </aside>

  <!-- ═══ 主區 ═══ -->
  <main class="tr-main" id="trMain">
    <div class="tr-main-inner">

      <!-- 標題列 -->
      <header class="tr-head">
        <button class="tr-mobile-menu-btn" id="trMobileMenuBtn" title="Menu">
          <i class="fas fa-bars"></i>
        </button>
        <h1><i class="fas fa-graduation-cap"></i> TR Training</h1>
        <div class="tr-head-spacer"></div>
        <span class="tr-head-stat" id="trHeadStat">—</span>
        <button class="tr-icon-btn" id="trThemeBtn" title="Toggle theme">
          <i class="fas fa-moon" id="trThemeIcon"></i>
        </button>
      </header>

      <!-- 過濾器 -->
      <div class="tr-filters">
        <span class="tr-filter-label">Level</span>
        <select id="trFilterLevel"><option value="">All</option></select>
        <span class="tr-filter-label">Diff</span>
        <select id="trFilterDiff">
          <option value="">All</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <span class="tr-filter-label">Category</span>
        <select id="trFilterCat"><option value="">All</option></select>
        <select id="trFilterStatus">
          <option value="">All Status</option>
          <option value="unanswered">Unanswered</option>
          <option value="correct">Correct</option>
          <option value="wrong">Wrong</option>
        </select>
      </div>

      <!-- 進度列 -->
      <div class="tr-progress">
        <span class="count" id="trCounter">0 / 0</span>
        <div class="track"><i id="trProgressFill"></i></div>
        <span class="accuracy" id="trAccuracy">—</span>
        <div class="legend">
          <span><span class="dot g"></span><b id="trLegGood">0</b></span>
          <span><span class="dot r"></span><b id="trLegBad">0</b></span>
        </div>
      </div>

      <!-- 題目卡片 -->
      <div id="trCardWrap">
        <div class="tr-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <div>載入題庫中…</div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- 存取被拒 -->
<div id="trDenied" class="tr-empty" style="display:none;">
  <i class="fas fa-lock"></i>
  <h2>404</h2>
  <div>Page not found.</div>
</div>

<!-- Lightbox -->
<div class="tr-lightbox" id="trLightbox">
  <img id="trLightboxImg" src="" alt="">
</div>

<!-- 刷新遮罩 -->
<div class="tr-refresh-mask" id="trRefreshMask">
  <div class="box">
    <i class="fas fa-spinner fa-spin"></i>
    <div id="trRefreshMsg">Refreshing from server...</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script src="/assets/js/auth.js?v=d9634c1d"></script>
<script src="/assets/js/pages/tr-system.js?v=d9634c1d"></script>
</body>
</html>
