<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New User - WYK Maths Team</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    .admin-container { background: var(--card-bg); border-radius: 4px; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group select {
      width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;
      font-family: inherit; font-size: 1rem;
      background: var(--card-bg); color: var(--text-primary);
    }
    .form-group input:focus,
    .form-group select:focus { outline: none; border-color: var(--accent); }
    .form-group .hint { color: var(--text-secondary); font-size: 0.82rem; margin-top: 4px; display: block; }
    .btn { padding: 0.5rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 0.5rem; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .message { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="admin-container">
        <h2>Create New User</h2>
        <form id="newUserForm" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label>Username *</label>
              <input type="text" id="newUsername" required autocomplete="off" />
              <span class="hint">登入用 ID，建議英數字</span>
            </div>
            <div class="form-group">
              <label>Password *</label>
              <input type="password" id="newPassword" required autocomplete="new-password" />
              <span class="hint">至少 4 字元</span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Display Name</label>
              <input type="text" id="newDisplayName" maxlength="60" placeholder="（留空 = username）" />
            </div>
            <div class="form-group">
              <label>Real Name</label>
              <input type="text" id="newRealName" maxlength="60" placeholder="（選填）" />
            </div>
          </div>

          <div class="form-group" id="roleGroup" style="display:none;">
            <label>Role</label>
            <select id="newRole">
              <option value="student">Student</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div style="margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">Create User</button>
            <a href="/admin/users" class="btn btn-secondary">Back to List</a>
          </div>
        </form>
        <div id="message" class="message"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    if (!isLoggedIn() || (getCurrentUser()?.role !== 'admin' && getCurrentUser()?.role !== 'root')) {
      window.location.href = '/index.html';
    }

    const currentUser = getCurrentUser();
    const isRoot = currentUser?.role === 'root';

    if (isRoot) {
      document.getElementById('roleGroup').style.display = 'block';
    }

    function setMessage(text, isError) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.style.color = isError ? 'var(--danger)' : '#2e7d32';
    }

    document.getElementById('newUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value;
      const displayName = document.getElementById('newDisplayName').value.trim();
      const realName = document.getElementById('newRealName').value.trim();
      const role = isRoot ? document.getElementById('newRole').value : undefined;

      if (!username || !password) {
        setMessage('Username and password are required.', true);
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const body = { username, password, displayName, realName };
        if (isRoot) body.role = role;

        const result = await apiCall('/api/users?action=adminCreate', 'POST', body);

        if (result.success) {
          // ⭐ 不跳轉：清空表單，保留 role（方便連續建同角色）
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          document.getElementById('newDisplayName').value = '';
          document.getElementById('newRealName').value = '';
          setMessage(`"${username}" created. Ready for next.`, false);
          document.getElementById('newUsername').focus();
        } else {
          setMessage(result.message || 'Error creating user.', true);
        }
      } catch (err) {
        setMessage('Network error: ' + err.message, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create User';
      }
    });

    document.getElementById('newUsername').focus();
  </script>
</body>
</html>
