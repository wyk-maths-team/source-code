  <style>
    .admin-container { background: var(--card-bg); border-radius: 4px; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group select {
      width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;
      font-family: inherit; font-size: 1rem;
      background: var(--card-bg); color: var(--text-primary);
    }
    .form-group input:focus,
    .form-group select:focus { outline: none; border-color: var(--accent); }
    .form-group .hint { color: var(--text-secondary); font-size: 0.82rem; margin-top: 4px; display: block; }
    .btn { padding: 0.5rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 0.5rem; }

<script src="/assets/js/core/ui.js?v=fb35566d"></script>

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="admin-container">
        <h2>Create New User</h2>
        <form id="newUserForm" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label>Username *</label>
              <input type="text" id="newUsername" required autocomplete="off" />
              <span class="hint">登入用 ID，建議英數字</span>
            </div>
            <div class="form-group">
              <label>Password *</label>
              <input type="password" id="newPassword" required autocomplete="new-password" />
              <span class="hint">至少 4 字元</span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Display Name</label>
              <input type="text" id="newDisplayName" maxlength="60" placeholder="（留空 = username）" />
            </div>
            <div class="form-group">
              <label>Real Name</label>
              <input type="text" id="newRealName" maxlength="60" placeholder="（選填）" />
            </div>
          </div>

          <div class="form-group" id="roleGroup" style="display:none;">
            <label>Role</label>
            <select id="newRole">
              <option value="student">Student</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div style="margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">Create User</button>
            <a href="/admin/users" class="btn btn-secondary">Back to List</a>
          </div>
        </form>
        <div id="message" class="message"></div>
      </div>
    </main>
  </div>
