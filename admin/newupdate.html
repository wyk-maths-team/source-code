  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Update - WYK Maths Team</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<link rel="stylesheet" href="/assets/css/styles.css?v=d9634c1d" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="admin-container">
        <h2>Create New Update</h2>
        <form id="newUpdateForm">
          <div class="form-group">
            <label>Badge Style:
              <select id="newBadge" required>
                <option value="info">Info</option>
                <option value="new">New</option>
                <option value="warning">Warning</option>
              </select>
            </label>
          </div>
          <div class="form-group">
            <label>Badge Text: <input type="text" id="newBadgeText" required /></label>
          </div>
          <div class="form-group">
            <label>Title (optional): <input type="text" id="newTitle" /></label>
          </div>
          <div class="form-group">
            <label>Content (HTML / LaTeX):</label>
            <div class="code-editor-wrapper" id="newContentWrapper">
              <div class="code-editor-toolbar" id="newContentToolbar">
                <button type="button" data-insert="$...$">$...$</button>
                <button type="button" data-insert="$$...$$">$$...$$</button>
                <button type="button" data-insert="\\begin{}...\\end{}">\\begin{}...\\end{}</button>
                <button type="button" data-insert="\\frac{}{}">\\frac{}{}</button>
                <button type="button" data-insert="\\sqrt{}">\\sqrt{}</button>
                <button type="button" data-insert="\\sum_{}^{}">\\sum_{}^{}</button>
                <button type="button" data-insert="\\int_{}^{}">\\int_{}^{}</button>
                <button type="button" data-insert="\\text{}">\\text{}</button>
                <button type="button" data-insert="<...>">&lt;...&gt;</button>
                <button type="button" data-insert="<... />">&lt;... /&gt;</button>
              </div>
              <div class="editor-area">
                <div class="line-numbers" id="newContentLineNumbers"></div>
                <pre id="newContentHighlight"></pre>
                <textarea id="newContent" rows="6" required></textarea>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="newLocked"> Locked (only root can delete/edit)
            </label>
          </div>
          <div style="margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">Create Update</button>
            <a href="/admin/updates" class="btn btn-secondary">Back to List</a>
          </div>
        </form>
        <div id="message" class="message"></div>
      </div>
    </main>
  </div>

  <script src="/assets/js/auth.js?v=d9634c1d"></script>

</body>
