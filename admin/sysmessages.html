<body class="index-body">
  <header class="topbar" id="topbarContainer"></header>

  <main class="main-content" id="mainContent">
    <div class="sm-wrap">
      <div class="sm-bar">
        <h1><i class="fas fa-bullhorn"></i> System Messages</h1>
        <input class="sm-input w-user" id="smUser" placeholder="Recipient…" autocomplete="off">
        <input class="sm-input w-text" id="smText" placeholder="Search content…" autocomplete="off">
        <button class="sm-btn" id="smReload"><i class="fas fa-sync-alt"></i> Reload</button>
        <span class="sm-count" id="smCount"></span>
      </div>
      <div id="smList"><div class="sm-empty">Loading…</div></div>
    </div>

<!-- moj-core-body:end -->                <script>
    Page.boot({ title: 'System Messages', requireAuth: true });

    Page.ready(function (user) {
      if (!user) { window.location.href = '/index.html'; return; }

      var listEl = document.getElementById('smList');
      var userEl = document.getElementById('smUser');
      var textEl = document.getElementById('smText');
      var countEl = document.getElementById('smCount');

      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      };
      function fmt(ts) {
        try { return new Date(ts).toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }); }
        catch (e) { return ''; }
      }

      var PAGE = 200;
      var skip = 0;
      var loading = false;
      var total = 0;

      function query() {
        var p = ['action=listSystemMessages', 'limit=' + PAGE, 'skip=' + skip];
        if (userEl.value.trim()) p.push('username=' + encodeURIComponent(userEl.value.trim()));
        if (textEl.value.trim()) p.push('q=' + encodeURIComponent(textEl.value.trim()));
        return p.join('&');
      }

      function cardHtml(m) {
        var tags = '';
        if (m.broadcast) tags += '<span class="sm-tag broadcast">Broadcast</span>';
        if (m.template) tags += '<span class="sm-tag">' + esc(m.template) + '</span>';
        if (!m.read) tags += '<span class="sm-tag unread">Unread</span>';
        return '<div class="sm-card">' +
          '<div class="sm-head">' +
            '<a class="sm-to" href="/users/' + encodeURIComponent(m.username) + '">' + esc(m.username) + '</a>' +
            tags +
            (m.sentBy ? '<span class="sm-by">sent by ' + esc(m.sentBy) + '</span>' : '') +
            '<span class="sm-time">' + esc(fmt(m.createdAt)) + '</span>' +
          '</div>' +
          '<div class="sm-body">' + esc(m.content) + '</div>' +
        '</div>';
      }

      async function load(reset) {
        if (loading) return;
        if (reset) { skip = 0; listEl.innerHTML = '<div class="sm-empty">Loading…</div>'; }
        loading = true;
        try {
          var res = await apiCall('/api/admin?' + query());
          var items = (res && res.messages) || [];
          total = (res && res.total) || 0;
          countEl.textContent = total + (total === 1 ? ' message' : ' messages');

          if (reset) {
            if (!items.length) { listEl.innerHTML = '<div class="sm-empty">No system messages match.</div>'; return; }
            listEl.innerHTML = '';
            listEl.appendChild(document.createElement('div'));
            listEl.id = 'smList';
            listEl.innerHTML = '<div id="smBody"></div><div class="sm-more" id="smMore"></div>';
          }
          var body = document.getElementById('smBody');
          if (body) body.insertAdjacentHTML('beforeend', items.map(cardHtml).join(''));

          skip += items.length;
          var more = document.getElementById('smMore');
          if (more) {
            if (skip < total) {
              more.innerHTML = '<button class="sm-btn" id="smMoreBtn">Load more</button>';
              document.getElementById('smMoreBtn').addEventListener('click', function () {
                more.innerHTML = '';
                load(false);
              });
            } else {
              more.innerHTML = '';
            }
          }
        } catch (e) {
          if (reset) listEl.innerHTML = '<div class="sm-empty" style="color:var(--danger);">' + esc(e.message) + '</div>';
          else if (window.DSHUI && DSHUI.toast) DSHUI.toast(e.message, 'err');
        } finally {
          loading = false;
        }
      }

      var timer = null;
      function debounced() {
        clearTimeout(timer);
        timer = setTimeout(function () { load(true); }, 300);
      }

      userEl.addEventListener('input', debounced);
      textEl.addEventListener('input', debounced);
      document.getElementById('smReload').addEventListener('click', function () { load(true); });

      load(true);
    });
  </script>
</body>
