  <style>
    /* ── 中性色变量（由 tools/extract-colors.mjs 生成）──────────────
       原先写死在内联样式里的浅色背景 / 深色文字 / 浅灰边框，抽取成
       变量后暗色与科幻主题只需覆盖取值，不必逐条重写规则。
       语义色（成功绿、错误红、警告橙）与代码高亮色刻意保留，
       它们在深色背景下依然成立。 */
    :root {
      --c-surface: #ffffff;
      --c-surface-sunken: #f8f9fa;
      --c-surface-raised: #f0f0f0;
      --c-surface-muted: #e9ecef;
      --c-border: #dddddd;
      --c-border-strong: #bbbbbb;
      --c-text: #333333;
      --c-text-muted: #666666;
      --c-text-subtle: #999999;
    }
    :root[data-theme="dark"] {
      --c-surface: #161b22;
      --c-surface-sunken: #0d1117;
      --c-surface-raised: #21262d;
      --c-surface-muted: #21262d;
      --c-border: #30363d;
      --c-border-strong: #484f58;
      --c-text: #c9d1d9;
      --c-text-muted: #8b949e;
      --c-text-subtle: #6e7681;
    }
    :root[data-theme="scifi"] {
      --c-surface: #09101a;
      --c-surface-sunken: #070d15;
      --c-surface-raised: #0f2231;
      --c-surface-muted: #101b26;
      --c-border: #14313f;
      --c-border-strong: #1e4a5e;
      --c-text: #c6eeff;
      --c-text-muted: #6c8fa3;
      --c-text-subtle: #546f80;
    }

    .admin-container { background: var(--card-bg); border-radius: 4px; padding: 1.5rem; }
    .form-section { margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;
    }

    /* ---- 代码编辑器样式 (来自 editproblem.html) ---- */
    .code-editor-wrapper {
      position: relative; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;
      background: #1e1e1e; font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
    }
    .code-editor-toolbar {
      display: flex; gap: 0.3rem; padding: 0.4rem 0.6rem; background: #2d2d2d; border-bottom: 1px solid #3e3e3e; flex-wrap: wrap;
    }
    .code-editor-toolbar button {
      background: #3e3e3e; border: 1px solid #555; color: var(--c-border); font-family: inherit; font-size: 0.8rem;
      padding: 0.2rem 0.5rem; border-radius: 3px; cursor: pointer; white-space: nowrap;
    }
    .code-editor-toolbar button:hover { background: #505050; color: #fff; }
    .editor-area {
      position: relative; min-height: 150px;
    }
    .editor-area pre {
      margin: 0; padding: 0.6rem 0.6rem 0.6rem 3rem; background: transparent; color: #d4d4d4;
      font-family: inherit; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
      overflow: auto; pointer-events: none; min-height: 150px; border: none; outline: none;
    }
    .editor-area textarea {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0.6rem 0.6rem 0.6rem 3rem;
      background: transparent; color: transparent; caret-color: #fff; border: none; outline: none;
      font-family: inherit; font-size: 0.9rem; line-height: 1.6; resize: vertical; tab-size: 2;
      white-space: pre-wrap; word-wrap: break-word; overflow: auto;
    }
    .editor-area textarea::selection { background: rgba(100, 150, 255, 0.4); }
    .line-numbers {
      position: absolute; left: 0; top: 0; bottom: 0; width: 2.5rem; background: #2d2d2d; color: #858585;
      font-family: inherit; font-size: 0.9rem; line-height: 1.6; padding: 0.6rem 0.3rem; text-align: right;
      user-select: none; pointer-events: none; overflow: hidden; white-space: pre; z-index: 2;
    }
    .hl-tag { color: #569cd6; } .hl-attr { color: #9cdcfe; } .hl-value { color: #ce9178; }
    .hl-latex { color: #d7ba7d; } .hl-brace { color: #ffd700; } .hl-text { color: #d4d4d4; }

    .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: #ffc107; color: #000; }
    .btn-secondary { background: var(--c-text-muted); color: #fff; }
    .updates-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .updates-table th, .updates-table td { padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
    .message { margin: 1rem 0; font-size: 0.9rem; }

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="admin-container">
        <h2>Manage Updates</h2>

        

        <!-- ========== 新增表单 ========== -->
        <div class="form-section">
          <h3>Add New Update</h3>
          <form id="addUpdateForm">
            <div class="form-group">
              <label>Badge Style:
                <select id="newBadge" required>
                  <option value="info">Info</option>
                  <option value="new">New</option>
                  <option value="warning">Warning</option>
                </select>
              </label>
            </div>
            <div class="form-group">
              <label>Badge Text: <input type="text" id="newBadgeText" required /></label>
            </div>
            <div class="form-group">
              <label>Title (optional): <input type="text" id="newTitle" /></label>
            </div>
            <div class="form-group">
              <label>Content (HTML / LaTeX):</label>
              <div class="code-editor-wrapper" id="newContentWrapper">
                <div class="editor-area">
                  <div class="line-numbers" id="newContentLineNumbers"></div>
                  <pre id="newContentHighlight"></pre>
                  <textarea id="newContent" rows="4" required></textarea>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label>
                <input type="checkbox" id="newLocked"> Locked (only root can delete/edit)
              </label>
            </div>
            <button type="submit" class="btn btn-primary">Add Update</button>
          </form>
        </div>

        <h3>Existing Updates</h3>
        <table class="updates-table">
          <thead><tr><th>Badge</th><th>Time</th><th>Title</th><th>Content</th><th>Locked</th><th>Actions</th></tr></thead>
          <tbody id="updatesList"></tbody>
        </table>
        <div id="message" class="message"></div>
      </div>
    </main>
