<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/arch-render.js"></script>
  

<meta charset="UTF-8">
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  if (localStorage.getItem('pageTransition') === 'off') return;
  if (sessionStorage.getItem('__pt') !== 'in') return;
  // ⭐ 铺的是"遮罩色"，不是页面底色
  document.documentElement.style.background = (t === 'dark' ? '#0d1117' : '#0f3460');
}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/pageload.js" defer></script>
  <title>Mark Submissions - WYK Maths Team</title><link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://cdn.amcharts.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.amcharts.com">

<link rel="stylesheet" href="/styles.css" />
  <style>
    .sub-row { display: flex; align-items: center; padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
    .sub-row.highlight { background: #ffffcc; }
    .sub-id { font-family: monospace; margin-right: 1rem; }
    .btn { padding: 0.3rem 0.8rem; }
  </style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">Loading...</main>
    <!-- <button class="sidebar-toggle" id="sidebarToggle">☰</button> -->
  </div>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/heartbeat.js"></script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/pk-invite.js"></script>
  <script>
    if(isLoggedIn())apiCall('/api/users?action=markAdminVisit', 'POST').catch(() => {});
    if (!isLoggedIn() || (getCurrentUser()?.role !== 'admin' && getCurrentUser()?.role !== 'root')) {
      window.location.href = '/index.html';
    }
    async function load() {
      const data = await apiCall('/api/admin?action=markerList');
      if (!data.success) return;
      const mc = document.getElementById('mainContent');
      mc.innerHTML = `<h2>Image Submissions to Mark</h2>`;
      if (data.submissions.length === 0) mc.innerHTML += '<p>All caught up!</p>';
      else {
        let html = '';
        data.submissions.forEach(s => {
          html += `<div class="sub-row highlight">
            <span class="sub-id">${s.subid}</span>
            <span>${s.username} — ${s.problemId}</span>
            <span style="margin-left: auto;">${new Date(s.timestamp).toLocaleString()}</span>
            <a href="/admin/marker/${s.subid}" class="btn btn-primary">Mark</a>
          </div>`;
        });
        mc.innerHTML += html;
      }
    }
    load();
  </script>
</body>
</html>
