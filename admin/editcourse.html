<style>
  .ce-wrap { max-width: 1400px; margin: 20px auto; padding: 0 18px; }
  .ce-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .ce-head h2 { margin:0; }
  .ce-head .ce-back { margin-left:auto; text-decoration:none; color:var(--accent); }

  .ce-grid { display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
  @media (max-width: 1000px) { .ce-grid { grid-template-columns:1fr; } }

  .ce-panel { background:var(--card-bg); border:1px solid var(--border-color); border-radius:12px; padding:16px; }
  .ce-row { margin-bottom:12px; }
  .ce-row label { display:block; font-size:.78rem; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; color:var(--text-secondary); margin-bottom:5px; }
  .ce-row input[type=text], .ce-row select {
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border-color);
    background:var(--bg-color); color:var(--text-primary); font-size:.94rem;
  }
  .ce-row textarea {
    width:100%; min-height:520px; padding:11px 13px; border-radius:8px;
    border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-primary);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size:.86rem; line-height:1.55;
    resize: vertical;
  }
  .ce-tip { font-size:.76rem; color:var(--text-secondary); margin-top:6px; line-height:1.5; }
  .ce-tip code { background:rgba(142,92,247,.14); padding:1px 5px; border-radius:4px; }

  .ce-actions { display:flex; gap:10px; margin-top:14px; }
  .ce-actions button { padding:9px 20px; border-radius:8px; border:none; cursor:pointer; font-weight:700; }
  #ceSave { background:linear-gradient(135deg,#9b6cf7,#6a3fc9); color:#fff; }
  #ceSave:disabled { opacity:.55; cursor:not-allowed; }
  .ce-msg { font-size:.85rem; margin-left:8px; }
  .ce-msg.err { color:#e74c3c; }
  .ce-msg.ok { color:#27ae60; }

  /* 预览区复用课程页的样式（子集） */
  .ce-preview { max-height: calc(100vh - 220px); overflow:auto; padding:4px 6px; }
  .ce-preview .course-body { background:transparent; border:none; padding:0; }
  .c-header { font-size:1.3rem; font-weight:800; margin:22px 0 9px; padding-bottom:6px; border-bottom:2px solid var(--accent); }
  .c-subheader { font-size:1.02rem; font-weight:700; margin:16px 0 7px; }
  .c-red { color:#d93025; font-weight:600; }
  .c-box { display:inline-block; padding:2px 9px; border-radius:6px;
    background:rgba(142,92,247,.16); border:1px solid rgba(142,92,247,.35);
    color:#6a3fc9; font-weight:700; font-size:.95em; }
  [data-theme="dark"] .c-box { background:rgba(142,92,247,.24); color:#cbb4ff; }

  .ce-prob-stub {
    margin:16px 0; padding:12px 14px; border:1px dashed rgba(142,92,247,.5);
    border-radius:10px; background:rgba(142,92,247,.08);
    font-family:ui-monospace,Menlo,monospace; font-size:.84rem; color:var(--accent);
  }
</style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="ce-wrap">
        <div class="ce-head">
          <h2 id="ceTitle">Edit Course</h2>
          <a class="ce-back" href="/admin/course"><i class="fas fa-arrow-left"></i> Back to list</a>
        </div>
        <div class="ce-grid">
          <div class="ce-panel">
            <div class="ce-row"><label>Track</label>
              <select id="ceTrack">
                <option value="M">M — Compulsory</option>
                <option value="M2">M2 — Extended</option>
                <option value="MO">MO — Olympiad</option>
              </select>
            </div>
            <div class="ce-row"><label>ID</label>
              <input type="text" id="ceId" placeholder="1, 2, intro, kinematics…" autocomplete="off">
              <div class="ce-tip">Unique inside the track. Editable later — changing it also moves student progress.</div>
            </div>
            <div class="ce-row"><label>Topic</label>
              <input type="text" id="ceTopic" placeholder="Topic name shown in the table" autocomplete="off">
            </div>
            <div class="ce-row"><label>Difficulty</label>
              <select id="ceDifficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="challenging">Challenging</option>
                <option value="insane">Insane</option>
              </select>
            </div>
            <div class="ce-row"><label>Content (HTML)</label>
              <textarea id="ceContent" spellcheck="false" placeholder="&lt;h2 class=&quot;c-header&quot;&gt;Introduction&lt;/h2&gt;&#10;&lt;p&gt;Solve $x^2=4$.&lt;/p&gt;&#10;&lt;div pid=&quot;HA0001&quot;&gt;&lt;/div&gt;"></textarea>
              <div class="ce-tip">
                Available classes: <code>.c-header</code> <code>.c-subheader</code> <code>.c-red</code> <code>.c-box</code><br>
                Embed a problem with <code>&lt;div pid="HA0001"&gt;&lt;/div&gt;</code>. KaTeX works with $…$ and $$…$$.
              </div>
            </div>
            <div class="ce-actions">
              <button type="button" id="ceSave">Save</button>
              <span class="ce-msg" id="ceMsg"></span>
            </div>
          </div>
          <div class="ce-panel">
            <label style="display:block;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">Live preview</label>
            <div class="ce-preview"><div class="course-body" id="cePreview"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/js/auth.js?v=8368eebd"></script>
  <script src="/assets/js/app.js?v=8368eebd"></script>
  <script src="/assets/js/topbar.js?v=8368eebd"></script>
  <script src="/assets/js/sidebar.js?v=8368eebd"></script>
  <script src="/assets/js/heartbeat.js?v=8368eebd"></script>
  <script src="/assets/js/pk-invite.js?v=8368eebd"></script>
  <script src="/assets/js/pages/admin-course-editor.js?v=8368eebd"></script>
  <script src="/assets/js/pk-notify.js?v=8368eebd"></script>
</body>
</html>
