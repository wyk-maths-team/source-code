<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="admin-container">
        <h2>Manage Users</h2>
        <div class="form-section">
          <h3>Add New User</h3>
            <form id="addUserForm">
            <div class="form-group">
              <label>Username: <input type="text" id="newUsername" required autocomplete="off" /></label>
            </div>
            <div class="form-group">
              <label>Password: <input type="password" id="newPassword" required autocomplete="new-password" /></label>
            </div>
            <div class="form-group">
              <label>Display Name: <input type="text" id="newDisplayName" /></label>
            </div>
            <div class="form-group">
              <label>Real Name: <input type="text" id="newRealName" maxlength="60" /></label>
            </div>
            <div class="form-group" id="roleSelectorGroup">
              <label>Role:
                <select id="newRole">
                  <option value="student">Student</option>
                  <option value="admin" id="adminOption">Admin</option>
                </select>
              </label>
            </div>
            <button type="submit" class="btn btn-primary">Add User</button>
          </form>
        </div>
        <h3>Existing Users</h3>
        <table class="users-table">
          <thead><tr><th>Display Name</th><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="usersList"></tbody>
        </table>
        <div id="message" class="message"></div>
      </div>
    </main>
