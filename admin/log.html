<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Logs - WYK Maths Team</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" as="style">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
  <style>
    .log-container { background: var(--card-bg); border-radius: 4px; padding: 1.5rem; }

    /* ===== Filter bar ===== */
    .filter-bar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      align-items: center;
    }
    .filter-bar input,
    .filter-bar select {
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .filter-bar input:focus { outline: none; border-color: var(--accent); }
    .filter-bar .btn {
      padding: 0.4rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity .15s;
    }
    .filter-bar .btn:hover { opacity: .85; }
    .filter-bar .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .filter-bar .btn-secondary { background: #6c757d; color: #fff; border-color: #6c757d; }

    /* ===== Table ===== */
    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .log-table th,
    .log-table td {
      padding: 0.6rem 0.7rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      vertical-align: top;
    }
    .log-table th {
      background: #e9ecef;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
    }
    [data-theme="dark"] .log-table th { background: #2d2d2d; color: #c9d1d9; }
    .log-table tbody tr:hover td { background: rgba(0,0,0,.025); }
    [data-theme="dark"] .log-table tbody tr:hover td { background: rgba(255,255,255,.04); }

    .log-time {
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .log-operator {
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ===== Action badge ===== */
    .log-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 11px;
      font-size: 0.76rem;
      font-weight: 700;
      font-family: 'Consolas', monospace;
      white-space: nowrap;
    }
    .log-action .ico { font-size: 0.85em; line-height: 1; }
    .log-action.create  { background: rgba(46,204,113,.16); color: #2e7d32; }
    .log-action.change  { background: rgba(74,144,217,.16); color: #2a6cb0; }
    .log-action.delete  { background: rgba(231,76,60,.16);  color: #c0392b; }
    .log-action.upload  { background: rgba(155,89,182,.16); color: #7d3c98; }
    .log-action.set     { background: rgba(241,196,15,.2);  color: #b7950b; }
    .log-action.neutral { background: rgba(0,0,0,.06);      color: var(--text-secondary); }
    [data-theme="dark"] .log-action.create  { background: rgba(46,204,113,.2);  color: #8fdf8f; }
    [data-theme="dark"] .log-action.change  { background: rgba(74,144,217,.22); color: #8ec3ff; }
    [data-theme="dark"] .log-action.delete  { background: rgba(231,76,60,.22);  color: #ff9b8f; }
    [data-theme="dark"] .log-action.upload  { background: rgba(155,89,182,.22); color: #d0a2e8; }
    [data-theme="dark"] .log-action.set     { background: rgba(241,196,15,.22); color: #ffe066; }
    [data-theme="dark"] .log-action.neutral { background: rgba(255,255,255,.08); color: #b0b8c0; }

    /* ===== Target ===== */
    .log-target {
      font-family: 'Consolas', monospace;
      font-size: 0.83rem;
      white-space: nowrap;
    }
    .log-target a { color: var(--accent); }
    .log-target .coll {
      color: var(--text-secondary);
      font-size: 0.78em;
    }

    /* ===== Details / expandable ===== */
    .details-cell details { display: inline-block; }
    .details-cell summary {
      cursor: pointer;
      list-style: none;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      font-size: 0.82rem;
      color: var(--text-secondary);
      user-select: none;
      transition: border-color .15s, color .15s;
    }
    .details-cell summary::-webkit-details-marker { display: none; }
    .details-cell summary:hover { border-color: var(--accent); color: var(--accent); }
    .details-cell summary::before {
      content: '▸';
      display: inline-block;
      margin-right: 6px;
      transition: transform .15s;
    }
    .details-cell details[open] summary::before { transform: rotate(90deg); }
    .details-cell details[open] summary { border-color: var(--accent); color: var(--accent); }
    .details-content {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(0,0,0,.025);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      min-width: 320px;
      max-width: 640px;
    }
    [data-theme="dark"] .details-content { background: rgba(255,255,255,.03); }

    /* ===== Diff / KV tables ===== */
    .diff-table,
    .kv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      font-family: 'Consolas', monospace;
    }
    .diff-table th,
    .kv-table th {
      background: transparent;
      padding: 4px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .diff-table td,
    .kv-table td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
      word-break: break-word;
      white-space: pre-wrap;
      max-width: 260px;
    }
    .diff-table tr:last-child td,
    .kv-table tr:last-child td { border-bottom: none; }
    .diff-table td:first-child,
    .kv-table td:first-child {
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      width: 1px;
    }
    .diff-table .diff-del {
      background: rgba(231,76,60,.08);
      color: #c0392b;
    }
    .diff-table .diff-add {
      background: rgba(46,204,113,.08);
      color: #2e7d32;
    }
    [data-theme="dark"] .diff-table .diff-del { color: #ff9b8f; }
    [data-theme="dark"] .diff-table .diff-add { color: #8fdf8f; }

    .json-block {
      margin: 0;
      font-family: 'Consolas', monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-primary);
      max-height: 320px;
      overflow-y: auto;
    }

    /* ===== Pagination ===== */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.85rem;
      transition: background .15s;
    }
    .page-btn:hover:not(:disabled):not(.active) { background: rgba(74,144,217,.1); }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading-msg { text-align: center; padding: 2rem; color: var(--text-secondary); }
    .error-msg { text-align: center; padding: 2rem; color: var(--danger); }
  </style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="log-container">
        <h2>Audit Logs</h2>
        <div class="filter-bar">
          <input type="text" id="filterAction" placeholder="Filter by action..." />
          <input type="text" id="filterOperator" placeholder="Filter by operator..." />
          <button id="applyFilterBtn" class="btn btn-primary">Apply</button>
          <button id="clearFilterBtn" class="btn btn-secondary">Clear</button>
        </div>
        <div id="logList"><div class="loading-msg">Loading...</div></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    if (!isLoggedIn() || (getCurrentUser()?.role !== 'admin' && getCurrentUser()?.role !== 'root')) {
      window.location.href = '/index.html';
    }

    let currentPage = 1;
    const limit = 20;
    let totalPages = 1;
    let filterAction = '';
    let filterOperator = '';

    // ============ 工具 ============
    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    // HKO 時區，YYYY-MM-DD HH:MM:SS
    function formatTime(ts) {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '—';
      const pad = n => String(n).padStart(2, '0');
      const localTime = d.getTime() + 8 * 3600000;
      const ld = new Date(localTime);
      return `${ld.getUTCFullYear()}-${pad(ld.getUTCMonth() + 1)}-${pad(ld.getUTCDate())} ` +
             `${pad(ld.getUTCHours())}:${pad(ld.getUTCMinutes())}:${pad(ld.getUTCSeconds())}`;
    }

    // 值轉字串，長度上限
    function fmtVal(v, maxLen = 400) {
      if (v === null || v === undefined) return '<i style="color:var(--text-secondary);">null</i>';
      let s;
      if (typeof v === 'object') {
        try { s = JSON.stringify(v, null, 0); }
        catch { s = String(v); }
      } else {
        s = String(v);
      }
      if (s.length > maxLen) s = s.slice(0, maxLen) + '…';
      return escapeHtml(s);
    }

    // ============ 分類器 ============
    // 回傳: { kind, class, icon, summary, body }
    //   kind: 'change' | 'create' | 'delete' | 'details' | 'empty'
    //   body: HTML 字串（展開後顯示的內容）
    function classifyEntry(entry) {
      // 1) 新格式：problem_change
      if (entry.changes && typeof entry.changes === 'object') {
        const fields = Object.keys(entry.changes);
        const body = renderChangesTable(entry.changes);
        return {
          kind: 'change',
          class: 'change',
          icon: '✎',
          summary: fields.length === 1
            ? `field: ${fields[0]}`
            : `${fields.length} fields changed`,
          body
        };
      }

      // 2) 新格式：problem_create（有 after）
      if (entry.after && typeof entry.after === 'object') {
        const body = renderObjectTable(entry.after, 'After');
        return {
          kind: 'create',
          class: 'create',
          icon: '＋',
          summary: 'New record',
          body
        };
      }

      // 3) 新格式：problem_delete（有 backup）
      if (entry.backup && typeof entry.backup === 'object') {
        const body = renderObjectTable(entry.backup, 'Backup (full document)');
        return {
          kind: 'delete',
          class: 'delete',
          icon: '🗑',
          summary: 'Deleted · backup saved',
          body
        };
      }

      // 4) 舊格式：有 details
      if (entry.details !== undefined) {
        let body;
        if (typeof entry.details === 'object' && entry.details !== null) {
          body = renderObjectTable(entry.details, 'Details');
        } else {
          body = `<pre class="json-block">${escapeHtml(String(entry.details))}</pre>`;
        }
        return {
          kind: 'details',
          class: classForAction(entry.action),
          icon: iconForAction(entry.action),
          summary: 'details',
          body
        };
      }

      // 5) 甚麼都沒有
      return {
        kind: 'empty',
        class: 'neutral',
        icon: '·',
        summary: '—',
        body: ''
      };
    }

    function classForAction(action) {
      if (/create|new/i.test(action)) return 'create';
      if (/change|update|edit|rejudge/i.test(action)) return 'change';
      if (/delete|remove/i.test(action)) return 'delete';
      if (/upload/i.test(action)) return 'upload';
      if (/set|add|like|favorite/i.test(action)) return 'set';
      return 'neutral';
    }

    function iconForAction(action) {
      if (/create|new/i.test(action)) return '＋';
      if (/change|update|edit|rejudge/i.test(action)) return '✎';
      if (/delete|remove/i.test(action)) return '🗑';
      if (/upload/i.test(action)) return '↑';
      if (/set|add|like|favorite/i.test(action)) return '⚙';
      return '·';
    }

    // ============ 渲染器 ============
    function renderChangesTable(changes) {
      const rows = Object.entries(changes).map(([field, pair]) => {
        const before = pair && typeof pair === 'object' ? pair.before : undefined;
        const after  = pair && typeof pair === 'object' ? pair.after  : undefined;
        return `<tr>
          <td>${escapeHtml(field)}</td>
          <td class="diff-del">${fmtVal(before)}</td>
          <td class="diff-add">${fmtVal(after)}</td>
        </tr>`;
      }).join('');
      return `<table class="diff-table">
        <thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function renderObjectTable(obj, title) {
      const skip = new Set(['_id']);
      const rows = Object.entries(obj)
        .filter(([k]) => !skip.has(k))
        .map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td>${fmtVal(v)}</td></tr>`)
        .join('');
      return `<table class="kv-table">
        <thead><tr><th colspan="2">${escapeHtml(title)}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // Target 列（collection · problemId）
    function renderTarget(entry) {
      const parts = [];
      if (entry.problemId) {
        parts.push(
          `<a href="/problems/${encodeURIComponent(entry.problemId)}">${escapeHtml(entry.problemId)}</a>`
        );
      }
      if (entry.collection) {
        parts.push(`<span class="coll">${escapeHtml(entry.collection)}</span>`);
      }
      if (parts.length === 0) return '<span style="color:var(--text-secondary);">—</span>';
      return `<span class="log-target">${parts.join(' · ')}</span>`;
    }

    // ============ 列表 ============
    function renderLogs(logs) {
      const container = document.getElementById('logList');
      if (!logs || logs.length === 0) {
        container.innerHTML = '<div class="loading-msg">No logs found.</div>';
        return;
      }
      let html = `<table class="log-table">
        <thead><tr>
          <th>Time</th>
          <th>Action</th>
          <th>Operator</th>
          <th>Target</th>
          <th>Details</th>
        </tr></thead><tbody>`;

      for (const entry of logs) {
        const info = classifyEntry(entry);
        const time = formatTime(entry.timestamp);
        const operator = entry.operator || 'system';

        let detailsCell;
        if (info.body) {
          detailsCell = `<details>
            <summary>${escapeHtml(info.summary)}</summary>
            <div class="details-content">${info.body}</div>
          </details>`;
        } else {
          detailsCell = `<span style="color:var(--text-secondary);">${escapeHtml(info.summary)}</span>`;
        }

        html += `<tr>
          <td class="log-time">${escapeHtml(time)}</td>
          <td>
            <span class="log-action ${info.class}">
              <span class="ico">${info.icon}</span>${escapeHtml(entry.action || '')}
            </span>
          </td>
          <td class="log-operator">${escapeHtml(operator)}</td>
          <td>${renderTarget(entry)}</td>
          <td class="details-cell">${detailsCell}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderPagination(page, total) {
      const pagination = document.getElementById('pagination');
      if (totalPages <= 1) { pagination.innerHTML = ''; return; }
      let html = '';
      html += `<button class="page-btn" onclick="goToPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goToPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>›</button>`;
      pagination.innerHTML = html;
    }

    window.goToPage = function (newPage) {
      if (newPage < 1 || newPage > totalPages) return;
      currentPage = newPage;
      loadLogs();
    };

    async function loadLogs() {
      const container = document.getElementById('logList');
      container.innerHTML = '<div class="loading-msg">Loading...</div>';
      try {
        const params = new URLSearchParams({ page: currentPage, limit });
        if (filterAction) params.set('actionFilter', filterAction);
        if (filterOperator) params.set('operatorFilter', filterOperator);
        const data = await apiCall(`/api/admin?action=logs&${params.toString()}`);
        if (data.success) {
          totalPages = data.totalPages;
          renderLogs(data.logs);
          renderPagination(data.page, data.total);
        } else {
          container.innerHTML = `<div class="error-msg">${escapeHtml(data.message || 'Failed to load logs')}</div>`;
        }
      } catch (err) {
        container.innerHTML = '<div class="error-msg">Network error</div>';
      }
    }

    document.getElementById('applyFilterBtn').addEventListener('click', () => {
      filterAction = document.getElementById('filterAction').value.trim();
      filterOperator = document.getElementById('filterOperator').value.trim();
      currentPage = 1;
      loadLogs();
    });
    document.getElementById('clearFilterBtn').addEventListener('click', () => {
      document.getElementById('filterAction').value = '';
      document.getElementById('filterOperator').value = '';
      filterAction = '';
      filterOperator = '';
      currentPage = 1;
      loadLogs();
    });

    loadLogs();
  </script>
</body>
</html>
