    /* ── 中性色变量（由 tools/extract-colors.mjs 生成）──────────────
       原先写死在内联样式里的浅色背景 / 深色文字 / 浅灰边框，抽取成
       变量后暗色与科幻主题只需覆盖取值，不必逐条重写规则。
       语义色（成功绿、错误红、警告橙）与代码高亮色刻意保留，
       它们在深色背景下依然成立。 */
    :root {
      --c-surface: #ffffff;
      --c-surface-sunken: #f8f9fa;
      --c-surface-raised: #f0f0f0;
      --c-surface-muted: #e9ecef;
      --c-border: #dddddd;
      --c-border-strong: #bbbbbb;
      --c-text: #333333;
      --c-text-muted: #666666;
      --c-text-subtle: #999999;
    }
    :root[data-theme="dark"] {
      --c-surface: #161b22;
      --c-surface-sunken: #0d1117;
      --c-surface-raised: #21262d;
      --c-surface-muted: #21262d;
      --c-border: #30363d;
      --c-border-strong: #484f58;
      --c-text: #c9d1d9;
      --c-text-muted: #8b949e;
      --c-text-subtle: #6e7681;
    }
    :root[data-theme="scifi"] {
      --c-surface: #09101a;
      --c-surface-sunken: #070d15;
      --c-surface-raised: #0f2231;
      --c-surface-muted: #101b26;
      --c-border: #14313f;
      --c-border-strong: #1e4a5e;
      --c-text: #c6eeff;
      --c-text-muted: #6c8fa3;
      --c-text-subtle: #546f80;
    }

    .marker-container {
      background: var(--card-bg);
      border-radius: 4px;
      padding: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .submission-info {
      margin-bottom: 1.5rem;
    }
    .submission-info p {
      margin: 0.3rem 0;
    }
    .problem-statement {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .image-preview {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }
    .image-container {
      position: relative;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .rotate-btn {
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .rotate-btn:hover {
      background: rgba(0,0,0,0.05);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .form-group textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
      min-height: 80px;
    }
    .form-group input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .btn {
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--c-text-muted); color: #fff; }
    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
