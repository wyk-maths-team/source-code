  <style>
    .marker-container {
      background: var(--card-bg);
      border-radius: 4px;
      padding: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .submission-info {
      margin-bottom: 1.5rem;
    }
    .submission-info p {
      margin: 0.3rem 0;
    }
    .problem-statement {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .image-preview {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }
    .image-container {
      position: relative;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .rotate-btn {
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .rotate-btn:hover {
      background: rgba(0,0,0,0.05);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .form-group textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
      min-height: 80px;
    }
    .form-group input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .btn {
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
