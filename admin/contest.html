<!DOCTYPE html>
<html lang="en">
<head>
  

<meta charset="UTF-8">
<script>(function(){try{
  if(sessionStorage.getItem('__pt')!=='in')return;
  var t=localStorage.getItem('theme')||'light';
  document.documentElement.style.background = t==='dark' ? '#0d1117' : '#f0f2f5';
}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/pageload.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Manage Contests - WYK Maths Team</title><link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
  <style>
    .contests-container { background: var(--card-bg); border-radius: 4px; padding: 1.2rem; box-shadow: var(--shadow-sm); }
    .contests-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .contests-table th, .contests-table td { padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border-color); text-align: left; }
    .contests-table th { background: #e9ecef; font-weight: 700; }
    .contest-row { cursor: pointer; transition: background 0.15s; }
    .contest-row:hover { background: var(--hover-bg); }
    .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; margin-right: 0.3rem; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-warning { background: #ffc107; color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .top-actions { margin-bottom: 1rem; }
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
    .pagination a { padding: 0.3rem 0.7rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--card-bg); color: var(--text-primary); text-decoration: none; }
    .pagination .active { background: var(--accent); color: #fff; }
    .badge-public { background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }
    .badge-private { background: #f8d7da; color: #721c24; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="loading-msg">Loading contests...</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    // 在 /admin/*.html 页面里
    if(isLoggedIn())apiCall('/api/users?action=markAdminVisit', 'POST').catch(() => {});
    if (!isLoggedIn() || (getCurrentUser()?.role !== 'admin' && getCurrentUser()?.role !== 'root')) {
      window.location.href = '/index.html';
    }

    const mainContainer = document.getElementById('mainContent');
    let currentPage = 1;
    const limit = 20;
    let totalPages = 1;

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    async function loadContests(page = 1) {
      try {
        const data = await apiCall(`/api/contests?action=list&page=${page}&limit=${limit}`);
        if (data.success) {
          totalPages = data.totalPages;
          currentPage = data.page;
          return data.contests;
        }
      } catch (err) { console.error(err); }
      return [];
    }

    function renderContests(contests) {
      let html = `<div class="contests-container">
        <div class="top-actions">
          <h2 style="display:inline-block; margin-right:1rem;">Manage Contests</h2>
          <button class="btn btn-primary" id="addContestBtn">Add Contest</button>
        </div>`;
      if (!contests.length) {
        html += '<p>No contests yet.</p>';
      } else {
        html += `<table class="contests-table">
          <thead><tr>
            <th>ID</th>
            <th>Name</th>
            <th>Public</th>
            <th>Participants</th>
            <th>Actions</th>
          </tr></thead><tbody>`;
        contests.forEach(c => {
          html += `<tr class="contest-row">
            <td onclick="window.location.href='/contest/${c.id}'">${c.id}</td>
            <td onclick="window.location.href='/contest/${c.id}'">${escapeHtml(c.name)}</td>
            <td onclick="window.location.href='/contest/${c.id}'">
              ${c.public !== false ? '<span class="badge-public">Public</span>' : '<span class="badge-private">Private</span>'}
            </td>
            <td onclick="window.location.href='/contest/${c.id}'">${c.contestantCount || 0}</td>
            <td>
              <button class="btn btn-warning" onclick="event.stopPropagation(); window.location.href='/admin/contests/${c.id}'">Edit</button>
              <button class="btn btn-danger" data-delete-id="${c.id}" onclick="event.stopPropagation();">Delete</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table>';

        let paginationHtml = '<div class="pagination">';
        for (let i = 1; i <= totalPages; i++) {
          paginationHtml += `<a class="${i === currentPage ? 'active' : ''}" href="javascript:void(0)" onclick="gotoPage(${i})">${i}</a>`;
        }
        paginationHtml += '</div>';
        html += paginationHtml;
      }
      html += '</div>';
      mainContainer.innerHTML = html;

      document.getElementById('addContestBtn')?.addEventListener('click', () => {
        window.location.href = '/admin/create/contest';
      });

      // ⭐ 只綁一次：用 data-delete-id
      document.querySelectorAll('.btn-danger[data-delete-id]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = Number(btn.dataset.deleteId);
          if (!confirm(`Delete contest #${id}?`)) return;
          btn.disabled = true;
          try {
            const res = await apiCall('/api/contests?action=adminDelete', 'DELETE', { id });
            if (res.success) {
              const contests = await loadContests(currentPage);
              renderContests(contests);
            } else {
              alert(res.message || 'Delete failed');
              btn.disabled = false;
            }
          } catch (err) {
            alert('Error: ' + err.message);
            btn.disabled = false;
          }
        });
      });
    }

    async function gotoPage(page) {
      const contests = await loadContests(page);
      renderContests(contests);
    }

    (async function init() {
      const contests = await loadContests(1);
      renderContests(contests);
    })();
  </script>
</body>
</html>
