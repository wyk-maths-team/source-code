  <style>
    .form-container {
      background: var(--card-bg);
      border-radius: 4px;
      padding: 2rem;
      max-width: 700px;
      margin: 2rem auto;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
    }
    .btn {
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .problem-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0.5rem;
    }
    .problem-table th, .problem-table td {
      padding: 0.3rem;
      border: 1px solid var(--border-color);
    }
    .problem-table th {
      background: #f0f0f0;
    }
    .problem-table select {
      width: 100%;
      padding: 0.3rem;
    }
    .add-problem-btn {
      margin-top: 0.5rem;
    }
        /* ⭐ 題目列表 textarea */
    .problem-list-input {
      width: 100%;
      min-height: 200px;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.9rem;
      line-height: 1.7;
      resize: vertical;
      background: var(--card-bg);
      color: var(--text-primary);
      outline: none;
      tab-size: 2;
    }
    .problem-list-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74,144,217,.15);
    }
    .problem-list-hint {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.6;
    }
    .problem-list-hint code {
      background: rgba(74,144,217,.12);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.85em;
    }
    /* ⭐ 解析預覽 */
    .problem-list-preview {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(74,144,217,.06);
      border: 1px solid rgba(74,144,217,.25);
      border-radius: 5px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.7;
      max-height: 120px;
      overflow-y: auto;
    }
    .problem-list-preview .pv-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 1px 0;
    }
    .problem-list-preview .pv-id {
      font-family: 'Consolas', monospace;
      color: var(--accent);
      font-weight: 600;
      min-width: 60px;
    }
    .problem-list-preview .pv-type {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .problem-list-preview .pv-type.numeric {
      background: rgba(74,144,217,.18);
      color: #4a90d9;
    }
    .problem-list-preview .pv-type.image {
      background: rgba(230,126,34,.18);
      color: #e67e22;
    }
    .problem-list-preview .pv-empty {
      color: var(--text-secondary);
      font-style: italic;
    }
