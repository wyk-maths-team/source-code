<style>
  .ep-bar {
    position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center;
    flex-wrap: wrap; padding: 12px 16px; margin-bottom: 18px;
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
  }
  .ep-bar h2 { margin: 0; font-size: 1rem; }

  #epReset { background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); }
  #epStatus { font-size: .82rem; }
  .ep-hint { font-size: .78rem; color: var(--text-secondary); width: 100%; }

  #epList { display: flex; flex-direction: column; gap: 18px; padding-bottom: 55vh; }
  .ep-card {
    background: var(--card-bg); border: 1px solid var(--border-color);

  .ep-stmt { font-size: .86rem; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }

  .ep-board {
    background-color: #fff; border: 1px solid var(--border-color); border-radius: 8px;
    transition: height .06s linear;
  }

  .ep-handle {
