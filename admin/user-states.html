  <style>
    .us-container { max-width: 1000px; margin: 0 auto; padding: 1rem; }

    .us-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
    }
    .us-title { margin: 0; font-size: 1.15rem; display: flex; align-items: center; gap: .5rem; }
    .us-toolbar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .us-search {
      padding: .5rem .8rem; font-size: .88rem; min-width: 240px;
      border: 1px solid var(--border-color); border-radius: 6px;
      background: var(--card-bg); color: var(--text-primary); font-family: inherit;
    }

    .us-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 10px; overflow: hidden;
    }

    /* ── 用户行（手风琴头）── */
    .us-user {
      display: flex; align-items: center; gap: .8rem;
      padding: .7rem 1rem; cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      transition: background .12s ease;
    }
    .us-user:last-child { border-bottom: none; }
    .us-user:hover { background: rgba(127,127,127,.06); }
    .us-user.open { background: rgba(74,144,217,.08); }
    .us-user .caret { width: 14px; color: var(--text-secondary); transition: transform .15s ease; }
    .us-user.open .caret { transform: rotate(90deg); }
    .us-user .uname { font-weight: 700; flex: 0 0 auto; }
    .us-user .ureal { color: var(--text-secondary); font-size: .82rem; flex: 1 1 auto; min-width: 0;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .us-user .urole {
      font-size: .68rem; padding: 1px 7px; border-radius: 8px;
      background: rgba(127,127,127,.18); color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .03em;
    }
    .us-user .urole.root { background: rgba(231,76,60,.18); color: #e74c3c; }
    .us-user .urole.admin { background: rgba(74,144,217,.18); color: var(--accent); }
    .us-user .ucount { font-size: .78rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

    /* ── 展开区 ── */
    .us-panel {
      border-bottom: 1px solid var(--border-color);
      background: rgba(127,127,127,.03);
      padding: .9rem 1rem 1rem;
    }
    .us-panel:last-child { border-bottom: none; }

    .us-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 6px;
      max-height: 340px; overflow-y: auto;
      padding: 2px;
    }

    .us-cell {
      border: 1px solid var(--border-color); border-radius: 6px;
      padding: 6px 8px; cursor: pointer; text-align: left;
      background: var(--card-bg); color: var(--text-primary);
      font-family: inherit; font-size: .74rem; line-height: 1.3;
      transition: transform .1s ease, box-shadow .1s ease;
      position: relative;
    }
    .us-cell:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .us-cell .pid { font-weight: 700; display: block; }
    .us-cell .st { font-size: .66rem; text-transform: uppercase; letter-spacing: .03em; opacity: .9; }

    .us-cell.passed { background: rgba(46,204,113,.18); border-color: #2ecc71; }
    .us-cell.failed { background: rgba(231,76,60,.15); border-color: #e74c3c; }
    .us-cell.not_started { background: rgba(127,127,127,.12); border-color: rgba(127,127,127,.3); }
    .us-cell.dirty { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* 点击后弹出的三选一 */
    .us-picker {
      position: fixed; z-index: 9999;
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.28);
      padding: 6px; min-width: 156px;
    }
    .us-picker button {
      display: block; width: 100%; text-align: left;
      padding: 6px 10px; border: none; border-radius: 5px;
      background: none; color: var(--text-primary); cursor: pointer;
      font-family: inherit; font-size: .8rem;
    }
    .us-picker button:hover { background: rgba(127,127,127,.14); }
    .us-picker button.cur { font-weight: 700; }

    .us-footer {
      display: flex; align-items: center; gap: .8rem;
      margin-top: .9rem; flex-wrap: wrap;
    }
    .us-save {
      padding: .5rem 1.3rem; border-radius: 6px; font-weight: 700;
      border: none; cursor: pointer; font-size: .85rem;
      background: var(--accent); color: #fff;
    }
    .us-save:disabled { opacity: .45; cursor: not-allowed; }
    .us-hint { font-size: .78rem; color: var(--text-secondary); }
    .us-dirty { font-size: .78rem; color: #e3a008; font-weight: 600; }

    .us-add {
      display: flex; gap: .5rem; margin-top: .7rem; flex-wrap: wrap;
    }
    .us-add input {
      padding: .4rem .7rem; font-size: .8rem; font-family: monospace;
      border: 1px solid var(--border-color); border-radius: 5px;
      background: var(--card-bg); color: var(--text-primary);
      min-width: 160px;
    }
    .us-add button {
      padding: .4rem .9rem; font-size: .8rem; border-radius: 5px;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--text-primary); cursor: pointer;
    }

    .us-err {
      background: rgba(231,76,60,.08); border: 1px solid rgba(231,76,60,.4);
      border-radius: 10px; padding: 1rem; color: #e74c3c; font-size: .88rem;
    }
    .us-empty { padding: 2rem; text-align: center; color: var(--text-secondary); }

    /* 图例 */
    .us-legend { display: flex; gap: .9rem; font-size: .74rem; color: var(--text-secondary); flex-wrap: wrap; }
    .us-legend span::before {
      content: ''; display: inline-block; width: 9px; height: 9px;
      border-radius: 2px; margin-right: 4px; vertical-align: middle;
    }
    .us-legend .l-passed::before { background: #2ecc71; }
    .us-legend .l-failed::before { background: #e74c3c; }
    .us-legend .l-not_started::before { background: rgba(127,127,127,.5); }
  </style>
