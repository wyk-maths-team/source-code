<!DOCTYPE html>
<html lang="en">
<head>
<script>window.__BUILD_V='d9634c1d';</script>
<meta charset="UTF-8" />
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit PK Problem - WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/css/styles.css?v=d9634c1d" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/assets/css/pages/admin-editpkproblem.css?v=d9634c1d" />
<script src="/assets/js/core/ui.js?v=d9634c1d"></script>
<script src="/assets/js/core/net.js?v=d9634c1d"></script>
<script src="/assets/js/core/api.js?v=d9634c1d"></script>
<script src="/assets/js/core/page.js?v=d9634c1d"></script>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="pk-admin-wrap">
        <div class="pk-admin-card">
          <h1><i class="fas fa-sword" style="color:var(--accent)"></i> Edit PK Problem</h1>
          <div class="subtitle" id="pkId">Loading…</div>

          <form id="pkForm">
            <div class="fg">
              <label>Statement (HTML / KaTeX)</label>
              <textarea id="pkStatement" required></textarea>
            </div>
                        <div class="fg">
              <label>Image upload</label>
              <div class="img-up-panel">
                <div class="img-up-bar">
                  <input type="file" id="pkImgFile" accept="image/*" style="display:none" />
                  <button type="button" id="pkImgPick">
                    <i class="fas fa-upload"></i> Upload image
                  </button>
                  <span class="hint">Max 2 MB · auto-compressed to 1920px</span>
                </div>
                <div class="img-up-progress" id="pkImgProgress">
                  <span class="spin"></span>
                  <span id="pkImgProgressText">Uploading…</span>
                </div>
                <div class="img-up-result" id="pkImgResult">
                  <img id="pkImgPreview" alt="preview" />
                  <div class="img-up-fields">
                    <div class="img-up-field">
                      <label>URL</label>
                      <input type="text" id="pkImgUrl" readonly />
                      <button type="button" id="pkImgCopyUrl"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="img-up-field">
                      <label>HTML</label>
                      <input type="text" id="pkImgHtml" readonly />
                      <button type="button" id="pkImgCopyHtml"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="img-up-field">
                      <label>Width</label>
                      <input type="number" id="pkImgWidth" min="40" max="1600" step="10" placeholder="auto (66.67%)" style="max-width:140px;font-family:inherit;padding:4px 8px;font-size:.8rem;" />
                      <button type="button" id="pkImgInsert" style="padding:4px 12px;">
                        <i class="fas fa-arrow-down"></i> Insert
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="fg">
              <label>Choices</label>
              <div id="pkChoices"></div>
              <button type="button" class="add-choice" id="pkAddChoice">
                <i class="fas fa-plus"></i> Add option
              </button>
            </div>

            <div class="fg">
              <label>Correct Answer</label>
              <div class="ans-picker" id="pkAnsPicker"></div>
            </div>

            <div class="btn-row">
              <button type="submit" class="btn-save" id="pkSaveBtn">
                <i class="fas fa-save"></i> Save
              </button>
              <a href="/admin" class="btn-cancel">Cancel</a>
            </div>
          </form>
          <div class="msg" id="pkMsg"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/auth.js?v=d9634c1d"></script>
  <script src="/assets/js/app.js?v=d9634c1d"></script>
  <script src="/assets/js/topbar.js?v=d9634c1d"></script>
  <script src="/assets/js/sidebar.js?v=d9634c1d"></script>

  <script src="/assets/js/pages/admin-editpkproblem.js?v=d9634c1d"></script>
</body>
</html>
