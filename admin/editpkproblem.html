<style>
  .pk-admin-wrap { max-width: 820px; margin: 0 auto; padding: 20px; }
  .pk-admin-card {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 12px; padding: 24px;
  }
  .pk-admin-card h1 {
    margin: 0 0 6px; font-size: 1.4rem;
    display: flex; align-items: center; gap: 10px;
  }
  .pk-admin-card .subtitle {
    color: var(--text-secondary); font-size: .85rem;
    margin-bottom: 22px; font-family: 'Consolas', monospace;
  }
  .fg { margin-bottom: 18px; }
  .fg label {
    display: block; font-weight: 600; font-size: .88rem;
    margin-bottom: 6px; color: var(--text-secondary);
  }
  .fg input[type="text"],
  .fg textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border-color); border-radius: 6px;
    background: var(--card-bg); color: var(--text-primary);
    font-family: inherit; font-size: .92rem;
    box-sizing: border-box;
  }
  .fg textarea {
    font-family: 'Consolas', monospace; font-size: .85rem;
    resize: vertical; min-height: 140px;
  }
  .fg input:focus, .fg textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .choice-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .choice-row .letter {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    border-radius: 50%; font-weight: 700;

  .choice-row input { flex: 1; }
  .choice-row .rm {
    flex-shrink: 0; width: 32px; height: 32px;
    border: 1px solid var(--border-color); border-radius: 6px;
    background: none; color: var(--danger);
    cursor: pointer; font-size: .9rem;
  }
  .choice-row .rm:hover { border-color: var(--danger); }
  .add-choice {
    margin-top: 4px; padding: 6px 14px;
    border: 1px dashed var(--border-color); border-radius: 6px;
    background: none; color: var(--text-secondary);
    cursor: pointer; font-size: .82rem; font-family: inherit;
  }
  .add-choice:hover { border-color: var(--accent); color: var(--accent); }
  .ans-picker {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
  }
  .ans-picker label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border: 2px solid var(--border-color);
    border-radius: 8px; cursor: pointer;
    font-weight: 700; font-family: 'Consolas', monospace;
    transition: all .15s;
  }
  .ans-picker label:hover { border-color: var(--accent); }
  .ans-picker input { display: none; }
  .ans-picker label.active {
    background: rgba(46,204,113,.12);
    border-color: #2ecc71;
    color: #2e7d32;
  }
  [data-theme="dark"] .ans-picker label.active { color: #8fdf8f; }
  .btn-row { display: flex; gap: 10px; margin-top: 24px; }
  .btn-row button {
    padding: 10px 22px; border-radius: 8px;
    border: none; font-weight: 700; font-size: .92rem;
    cursor: pointer; font-family: inherit;
  }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:hover:not(:disabled) { filter: brightness(1.1); }
  .btn-save:disabled { opacity: .5; cursor: not-allowed; }
  .btn-cancel {
    background: none; color: var(--text-secondary);
    border: 1px solid var(--border-color) !important;
    text-decoration: none; display: inline-block;
    padding: 10px 22px; border-radius: 8px; font-weight: 700;
  }
  .msg { margin-top: 14px; font-size: .9rem; min-height: 1.2em; }
    /* 图片上传 */
  .img-up-panel {
    margin-top: 10px; padding: 12px 14px;
    border: 1px dashed var(--border-color); border-radius: 8px;
    background: rgba(74,144,217,.03);
  }
  .img-up-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .img-up-bar button {
    padding: 7px 14px; border-radius: 6px;
    background: var(--accent); color: #fff;
    border: none; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: .85rem;
  }
  .img-up-bar button:hover { filter: brightness(1.1); }
  .img-up-bar .hint { font-size: .78rem; color: var(--text-secondary); }
  .img-up-progress {
    display: none; margin-top: 10px;
    font-size: .85rem; color: var(--accent);
    align-items: center; gap: 8px;
  }
  .img-up-progress.show { display: flex; }
  .img-up-progress .spin {
    width: 14px; height: 14px;
    border: 2px solid rgba(74,144,217,.25);
    border-top-color: var(--accent);
    border-radius: 50%; animation: imgSpin .7s linear infinite;
  }
  @keyframes imgSpin { to { transform: rotate(360deg); } }
  .img-up-result {
    display: none; gap: 14px; align-items: flex-start; flex-wrap: wrap;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--border-color);
  }
  .img-up-result.show { display: flex; }
  .img-up-result img {
    max-width: 180px; max-height: 140px;
    border-radius: 6px; border: 1px solid var(--border-color);
    background: #fafafa; object-fit: contain;
  }
  .img-up-fields {
    flex: 1; min-width: 240px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .img-up-field { display: flex; align-items: center; gap: 8px; }
  .img-up-field label {
    font-size: .75rem; color: var(--text-secondary);
    font-weight: 600; width: 40px; text-align: right; flex-shrink: 0;
  }
  .img-up-field input[type="text"] {
    flex: 1; padding: 6px 8px;
    border: 1px solid var(--border-color); border-radius: 4px;
    background: rgba(0,0,0,.02); color: var(--text-primary);
    font-family: 'Consolas', monospace; font-size: .78rem;
    min-width: 0;
  }
  .img-up-field button {
    padding: 4px 10px; border-radius: 4px;
    background: none; border: 1px solid var(--border-color);
    color: var(--text-primary); cursor: pointer;
    font-family: inherit; font-size: .75rem; font-weight: 600;
  }
  .img-up-field button:hover { border-color: var(--accent); color: var(--accent); }
</style>

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="pk-admin-wrap">
        <div class="pk-admin-card">
          <h1><i class="fas fa-sword" style="color:var(--accent)"></i> Edit PK Problem</h1>
          <div class="subtitle" id="pkId">Loading…</div>

          <form id="pkForm">
            <div class="fg">
              <label>Statement (HTML / KaTeX)</label>
              <textarea id="pkStatement" required></textarea>
            </div>
                        <div class="fg">
              <label>Image upload</label>
              <div class="img-up-panel">
                <div class="img-up-bar">
                  <input type="file" id="pkImgFile" accept="image/*" style="display:none" />
                  <button type="button" id="pkImgPick">
                    <i class="fas fa-upload"></i> Upload image
                  </button>
                  <span class="hint">Max 2 MB · auto-compressed to 1920px</span>
                </div>
                <div class="img-up-progress" id="pkImgProgress">
                  <span class="spin"></span>
                  <span id="pkImgProgressText">Uploading…</span>
                </div>
                <div class="img-up-result" id="pkImgResult">
                  <img id="pkImgPreview" alt="preview" />
                  <div class="img-up-fields">
                    <div class="img-up-field">
                      <label>URL</label>
                      <input type="text" id="pkImgUrl" readonly />
                      <button type="button" id="pkImgCopyUrl"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="img-up-field">
                      <label>HTML</label>
                      <input type="text" id="pkImgHtml" readonly />
                      <button type="button" id="pkImgCopyHtml"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="img-up-field">
                      <label>Width</label>
                      <input type="number" id="pkImgWidth" min="40" max="1600" step="10" placeholder="auto (66.67%)" style="max-width:140px;font-family:inherit;padding:4px 8px;font-size:.8rem;" />
                      <button type="button" id="pkImgInsert" style="padding:4px 12px;">
                        <i class="fas fa-arrow-down"></i> Insert
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="fg">
              <label>Choices</label>
              <div id="pkChoices"></div>
              <button type="button" class="add-choice" id="pkAddChoice">
                <i class="fas fa-plus"></i> Add option
              </button>
            </div>

            <div class="fg">
              <label>Correct Answer</label>
              <div class="ans-picker" id="pkAnsPicker"></div>
            </div>

            <div class="btn-row">
              <button type="submit" class="btn-save" id="pkSaveBtn">
                <i class="fas fa-save"></i> Save
              </button>
              <a href="/admin" class="btn-cancel">Cancel</a>
            </div>
          </form>
          <div class="msg" id="pkMsg"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/auth.js?v=46dacaea"></script>
  <script src="/assets/js/app.js?v=46dacaea"></script>
  <script src="/assets/js/topbar.js?v=46dacaea"></script>
  <script src="/assets/js/sidebar.js?v=46dacaea"></script>

  <script>
    const me = getCurrentUser();
    if (!isLoggedIn() || (me?.role !== 'admin' && me?.role !== 'root')) {
      window.location.href = '/index.html';
      throw new Error('Forbidden');
    }

    const pathMatch = location.pathname.match(/^\/admin\/pkproblems\/([^/]+)$/);
    const idFromPath = pathMatch ? decodeURIComponent(pathMatch[1]) : new URLSearchParams(location.search).get('id');
    if (!idFromPath) {
      document.getElementById('mainContent').innerHTML =
        '<div style="text-align:center;padding:60px;color:var(--danger)">Missing problem ID</div>';
      throw new Error('No id');
    }
        // ═══════════════ 图片上传 ═══════════════
    const pkImgPick      = document.getElementById('pkImgPick');
    const pkImgFile      = document.getElementById('pkImgFile');
    const pkImgProgress  = document.getElementById('pkImgProgress');
    const pkImgProgressTxt = document.getElementById('pkImgProgressText');
    const pkImgResult    = document.getElementById('pkImgResult');
    const pkImgPreview   = document.getElementById('pkImgPreview');
    const pkImgUrl       = document.getElementById('pkImgUrl');
    const pkImgHtml      = document.getElementById('pkImgHtml');
    const pkImgWidth     = document.getElementById('pkImgWidth');
    const pkImgInsert    = document.getElementById('pkImgInsert');
    const pkImgCopyUrl   = document.getElementById('pkImgCopyUrl');
    const pkImgCopyHtml  = document.getElementById('pkImgCopyHtml');

    let uploadedImageUrl = '';

    function buildImgHtml(url) {
      const w = (pkImgWidth.value || '').trim();
      const style = w
        ? `max-width:${w}px;width:100%;height:auto;display:block;margin:.6rem auto;`
        : `max-width:66.67%;width:100%;height:auto;display:block;margin:.6rem auto;`;
      return `<img src="${url}" alt="problem image" loading="lazy" style="${style}" />`;
    }

    function refreshImageFields() {
      if (!uploadedImageUrl) return;
      pkImgUrl.value = uploadedImageUrl;
      pkImgHtml.value = buildImgHtml(uploadedImageUrl);
    }

    function readAndCompress(file, maxWidth = 1920, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) return reject(new Error('Not an image'));
        if (file.size > 2 * 1024 * 1024) return reject(new Error('Image too large (max 2 MB)'));
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('Cannot decode image'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Cannot read file'));
        reader.readAsDataURL(file);
      });
    }

    async function uploadImage(file) {
      pkImgPick.disabled = true;
      pkImgResult.classList.remove('show');
      pkImgProgress.classList.add('show');
      pkImgProgressTxt.textContent = 'Compressing…';
      try {
        const base64 = await readAndCompress(file);
        pkImgProgressTxt.textContent = 'Uploading to GitHub…';
        const res = await apiCall('/api/problem?action=adminUploadImage', 'POST', {
          image: base64,
          problemId: idFromPath,
        });
        if (!res.success) throw new Error(res.message || 'Upload failed');
        uploadedImageUrl = res.url;
        pkImgPreview.src = res.url;
        refreshImageFields();
        pkImgResult.classList.add('show');
        pkImgProgress.classList.remove('show');
        pkMsg.textContent = '✓ Image uploaded';
        pkMsg.style.color = '#2e7d32';
      } catch (err) {
        pkImgProgress.classList.remove('show');
        pkMsg.textContent = 'Upload failed: ' + err.message;
        pkMsg.style.color = 'var(--danger)';
      } finally {
        pkImgPick.disabled = false;
      }
    }

    pkImgPick.addEventListener('click', () => pkImgFile.click());
    pkImgFile.addEventListener('change', () => {
      const f = pkImgFile.files && pkImgFile.files[0];
      pkImgFile.value = '';
      if (f) uploadImage(f);
    });
    pkImgWidth.addEventListener('input', refreshImageFields);

    // ⭐ Ctrl+V 粘贴图片上传
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;

      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        // 只看文件类型的项
        if (it.kind !== 'file') continue;
        if (!it.type || !it.type.startsWith('image/')) continue;

        const file = it.getAsFile();
        if (!file) continue;

        // 阻止把二进制垃圾或文件名文本粘进 textarea
        e.preventDefault();

        // 覆盖式地触发上传（跟选文件同一个流程）
        uploadImage(file);
        return;
      }
    });

    pkImgInsert.addEventListener('click', () => {
      if (!uploadedImageUrl) return;
      const ta = document.getElementById('pkStatement');
      const html = buildImgHtml(uploadedImageUrl);
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const after  = ta.value.slice(pos);
      const nl = (before.length && !before.endsWith('\n')) ? '\n' : '';
      ta.value = before + nl + html + '\n' + after;
      const newPos = pos + nl.length + html.length + 1;
      ta.setSelectionRange(newPos, newPos);
      ta.focus();
    });

    function copyTo(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => { btn.innerHTML = old; }, 1200);
      }).catch(() => (window.DSHUI ? DSHUI.toast('Copy failed', 'err') : alert('Copy failed')));
    }
    pkImgCopyUrl.addEventListener('click', () => { if (uploadedImageUrl) copyTo(uploadedImageUrl, pkImgCopyUrl); });
    pkImgCopyHtml.addEventListener('click', () => { if (uploadedImageUrl) copyTo(buildImgHtml(uploadedImageUrl), pkImgCopyHtml); });
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let choices = ['', '', '', ''];
    let currentAns = 'A';

    function esc(s) { return (window.DSHUI && window.DSHUI.esc) || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; }); }; }

    function renderChoices() {
      const wrap = document.getElementById('pkChoices');
      wrap.innerHTML = choices.map((c, i) => `
        <div class="choice-row">
          <span class="letter">${LETTERS[i]}</span>
          <input type="text" data-idx="${i}" value="${esc(c)}" placeholder="Option ${LETTERS[i]}" />
          ${choices.length > 2
            ? `<button type="button" class="rm" data-rm="${i}" title="Remove"><i class="fas fa-times"></i></button>`
            : ''}
        </div>
      `).join('');

      wrap.querySelectorAll('input[data-idx]').forEach(inp => {
        inp.addEventListener('input', () => {
          choices[Number(inp.dataset.idx)] = inp.value;
        });
      });
      wrap.querySelectorAll('button[data-rm]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.rm);
          choices.splice(idx, 1);
          if (choices.length < 2) choices.push('');
          // 修正 ans
          if (LETTERS.indexOf(currentAns) >= choices.length) {
            currentAns = LETTERS[0];
          }
          renderChoices();
          renderAnsPicker();
        });
      });
    }

    function renderAnsPicker() {
      const wrap = document.getElementById('pkAnsPicker');
      wrap.innerHTML = choices.map((_, i) => {
        const L = LETTERS[i];
        return `
          <label class="${currentAns === L ? 'active' : ''}" data-ans="${L}">
            <input type="radio" name="ans" value="${L}" ${currentAns === L ? 'checked' : ''} />
            ${L}
          </label>
        `;
      }).join('');
      wrap.querySelectorAll('label[data-ans]').forEach(lbl => {
        lbl.addEventListener('click', () => {
          currentAns = lbl.dataset.ans;
          renderAnsPicker();
        });
      });
    }

    document.getElementById('pkAddChoice').addEventListener('click', () => {
      if (choices.length >= 10) return (window.DSHUI ? DSHUI.toast('Max 10 options', 'err') : alert('Max 10 options'));
      choices.push('');
      renderChoices();
      renderAnsPicker();
    });

    async function load() {
      document.getElementById('pkId').textContent = idFromPath;
      try {
        const data = await apiCall(`/api/admin-pkproblem?action=get&id=${encodeURIComponent(idFromPath)}`);
        if (!data.success) throw new Error(data.message);
        const p = data.problem;
        document.getElementById('pkStatement').value = p.statement || '';
        choices = Array.isArray(p.choice) && p.choice.length >= 2 ? [...p.choice] : ['', '', '', ''];
        currentAns = String(p.ans || 'A').toUpperCase();
        renderChoices();
        renderAnsPicker();
      } catch (err) {
        document.getElementById('pkMsg').textContent = 'Load failed: ' + err.message;
        document.getElementById('pkMsg').style.color = 'var(--danger)';
      }
    }

    document.getElementById('pkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('pkSaveBtn');
      const msg = document.getElementById('pkMsg');
      const statement = document.getElementById('pkStatement').value;

      if (choices.some(c => !c.trim())) {
        msg.textContent = 'All options must be filled';
        msg.style.color = 'var(--danger)';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
      msg.textContent = '';

      try {
        const res = await apiCall('/api/admin-pkproblem?action=update', 'PUT', {
          id: idFromPath,
          statement,
          choice: choices,
          ans: currentAns,
        });
        if (res.success) {
          msg.textContent = '✓ Saved';
          msg.style.color = '#2e7d32';
        } else {
          msg.textContent = res.message || 'Failed';
          msg.style.color = 'var(--danger)';
        }
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.style.color = 'var(--danger)';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Save';
      }
    });

    load();
  </script>
