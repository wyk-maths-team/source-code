<style>
  .msg-form { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); }
  .msg-form h2 { margin-top: 0; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
  .form-group select, .form-group input, .form-group textarea {
    width: 100%; padding: 10px; border-radius: 6px;
    border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary);
    font-family: inherit; box-sizing: border-box; font-size: 0.95rem;
  }
  .form-group textarea { resize: vertical; min-height: 100px; }
  .btn-submit {
    width: 100%; padding: 12px; background: var(--accent); color: white;
    border: none; border-radius: 6px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .ac-wrap { position: relative; }
  .ac-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.15);
    max-height: 240px; overflow-y: auto; margin-top: 2px;
  }
  .ac-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: .85rem; }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: var(--sidebar-hover-bg, rgba(127,127,127,.12)); }
  .ac-name { font-weight: 600; color: var(--text-primary); }
  .ac-sub { color: var(--text-secondary); font-size: .78rem; }
  .ac-empty { padding: 8px 10px; color: var(--text-secondary); font-size: .82rem; }
  .ac-hint { display: block; margin-top: 6px; font-size: .8rem; color: var(--text-secondary); }

  .preview-box {
    margin-top: 20px; padding: 16px; border-radius: 8px;
    background: rgba(74,144,217,0.08); border-left: 4px solid var(--accent);
    font-size: 0.95rem; line-height: 1.5; color: var(--text-primary);
  }
</style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="msg-form" id="adminMsgForm" style="display:none;">
        <h2><i class="fas fa-paper-plane"></i> Send System Message</h2>
        
        <div class="form-group">
          <label>Target User</label>
          <div class="ac-wrap">
            <input type="text" id="userSearch" placeholder="Type a username or display name..." autocomplete="off">
            <div id="acDropdown" class="ac-dropdown" style="display:none;"></div>
          </div>
          <small id="selectedUserHint" class="ac-hint">No user selected</small>
        </div>

        <div class="form-group">
          <label>Message Template</label>
          <select id="templateType">
            <option value="reviewed">Your [] was reviewed. Your submission was rejudged. Thank you.</option>
            <option value="toc">Your [] was removed. Please follow the rules. Thank you.</option>
            <option value="custom">Custom Message</option>
          </select>
        </div>

        <div id="dynamicVars"></div>

        <div class="preview-box" id="previewBox">Message preview will appear here...</div>

        <button class="btn-submit" id="sendBtn" style="margin-top: 20px;">Send Message</button>
      </div>
    </main>
  </div>

  <script src="/assets/js/auth.js?v=39ed8638"></script>
  <script src="/assets/js/app.js?v=39ed8638"></script>
  <script src="/assets/js/topbar.js?v=39ed8638"></script>
  <script src="/assets/js/sidebar.js?v=39ed8638"></script>
  <script src="/assets/js/heartbeat.js?v=39ed8638"></script>
  <script src="/assets/js/pk-invite.js?v=39ed8638"></script>

  <script>
    Page.boot({ title: 'Send Message', requireAuth: true, skeleton: true });
    Page.ready(async (user) => {
      if (user.role !== 'admin' && user.role !== 'root') {
        document.getElementById('mainContent').innerHTML = '<h2 style="text-align:center;padding:40px;">403 Forbidden</h2>';
        Page.hideSkeleton(); return;
      }

      const form = document.getElementById('adminMsgForm');
      const userSearchInput = document.getElementById('userSearch');
      const acDropdown = document.getElementById('acDropdown');
      const selectedUserHint = document.getElementById('selectedUserHint');
      const templateType = document.getElementById('templateType');
      const dynamicVars = document.getElementById('dynamicVars');
      const previewBox = document.getElementById('previewBox');
      const sendBtn = document.getElementById('sendBtn');

      // 检查 URL 参数
      const urlParams = new URLSearchParams(window.location.search);
      const prefillUser = urlParams.get('username');
      const prefillProblemId = urlParams.get('problemid') || '';
      const prefillSubid = urlParams.get('subid') || '';
      const prefillFlag = urlParams.get('flag');

      let selectedUsername = '';
      function setSelected(username) {
        selectedUsername = username || '';
        selectedUserHint.textContent = selectedUsername
          ? 'Sending to: ' + selectedUsername
          : 'No user selected';
        selectedUserHint.style.color = selectedUsername ? 'var(--accent)' : 'var(--text-secondary)';
      }

      // ⭐ 用户自动补全（与 /submissions 页的选择方式一致）
      let acTimer = null;
      let acIndex = -1;

      function renderAc(list) {
        acIndex = -1;
        if (!list || !list.length) {
          acDropdown.innerHTML = '<div class="ac-empty">No users found</div>';
          acDropdown.style.display = 'block';
          return;
        }
        acDropdown.innerHTML = list.map((u) => (
          '<div class="ac-item" data-val="' + DSHUI.esc(u.username) + '">' +
            '<div class="ac-name">' + DSHUI.esc(u.username) + '</div>' +
            '<div class="ac-sub">' + DSHUI.esc(u.displayName || u.username) +
              (u.realName ? ' (' + DSHUI.esc(u.realName) + ')' : '') + '</div>' +
          '</div>'
        )).join('');
        acDropdown.style.display = 'block';
      }

      userSearchInput.addEventListener('input', () => {
        setSelected('');
        const kw = userSearchInput.value.trim();
        if (acTimer) clearTimeout(acTimer);
        if (!kw) { acDropdown.style.display = 'none'; return; }
        acTimer = setTimeout(async () => {
          try {
            const res = await apiCall('/api/search?action=search_user&keyword=' + encodeURIComponent(kw));
            renderAc(res && res.success ? res.data : []);
          } catch (e) {
            console.error('search users failed', e);
          }
        }, 250);
      });

      userSearchInput.addEventListener('keydown', (e) => {
        const items = acDropdown.querySelectorAll('.ac-item[data-val]');
        if (!items.length || acDropdown.style.display === 'none') return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          acIndex = (acIndex + 1) % items.length;
          items.forEach((it, i) => it.classList.toggle('active', i === acIndex));
          items[acIndex].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          acIndex = (acIndex - 1 + items.length) % items.length;
          items.forEach((it, i) => it.classList.toggle('active', i === acIndex));
          items[acIndex].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (acIndex >= 0 && items[acIndex]) items[acIndex].click();
        } else if (e.key === 'Escape') {
          acDropdown.style.display = 'none';
        }
      });

      acDropdown.addEventListener('click', (e) => {
        const item = e.target.closest('.ac-item[data-val]');
        if (!item) return;
        userSearchInput.value = item.dataset.val;
        setSelected(item.dataset.val);
        acDropdown.style.display = 'none';
      });

      document.addEventListener('click', (e) => {
        if (!userSearchInput.contains(e.target) && !acDropdown.contains(e.target)) {
          acDropdown.style.display = 'none';
        }
      });

      // URL 预填（从 submissions 页跳过来时带 username）
      if (prefillUser) {
        userSearchInput.value = prefillUser;
        setSelected(prefillUser);
      }
      if (prefillFlag) {
        templateType.value = 'custom';
        renderTemplateVars();
        setTimeout(() => {
          const textarea = document.getElementById('varCustomText');
          if (textarea) {
            if (prefillFlag === 'red') {
              textarea.value = `[RED CARD WARNING] Your account has been flagged for severe violation (obscene/inappropriate content) regarding submission ${prefillSubid}. Your progress on this problem has been reset. This is a final warning before account suspension. Thank you.`;
            } else {
              textarea.value = `[YELLOW CARD WARNING] Your submission ${prefillSubid} has been flagged for inappropriate content or AI usage. Your progress on this problem has been reset. Please follow the rules. Thank you.`;
            }
            updatePreview();
          }
        }, 50);
      }

      form.style.display = 'block';
      Page.hideSkeleton();

      // ⭐ 3. 统一的预览更新函数
      function updatePreview() {
        const t = templateType.value;
        let text = '';
        
        if (t === 'reviewed') {
          const pid = document.getElementById('varProblemId')?.value.trim() || '[Problem ID]';
          text = `Your problem report on ${pid} was reviewed. Your submission was rejudged. Thank you.`;
        } else if (t === 'toc') {
          text = `Your profile picture violates the ToS and was removed. Please follow the rules. Thank you.`;
        } else if (t === 'custom') {
          text = document.getElementById('varCustomText')?.value || '[Custom Message]';
        }
        previewBox.textContent = text;
      }

      // ⭐ 4. 动态渲染参数输入框
      function renderTemplateVars() {
        const t = templateType.value;
        dynamicVars.innerHTML = '';
        
        if (t === 'reviewed') {
          const group = document.createElement('div');
          group.className = 'form-group';
          group.innerHTML = `<label>Problem ID</label><input type="text" id="varProblemId" placeholder="e.g. HA0001">`;
          dynamicVars.appendChild(group);
          document.getElementById('varProblemId').addEventListener('input', updatePreview);
        } else if (t === 'custom') {
          const group = document.createElement('div');
          group.className = 'form-group';
          group.innerHTML = `<label>Custom Text</label><textarea id="varCustomText" placeholder="Enter message here..."></textarea>`;
          dynamicVars.appendChild(group);
          document.getElementById('varCustomText').addEventListener('input', updatePreview);
        }
        updatePreview();
      }

      // 初始化模板
      templateType.addEventListener('change', renderTemplateVars);
      renderTemplateVars();

      // ⭐ 5. 发送消息
      sendBtn.addEventListener('click', async () => {
        const target = selectedUsername || userSearchInput.value.trim();
        if (!target) return DSHUI.toast('Please select a target user', 'warn');
        
        const template = templateType.value;
        const variables = {};
        if (template === 'reviewed') {
          variables.problemId = document.getElementById('varProblemId')?.value.trim() || '';
          if (!variables.problemId) return DSHUI.toast('Please enter Problem ID', 'warn');
        }
        if (template === 'custom') {
          variables.customText = document.getElementById('varCustomText')?.value.trim() || '';
          if (!variables.customText) return DSHUI.toast('Please enter message text', 'warn');
        }

        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';

        try {
          await API.post('/api/admin?action=sendMessage', { 
            targetUser: target, 
            template, 
            variables 
          });
          
          DSHUI.toast('Message sent successfully!', 'ok');
          
          if (template === 'custom') document.getElementById('varCustomText').value = '';
          if (template === 'reviewed') document.getElementById('varProblemId').value = '';
          updatePreview();
          
        } catch (err) {
          DSHUI.toast(err.message || 'Failed to send', 'err');
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send Message';
        }
      });
    });
  </script>
<script src="/assets/js/pk-notify.js?v=39ed8638"></script>
</body>
</html>
