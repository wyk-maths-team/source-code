<style>
  .gr-page { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }

  .gr-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .gr-head h1 {
    font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 9px;
    color: var(--text-primary); margin: 0;
  }
  .gr-head h1 i { color: var(--accent); font-size: 1rem; }
  .gr-head .spacer { flex: 1; }
  .gr-btn {
    padding: 8px 15px; border: 1px solid var(--border-color); border-radius: 8px;
    background: var(--card-bg); color: var(--text-primary); cursor: pointer;
    font-family: inherit; font-size: .84rem; font-weight: 600; display: inline-flex;
    align-items: center; gap: 7px; transition: border-color .15s, color .15s;
  }
  .gr-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gr-btn.spinning i { animation: grSpin .8s linear infinite; }
  @keyframes grSpin { to { transform: rotate(360deg); } }

  /* ── 数据源切换 ── */
  .gr-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .gr-tab {
    padding: 7px 15px; border: 1px solid var(--border-color); border-radius: 8px;
    background: var(--card-bg); color: var(--text-secondary); cursor: pointer;
    font-family: inherit; font-size: .82rem; font-weight: 600; transition: all .15s;
  }
  .gr-tab:hover { border-color: var(--accent); color: var(--accent); }
  .gr-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(74,144,217,.10); }
  :root[data-theme="scifi"] .gr-tab.active { background: rgba(0,229,255,.10); }

  /* ── 按难度 ── */
  .gr-diff-head {
    display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
    margin: -4px 0 10px;
  }
  .gr-diff-note {
    flex: 1; min-width: 240px;
    font-size: .74rem; color: var(--text-secondary); line-height: 1.5;
  }
  .gr-diff-note strong { color: var(--text-primary); font-weight: 700; }
  .gr-btn-sm { padding: 6px 12px; font-size: .78rem; flex: none; }
  .gr-recalc-msg {
    font-size: .76rem; padding: 8px 12px; margin-bottom: 10px;
    border-radius: 8px; border: 1px solid var(--border-color);
    background: var(--content-bg); color: var(--text-secondary);
  }
  .gr-recalc-msg.ok { border-color: rgba(46,160,67,.35); color: #2e7d32; }
  .gr-recalc-msg.warn { border-color: rgba(230,140,30,.35); color: #b45309; }
  :root[data-theme="dark"] .gr-recalc-msg.ok { color: #8fdf8f; }
  :root[data-theme="dark"] .gr-recalc-msg.warn { color: #ffb86c; }
  :root[data-theme="scifi"] .gr-recalc-msg.ok { color: #78ffb0; border-color: rgba(120,255,176,.32); }
  :root[data-theme="scifi"] .gr-recalc-msg.warn { color: #ffd166; border-color: rgba(255,209,102,.32); }
  .gr-diff .gr-stat .k { text-transform: none; letter-spacing: 0; }
  .gr-diff .gr-stat .v { font-size: 1.15rem; }

  /* ── 统计卡 ── */
  .gr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .gr-stat {
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;
    padding: 12px 14px;
  }
  .gr-stat .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); }
  .gr-stat .v { font-size: 1.35rem; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; line-height: 1.25; }
  .gr-stat .s { font-size: .72rem; color: var(--text-secondary); }
  .gr-stat.ok .v { color: #2e7d32; }
  .gr-stat.err .v { color: var(--danger); }
  .gr-stat.warn .v { color: #b45309; }
  :root[data-theme="dark"] .gr-stat.ok .v { color: #8fdf8f; }
  :root[data-theme="dark"] .gr-stat.warn .v { color: #ffb86c; }
  :root[data-theme="scifi"] .gr-stat.ok .v { color: #78ffb0; }
  :root[data-theme="scifi"] .gr-stat.warn .v { color: #ffd166; }

  /* ── 筛选 ── */
  .gr-filters { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 12px; }
  .gr-filters select, .gr-filters input {
    padding: 8px 11px; border: 1px solid var(--border-color); border-radius: 8px;
    background: var(--card-bg); color: var(--text-primary); font-family: inherit; font-size: .84rem;
  }
  .gr-filters input { min-width: 150px; }
  .gr-filters select:focus, .gr-filters input:focus { outline: none; border-color: var(--accent); }

  /* ── 表格 ── */
  .gr-table-wrap {
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;
    overflow: hidden;
  }
  .gr-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .gr-table th {
    text-align: left; padding: 10px 12px; font-size: .7rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);
    background: var(--content-bg); font-weight: 700; white-space: nowrap;
  }
  .gr-table td {
    padding: 9px 12px; border-bottom: 1px solid var(--border-color);
    color: var(--text-primary); vertical-align: top;
  }
  .gr-table tr:last-child td { border-bottom: none; }
  .gr-table tbody tr:hover td { background: var(--content-bg); }
  .gr-mono { font-family: Consolas, Monaco, monospace; font-size: .76rem; }
  .gr-dim { color: var(--text-secondary); }
  .gr-nowrap { white-space: nowrap; }

  .gr-badge {
    display: inline-block; padding: 2px 8px; border-radius: 7px;
    font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  }
  .gr-badge.done    { background: rgba(46,160,67,.16); color: #2e7d32; }
  .gr-badge.error   { background: rgba(231,76,60,.16); color: var(--danger); }
  .gr-badge.pending { background: rgba(230,140,30,.16); color: #b45309; }
  .gr-badge.processing { background: rgba(31,111,235,.16); color: #1565c0; }
  :root[data-theme="dark"] .gr-badge.done  { background: #1b4d2e; color: #8fdf8f; }
  :root[data-theme="dark"] .gr-badge.error { background: #4d1f1f; color: #ff8f8f; }
  :root[data-theme="dark"] .gr-badge.pending { background: #4d2e0d; color: #ffb86c; }
  :root[data-theme="dark"] .gr-badge.processing { background: #14395e; color: #8ec3ff; }
  :root[data-theme="scifi"] .gr-badge.done  { background: rgba(120,255,176,.10); color: #78ffb0; border: 1px solid rgba(120,255,176,.32); }
  :root[data-theme="scifi"] .gr-badge.error { background: rgba(255,61,113,.10); color: #ff8fab; border: 1px solid rgba(255,61,113,.32); }
  :root[data-theme="scifi"] .gr-badge.pending { background: rgba(255,209,102,.10); color: #ffd166; border: 1px solid rgba(255,209,102,.32); }
  :root[data-theme="scifi"] .gr-badge.processing { background: rgba(0,229,255,.10); color: #8ff0ff; border: 1px solid rgba(0,229,255,.32); }

  .gr-err {
    max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--danger); cursor: help;
  }
  .gr-empty { padding: 34px 20px; text-align: center; color: var(--text-secondary); font-size: .86rem; }
  .gr-more { text-align: center; margin-top: 14px; }

  @media (max-width: 720px) {
    .gr-table thead { display: none; }
    .gr-table, .gr-table tbody, .gr-table tr, .gr-table td { display: block; width: 100%; }
    .gr-table tr { border-bottom: 1px solid var(--border-color); padding: 8px 4px; }
    .gr-table td { border: none; padding: 3px 12px; }
    .gr-table td:before {
      content: attr(data-label); display: inline-block; min-width: 82px;
      font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-secondary); font-weight: 700;
    }
    .gr-err { max-width: none; white-space: normal; }
  }
</style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>

    <main class="main-content" id="mainContent">
      <div class="gr-page">
        <div class="gr-head">
          <h1><i class="fas fa-list-check"></i> Grading Queue</h1>
          <span class="gr-dim" style="font-size:.78rem">read-only</span>
          <span class="spacer"></span>
          <button id="grRefresh" class="gr-btn"><i class="fas fa-rotate"></i> Refresh</button>
        </div>

        <div class="gr-tabs">
          <button class="gr-tab active" data-source="history">History</button>
          <button class="gr-tab" data-source="queue">Live queue</button>
        </div>

        <section class="gr-stats" id="grStats"></section>

        <div class="gr-diff-head" id="grDiffHead" style="display:none">
          <span class="gr-diff-note">
            Average grading time by difficulty — <strong>steps only</strong>. Image grading is recorded too, but its input is a picture, so mixing it in would skew the average.
          </span>
          <button id="grRecalc" class="gr-btn gr-btn-sm" title="Difficulty is a snapshot taken when the run was recorded. If you have changed a problem's difficulty since, the old rows still carry the old value.">
            <i class="fas fa-arrows-rotate"></i> Recalculate difficulty
          </button>
        </div>
        <div class="gr-recalc-msg" id="grRecalcMsg" style="display:none"></div>
        <section class="gr-stats gr-diff" id="grDiff" style="display:none"></section>

        <section class="gr-filters">
          <select id="grStatus">
            <option value="">All statuses</option>
            <option value="done">done</option>
            <option value="error">error</option>
            <option value="pending">pending</option>
            <option value="processing">processing</option>
          </select>
          <select id="grRange">
            <option value="">All time</option>
            <option value="24">Last 24h</option>
            <option value="168">Last 7 days</option>
          </select>
          <input id="grUser" type="text" placeholder="username" autocomplete="off" />
          <input id="grProblem" type="text" placeholder="problem id" autocomplete="off" />
        </section>

        <section class="gr-table-wrap">
          <table class="gr-table">
            <thead>
              <tr>
                <th>When</th>
                <th>User</th>
                <th>Problem</th>
                <th>Diff</th>
                <th>Status</th>
                <th>Model</th>
                <th>Elapsed</th>
                <th>Note</th>
              </tr>
            </thead>
            <tbody id="grBody"></tbody>
          </table>
          <div class="gr-empty" id="grEmpty" style="display:none">Nothing to show.</div>
        </section>

        <div class="gr-more">
          <button id="grMore" class="gr-btn" style="display:none">Load more</button>
        </div>
      </div>
    </main>
  </div>
