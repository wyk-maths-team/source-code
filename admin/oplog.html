<style>
  /* ═══════════════ op 顏色 ═══════════════ */
  :root {
    --op-insert: #2e7d32;
    --op-insert-bg: #e8f5e9;
    --op-update: #ed6c02;
    --op-update-bg: #fff3e0;
    --op-delete: #c62828;
    --op-delete-bg: #ffebee;
    --op-command: #6a1b9a;
    --op-command-bg: #f3e5f5;
  }
  :root[data-theme="dark"] {
    --op-insert: #56d364;
    --op-insert-bg: #1a3a2a;
    --op-update: #ffa726;
    --op-update-bg: #3a2a1a;
    --op-delete: #f85149;
    --op-delete-bg: #3a1a1a;
    --op-command: #c586f5;
    --op-command-bg: #2a1a3a;
  }
  /* 操作类型颜色沿用暗色的色相，仅把底色换成青色系深调，
     保证与整体皮肤一致又不丢失「新增绿 / 修改橙 / 删除红」的语义 */
  :root[data-theme="scifi"] {
    --op-insert: #56d364;
    --op-insert-bg: #0b2a24;
    --op-update: #ffa726;
    --op-update-bg: #2e2410;
    --op-delete: #f85149;
    --op-delete-bg: #2a1118;
    --op-command: #c586f5;
    --op-command-bg: #211a2e;
  }

  .oplog-wrap { max-width: 1080px; margin: 0 auto; }

  /* ═══════════════ Header ═══════════════ */
  .oplog-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 18px;
  }
  .oplog-header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-primary);
  }
  .oplog-header h1 i { color: var(--accent); font-size: 1.05rem; }
  .oplog-header-spacer { flex: 1; }
  .oplog-stats {
    font-size: .82rem;
    color: var(--text-secondary);
    font-family: 'Consolas', monospace;
  }
  .oplog-icon-btn {
    width: 34px; height: 34px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: .9rem;
  }
  .oplog-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .oplog-icon-btn.spinning i { animation: oplogSpin .8s linear infinite; }
  @keyframes oplogSpin { to { transform: rotate(360deg); } }

  /* ═══════════════ Filters ═══════════════ */
  .oplog-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .oplog-filters select,
  .oplog-filters input {
    padding: 7px 11px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: .85rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .oplog-filters select:focus,
  .oplog-filters input:focus { border-color: var(--accent); }
  .oplog-filters input {
    flex: 1;
    min-width: 180px;
  }

  /* ═══════════════ List ═══════════════ */
  .oplog-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .oplog-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--border-color);
    border-radius: 6px;
    cursor: pointer;
    transition: background .12s, border-color .12s, transform .08s;
  }
  .oplog-item:hover {
    background: var(--hover-bg);
    transform: translateX(2px);
    border-color: var(--accent);
  }
  .oplog-item.insert  { border-left-color: var(--op-insert); }
  .oplog-item.update  { border-left-color: var(--op-update); }
  .oplog-item.delete  { border-left-color: var(--op-delete); }
  .oplog-item.command { border-left-color: var(--op-command); }

  .oplog-time {
    flex-shrink: 0;
    min-width: 82px;
    font-family: 'Consolas', monospace;
    font-size: .72rem;
    line-height: 1.35;
    color: var(--text-secondary);
  }
  .oplog-time .d { display: block; font-weight: 700; color: var(--text-primary); font-size: .76rem; }

  .oplog-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .78rem;
    flex-shrink: 0;
  }
  .oplog-item.insert  .oplog-icon { background: var(--op-insert-bg); color: var(--op-insert); }
  .oplog-item.update  .oplog-icon { background: var(--op-update-bg); color: var(--op-update); }
  .oplog-item.delete  .oplog-icon { background: var(--op-delete-bg); color: var(--op-delete); }
  .oplog-item.command .oplog-icon { background: var(--op-command-bg); color: var(--op-command); }

  .oplog-body { flex: 1; min-width: 0; }
  .oplog-summary {
    font-size: .88rem;
    line-height: 1.4;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .oplog-sub {
    font-size: .72rem;
    color: var(--text-secondary);
    font-family: 'Consolas', monospace;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .oplog-badge {
    flex-shrink: 0;
    font-size: .66rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .oplog-item.insert  .oplog-badge { background: var(--op-insert-bg); color: var(--op-insert); }
  .oplog-item.update  .oplog-badge { background: var(--op-update-bg); color: var(--op-update); }
  .oplog-item.delete  .oplog-badge { background: var(--op-delete-bg); color: var(--op-delete); }
  .oplog-item.command .oplog-badge { background: var(--op-command-bg); color: var(--op-command); }

  /* ═══════════════ Pagination ═══════════════ */
  .oplog-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 24px 0 12px;
    flex-wrap: wrap;
  }
  .oplog-page-btn {
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: .85rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .12s;
  }
  .oplog-page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .oplog-page-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 700;
  }
  .oplog-page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .oplog-page-info {
    margin: 0 10px;
    font-size: .8rem;
    color: var(--text-secondary);
    font-family: 'Consolas', monospace;
  }

  /* ═══════════════ Empty / Loading ═══════════════ */
  .oplog-empty,
  .oplog-loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: .92rem;
  }
  .oplog-empty i,
  .oplog-loading i {
    font-size: 2rem;
    color: var(--accent);
    opacity: .45;
    display: block;
    margin-bottom: 12px;
  }

  /* ═══════════════ Drawer ═══════════════ */
  .oplog-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 500px;
    max-width: 92vw;
    background: var(--card-bg);
    border-left: 1px solid var(--border-color);
    box-shadow: -8px 0 32px rgba(0,0,0,.18);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .oplog-drawer.open { transform: translateX(0); }

  .oplog-drawer-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .oplog-drawer-head h3 {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .oplog-drawer-close {
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.1rem;
    border-radius: 6px;
    transition: all .12s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .oplog-drawer-close:hover { background: var(--hover-bg); color: var(--text-primary); }

  .oplog-drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 40px;
  }
  .oplog-drawer-body::-webkit-scrollbar { width: 6px; }
  .oplog-drawer-body::-webkit-scrollbar-thumb { background: rgba(150,150,150,.3); border-radius: 3px; }

  .oplog-detail-section { margin-bottom: 18px; }
  .oplog-detail-label {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-secondary);
    font-weight: 700;
    margin-bottom: 5px;
  }
  .oplog-detail-value {
    font-family: 'Consolas', monospace;
    font-size: .82rem;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.5;
  }
  .oplog-json {
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: .78rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
    color: var(--text-primary);
    margin: 0;
  }

  .oplog-related-item {
    font-size: .78rem;
    padding: 7px 10px;
    background: var(--hover-bg);
    border-radius: 5px;
    margin-bottom: 4px;
    border-left: 3px solid var(--border-color);
    word-break: break-word;
  }
  .oplog-related-item.insert  { border-left-color: var(--op-insert); }
  .oplog-related-item.update  { border-left-color: var(--op-update); }
  .oplog-related-item.delete  { border-left-color: var(--op-delete); }

  /* ═══════════════ Mobile ═══════════════ */
  @media (max-width: 700px) {
    .oplog-time { min-width: 60px; font-size: .68rem; }
    .oplog-summary { font-size: .84rem; }
    .oplog-filters select { flex: 1; min-width: 0; }
  }
</style>
