<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="form-container">
        <h2>Create New Contest</h2>
        <form id="newContestForm">
          <div class="form-group">
            <label for="contestName">Name *</label>
            <input type="text" id="contestName" required>
          </div>

          <div class="form-group">
            <label for="startTime">Start Time *</label>
            <input type="datetime-local" id="startTime" required>
          </div>

          <div class="form-group">
            <label for="duration">Duration (minutes, max 2016000) *</label>
            <input type="number" id="duration" min="1" max="2016000" required value="180">
          </div>

          <div class="form-group">
            <label for="problemListInput">Problems</label>
            <textarea
              class="problem-list-input"
              id="problemListInput"
              rows="10"
              placeholder="每行一道題，格式：&#10;A001&#10;A002&#10;A003;&#10;A004&#10;&#10;行末加分號 ; 表示 Photo（圖片評分），否則為 Numeric（數值評分）"
              spellcheck="false"></textarea>
            <div class="problem-list-hint">
              每行一道題：<code>A001</code> → Numeric，<code>A001;</code> → Photo。
              空行和 <code># 開頭</code> 的行會被忽略。
            </div>
            <div class="problem-list-preview" id="problemListPreview" style="display:none"></div>
          </div>

          <div class="form-group">
            <label for="participants">Participants (comma separated usernames)</label>
            <textarea id="participants" rows="3" placeholder="alice, bob, charlie"></textarea>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="isPublic" checked> Public (visible to students)
            </label>
          </div>
                    <div class="form-group">
            <label>
              <input type="checkbox" id="isSpecial"> <strong>Special Contest (Team Mode)</strong>
            </label>
            <small style="color: var(--text-secondary); display:block; margin-top: 4px;">
              Warning: Testing 
            </small>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary">Create Contest</button>
            <a href="/admin/contest" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
        <div id="message" class="message"></div>
      </div>
    </main>
