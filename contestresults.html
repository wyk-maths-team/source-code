<title>Contest Results - WYK Maths Team</title>

<style>
  .results-wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }

  .rs-hero {
    position: relative; overflow: hidden; border-radius: 16px;
    padding: 2rem 2.2rem 1.8rem;
    background: linear-gradient(135deg, #4a90d9 0%, #2e5fa0 55%, #1a1a2e 100%);
    color: #fff;
    box-shadow: 0 12px 40px rgba(74,144,217,.22), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .rs-hero::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 25%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 58% 20%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 78% 78%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 90% 35%, rgba(255,255,255,.85), transparent);
    background-size: 400px 400px; opacity: .55;
    pointer-events: none; animation: rsDrift 60s linear infinite;
  }
  @keyframes rsDrift { from { background-position: 0 0; } to { background-position: 400px 300px; } }
  .rs-hero::after {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, transparent 65%);
    pointer-events: none;
  }
  .rs-hero-inner { position: relative; z-index: 1; }
  .rs-hero-name {
    font-size: 1.9rem; font-weight: 800; letter-spacing: -.5px;
    margin: 0 0 .3rem; color: #fff; line-height: 1.2;
    display: flex; align-items: center; gap: 12px;
  }
  .rs-hero-name i { font-size: 1.5rem; color: #ffd54f; filter: drop-shadow(0 2px 8px rgba(255,213,79,.5)); }
  .rs-hero-sub { font-size: .92rem; opacity: .88; margin: .3rem 0 1.4rem; }
  .rs-hero-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
  .rs-hero-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: .55rem 1.2rem; border-radius: 9px;
    font-size: .88rem; font-weight: 600; font-family: inherit;
    cursor: pointer; border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.15); color: #fff; text-decoration: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all .15s;
  }
  .rs-hero-btn:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .rs-hero-btn.primary { background: #fff; color: #2e5fa0; border-color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .rs-hero-btn.primary:hover { box-shadow: 0 8px 24px rgba(0,0,0,.3); }

  .rs-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; }
  .rs-stat {
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
    padding: 1rem 1.1rem; display: flex; align-items: center; gap: .9rem;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .rs-stat:hover { border-color: var(--accent); box-shadow: 0 6px 20px rgba(74,144,217,.12); transform: translateY(-2px); }
  .rs-stat-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; background: rgba(74,144,217,.12); color: var(--accent); flex-shrink: 0;
  }
  .rs-stat-icon.gold   { background: rgba(255,193,7,.16);  color: #d4a017; }
  .rs-stat-icon.green  { background: rgba(76,175,80,.14);  color: #2e7d32; }
  .rs-stat-icon.purple { background: rgba(125,91,176,.16); color: #7d5bb0; }
  [data-theme="dark"] .rs-stat-icon.gold   { color: #ffd54f; }
  [data-theme="dark"] .rs-stat-icon.green  { color: #8fdf8f; }
  [data-theme="dark"] .rs-stat-icon.purple { color: #c0a2e8; }
  .rs-stat-info { min-width: 0; }
  .rs-stat-label { font-size: .75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-bottom: 2px; }
  .rs-stat-value { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; word-break: break-word; font-family: 'Fira Code', 'Consolas', monospace; }
  .rs-stat-value .max { font-size: .72rem; color: var(--text-secondary); font-weight: 600; font-family: inherit; }

  .rs-section {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .rs-section-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: .9rem 1.3rem; border-bottom: 1px solid var(--border-color);
    background: rgba(0,0,0,.015); gap: .5rem; flex-wrap: wrap;
  }
  [data-theme="dark"] .rs-section-header { background: rgba(255,255,255,.02); }
  .rs-section-header h3 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
  .rs-section-header h3 i { color: var(--accent); font-size: .9rem; }
  .rs-section-header .hint { font-size: .8rem; color: var(--text-secondary); }

  .rs-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .rs-table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    font-size: .88rem;
  }

  .rs-table tbody tr { --row-tint: transparent; }
  .rs-table tbody tr:hover { --row-tint: rgba(74,144,217,.08); }
  .rs-table tbody tr.me { --row-tint: rgba(74,144,217,.14); }
  .rs-table tbody tr.me:hover { --row-tint: rgba(74,144,217,.22); }
  [data-theme="dark"] .rs-table tbody tr:hover { --row-tint: rgba(74,144,217,.16); }
  [data-theme="dark"] .rs-table tbody tr.me { --row-tint: rgba(74,144,217,.22); }
  [data-theme="dark"] .rs-table tbody tr.me:hover { --row-tint: rgba(74,144,217,.32); }

  table.rs-table tbody tr td {
    background-color: var(--card-bg) !important;
    background-image: linear-gradient(var(--row-tint, transparent), var(--row-tint, transparent));
  }

  .rs-table thead th {
    position: sticky; top: 0; z-index: 5;
    padding: .75rem .8rem; text-align: center;
    font-size: .74rem; text-transform: uppercase; letter-spacing: .5px;
    font-weight: 700; color: var(--text-secondary);
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-color); white-space: nowrap;
  }
  [data-theme="dark"] .rs-table thead th { background: #161b22; }

  .rs-table tbody td {
    padding: .55rem .7rem; text-align: center;
    border-bottom: 1px solid var(--border-color);
    vertical-align: middle;
  }
  .rs-table tbody tr:last-child td { border-bottom: none; }

  .col-rank  { width: 64px;  min-width: 64px; }
  .col-user  { width: 240px; min-width: 240px; text-align: left; }
  .col-prob  { width: 80px;  min-width: 80px; }
  .col-total { width: 100px; min-width: 100px; }

  .rs-table thead th.col-rank,
  .rs-table tbody td.cell-rank { position: sticky; left: 0; z-index: 4; }
  .rs-table thead th.col-rank { z-index: 6; background: var(--card-bg); }
  [data-theme="dark"] .rs-table thead th.col-rank { background: #161b22; }

  .rs-table thead th.col-user,
  .rs-table tbody td.cell-user {
    position: sticky; left: 64px; z-index: 4;
    box-shadow: 2px 0 0 var(--border-color);
  }
  .rs-table thead th.col-user { z-index: 6; background: var(--card-bg); }
  [data-theme="dark"] .rs-table thead th.col-user { background: #161b22; }

  .rs-table thead th.col-total,
  .rs-table tbody td.cell-total {
    position: sticky; right: 0; z-index: 4;
    box-shadow: -2px 0 0 var(--border-color);
  }
  .rs-table thead th.col-total { z-index: 6; background: var(--card-bg); }
  [data-theme="dark"] .rs-table thead th.col-total { background: #161b22; }

  .rs-table tbody td.cell {
    padding: 0;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: .82rem;
    line-height: 1;
    min-width: 80px;
  }
  .rs-table tbody td.cell > span {
    display: flex; align-items: center; justify-content: center;
    padding: 9px 6px; min-height: 36px;
    transition: filter .15s;
  }
  .rs-table tbody tr:hover td.cell > span { filter: brightness(1.08); }

  .rs-table tbody td.cell.cell-ac-first > span {
    background: #1b5e20; color: #ffffff;
    font-weight: 800; letter-spacing: .3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .rs-table tbody td.cell.cell-ac > span { background: #4caf50; color: #ffffff; font-weight: 500; }
  .rs-table tbody td.cell.cell-wa > span { background: #c62828; color: #ffcdd2; font-weight: 700; }
  .rs-table tbody td.cell.cell-partial > span { background: #fbc02d; color: #4e342e; font-weight: 700; }
  .rs-table tbody td.cell.cell-empty > span { background: rgba(0,0,0,.03); color: #b8b8b8; font-weight: 400; }
  [data-theme="dark"] .rs-table tbody td.cell.cell-empty > span { background: rgba(255,255,255,.04); color: #666; }

  .rs-rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    font-weight: 800; font-size: .85rem;
    background: rgba(0,0,0,.05); color: var(--text-secondary);
    font-family: 'Fira Code', 'Consolas', monospace;
  }
  [data-theme="dark"] .rs-rank { background: rgba(255,255,255,.07); }
  .rs-rank.gold   { background: linear-gradient(135deg, #ffd700, #d4a017); color: #4a3a00; box-shadow: 0 2px 10px rgba(255,193,7,.5); }
  .rs-rank.silver { background: linear-gradient(135deg, #e8e8e8, #a8a8a8); color: #333; box-shadow: 0 2px 10px rgba(180,180,180,.5); }
  .rs-rank.bronze { background: linear-gradient(135deg, #e8a87c, #a86a3d); color: #fff; box-shadow: 0 2px 10px rgba(200,130,80,.5); }

  .rs-user {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text-primary); text-align: left; min-width: 0;
  }
  .rs-user-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #4a90d9, #2e5fa0); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .82rem; flex-shrink: 0;
    text-transform: uppercase; box-shadow: 0 2px 6px rgba(74,144,217,.25);
    overflow: hidden;
  }
  .rs-user-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .rs-user-avatar.gold   { background: linear-gradient(135deg, #ffd700, #d4a017); box-shadow: 0 2px 8px rgba(255,193,7,.4); }
  .rs-user-avatar.silver { background: linear-gradient(135deg, #d8d8d8, #a8a8a8); box-shadow: 0 2px 8px rgba(180,180,180,.4); }
  .rs-user-avatar.bronze { background: linear-gradient(135deg, #e8a87c, #a86a3d); box-shadow: 0 2px 8px rgba(200,130,80,.4); }

  /* ⭐ Team 头像：用队徽样式 */
  .rs-user-avatar.team {
    background: linear-gradient(135deg, #6b8fff, #3a5ecf);
    box-shadow: 0 2px 8px rgba(107,143,255,.4);
  }
  .rs-user-avatar.team.gold   { background: linear-gradient(135deg, #ffd700, #d4a017); }
  .rs-user-avatar.team.silver { background: linear-gradient(135deg, #d8d8d8, #a8a8a8); }
  .rs-user-avatar.team.bronze { background: linear-gradient(135deg, #e8a87c, #a86a3d); }

  .rs-user-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }
  .rs-user-name {
    font-weight: 700; font-size: .9rem;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rs-user-name:hover { color: var(--accent); }
  .rs-user-sub {
    font-size: .72rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Consolas', monospace;
  }

  .rs-table tbody td.cell-total {
    font-family: 'Fira Code', 'Consolas', monospace;
    font-weight: 800; color: var(--accent);
    font-size: .95rem; white-space: nowrap;
  }

  .rs-legend {
    display: flex; gap: 1.2rem; flex-wrap: wrap;
    padding: .8rem 1.3rem;
    border-top: 1px solid var(--border-color);
    background: rgba(0,0,0,.015);
    font-size: .78rem; color: var(--text-secondary);
  }
  [data-theme="dark"] .rs-legend { background: rgba(255,255,255,.02); }
  .rs-legend-item { display: inline-flex; align-items: center; gap: 7px; }
  .rs-legend-swatch { display: inline-block; width: 16px; height: 16px; border-radius: 3px; }
  .rs-legend-swatch.ac-first { background: #1b5e20; }
  .rs-legend-swatch.ac       { background: #4caf50; }
  .rs-legend-swatch.wa       { background: #c62828; }
  .rs-legend-swatch.partial  { background: #fbc02d; }
  .rs-legend-swatch.empty    { background: rgba(0,0,0,.05); border: 1px solid var(--border-color); }

  .rs-loading, .rs-empty { text-align: center; padding: 3.5rem 1rem; color: var(--text-secondary); font-size: .95rem; }
  .rs-loading i, .rs-empty i { font-size: 2.2rem; color: var(--accent); opacity: .6; display: block; margin-bottom: .9rem; }
  .rs-spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 3px solid rgba(74,144,217,.25); border-top-color: var(--accent);
    border-radius: 50%; animation: rsSpin .7s linear infinite;
  }
  @keyframes rsSpin { to { transform: rotate(360deg); } }

  .rs-back {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text-secondary); font-size: .88rem; font-weight: 500;
    text-decoration: none; padding: .4rem 0; transition: color .15s;
  }
  .rs-back:hover { color: var(--accent); }
  .rs-back i { transition: transform .15s; }
  .rs-back:hover i { transform: translateX(-3px); }

  #userTooltip {
    position: fixed; top: 0; left: 0;
    z-index: 10000;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    padding: 10px 14px;
    display: none; align-items: center; gap: 12px;
    pointer-events: none; opacity: 0;
    transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
    max-width: 340px;
  }
  #userTooltip.visible { opacity: 1; transform: translateY(0); }
  #userTooltip .tip-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    border: 2px solid var(--border-color);
    background: var(--hover-bg, #eef1f5);
  }
  #userTooltip .tip-avatar.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: var(--text-secondary);
  }
  #userTooltip .tip-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #userTooltip .tip-display {
    font-weight: 700; font-size: 1rem; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #userTooltip .tip-username {
    font-family: 'Consolas', monospace;
    font-size: 0.82rem; color: var(--accent);
  }
  #userTooltip .tip-realname {
    font-size: 0.82rem; color: var(--text-secondary);
  }

  @media (max-width: 700px) {
    .rs-hero { padding: 1.4rem 1.2rem 1.2rem; border-radius: 12px; }
    .rs-hero-name { font-size: 1.4rem; }
    .rs-hero-name i { font-size: 1.2rem; }
    .rs-stat { padding: .8rem .9rem; }
    .rs-stat-icon { width: 34px; height: 34px; font-size: .9rem; }
    .rs-stat-value { font-size: 1rem; }
    .rs-table { font-size: .82rem; }
    .rs-table thead th,
    .rs-table tbody td { padding: .5rem .4rem; }
    .rs-table tbody td.cell > span { min-height: 32px; padding: 7px 4px; font-size: .76rem; }
    .rs-user-avatar { width: 28px; height: 28px; font-size: .72rem; }
    .rs-user-name { font-size: .82rem; }
    .rs-legend { font-size: .72rem; gap: .8rem; }
    .col-rank  { width: 52px;  min-width: 52px; }
    .col-user  { width: 180px; min-width: 180px; }
    .rs-table thead th.col-user,
    .rs-table tbody td.cell-user { left: 52px; }
    .col-total { width: 90px;  min-width: 90px; }
  }
</style>

<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="rs-loading">
        <i class="fas fa-trophy"></i>
        <div><span class="rs-spinner"></span> Loading results…</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>

  <script>
    if (!isLoggedIn()) window.location.href = '/index.html';

    const pathMatch = window.location.pathname.match(/^\/contest\/(\d+)\/results$/);
    const queryId = new URLSearchParams(location.search).get('id');
    const contestId = pathMatch ? parseInt(pathMatch[1], 10) : (queryId ? parseInt(queryId, 10) : null);

    if (!contestId) {
      document.getElementById('mainContent').innerHTML =
        '<div class="rs-empty"><i class="fas fa-triangle-exclamation"></i>Invalid URL.</div>';
      throw new Error('No ID');
    }
    document.title = `Results for Contest #${contestId} - WYK Maths Team`;

    const mainContainer = document.getElementById('mainContent');
    const currentUsername = (typeof getCurrentUser === 'function' && getCurrentUser()?.username) || '';

    async function loadResults() {
      try {
        const data = await apiCall(`/api/contests?action=results&id=${contestId}`);
        if (data.success) return data.stats;
      } catch (err) { console.error(err); }
      return null;
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m]));
    }

    function rankClass(rank) {
      if (rank === 1) return 'gold';
      if (rank === 2) return 'silver';
      if (rank === 3) return 'bronze';
      return '';
    }

    function fmtScore(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return '0.00';
      return v.toFixed(2);
    }

    // ⭐ 判断是否 team（username 纯数字 = team）
    function isTeamUser(username, meta) {
      if (meta && meta.isTeam) return true;
      return /^\d+$/.test(String(username));
    }

    // ═══════════ Tooltip ═══════════
    const tooltip = document.createElement('div');
    tooltip.id = 'userTooltip';
    document.body.appendChild(tooltip);

    let tooltipTargetEl = null;

    function showTooltip(user) {
      const avatar = user.pfp
        ? `<img class="tip-avatar" src="${escapeHtml(user.pfp)}" alt="">`
        : `<div class="tip-avatar placeholder">${user.isTeam ? '👥' : '👤'}</div>`;

      tooltip.innerHTML = `
        ${avatar}
        <div class="tip-info">
          <div class="tip-display">${escapeHtml(user.displayName || user.username)}</div>
          <div class="tip-username">${user.isTeam ? 'Team #' : '@'}${escapeHtml(user.username)}</div>
          ${user.realName && !user.isTeam ? `<div class="tip-realname">${escapeHtml(user.realName)}</div>` : ''}
          ${user.isTeam && user.captain ? `<div class="tip-realname">Captain: ${escapeHtml(user.captain)}</div>` : ''}
          ${user.isTeam && user.memberCount ? `<div class="tip-realname">${user.memberCount} member${user.memberCount > 1 ? 's' : ''}</div>` : ''}
        </div>
      `;
      tooltip.style.display = 'flex';
      void tooltip.offsetWidth;
      tooltip.classList.add('visible');
    }

    function hideTooltip() {
      tooltipTargetEl = null;
      tooltip.classList.remove('visible');
      setTimeout(() => {
        if (!tooltipTargetEl) tooltip.style.display = 'none';
      }, 120);
    }

    function moveTooltip(e) {
      if (!tooltipTargetEl) return;
      const pad = 14;
      const w = tooltip.offsetWidth;
      const h = tooltip.offsetHeight;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tooltip.style.left = Math.max(8, x) + 'px';
      tooltip.style.top  = Math.max(8, y) + 'px';
    }

    // ═══════════ Render ═══════════
    function renderResults(stats) {
      if (!stats || !stats.participants || stats.participants.length === 0) {
        mainContainer.innerHTML = `
          <div class="results-wrap">
            <div class="rs-empty">
              <i class="fas fa-inbox"></i>
              <div>No results yet.</div>
              <div style="margin-top:1rem;">
                <a href="/contest/${contestId}" class="rs-back"><i class="fas fa-arrow-left"></i> Back to Contest</a>
              </div>
            </div>
          </div>`;
        return;
      }

      const problemIds = stats.problems || [];
      const participants = stats.participants;
      const maxTotal = problemIds.length * 100;

      const totalParticipants = participants.length;
      const topScore = participants[0]?.total ?? 0;

      const totalAC = participants.reduce((sum, p) => {
        const probs = p.problems || {};
        return sum + problemIds.filter(pid => {
          const info = probs[pid];
          return info && Number(info.score) >= 100;
        }).length;
      }, 0);

      const myIndex = participants.findIndex(p => p.username === currentUsername);
      const myRank = myIndex >= 0 ? myIndex + 1 : null;

      let html = `<div class="results-wrap">`;

      html += `
        <div class="rs-hero">
          <div class="rs-hero-inner">
            <h1 class="rs-hero-name">
              <i class="fas fa-trophy"></i>
              Contest Results
            </h1>
            <p class="rs-hero-sub">Contest #${contestId} · ${totalParticipants} participant${totalParticipants !== 1 ? 's' : ''}</p>
            <div class="rs-hero-actions">
              <a href="/contest/${contestId}" class="rs-hero-btn"><i class="fas fa-arrow-left"></i> Back to Contest</a>
              <a href="/contest" class="rs-hero-btn primary"><i class="fas fa-list"></i> All Contests</a>
            </div>
          </div>
        </div>
      `;

      html += `
        <div class="rs-stats">
          <div class="rs-stat">
            <div class="rs-stat-icon"><i class="fas fa-users"></i></div>
            <div class="rs-stat-info">
              <div class="rs-stat-label">Participants</div>
              <div class="rs-stat-value">${totalParticipants}</div>
            </div>
          </div>
          <div class="rs-stat">
            <div class="rs-stat-icon gold"><i class="fas fa-crown"></i></div>
            <div class="rs-stat-info">
              <div class="rs-stat-label">Top Score</div>
              <div class="rs-stat-value">${fmtScore(topScore)} <span class="max">/ ${maxTotal.toFixed(2)}</span></div>
            </div>
          </div>
          <div class="rs-stat">
            <div class="rs-stat-icon green"><i class="fas fa-circle-check"></i></div>
            <div class="rs-stat-info">
              <div class="rs-stat-label">Total AC</div>
              <div class="rs-stat-value">${totalAC}</div>
            </div>
          </div>
          ${myRank ? `
          <div class="rs-stat">
            <div class="rs-stat-icon purple"><i class="fas fa-user"></i></div>
            <div class="rs-stat-info">
              <div class="rs-stat-label">Your Rank</div>
              <div class="rs-stat-value">#${myRank}</div>
            </div>
          </div>` : ''}
        </div>
      `;

      html += `
        <div class="rs-section">
          <div class="rs-section-header">
            <h3><i class="fas fa-ranking-star"></i> Leaderboard</h3>
          </div>
          <div class="rs-table-scroll">
            <table class="rs-table">
              <thead>
                <tr>
                  <th class="col-rank">Rank</th>
                  <th class="col-user" style="text-align:left;">User</th>
      `;

      problemIds.forEach(pid => {
        html += `<th class="col-prob">${escapeHtml(pid)}</th>`;
      });

      html += `
                  <th class="col-total">Total</th>
                </tr>
              </thead>
              <tbody>
      `;

      participants.forEach((p, idx) => {
        const rank = idx + 1;
        const rClass = rankClass(rank);
        const isMe = p.username === currentUsername;
        const problems = p.problems || {};
        const display = p.displayName || '';
        const team = isTeamUser(p.username, p);

        // 头像内容
        let avatarContent;
        if (team) {
          avatarContent = '<i class="fas fa-users"></i>';
        } else if (p.pfp) {
          avatarContent = `<img src="${escapeHtml(p.pfp)}" alt="" loading="lazy" decoding="async">`;
        } else {
          avatarContent = escapeHtml((p.username[0] || '?').toUpperCase());
        }

        // ⭐ 链接：team 跳 /teams/1，普通用户跳 /users/xxx
        const href = team
          ? `/teams/${encodeURIComponent(p.username)}`
          : `/users/${encodeURIComponent(p.username)}`;

        // 主名称显示
        const mainName = team ? (display || `Team #${p.username}`) : p.username;
        // 副名称（team 显示 members 数，user 显示 realName）
        let subText = '';
        if (team) {
          const mc = p.memberCount || 0;
          subText = `Team #${p.username}${mc ? ' · ' + mc + ' member' + (mc > 1 ? 's' : '') : ''}`;
        } else if (display && display !== p.username) {
          subText = display;
        }

        html += `<tr class="${isMe ? 'me' : ''}">
          <td class="cell-rank">
            <span class="rs-rank ${rClass}">${rank}</span>
          </td>
          <td class="cell-user" style="text-align:left;">
            <a class="rs-user user-link"
               href="${href}"
               data-username="${escapeHtml(p.username)}">
              <span class="rs-user-avatar ${rClass} ${team ? 'team' : ''}">${avatarContent}</span>
              <span class="rs-user-info">
                <span class="rs-user-name">${escapeHtml(mainName)}</span>
                ${subText ? `<span class="rs-user-sub">${escapeHtml(subText)}</span>` : ''}
              </span>
            </a>
          </td>`;

        problemIds.forEach(pid => {
          const info = problems[pid];
          if (!info) {
            html += `<td class="cell cell-empty"><span>—</span></td>`;
            return;
          }
          const score = Number(info.score) || 0;
          const wrongAttempts = Number(info.wrongAttempts) || 0;
          const solved = info.solved === true || score >= 100;
          const locked = info.locked === true;

          // ⭐ WA 锁定：显示红色
          if (locked) {
            html += `<td class="cell cell-wa"><span>${fmtScore(score)}</span></td>`;
            return;
          }

          if (solved && score >= 100) {
            if (wrongAttempts === 0) {
              html += `<td class="cell cell-ac-first"><span>100.00</span></td>`;
            } else {
              html += `<td class="cell cell-ac"><span>${fmtScore(score)}</span></td>`;
            }
          } else if (score > 0) {
            html += `<td class="cell cell-partial"><span>${fmtScore(score)}</span></td>`;
          } else {
            html += `<td class="cell cell-wa"><span>${fmtScore(score)}</span></td>`;
          }
        });

        html += `
          <td class="cell-total">${fmtScore(p.total ?? 0)}</td>
        </tr>`;
      });

      html += `
              </tbody>
            </table>
          </div>
          <div class="rs-legend">
            <span class="rs-legend-item"><span class="rs-legend-swatch ac-first"></span> First-try AC</span>
            <span class="rs-legend-item"><span class="rs-legend-swatch ac"></span> AC (after tries)</span>
            <span class="rs-legend-item"><span class="rs-legend-swatch wa"></span> Wrong Answer</span>
            <span class="rs-legend-item"><span class="rs-legend-swatch partial"></span> Partial</span>
            <span class="rs-legend-item"><span class="rs-legend-swatch empty"></span> Not attempted</span>
          </div>
        </div>
      `;

      html += `
        <div style="padding-top:.5rem;">
          <a href="/contest/${contestId}" class="rs-back"><i class="fas fa-arrow-left"></i> Back to Contest</a>
        </div>
      `;

      html += `</div>`;
      mainContainer.innerHTML = html;

      // Tooltip 绑定
      const userMap = Object.fromEntries(participants.map(p => [p.username, p]));
      mainContainer.querySelectorAll('.user-link').forEach(link => {
        link.addEventListener('mouseenter', (e) => {
          const u = userMap[link.dataset.username];
          if (!u) return;
          // 补充 isTeam 用于 tooltip
          u.isTeam = isTeamUser(u.username, u);
          tooltipTargetEl = link;
          showTooltip(u);
          moveTooltip(e);
        });
        link.addEventListener('mousemove', moveTooltip);
        link.addEventListener('mouseleave', hideTooltip);
      });
    }

    (async function init() {
      const stats = await loadResults();
      renderResults(stats);
    })();
  </script>
</body>
</html>
