  <script>
  (function() {
    if (localStorage.getItem('hideDifficulty') === 'true') {
      if (document.body) {
        document.body.classList.add('hide-difficulty');
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('hide-difficulty');
        });
      }
    }
    window.addEventListener('storage', (e) => {
      if (e.key === 'hideDifficulty') {
        document.body.classList.toggle('hide-difficulty', e.newValue === 'true');
      }
    });
  })();
</script>

        /* ═══════════════ Random 抽奖机 ═══════════════ */
    .slot-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .slot-overlay.show { opacity: 1; }
    .slot-overlay.fade-out { opacity: 0; pointer-events: none; }

    .slot-machine {
      background: linear-gradient(180deg, #1e2130 0%, #0f1219 100%);
      border: 2px solid rgba(255,200,80,.35);
      border-radius: 16px;
      padding: 30px 38px;
      box-shadow: 0 0 60px rgba(255,200,80,.25),
                  0 20px 60px rgba(0,0,0,.8);
      text-align: center;
      color: #fff;
      min-width: 360px;
      max-width: 92vw;
      font-family: inherit;
    }
    .slot-title {
      font-size: .82rem;
      color: #ffc850;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 700;
      opacity: .85;
    }
    .slot-reels {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .slot-reel {
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 16px 22px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      min-width: 100px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,.5);
      box-shadow: inset 0 4px 12px rgba(0,0,0,.9);
      transition: border-color .3s, color .3s;
      letter-spacing: 2px;
    }
    .slot-reel.landed {
      border-color: #ffc850;
      color: #ffc850;
      animation: slotGlow .7s ease;
    }
    @keyframes slotGlow {
      0%   { text-shadow: 0 0 20px rgba(255,200,80,.5); }
      40%  { text-shadow: 0 0 40px rgba(255,200,80,1), 0 0 80px rgba(255,200,80,.8); }
      100% { text-shadow: 0 0 20px rgba(255,200,80,.5); }
    }
    .slot-status {
      font-size: .9rem;
      color: #aaa;
      min-height: 1.4em;
      letter-spacing: 1.5px;
      transition: color .3s;
    }
    .slot-status.done {
      color: #ffc850;
      font-weight: 700;
      font-size: 1rem;
    }
    @media (max-width: 480px) {
      .slot-machine { padding: 22px 24px; min-width: auto; }
      .slot-reel { font-size: 1.8rem; min-width: 80px; padding: 12px 16px; }
    }
