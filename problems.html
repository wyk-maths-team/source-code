<meta charset="UTF-8">
<script>(function(){try{
  var t = localStorage.getItem('theme') || 'light';
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  if (localStorage.getItem('pageTransition') === 'off') return;
  if (sessionStorage.getItem('__pt') !== 'in') return;
  // ⭐ 铺的是"遮罩色"，不是页面底色
  document.documentElement.style.background = (t === 'dark' ? '#0d1117' : '#0f3460');
}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/pageload.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WYK Maths Team - Problems</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/problems.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script>
  (function() {
    if (localStorage.getItem('hideDifficulty') === 'true') {
      if (document.body) {
        document.body.classList.add('hide-difficulty');
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('hide-difficulty');
        });
      }
    }
    window.addEventListener('storage', (e) => {
      if (e.key === 'hideDifficulty') {
        document.body.classList.toggle('hide-difficulty', e.newValue === 'true');
      }
    });
  })();
</script>

<body class="index-body">
<div id="appContainer">
  <header class="topbar" id="topbarContainer"></header>
  <aside class="sidebar" id="sidebarContainer"></aside>
  <main class="main-content" id="mainContent">
  <div class="updates-panel" style="padding:0.5rem;">
    <div class="updates-header">
      <h2>Problem Set</h2>
      <div>
        <button id="refreshProblemsBtn" class="btn btn-primary" style="margin-left:0.5rem;">
          <i class="fas fa-sync-alt"></i>
        </button>

        <a href="/problems/bookmarked" class="btn btn-secondary" style="margin-left:0.5rem;">
          Bookmarked

      </div>
    </div>
    <div class="cat-grid" id="initialCatGrid">
      <div class="cat-col">
        <div class="cat-box">
          <div class="cat-heading">Learn</div>
          <ul class="cat-list">
            <li class="cat-item disabled"><span class="cat-text">Tricks</span><span class="cat-badge blurred">00</span></li>
            <li class="cat-item disabled"><span class="cat-text">Advanced skills</span><span class="cat-badge blurred">00</span></li>
          </ul>
        </div>
      </div>
      <div class="cat-col">
        <div class="cat-box">
          <div class="cat-heading">Exercises</div>
          <ul class="cat-list">
            <li class="cat-item disabled"><span class="cat-text">DSE</span><span class="cat-badge blurred">00</span></li>
          </ul>
        </div>
      </div>
      <div class="cat-col">
        <div class="cat-box">
          <div class="cat-heading">Local Competitions</div>
          <ul class="cat-list">
            <li class="cat-item disabled"><span class="cat-text">HKMHASC</span><span class="cat-badge blurred">000</span></li>
            <li class="cat-item disabled"><span class="cat-text">HKMO</span><span class="cat-badge blurred">0000</span></li>
            <li class="cat-item disabled"><span class="cat-text">IMO Prelim</span><span class="cat-badge blurred">000</span></li>
          </ul>
        </div>
      </div>
      <div class="cat-col">
        <div class="cat-box">
          <div class="cat-heading">External Competitions</div>
          <ul class="cat-list">
            <li class="cat-item disabled"><span class="cat-text">IMO Shortlist</span><span class="cat-badge blurred">00</span></li>
            <li class="cat-item disabled"><span class="cat-text">CMO</span><span class="cat-badge blurred">00</span></li>
            <li class="cat-item disabled"><span class="cat-text">APMO</span><span class="cat-badge blurred">00</span></li>
          </ul>
        </div>
      </div>
    </div>
    <div style="min-height:400px;">
      <div class="tag-dd-row">
        <button class="tag-dd-btn" disabled>
          <i class="fas fa-tag"></i><span>Tags</span><span class="caret">▾</span>
        </button>
      </div>
    </div>
  </div>
</main>
