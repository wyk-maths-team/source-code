  <style>
    .rp-wrap { max-width: 780px; margin: 0 auto; }
    .rp-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 20px 22px; margin-bottom: 18px;
    }
    .rp-title { margin: 0 0 6px; font-size: 1.2rem; color: var(--text-primary); }
    .rp-sub { margin: 0 0 18px; font-size: .86rem; color: var(--text-secondary); line-height: 1.6; }
    .rp-label { display: block; font-size: .76rem; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
    .rp-textarea {
      width: 100%; box-sizing: border-box; min-height: 140px; resize: vertical;
      padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-primary); font: inherit; font-size: .9rem; line-height: 1.6;
    }
    .rp-counter { text-align: right; font-size: .74rem; color: var(--text-secondary); margin-top: 4px; }
    .rp-shots { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .rp-shot {
      position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-color); background: var(--bg-color);
    }
    .rp-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rp-shot button {
      position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
      border: none; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; font-size: .62rem; line-height: 1;
    }
    .rp-add {
      width: 96px; height: 96px; border-radius: 8px; border: 1px dashed var(--border-color);
      background: var(--bg-color); color: var(--text-secondary); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font-size: .72rem;
    }
    .rp-add:hover { border-color: var(--accent); color: var(--accent); }
    .rp-actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .rp-submit {
      padding: 9px 22px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: .88rem;
    }
    .rp-submit:disabled { opacity: .6; cursor: default; }
    .rp-note { font-size: .8rem; color: var(--text-secondary); }
    .rp-history { list-style: none; margin: 0; padding: 0; }
    .rp-history li {
      border-top: 1px solid var(--border-color); padding: 12px 0; font-size: .86rem;
    }
    .rp-history li:first-child { border-top: none; }
    .rp-hist-head { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
    .rp-badge {
      font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      background: #fff3cd; color: #856404;
    }
    .rp-badge.handled { background: #d4edda; color: #155724; }
    .rp-hist-time { font-size: .74rem; color: var(--text-secondary); margin-left: auto; }
    .rp-hist-body { white-space: pre-wrap; color: var(--text-primary); }
    .rp-hist-imgs { display: flex; gap: 6px; margin-top: 6px; }
    .rp-hist-imgs img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
    [data-theme="dark"] .rp-badge { background: #4d3e1b; color: #dfc88f; }
    [data-theme="dark"] .rp-badge.handled { background: #1b4d2e; color: #8fdf8f; }
    [data-theme="scifi"] .rp-badge { background: #2e2410; color: #ffd166; }
    [data-theme="scifi"] .rp-badge.handled { background: #0b2a24; color: #7ef2c8; }
  </style>

<body class="index-body">
  <header class="topbar" id="topbarContainer"></header>
  <aside class="sidebar" id="sidebarContainer"></aside>
  <main class="main-content" id="mainContent">
    <div class="rp-wrap">
      <section class="rp-card">
        <h1 class="rp-title"><i class="fas fa-flag"></i> Report a problem</h1>
        <p class="rp-sub">
          Something broken, a wrong answer key, a page that will not load, or anything else you want us to look at.
          Describe it as clearly as you can — screenshots help a lot.
        </p>

        <label class="rp-label" for="rpBody">What happened</label>
        <textarea id="rpBody" class="rp-textarea" maxlength="4000"
          placeholder="e.g. On problem HA0108 the accepted answer looks wrong; my answer 19 was marked incorrect."></textarea>
        <div class="rp-counter"><span id="rpCount">0</span> / 4000</div>

        <label class="rp-label" style="margin-top:16px;">Screenshots <span id="rpShotHint">(up to 2)</span></label>
        <div class="rp-shots" id="rpShots"></div>

        <div class="rp-actions">
          <button type="button" class="rp-submit" id="rpSubmit">Send report</button>
          <span class="rp-note" id="rpNote"></span>
        </div>
      </section>

      <section class="rp-card">
        <h2 class="rp-title" style="font-size:1rem;">Your recent reports</h2>
        <ul class="rp-history" id="rpHistory">
          <li style="color:var(--text-secondary);">Loading…</li>
        </ul>
      </section>
    </div>
  </main>
    <script src="/assets/js/auth.js?v=8149948a"></script>
  <script src="/assets/js/app.js?v=8149948a"></script>
  <script src="/assets/js/topbar.js?v=8149948a"></script>
  <script src="/assets/js/sidebar.js?v=8149948a"></script>
  <script src="/assets/js/core/polling.js?v=8149948a"></script>
  <script src="/assets/js/heartbeat.js?v=8149948a"></script>
  <script src="/assets/js/pk-invite.js?v=8149948a"></script>
<script src="/assets/js/pk-notify.js?v=8149948a"></script>
  <script>
    Page.boot({ title: 'Reports', requireAuth: true, skeleton: true });

    Page.ready(function () {
      // 图片上限由后端决定，这里只负责显示；改数字不用动这个文件
      var MAX_IMAGES = 2;
      var shots = [];
      var shotsEl = document.getElementById('rpShots');
      var bodyEl = document.getElementById('rpBody');
      var countEl = document.getElementById('rpCount');
      var noteEl = document.getElementById('rpNote');
      var submitEl = document.getElementById('rpSubmit');

      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      };

      bodyEl.addEventListener('input', function () {
        countEl.textContent = String(bodyEl.value.length);
      });

      function renderShots() {
        shotsEl.innerHTML = '';
        shots.forEach(function (s, i) {
          var box = document.createElement('div');
          box.className = 'rp-shot';
          box.innerHTML = '<img src="' + s + '" alt="screenshot">' +
            '<button type="button" data-i="' + i + '" title="Remove">&times;</button>';
          shotsEl.appendChild(box);
        });
        if (shots.length < MAX_IMAGES) {
          var add = document.createElement('button');
          add.type = 'button';
          add.className = 'rp-add';
          add.innerHTML = '<i class="fas fa-plus"></i><span>Add</span>';
          add.addEventListener('click', pickFile);
          shotsEl.appendChild(add);
        }
        shotsEl.querySelectorAll('.rp-shot button').forEach(function (b) {
          b.addEventListener('click', function () {
            shots.splice(parseInt(b.dataset.i, 10), 1);
            renderShots();
          });
        });
      }

      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.style.display = 'none';
      document.body.appendChild(fileInput);

      function pickFile() { fileInput.click(); }

      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        if (f.size > 6 * 1024 * 1024) {
          noteEl.textContent = 'That image is over 6 MB.';
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          shots.push(reader.result);
          renderShots();
          noteEl.textContent = '';
        };
        reader.readAsDataURL(f);
        fileInput.value = '';
      });

      submitEl.addEventListener('click', async function () {
        var body = bodyEl.value.trim();
        if (!body) { noteEl.textContent = 'Please describe the problem first.'; return; }
        submitEl.disabled = true;
        submitEl.textContent = 'Sending…';
        noteEl.textContent = '';
        try {
          var res = await apiCall('/api/reports?action=create', 'POST', { body: body, images: shots });
          if (!res.success) throw new Error(res.message || 'Failed');
          noteEl.textContent = 'Thanks — we got it.';
          bodyEl.value = '';
          countEl.textContent = '0';
          shots = [];
          renderShots();
          loadHistory();
        } catch (e) {
          noteEl.textContent = e.message || 'Send failed';
        } finally {
          submitEl.disabled = false;
          submitEl.textContent = 'Send report';
        }
      });

      function fmt(ts) {
        try { return new Date(ts).toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }); }
        catch (e) { return ''; }
      }

      async function loadHistory() {
        var list = document.getElementById('rpHistory');
        try {
          var res = await apiCall('/api/reports?action=mine');
          var items = (res && res.items) || [];
          if (!items.length) {
            list.innerHTML = '<li style="color:var(--text-secondary);">You have not sent any reports yet.</li>';
            return;
          }
          list.innerHTML = items.map(function (r) {
            var imgs = (r.images || []).map(function (u) {
              return '<img src="' + esc(u) + '" alt="screenshot">';
            }).join('');
            return '<li>' +
              '<div class="rp-hist-head">' +
                '<span class="rp-badge' + (r.status === 'handled' ? ' handled' : '') + '">' +
                  (r.status === 'handled' ? 'Handled' : 'Open') + '</span>' +
                '<span class="rp-hist-time">' + esc(fmt(r.createdAt)) + '</span>' +
              '</div>' +
              '<div class="rp-hist-body">' + esc(r.body) + '</div>' +
              (imgs ? '<div class="rp-hist-imgs">' + imgs + '</div>' : '') +
            '</li>';
          }).join('');
        } catch (e) {
          list.innerHTML = '<li style="color:var(--danger);">Could not load your reports.</li>';
        }
      }

      renderShots();
      loadHistory();
      Page.hideSkeleton();
    });
  </script>
</body>
