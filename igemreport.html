<!DOCTYPE html>
<html lang="zh-HK">
<head>

<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/arch-render.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iGEM Reports - WYK Maths Team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/web_css/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  .ig-wrap { max-width: 900px; margin: 0 auto; }
  .ig-hero { margin-bottom: 1.2rem; }
  .ig-hero h1 { margin: 0 0 .3rem; font-size: 1.6rem; }
  .ig-hero p { margin: 0; color: var(--text-secondary); font-size: .9rem; }

  .ig-drop {
    background: var(--card-bg); border: 2px dashed var(--border-color);
    border-radius: 12px; padding: 2.5rem 1.5rem; text-align: center;
    cursor: pointer; transition: all .15s; position: relative;
  }
  .ig-drop:hover, .ig-drop.dragover { border-color: var(--accent); background: rgba(74,144,217,.05); }
  .ig-drop > i { font-size: 2.6rem; color: var(--accent); margin-bottom: .8rem; display: block; }
  .ig-drop-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
  .ig-drop-sub { color: var(--text-secondary); font-size: .82rem; line-height: 1.5; }

  .ig-pick-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px; margin-top: 14px;
    background: var(--accent); color: #fff;
    border-radius: 8px; font-weight: 600; font-size: .9rem;
    cursor: pointer; transition: filter .12s;
    user-select: none;
  }
  .ig-pick-btn:hover { filter: brightness(1.08); }
  .ig-pick-btn:active { transform: scale(.97); }

  .ig-paste {
    margin-top: 1rem; background: var(--card-bg);
    border: 1px solid var(--border-color); border-radius: 10px; padding: 14px;
  }
  .ig-paste-label { font-size: .8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
  .ig-paste-input {
    width: 100%; min-height: 70px; padding: 10px 14px;
    border: 2px dashed var(--border-color); border-radius: 6px;
    background: rgba(74,144,217,.04); color: var(--text-secondary);
    font-family: inherit; font-size: .85rem; line-height: 1.5;
    resize: vertical; outline: none; box-sizing: border-box;
  }
  .ig-paste-input:focus { border-color: var(--accent); border-style: solid; color: var(--text-primary); }

  .ig-queue {
    margin-top: 1rem; padding: 14px 16px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 10px;
  }
  .ig-queue-head {
    display: flex; align-items: center; gap: 6px;
    font-size: .9rem; font-weight: 700; margin-bottom: 10px;
  }
  .ig-queue-clear {
    margin-left: auto; padding: 3px 10px; font-size: .78rem;
    border: 1px solid var(--border-color); border-radius: 5px;
    background: none; color: var(--text-secondary); cursor: pointer;
  }
  .ig-queue-clear:hover { border-color: var(--danger); color: var(--danger); }
  .ig-queue-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .ig-queue-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    background: rgba(74,144,217,.05);
    border: 1px solid rgba(74,144,217,.15);
    font-size: .85rem;
  }
  .ig-queue-item i.ico { color: var(--accent); flex-shrink: 0; }
  .ig-queue-item .name { flex: 1; min-width: 0; word-break: break-all; }
  .ig-queue-item .size { color: var(--text-secondary); font-size: .78rem; flex-shrink: 0; }
  .ig-queue-item .rm {
    flex-shrink: 0; background: none; border: none; cursor: pointer;
    color: var(--text-secondary); padding: 2px 6px; font-size: .8rem;
  }
  .ig-queue-item .rm:hover { color: var(--danger); }
  .ig-submit-btn {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff;
    font-size: .95rem; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: filter .12s;
  }
  .ig-submit-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .ig-submit-btn:disabled { opacity: .55; cursor: not-allowed; }

  .ig-progress {
    display: none; margin-top: 1rem; padding: 12px 16px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 8px; font-size: .88rem; color: var(--accent);
    align-items: center; gap: 10px;
  }
  .ig-progress.show { display: flex; }
  .ig-progress i { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ig-msg {
    margin-top: .8rem; padding: 10px 14px; border-radius: 8px;
    font-size: .88rem; display: none;
  }
  .ig-msg.show { display: block; }
  .ig-msg.ok { background: rgba(76,175,80,.12); color: #2e7d32; border: 1px solid rgba(76,175,80,.3); }
  .ig-msg.err { background: rgba(248,81,73,.12); color: #c62828; border: 1px solid rgba(248,81,73,.3); }
  [data-theme="dark"] .ig-msg.ok { color: #8fdf8f; }
  [data-theme="dark"] .ig-msg.err { color: #ff8888; }

  .ig-section { margin-top: 2rem; }
  .ig-section h2 { font-size: 1.05rem; margin-bottom: .8rem; display: flex; align-items: center; gap: 8px; }
  .ig-count { color: var(--text-secondary); font-size: .82rem; font-weight: 400; }
  .ig-refresh { margin-left: auto; background: none; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 5px; cursor: pointer; color: var(--text-primary); font-size: .78rem; }
  .ig-refresh:hover { border-color: var(--accent); color: var(--accent); }

  .ig-list { display: flex; flex-direction: column; gap: 8px; }
  .ig-item {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 8px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: all .15s;
  }
  .ig-item-icon { font-size: 1.6rem; color: var(--accent); flex-shrink: 0; width: 32px; text-align: center; }

  .ig-item-thumb {
    width: 56px; height: 56px; flex-shrink: 0;
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border-color);
    background: #f5f5f5; display: block;
    transition: transform .12s;
  }
  [data-theme="dark"] .ig-item-thumb { background: #1a1e25; }
  .ig-item-thumb:hover { transform: scale(1.04); }
  .ig-item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ig-item-main { flex: 1; min-width: 0; }
  .ig-item-name { font-weight: 600; font-size: .92rem; word-break: break-all; }
  .ig-item-meta { font-size: .75rem; color: var(--text-secondary); margin-top: 2px; }
  .ig-item-actions { flex-shrink: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ig-btn {
    padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border-color);
    background: var(--card-bg); color: var(--text-primary);
    font-size: .8rem; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: all .12s; display: inline-flex; align-items: center; gap: 4px;
  }
  .ig-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ig-empty { text-align: center; padding: 2rem; color: var(--text-secondary); font-size: .9rem; }

  .ig-resolve-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 5px;
    border: 1px solid var(--border-color);
    cursor: pointer; user-select: none;
    font-size: .8rem; font-weight: 600;
    transition: all .12s;
  }
  .ig-resolve-toggle:hover { border-color: var(--accent); }
  .ig-resolve-toggle input { display: none; }
  .ig-checkmark {
    width: 16px; height: 16px; border-radius: 4px;
    border: 2px solid var(--border-color);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .12s;
    position: relative;
  }
  .ig-resolve-toggle input:checked + .ig-checkmark {
    background: #2e7d32; border-color: #2e7d32;
  }
  .ig-resolve-toggle input:checked + .ig-checkmark::after {
    content: ''; width: 4px; height: 8px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .ig-resolve-toggle input:checked ~ .ig-resolve-label { color: #2e7d32; }
  [data-theme="dark"] .ig-resolve-toggle input:checked ~ .ig-resolve-label { color: #8fdf8f; }
  .ig-resolve-toggle input:disabled { opacity: .5; }

  .ig-item.resolved {
    opacity: .55;
    background: rgba(76,175,80,.05);
    border-color: rgba(76,175,80,.25);
  }
  .ig-item.resolved .ig-item-name {
    text-decoration: line-through;
    text-decoration-color: rgba(76,175,80,.6);
  }
  .ig-resolved-by { color: #2e7d32; font-weight: 600; }
  [data-theme="dark"] .ig-resolved-by { color: #8fdf8f; }

  @media (max-width: 600px) {
    .ig-drop { padding: 2rem 1rem; }
    .ig-item { flex-wrap: wrap; }
    .ig-item-actions { width: 100%; justify-content: flex-end; }
  }
/* hover 卡片效果 */
.ig-item {
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s;
}
.ig-item:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 6px 20px rgba(74,144,217,.14);
}
.ig-item.resolved:hover {
  box-shadow: 0 6px 20px rgba(76,175,80,.18);
}

/* 缩略图点击光标 */
.ig-item-thumb { cursor: zoom-in; }

/* Lightbox */
.ig-lightbox {
  position: fixed; inset: 0; z-index: 9999;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 40px 24px;
  opacity: 0;
  transition: opacity .2s ease;
}
.ig-lightbox.show { display: flex; opacity: 1; }
.ig-lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 60px rgba(0,0,0,.7);
  transform: scale(.96);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1);
}
.ig-lightbox.show img { transform: scale(1); }
.ig-lightbox-close {
  position: absolute;
  top: 20px; right: 24px;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none;
  transition: background .15s, transform .15s;
}
.ig-lightbox-close:hover { background: rgba(255,255,255,.28); transform: scale(1.08); }
.ig-lightbox-caption {
  position: absolute;
  bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.85);
  font-size: .85rem;
  background: rgba(0,0,0,.5);
  padding: 6px 14px; border-radius: 20px;
  max-width: 90vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}
.ig-lightbox-prev,
.ig-lightbox-next {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none;
  transition: background .15s;
}
.ig-lightbox-prev { left: 20px; }
.ig-lightbox-next { right: 20px; }
.ig-lightbox-prev:hover,
.ig-lightbox-next:hover { background: rgba(255,255,255,.28); }
.ig-lightbox-prev[hidden],
.ig-lightbox-next[hidden] { display: none; }
</style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="ig-wrap">
        <div class="ig-hero">
          <h1><i class="fas fa-flask" style="color:var(--accent);margin-right:8px"></i>iGEM Reports</h1>
          <p>上傳報告、文檔、圖片——所有人可見。檔案透過 CDN 加速下載。</p>
        </div>

        <div class="ig-drop" id="igDrop">
          <i class="fas fa-cloud-arrow-up"></i>
          <div class="ig-drop-title">拖拽檔案到此處</div>
          <div class="ig-drop-sub">或</div>
          <label class="ig-pick-btn" for="igFile">
            <i class="fas fa-folder-open"></i> 選擇檔案
          </label>
          <input type="file" id="igFile" multiple
            style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px" />
        </div>

        <div class="ig-paste">
          <div class="ig-paste-label">
            <i class="fas fa-paste" style="margin-right:5px;opacity:.7"></i>
            或者在此貼上（Ctrl + V）：截圖、複製的檔案
          </div>
          <textarea class="ig-paste-input" id="igPaste"
            placeholder="點此處，然後按 Ctrl + V 貼上檔案或截圖…"></textarea>
        </div>

        <div class="ig-queue" id="igQueue" style="display:none">
          <div class="ig-queue-head">
            <i class="fas fa-list" style="margin-right:6px;opacity:.7"></i>
            待上傳 <span id="igQueueCount">0</span> 個檔案
            <button class="ig-queue-clear" id="igQueueClear" type="button">清空</button>
          </div>
          <div class="ig-queue-list" id="igQueueList"></div>
          <button class="ig-submit-btn" id="igSubmit" type="button">
            <i class="fas fa-cloud-arrow-up"></i> 提交上傳
          </button>
        </div>

        <div class="ig-progress" id="igProgress">
          <i class="fas fa-spinner"></i>
          <span id="igProgressText">上傳中…</span>
        </div>

        <div class="ig-msg" id="igMsg"></div>

        <div class="ig-section">
          <h2>
            <i class="fas fa-folder-open" style="opacity:.7"></i>
            所有檔案 <span class="ig-count" id="igCount"></span>
            <button class="ig-refresh" id="igRefresh" title="重新整理">
              <i class="fas fa-rotate"></i> Refresh
            </button>
          </h2>
          <div class="ig-list" id="igList">
            <div class="ig-empty"><i class="fas fa-spinner fa-spin"></i> 載入中…</div>
          </div>
        </div>
      </div>
      <div class="ig-lightbox" id="igLightbox" aria-hidden="true">
  <button class="ig-lightbox-close" id="igLightboxClose" aria-label="關閉">
    <i class="fas fa-times"></i>
  </button>
  <button class="ig-lightbox-prev" id="igLightboxPrev" aria-label="上一張">
    <i class="fas fa-chevron-left"></i>
  </button>
  <img id="igLightboxImg" alt="" />
  <button class="ig-lightbox-next" id="igLightboxNext" aria-label="下一張">
    <i class="fas fa-chevron-right"></i>
  </button>
  <div class="ig-lightbox-caption" id="igLightboxCaption"></div>
</div>
    </main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/topbar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/heartbeat.js"></script>
<script src="https://cdn.jsdelivr.net/gh/wyk-math-team/resources/script/sidebar.js"></script>
<script src="/script/heartbeat.js"></script>

  <script>
    if (!isLoggedIn()) window.location.href = '/index.html';

    const dropEl       = document.getElementById('igDrop');
    const fileEl       = document.getElementById('igFile');
    const pasteEl      = document.getElementById('igPaste');
    const progEl       = document.getElementById('igProgress');
    const progTxt      = document.getElementById('igProgressText');
    const msgEl        = document.getElementById('igMsg');
    const listEl       = document.getElementById('igList');
    const countEl      = document.getElementById('igCount');
    const refreshEl    = document.getElementById('igRefresh');
    const queueEl      = document.getElementById('igQueue');
    const queueListEl  = document.getElementById('igQueueList');
    const queueCountEl = document.getElementById('igQueueCount');
    const queueClearEl = document.getElementById('igQueueClear');
    const submitEl     = document.getElementById('igSubmit');

    const MAX_BYTES = 25 * 1024 * 1024;

    let queue = [];
    let nextId = 1;
    let uploading = false;

    // ═══════ 工具 ═══════
    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }
    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts), pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function isImage(name) {
      const ext = (String(name).match(/\.([A-Za-z0-9]+)$/) || [,''])[1].toLowerCase();
      return ['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext);
    }
    function iconFor(name) {
      const ext = (String(name).match(/\.([A-Za-z0-9]+)$/) || [,''])[1].toLowerCase();
      if (['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext)) return 'fa-file-image';
      if (ext === 'pdf') return 'fa-file-pdf';
      if (['doc','docx'].includes(ext)) return 'fa-file-word';
      if (['xls','xlsx','csv'].includes(ext)) return 'fa-file-excel';
      if (['ppt','pptx'].includes(ext)) return 'fa-file-powerpoint';
      if (['zip','rar','7z','tar','gz'].includes(ext)) return 'fa-file-zipper';
      if (['mp4','mov','avi','mkv','webm'].includes(ext)) return 'fa-file-video';
      if (['mp3','wav','ogg','m4a'].includes(ext)) return 'fa-file-audio';
      if (['js','ts','py','cpp','c','java','html','css'].includes(ext)) return 'fa-file-code';
      return 'fa-file';
    }
    function esc(s) {
      return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    }
    function showMsg(text, type = 'ok') {
      msgEl.textContent = text;
      msgEl.className = 'ig-msg show ' + type;
      clearTimeout(showMsg._t);
      showMsg._t = setTimeout(() => msgEl.className = 'ig-msg', 6000);
    }
    function setProgress(text) {
      if (text == null) { progEl.classList.remove('show'); return; }
      progTxt.textContent = text;
      progEl.classList.add('show');
    }

    // ═══════ 队列 ═══════
    function addFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      let added = 0, skipped = 0;
      for (const f of files) {
        if (f.size > MAX_BYTES) { skipped++; continue; }
        queue.push({ file: f, id: nextId++ });
        added++;
      }
      renderQueue();
      if (added) showMsg(`✓ 已加入 ${added} 個檔案到待上傳佇列`, 'ok');
      if (skipped) showMsg(`⚠️ ${skipped} 個檔案太大（> 25 MB），已跳過`, 'err');
    }
    function removeFile(id) {
      queue = queue.filter(x => x.id !== id);
      renderQueue();
    }
    function renderQueue() {
      if (queue.length === 0) {
        queueEl.style.display = 'none';
        queueListEl.innerHTML = '';
        queueCountEl.textContent = '0';
        return;
      }
      queueEl.style.display = '';
      queueCountEl.textContent = queue.length;
      queueListEl.innerHTML = queue.map(x => `
        <div class="ig-queue-item">
          <i class="ico fas ${iconFor(x.file.name)}"></i>
          <span class="name">${esc(x.file.name)}</span>
          <span class="size">${fmtSize(x.file.size)}</span>
          <button class="rm" data-id="${x.id}" title="移除">✕</button>
        </div>
      `).join('');
      queueListEl.querySelectorAll('.rm').forEach(b => {
        b.onclick = () => removeFile(Number(b.dataset.id));
      });
    }

    // ═══════ 上传 ═══════
    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error('讀取失敗'));
        r.readAsDataURL(file);
      });
    }
    async function uploadOne(file) {
      const dataUrl = await readAsDataUrl(file);
      return await apiCall('/api/igemreport', 'POST', {
        filename: file.name,
        dataUrl,
      });
    }
    async function submitQueue() {
      if (uploading || queue.length === 0) return;
      uploading = true;
      submitEl.disabled = true;
      submitEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上傳中…';

      const total = queue.length;
      let ok = 0, fail = 0;
      const failed = [];

      for (let i = 0; i < total; i++) {
        const item = queue[i];
        setProgress(`(${i + 1}/${total}) 上傳「${item.file.name}」…`);
        try {
          const res = await uploadOne(item.file);
          if (res && res.success) {
            ok++;
            prependFile({
              name: res.file.name,
              url: res.file.url,
              uploadedAt: res.file.uploadedAt,
              uploadedBy: (getCurrentUser() || {}).username || '',
              displayName: item.file.name,
              resolved: false,
            });
          } else {
            fail++;
            failed.push(item);
          }
        } catch (err) {
          fail++;
          failed.push(item);
        }
      }

      setProgress(null);
      uploading = false;
      submitEl.disabled = false;
      submitEl.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> 提交上傳';

      queue = failed;
      renderQueue();

      if (fail === 0) {
        showMsg(`✓ 全部上傳成功（${ok} 個）`, 'ok');
      } else if (ok === 0) {
        showMsg(`✗ 全部失敗（${fail} 個），已保留在佇列`, 'err');
      } else {
        showMsg(`部分成功：${ok} 成功 / ${fail} 失敗。失敗項已留在佇列。`, 'err');
      }
    }

    // ═══════ 列表渲染 ═══════
    function renderItem(f) {
      const size = f.size ? ` · ${fmtSize(f.size)}` : '';
      const user = f.uploadedBy ? ` · ${esc(f.uploadedBy)}` : '';
      const time = f.uploadedAt ? fmtTime(f.uploadedAt) : '';
      const resolved = !!f.resolved;

const preview = isImage(f.name)
  ? `<div class="ig-item-thumb" data-img="${esc(f.url)}" data-caption="${esc(f.displayName || f.name)}">
       <img src="${esc(f.url)}" alt="${esc(f.displayName || f.name)}" loading="lazy" />
     </div>`
  : `<i class="ig-item-icon fas ${iconFor(f.name)}"></i>`;
      return `
        <div class="ig-item${resolved ? ' resolved' : ''}" data-filename="${esc(f.name)}">
          ${preview}
          <div class="ig-item-main">
            <div class="ig-item-name">${esc(f.displayName || f.name)}</div>
            <div class="ig-item-meta">
              ${time}${user}${size}
              ${resolved && f.resolvedBy ? ` · <span class="ig-resolved-by"><i class="fas fa-check"></i> ${esc(f.resolvedBy)} 標記已解決</span>` : ''}
            </div>
          </div>
          <div class="ig-item-actions">
            <label class="ig-resolve-toggle" title="${resolved ? '取消已解決' : '標記已解決'}">
              <input type="checkbox" data-filename="${esc(f.name)}" ${resolved ? 'checked' : ''} />
              <span class="ig-checkmark"></span>
              <span class="ig-resolve-label">${resolved ? '已解決' : '未解決'}</span>
            </label>
            <a class="ig-btn" href="${esc(f.url)}" target="_blank" rel="noopener" title="開啟">
              <i class="fas fa-eye"></i>
            </a>
            <a class="ig-btn" href="${esc(f.url)}" download title="下載">
              <i class="fas fa-download"></i>
            </a>
          </div>
        </div>
      `;
    }

    function bindOneToggle(cb) {
      cb.addEventListener('change', async () => {
        const filename = cb.dataset.filename;
        const next = cb.checked;
        const item = cb.closest('.ig-item');
        const label = cb.parentElement.querySelector('.ig-resolve-label');
        cb.disabled = true;
        try {
          const res = await apiCall('/api/igemreport', 'PUT', { filename, resolved: next });
          if (!res || !res.success) throw new Error(res?.message || 'failed');
          item.classList.toggle('resolved', next);
          if (label) label.textContent = next ? '已解決' : '未解決';
        } catch (err) {
          cb.checked = !next;
          showMsg('標記失敗：' + err.message, 'err');
        } finally {
          cb.disabled = false;
        }
      });
    }

    function bindResolveToggles() {
      listEl.querySelectorAll('.ig-resolve-toggle input[type="checkbox"]').forEach(bindOneToggle);
    }

    function prependFile(f) {
      const empty = listEl.querySelector('.ig-empty');
      if (empty) empty.remove();
      listEl.insertAdjacentHTML('afterbegin', renderItem(f));
      const newItem = listEl.firstElementChild;
      newItem.querySelectorAll('.ig-resolve-toggle input').forEach(bindOneToggle);
      countEl.textContent = `(${listEl.children.length})`;
    }

    async function loadFiles() {
      listEl.innerHTML = '<div class="ig-empty"><i class="fas fa-spinner fa-spin"></i> 載入中…</div>';
      try {
        const res = await apiCall('/api/igemreport', 'GET');
        if (!res || !res.success) throw new Error(res?.message || 'load failed');
        const files = res.files || [];
        if (!files.length) {
          listEl.innerHTML = '<div class="ig-empty"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:8px;opacity:.4"></i>還沒有任何檔案</div>';
          countEl.textContent = '';
          return;
        }
        listEl.innerHTML = files.map(renderItem).join('');
        bindResolveToggles();
        countEl.textContent = `(${files.length})`;
      } catch (err) {
        listEl.innerHTML = `<div class="ig-empty" style="color:var(--danger)">載入失敗：${esc(err.message)}</div>`;
      }
    }

    // ═══════ 事件 ═══════
    fileEl.addEventListener('change', () => {
      addFiles(fileEl.files);
      fileEl.value = '';
    });

    dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('dragover'); });
    dropEl.addEventListener('dragleave', () => dropEl.classList.remove('dragover'));
    dropEl.addEventListener('drop', e => {
      e.preventDefault();
      dropEl.classList.remove('dragover');
      addFiles(e.dataTransfer?.files);
    });

    function handlePaste(e) {
      const cd = e.clipboardData;
      if (!cd) return;
      const files = [];
      for (let i = 0; i < cd.items.length; i++) {
        const it = cd.items[i];
        if (it.kind === 'file') {
          const f = it.getAsFile();
          if (f) files.push(f);
        }
      }
      if (!files.length) return;
      e.preventDefault();
      addFiles(files);
    }
    pasteEl.addEventListener('paste', handlePaste);
    document.addEventListener('paste', e => {
      if (e.target === pasteEl) return;
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      handlePaste(e);
    });

    submitEl.addEventListener('click', submitQueue);
    queueClearEl.addEventListener('click', () => {
      if (!queue.length) return;
      if (!confirm(`清空待上傳佇列（${queue.length} 個檔案）？`)) return;
      queue = [];
      renderQueue();
    });
    refreshEl.addEventListener('click', loadFiles);
// ═══════ Lightbox ═══════
const lightbox      = document.getElementById('igLightbox');
const lightboxImg   = document.getElementById('igLightboxImg');
const lightboxCap   = document.getElementById('igLightboxCaption');
const lightboxClose = document.getElementById('igLightboxClose');
const lightboxPrev  = document.getElementById('igLightboxPrev');
const lightboxNext  = document.getElementById('igLightboxNext');

let lbImages = [];   // [{ url, caption }]
let lbIndex  = 0;

function openLightbox(url, caption) {
  // 收集当前列表里所有图片（用于左右切换）
  lbImages = Array.from(listEl.querySelectorAll('.ig-item-thumb[data-img]'))
    .map(el => ({ url: el.dataset.img, caption: el.dataset.caption || '' }));
  lbIndex = lbImages.findIndex(x => x.url === url);
  if (lbIndex < 0) {
    lbImages = [{ url, caption: caption || '' }];
    lbIndex = 0;
  }
  showLightbox();
}

function showLightbox() {
  const item = lbImages[lbIndex];
  if (!item) return;
  lightboxImg.src = item.url;
  lightboxImg.alt = item.caption;
  lightboxCap.textContent = item.caption;
  lightboxCap.style.display = item.caption ? '' : 'none';

  // 单张图时隐藏左右箭头
  const single = lbImages.length <= 1;
  lightboxPrev.hidden = single;
  lightboxNext.hidden = single;

  lightbox.classList.add('show');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('show');
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  // 延迟清空 src，避免关闭动画闪烁
  setTimeout(() => { lightboxImg.src = ''; }, 220);
}

function prevImage() {
  if (lbImages.length <= 1) return;
  lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
  showLightbox();
}
function nextImage() {
  if (lbImages.length <= 1) return;
  lbIndex = (lbIndex + 1) % lbImages.length;
  showLightbox();
}

// 事件：列表里任何缩略图被点击
listEl.addEventListener('click', e => {
  const thumb = e.target.closest('.ig-item-thumb[data-img]');
  if (!thumb) return;
  e.preventDefault();
  openLightbox(thumb.dataset.img, thumb.dataset.caption);
});

// 关闭
lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => {
  // 点击背景关闭；点击图片本身不关
  if (e.target === lightbox) closeLightbox();
});
lightboxPrev.addEventListener('click', e => { e.stopPropagation(); prevImage(); });
lightboxNext.addEventListener('click', e => { e.stopPropagation(); nextImage(); });

// 键盘
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') prevImage();
  if (e.key === 'ArrowRight') nextImage();
});
    // ═══════ 启动 ═══════
    renderQueue();
    loadFiles();
  </script>
  <!-- ⭐ Lightbox -->

</body>
