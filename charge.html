<style>
  .charge-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 20px;
    max-width: 1080px;
    margin: 24px auto;
    padding: 0 16px;
  }
  @media (max-width: 820px) { .charge-grid { grid-template-columns: 1fr; } }

  .charge-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 280px;
  }
  .charge-card h3 { margin: 0; font-size: 1rem; color: var(--text-primary); }
  .charge-card h3 i { color: var(--accent); margin-right: 6px; }

  .charge-slider-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }

  input[type="range"].charge-slider {
    width: 100%;
    height: 24px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  input[type="range"].charge-slider:disabled { cursor: not-allowed; opacity: .5; }

  .charge-meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: .85rem;
    color: var(--text-secondary);
  }
  .charge-note { font-size: .78rem; color: var(--text-secondary); }

  .charge-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity .15s;
  }
  .charge-btn:disabled { opacity: .45; cursor: not-allowed; }
  .charge-btn.buy { background: #2ecc71; color: #fff; }
  .charge-btn.buy:not(:disabled):hover { background: #27ae60; }
  .charge-btn.reduce { background: #e74c3c; color: #fff; }
  .charge-btn.reduce:not(:disabled):hover { background: #c0392b; }

  .time-display {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 2.1rem;
    font-weight: 800;
    text-align: center;
    color: var(--text-primary);
    padding: 8px 0 4px;
    letter-spacing: .02em;
  }
  .time-sub { text-align: center; font-size: .78rem; color: var(--text-secondary); margin-top: -6px; }
</style>
</head>
<body class="index-body">
  <div id="appContainer">
    <header class="topbar" id="topbarContainer"></header>
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content" id="mainContent">
      <div class="charge-grid">
        <section class="charge-card">
          <h3><i class="fas fa-coins"></i> Buy time</h3>
          <div class="charge-slider-wrap">
            <input type="range" class="charge-slider" id="buySlider" min="0" step="10000" value="0" disabled>
            <div class="charge-meta">
              <span id="buyTokens">0 / 0 tokens</span>
              <span id="buyPreview">+0s</span>
            </div>
            <div class="charge-note" id="buyNote">Loading…</div>
          </div>
          <button class="charge-btn buy" id="buyBtn" disabled>Confirm</button>
        </section>

        <section class="charge-card">
          <div class="time-display" id="timeDisplay">0s</div>
          <div class="time-sub" id="timeSub">Your banked time</div>
          <div class="charge-slider-wrap">
            <input type="range" class="charge-slider" id="reduceSlider" min="0" step="1" value="0" disabled>
            <div class="charge-meta">
              <span id="reduceLabel">-0 min</span>
            </div>
          </div>
          <button class="charge-btn reduce" id="reduceBtn" disabled>Confirm</button>
        </section>
      </div>
    </main>
  </div>

  <script src="/assets/js/auth.js?v=abcadf0e"></script>
  <script src="/assets/js/app.js?v=abcadf0e"></script>
  <script src="/assets/js/topbar.js?v=abcadf0e"></script>
  <script src="/assets/js/sidebar.js?v=abcadf0e"></script>

  <script src="/assets/js/pages/charge.js?v=abcadf0e"></script>
  <script src="/assets/js/pk-notify.js?v=abcadf0e"></script>
</body>
</html>
