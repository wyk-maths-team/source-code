<title>Contest - WYK Maths Team</title>

<style>
  /* ═══════════════ Contest Detail ═══════════════ */
  .contest-detail { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }

  .cd-hero {
    position: relative; overflow: hidden; border-radius: 16px;
    padding: 2rem 2.2rem 1.8rem;
    background: linear-gradient(135deg, #4a90d9 0%, #2e5fa0 55%, #1a1a2e 100%);
    color: #fff;
    box-shadow: 0 12px 40px rgba(74,144,217,.22), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .cd-hero::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 25%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 58% 20%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 78% 78%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 90% 35%, rgba(255,255,255,.85), transparent);
    background-size: 400px 400px; opacity: .55;
    pointer-events: none; animation: cdDrift 60s linear infinite;
  }
  @keyframes cdDrift { from { background-position: 0 0; } to { background-position: 400px 300px; } }
  .cd-hero::after {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, transparent 65%);
    pointer-events: none;
  }
  .cd-hero-inner { position: relative; z-index: 1; }

  .cd-hero-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; margin-bottom: .6rem;
  }
  .cd-hero-name {
    font-size: 1.9rem; font-weight: 800; letter-spacing: -.5px;
    margin: 0; color: #fff; line-height: 1.2; flex: 1; min-width: 200px;
  }
  .cd-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; border-radius: 20px;
    font-size: .85rem; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
    flex-shrink: 0;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .cd-status.upcoming { background: rgba(255,193,7,.25); color: #ffe066; border: 1px solid rgba(255,193,7,.4); }
  .cd-status.ongoing  { background: rgba(76,175,80,.28); color: #a5f0a5; border: 1px solid rgba(76,175,80,.45); }
  .cd-status.ended    { background: rgba(255,255,255,.15); color: #d0d0d0; border: 1px solid rgba(255,255,255,.25); }
  .cd-status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .cd-status.ongoing .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .4; transform: scale(1.4); }
  }

  .cd-hero-meta { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: .9rem; opacity: .92; }
  .cd-hero-meta .item { display: inline-flex; align-items: center; gap: 6px; }
  .cd-hero-meta i { opacity: .85; font-size: .85rem; }

  .cd-countdown { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid rgba(255,255,255,.15); }
  .cd-countdown-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: .55rem; flex-wrap: wrap; gap: .4rem;
  }
  .cd-countdown-label { font-size: .8rem; letter-spacing: .6px; text-transform: uppercase; opacity: .75; font-weight: 600; }
  .cd-countdown-val {
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 1.35rem; font-weight: 700; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .cd-progress { height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; position: relative; }
  .cd-progress-fill {
    height: 100%; background: linear-gradient(90deg, #7ecbff, #ffffff);
    border-radius: 3px; transition: width .6s ease; box-shadow: 0 0 12px rgba(255,255,255,.6);
  }
  .cd-progress-fill.done { background: linear-gradient(90deg, #a5f0a5, #7ed97e); }

  .cd-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

  .cd-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; }
  .cd-stat {
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
    padding: 1rem 1.1rem; display: flex; align-items: center; gap: .9rem;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .cd-stat:hover { border-color: var(--accent); box-shadow: 0 6px 20px rgba(74,144,217,.12); transform: translateY(-2px); }
  .cd-stat-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; background: rgba(74,144,217,.12); color: var(--accent); flex-shrink: 0;
  }
  .cd-stat-icon.green  { background: rgba(76,175,80,.14);  color: #2e7d32; }
  .cd-stat-icon.amber  { background: rgba(255,193,7,.16);  color: #b28500; }
  .cd-stat-icon.purple { background: rgba(125,91,176,.16); color: #7d5bb0; }
  [data-theme="dark"] .cd-stat-icon.green  { color: #8fdf8f; }
  [data-theme="dark"] .cd-stat-icon.amber  { color: #ffd54f; }
  [data-theme="dark"] .cd-stat-icon.purple { color: #c0a2e8; }
  .cd-stat-info { min-width: 0; }
  .cd-stat-label { font-size: .75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-bottom: 2px; }
  .cd-stat-value { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; word-break: break-word; }

  .cd-section {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .cd-section-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: .9rem 1.3rem; border-bottom: 1px solid var(--border-color);
    background: rgba(0,0,0,.015); gap: .5rem; flex-wrap: wrap;
  }
  [data-theme="dark"] .cd-section-header { background: rgba(255,255,255,.02); }
  .cd-section-header h3 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
  .cd-section-header h3 i { color: var(--accent); font-size: .9rem; }
  .cd-section-header .count { font-size: .8rem; color: var(--text-secondary); font-weight: 500; }
  .cd-section-body { padding: 1.1rem 1.3rem; }

  .cd-participants { display: flex; flex-wrap: wrap; gap: .5rem; }
  .cd-ptag {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px 5px 6px; border-radius: 20px;
    background: var(--hover-bg, #eef1f5); border: 1px solid var(--border-color);
    font-size: .83rem; font-weight: 500; color: var(--text-primary);
    transition: all .15s; text-decoration: none;
  }
  [data-theme="dark"] .cd-ptag { background: #21262d; }
  .cd-ptag:hover { border-color: var(--accent); background: rgba(74,144,217,.1); transform: translateY(-1px); }
  .cd-ptag .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #4a90d9, #2e5fa0); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-weight: 700; flex-shrink: 0; text-transform: uppercase;
  }

  /* ── Problem table ── */
  .cd-problem-table {
    width: 100%; border-collapse: separate; border-spacing: 0; font-size: .9rem;
  }
  .cd-problem-table thead th {
    padding: .7rem 1rem; text-align: left;
    font-size: .75rem; text-transform: uppercase; letter-spacing: .5px;
    color: var(--text-secondary); font-weight: 700;
    border-bottom: 1px solid var(--border-color); background: transparent; white-space: nowrap;
  }
  .cd-problem-table tbody tr { cursor: pointer; transition: background .15s; border-left: 4px solid transparent; }
  .cd-problem-table tbody td { padding: .85rem 1rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
  .cd-problem-table tbody tr:last-child td { border-bottom: none; }
  .cd-problem-table tbody tr:hover { background: rgba(74,144,217,.06); }

  /* ⭐ 4 種狀態 */
  .cd-problem-table tbody tr.ac-first         { border-left-color: #1b5e20; background: rgba(27,94,32,.09); }
  .cd-problem-table tbody tr.ac-first:hover   { background: rgba(27,94,32,.16); }
  .cd-problem-table tbody tr.ac               { border-left-color: #4caf50; background: rgba(76,175,80,.06); }
  .cd-problem-table tbody tr.ac:hover         { background: rgba(76,175,80,.13); }
  .cd-problem-table tbody tr.partial          { border-left-color: #fbc02d; background: rgba(251,192,45,.08); }
  .cd-problem-table tbody tr.partial:hover    { background: rgba(251,192,45,.15); }
  .cd-problem-table tbody tr.failed           { border-left-color: #c62828; background: rgba(198,40,40,.07); }
  .cd-problem-table tbody tr.failed:hover     { background: rgba(198,40,40,.14); }
  .cd-problem-table tbody tr.finished-before  { border-left-color: #1b5e20; background: rgba(27,94,32,.08); }
  .cd-problem-table tbody tr.finished-before:hover { background: rgba(27,94,32,.15); }
  [data-theme="dark"] .cd-problem-table tbody tr.ac-first        { background: rgba(27,94,32,.2); }
  [data-theme="dark"] .cd-problem-table tbody tr.ac              { background: rgba(76,175,80,.1); }
  [data-theme="dark"] .cd-problem-table tbody tr.partial         { background: rgba(251,192,45,.12); }
  [data-theme="dark"] .cd-problem-table tbody tr.failed          { background: rgba(198,40,40,.12); }
  [data-theme="dark"] .cd-problem-table tbody tr.finished-before { background: rgba(27,94,32,.2); }

  .cd-pid { font-family: 'Fira Code', 'Consolas', monospace; font-weight: 700; color: var(--accent); font-size: .85rem; }
  .cd-pname { font-weight: 500; color: var(--text-primary); }
  .cd-ptype {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .cd-ptype.numeric { background: rgba(74,144,217,.14); color: #3a7bc8; }
  .cd-ptype.photo   { background: rgba(230,126,34,.14); color: #d2691e; }
  [data-theme="dark"] .cd-ptype.numeric { background: rgba(74,144,217,.22); color: #8ec3ff; }
  [data-theme="dark"] .cd-ptype.photo   { background: rgba(230,126,34,.22); color: #ffb86c; }

  .cd-status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .8rem; font-weight: 700; padding: 4px 11px; border-radius: 12px; white-space: nowrap;
  }
  .cd-status-badge.ac-first        { background: #1b5e20; color: #ffffff; box-shadow: 0 2px 8px rgba(27,94,32,.4); }
  .cd-status-badge.ac              { background: #4caf50; color: #ffffff; }
  .cd-status-badge.partial         { background: #fbc02d; color: #4e342e; }
  .cd-status-badge.failed          { background: #c62828; color: #ffcdd2; }
  .cd-status-badge.finished-before { background: rgba(27,94,32,.18); color: #1b5e20; }
  .cd-status-badge.none            { background: rgba(0,0,0,.06); color: var(--text-secondary); }
  [data-theme="dark"] .cd-status-badge.finished-before { color: #a5f0a5; }
  [data-theme="dark"] .cd-status-badge.none            { background: rgba(255,255,255,.08); }

  .cd-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: .55rem 1.2rem; border-radius: 9px;
    font-size: .88rem; font-weight: 600; font-family: inherit;
    cursor: pointer; border: 1px solid transparent;
    transition: all .15s ease; text-decoration: none; white-space: nowrap;
  }
  .cd-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .cd-btn:active:not(:disabled) { transform: translateY(0); }
  .cd-btn:disabled { opacity: .6; cursor: not-allowed; }
  .cd-btn.primary    { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cd-btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .cd-btn.success    { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  .cd-btn.success:hover:not(:disabled) { background: #256428; }
  .cd-btn.danger     { background: transparent; color: var(--danger); border-color: var(--danger); }
  .cd-btn.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

  .cd-loading, .cd-empty { text-align: center; padding: 3.5rem 1rem; color: var(--text-secondary); font-size: .95rem; }
  .cd-loading i, .cd-empty i { font-size: 2.2rem; color: var(--accent); opacity: .6; display: block; margin-bottom: .9rem; }
  .cd-spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 3px solid rgba(74,144,217,.25); border-top-color: var(--accent);
    border-radius: 50%; animation: cdSpin .7s linear infinite;
  }
  @keyframes cdSpin { to { transform: rotate(360deg); } }

  .cd-back {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text-secondary); font-size: .88rem; font-weight: 500;
    text-decoration: none; padding: .4rem 0; transition: color .15s;
  }
  .cd-back:hover { color: var(--accent); }
  .cd-back i { transition: transform .15s; }
  .cd-back:hover i { transform: translateX(-3px); }

  @media (max-width: 700px) {
    .cd-hero { padding: 1.4rem 1.2rem 1.2rem; border-radius: 12px; }
    .cd-hero-name { font-size: 1.4rem; }
    .cd-countdown-val { font-size: 1.1rem; }
    .cd-hero-meta { gap: .9rem; font-size: .82rem; }
    .cd-stat { padding: .8rem .9rem; }
    .cd-stat-icon { width: 34px; height: 34px; font-size: .9rem; }
    .cd-stat-value { font-size: 1rem; }
    .cd-section-body { padding: .8rem .9rem; }
    .cd-section-header { padding: .75rem 1rem; }
    .cd-problem-table thead th,
    .cd-problem-table tbody td { padding: .65rem .7rem; font-size: .85rem; }
    .cd-problem-table .hide-mobile { display: none; }
    .cd-btn { padding: .5rem 1rem; font-size: .83rem; }
  }
  @media (max-width: 420px) {
    .cd-problem-table .hide-xs { display: none; }
  }
  /* ═══════ Difficulty (移植自 problems.html) ═══════ */
  .cd-diff {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 56px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: .8rem;
    font-weight: 700;
    font-family: 'Fira Code', 'Consolas', monospace;
    white-space: nowrap;
    line-height: 1.4;
  }

  /* 彩虹 (7 ≤ diff < 8) */
  .rainbow-bg {
    background: linear-gradient(90deg,#ff0000,#ff8800,#ffff00,#00ff00,#0088ff,#8800ff,#ff0088,#ff0000);
    background-size: 300% 100%;
    animation: rainbowFlow 4s linear infinite;
    color: #ffffff !important;
  }
  @keyframes rainbowFlow { 0% { background-position: 0 0; } 100% { background-position: 300% 0; } }

  /* 閃耀 (8 ≤ diff < 9) */
  .star-shine {
    position: relative;
    color: #000000 !important;
    overflow: hidden;
    z-index: 0;
  }
  .star-shine::before {
    content: '';
    position: absolute;
    top: -100%; left: -100%;
    width: 300%; height: 300%;
    background: conic-gradient(from 0deg,
      #ffb3ba,#ffdfba,#ffffba,#baffc9,#bae1ff,#e8baff,#ffb3ba,
      #ffb3ba,#ffdfba,#ffffba,#baffc9,#bae1ff,#e8baff,#ffb3ba);
    animation: starRotate 4s linear infinite;
    z-index: -1;
  }
  @keyframes starRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* 混沌 (diff ≥ 9) */
  .chaos {
    background: #000;
    background-image:
      repeating-linear-gradient(45deg,#000 0,#000 8px,#4a0088 8px,#4a0088 10px),
      repeating-linear-gradient(-30deg,#000 0,#000 12px,#6a00cc 12px,#6a00cc 14px),
      repeating-linear-gradient(70deg,#000 0,#000 15px,#8a2be2 15px,#8a2be2 17px);
    background-blend-mode: screen;
    animation: chaosMove .2s linear infinite;
    color: #fff !important;
    text-shadow: 0 0 4px #8a2be2;
  }
  @keyframes chaosMove {
    0%   { background-position: 0 0, 5px 10px, -10px -5px; }
    100% { background-position: 20px 20px, 30px 5px, 10px -15px; }
  }

  /* 深色模式下微調 */
  [data-theme="dark"] .cd-diff { border: 1px solid rgba(255,255,255,.06); }
</style>
